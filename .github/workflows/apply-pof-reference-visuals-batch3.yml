name: Apply POF reference visuals batch 3

on:
  push:
    paths:
      - '.github/workflows/apply-pof-reference-visuals-batch3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update third POF visual mappings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/practice/[subject]/components/principles-of-flight-visual.tsx')
          s = p.read_text()

          replacements = {
              'lift-pressure-distribution-v5.png': 'lift-pressure-distribution-ref-v1.svg',
              'skin-friction-v4.png': 'skin-friction-ref-v1.svg',
              'fowler-flap-v4.png': 'fowler-flap-ref-v1.svg',
              'vertical-fin-directional-stability-v4.png': 'directional-stability-ref-v1.svg',
              'cg-longitudinal-stability-v4.png': 'cg-longitudinal-stability-ref-v1.svg',
              'cg-centre-pressure-pitch-v4.png': 'cg-longitudinal-stability-ref-v1.svg',
              'centre-of-gravity-v4.png': 'centre-of-gravity-ref-v1.svg',
          }
          missing = [old for old in replacements if old not in s]
          if missing:
              raise SystemExit(f'Missing expected mappings: {missing}')
          for old, new in replacements.items():
              s = s.replace(old, new)

          old_controls = '''  if (topic === "Flight Controls & Axes") {
    if (has(q, "primary and further", "primary and secondary", "spiral dive", "followed by")) {
      return visual("control-effects-v4.png", "PilotVault primary and further control effects diagram")
    }
    if (has(q, "axis", "axes", "aileron", "elevator", "rudder") && !has(q, "control column is moved forward and left")) {
      return visual("aircraft-axes-controls-ref-v2.svg", "PilotVault aircraft axes and primary controls diagram")
    }
    return null
  }'''
          new_controls = '''  if (topic === "Flight Controls & Axes") {
    if (has(q, "rudder") && !has(q, "primary and further", "spiral dive", "followed by")) {
      return visual("rudder-effect-ref-v1.svg", "PilotVault rudder and yaw control diagram")
    }
    if (has(q, "aileron") && !has(q, "primary and further", "spiral dive", "followed by", "control column is moved forward and left")) {
      return visual("aileron-effect-ref-v1.svg", "PilotVault aileron and roll control diagram")
    }
    if (has(q, "axis", "axes", "pitch", "roll", "yaw") && !has(q, "control column is moved forward and left")) {
      return visual("aircraft-axes-controls-ref-v2.svg", "PilotVault aircraft axes and primary controls diagram")
    }
    return null
  }'''
          if old_controls not in s:
              raise SystemExit('Expected Flight Controls block not found')
          s = s.replace(old_controls, new_controls)

          old_stability = '''    if (has(q, "dynamically stable", "dynamic stability", "statically", "static stability", "neutral static", "oscillat")) {
      return visual("static-dynamic-stability-ref-v1.svg", "PilotVault static and dynamic stability diagram")
    }'''
          new_stability = '''    if (has(q, "positive stability", "negative stability", "neutral stability", "neutral static")) {
      return visual("static-stability-types-ref-v1.svg", "PilotVault positive neutral and negative static stability diagram")
    }
    if (has(q, "dynamically stable", "dynamic stability", "statically", "static stability", "oscillat")) {
      return visual("static-dynamic-stability-ref-v1.svg", "PilotVault static and dynamic stability diagram")
    }'''
          if old_stability not in s:
              raise SystemExit('Expected stability block not found')
          s = s.replace(old_stability, new_stability)

          p.write_text(s)
          PY
      - name: Commit mapping update
        run: |
          git config user.name 'PilotVault Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add 'app/practice/[subject]/components/principles-of-flight-visual.tsx'
          git diff --cached --quiet && exit 0
          git commit -m 'Use third PDF-reference POF visual batch'
          git push
