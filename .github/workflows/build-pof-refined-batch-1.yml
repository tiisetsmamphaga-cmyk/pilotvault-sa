name: Build POF refined batch 1

on:
  push:
    branches:
      - pof-refined-batch-1
    paths:
      - 'scripts/build_pof_refined_batch_1.py'
      - '.github/workflows/build-pof-refined-batch-1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install visual build dependencies
        run: python -m pip install --disable-pip-version-check pillow pymupdf

      - name: Select accessible AC 61-23C mirror
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/build_pof_refined_batch_1.py')
          s = p.read_text()
          s = s.replace(
              'https://air.flyingway.com/books/ac_61-23c_phak_canada.pdf',
              'https://www.sheppardair.com/download/ac61-23c.pdf',
          )
          # The verified chapter excerpt is ~487 KB; keep a lower guard that
          # still rejects HTML/error pages while accepting this valid PDF.
          s = s.replace('len(data) < 500_000', 'len(data) < 100_000')
          p.write_text(s)
          PY

      - name: Build refined handbook-based teaching visuals
        run: python scripts/build_pof_refined_batch_1.py

      - name: Validate manifest before commit
        run: python scripts/validate_pof_visuals.py

      - name: Commit generated raster assets and QA state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PilotVault Visual Pipeline'
          git config user.email 'actions@users.noreply.github.com'
          git add data/pof-visual-manifest.json public/explanation-images/principles-of-flight/refined-batch-1/
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Build refined POF visual batch 1'
          git push
