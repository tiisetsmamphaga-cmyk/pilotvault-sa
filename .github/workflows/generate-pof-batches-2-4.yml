name: Generate POF batches 2-4 reviewed rasters

on:
  push:
    branches:
      - pof-batch-2-rebuild
    paths:
      - 'scripts/generate_pof_batches_2_4_assets.py'
      - 'scripts/stage_pof_refining_assets.py'
      - '.github/workflows/generate-pof-batches-2-4.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned image dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.5' 'matplotlib==3.10.8' 'Pillow==12.3.0'
      - name: Generate only reviewed POF candidates
        run: python scripts/generate_pof_batches_2_4_assets.py
      - name: Attach assets and enter REFINING
        run: python scripts/stage_pof_refining_assets.py
      - name: Validate manifest structure
        run: python scripts/validate_pof_visuals.py
      - name: Reject SVG and unexpected raster locations
        shell: bash
        run: |
          set -euo pipefail
          test "$(find public/explanation-images/principles-of-flight/refined-batch-2 -type f | wc -l)" -eq 10
          test "$(find public/explanation-images/principles-of-flight/refined-batch-3 -type f | wc -l)" -eq 10
          test "$(find public/explanation-images/principles-of-flight/refined-batch-4 -type f | wc -l)" -eq 10
          if find public/explanation-images/principles-of-flight/refined-batch-{2,3,4} -type f -name '*.svg' | grep -q .; then
            echo 'SVG found in new POF batches'
            exit 1
          fi
      - name: Commit atomic REFINING asset state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pof-visual-manifest.json \
            public/explanation-images/principles-of-flight/refined-batch-2 \
            public/explanation-images/principles-of-flight/refined-batch-3 \
            public/explanation-images/principles-of-flight/refined-batch-4
          if git diff --cached --quiet; then
            echo 'Reviewed assets already staged.'
            exit 0
          fi
          git commit -m 'Stage POF batches 2-4 reviewed rasters at REFINING'
          git push
