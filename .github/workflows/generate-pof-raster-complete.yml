name: Generate complete POF raster assets

on:
  push:
    branches:
      - pof-visual-autonomous-completion-b2
    paths:
      - '.github/workflows/generate-pof-raster-complete.yml'
      - 'scripts/rasterize_pof_complete.py'
      - 'scripts/validate_pof_raster_complete.py'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pof-visual-autonomous-completion-b2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install raster dependencies
        run: pip install 'cairosvg==2.7.1' 'Pillow==11.3.0'
      - name: Generate PNG and WebP assets
        run: python scripts/rasterize_pof_complete.py
      - name: Validate raster fidelity and no-banner export
        run: python scripts/validate_pof_raster_complete.py
      - name: Commit generated raster assets and QA report
        run: |
          git config user.name 'PilotVault Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add public/explanation-images/principles-of-flight/raster-complete data/pof-raster-conversion-map.json data/pof-raster-qa-report.json
          git diff --cached --quiet && exit 0
          git commit -m 'Validate complete POF raster visual set'
          git push origin HEAD:pof-visual-autonomous-completion-b2
