name: Generate POF static explanation assets

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_pof_static_assets.py'
      - 'scripts/generate_pof_static_assets_corrections.py'
      - '.github/workflows/generate-pof-static-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate static POF graphics
        run: |
          python scripts/generate_pof_static_assets.py
          python scripts/generate_pof_static_assets_corrections.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/explanation-images/principles-of-flight/static-v4
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "Generate visually QA'd static POF explanation assets"
          git push
