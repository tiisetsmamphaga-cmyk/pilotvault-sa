name: Install exact verified POF batch 1 assets

on:
  push:
    branches:
      - pof-refined-batch-1
    paths:
      - '.github/workflows/install-pof-batch1-exact-assets.yml'
      - 'scripts/build_pof_batch1_with_masters.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned image tooling
        run: python -m pip install --disable-pip-version-check 'Pillow==12.3.0' 'PyMuPDF==1.26.7'

      - name: Fetch SHA-locked uploaded handbook bytes
        run: python scripts/fetch_exact_pof_handbook.py /tmp/ac_61-23c_phak_canada.pdf

      - name: Build 5 WebPs and 5 PNG masters with locked hashes
        run: python scripts/build_pof_batch1_with_masters.py /tmp/ac_61-23c_phak_canada.pdf /tmp/pof-batch1-final

      - name: Verify exact final set
        shell: bash
        run: |
          set -euo pipefail
          test "$(find /tmp/pof-batch1-final -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 5
          test "$(find /tmp/pof-batch1-final -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 5
          sha256sum /tmp/pof-batch1-final/*

      - name: Replace rejected batch with verified assets
        shell: bash
        run: |
          set -euo pipefail
          target='public/explanation-images/principles-of-flight/refined-batch-1'
          rm -rf "$target"
          mkdir -p "$target"
          cp /tmp/pof-batch1-final/* "$target/"
          git config user.name 'PilotVault Visual Pipeline'
          git config user.email 'actions@users.noreply.github.com'
          git add -A "$target"
          if git diff --cached --quiet; then
            echo 'Verified asset set already installed.'
            exit 0
          fi
          git commit -m 'Install exact verified POF batch 1 assets'
          git push
