name: POF Batch 10 production history repair

on:
  push:
    branches:
      - pof-batch-10-rebuild
    paths:
      - .github/workflows/pof-batch10-history-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean Batch 10 production-v2 branch
        uses: actions/checkout@v4
        with:
          ref: pof-batch-10-production-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Configure repair commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(git rev-parse HEAD)" = "10cf5745d5abb1c9302c9d3d920ad34767465cfc"

      - name: Install hardened history validator
        run: |
          git checkout 9c4da5a599403721d7c623da59b964a4cef152b1 -- scripts/validate_pof_visual_changes.py
          git add scripts/validate_pof_visual_changes.py
          git commit -m "Harden POF locked reuse validation"

      - name: Reconstruct verified SOURCE_FOUND checkpoint
        run: |
          git checkout baa9ef14d74aa187c7bc13bea700b2a4a2f7bdfa -- \
            data/pof-autonomous-state.json \
            data/pof-batch-10-source-selection.json \
            data/pof-visual-manifest.json
          git add data/pof-autonomous-state.json data/pof-batch-10-source-selection.json data/pof-visual-manifest.json
          git commit -m "Persist POF Batch 10 SOURCE_FOUND"
          python scripts/validate_pof_visuals.py
          python scripts/validate_pof_visual_changes.py 10cf5745d5abb1c9302c9d3d920ad34767465cfc

      - name: Reconstruct verified REFINING checkpoint
        env:
          REFINEMENT_QA_RUN: "33846476738"
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          visual_ids = {
              'pof-pressure-distribution-lift-001',
              'pof-adverse-yaw-high-aoa-001',
              'pof-venturi-continuity-001',
              'pof-level-turn-force-balance-001',
              'pof-propeller-left-turning-tendencies-001',
          }

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))
          def save(path, data):
              Path(path).write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          state = load('data/pof-autonomous-state.json')
          assert state['last_verified_checkpoint'] == 'POF_BATCH_10_SOURCE_FOUND'
          state['last_verified_checkpoint'] = 'POF_BATCH_10_REFINING'
          state['next_action'] = 'Complete deterministic raster refinement, inspect the actual PNG/WebP outputs against Batch 1 quality, then advance to QA_APPROVED only if all five pass.'
          state['active_batch_refinement'] = {
              'batch': 10,
              'visual_concepts': 5,
              'planned_png_assets': 5,
              'planned_webp_assets': 5,
              'svg_assets': 0,
              'asset_dimensions': '1600x1050',
              'source_to_refined_pairs': 5,
              'refinement_execution_verified_later_by_run': int(os.environ['REFINEMENT_QA_RUN']),
              'reconstructed_checkpoint_note': 'This persistence checkpoint was reconstructed from the verified Batch 10 refinement evidence after the history validator identified that the original refinement workflow had performed the work but had not committed the intermediate REFINING manifest state.',
              'verified': True,
          }
          save('data/pof-autonomous-state.json', state)

          selection = load('data/pof-batch-10-source-selection.json')
          assert selection['status'] == 'SOURCE_FOUND'
          selection['status'] = 'REFINING'
          for concept in selection['concepts']:
              assert concept['visual_id'] in visual_ids
              assert concept['status'] == 'SOURCE_FOUND'
              concept['status'] = 'REFINING'
          selection['gates']['refinement_started'] = True
          selection['next_action'] = 'Finish and inspect all five deterministic raster pairs, then advance only the exact reviewed outputs to QA_APPROVED.'
          save('data/pof-batch-10-source-selection.json', selection)

          manifest = load('data/pof-visual-manifest.json')
          touched = 0
          for visual in manifest['visuals']:
              if visual.get('visual_id') in visual_ids:
                  assert visual['status'] == 'SOURCE_FOUND'
                  assert visual['assets']['master_asset'] is None
                  assert visual['assets']['web_asset'] is None
                  visual['status'] = 'REFINING'
                  touched += 1
          assert touched == 5
          save('data/pof-visual-manifest.json', manifest)
          PY
          git add data/pof-autonomous-state.json data/pof-batch-10-source-selection.json data/pof-visual-manifest.json
          git commit -m "Persist POF Batch 10 REFINING"
          python scripts/validate_pof_visuals.py
          python scripts/validate_pof_visual_changes.py 10cf5745d5abb1c9302c9d3d920ad34767465cfc

      - name: Restore exact inspected QA_APPROVED rasters and checkpoint
        run: |
          git checkout ea40ec00fb6de181ec04f4fde3854c0f279da359 -- \
            data/pof-autonomous-state.json \
            data/pof-batch-10-source-selection.json \
            data/pof-visual-manifest.json \
            public/explanation-images/principles-of-flight/refined-batch-10
          git add data/pof-autonomous-state.json data/pof-batch-10-source-selection.json data/pof-visual-manifest.json public/explanation-images/principles-of-flight/refined-batch-10
          git commit -m "Approve POF Batch 10 refined visuals"
          python scripts/validate_pof_visuals.py
          python scripts/validate_pof_visual_changes.py 10cf5745d5abb1c9302c9d3d920ad34767465cfc

      - name: Restore exact verified PREVIEW_READY state and production renderer
        run: |
          git checkout 0eeeeaebfb6ea3d1900b6a8342c48788b4162b89 -- \
            data/pof-autonomous-state.json \
            data/pof-batch-10-source-selection.json \
            data/pof-visual-manifest.json \
            'app/practice/[subject]/components/explanation-image.tsx'
          git add data/pof-autonomous-state.json data/pof-batch-10-source-selection.json data/pof-visual-manifest.json 'app/practice/[subject]/components/explanation-image.tsx'
          git commit -m "Persist POF Batch 10 PREVIEW_READY"
          python scripts/validate_pof_visuals.py
          python scripts/validate_pof_visual_changes.py 10cf5745d5abb1c9302c9d3d920ad34767465cfc

      - name: Persist verified MAPPED checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          visual_ids = {
              'pof-pressure-distribution-lift-001',
              'pof-adverse-yaw-high-aoa-001',
              'pof-venturi-continuity-001',
              'pof-level-turn-force-balance-001',
              'pof-propeller-left-turning-tendencies-001',
          }
          def load(path): return json.loads(Path(path).read_text(encoding='utf-8'))
          def save(path, data): Path(path).write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          state = load('data/pof-autonomous-state.json')
          assert state['last_verified_checkpoint'] == 'POF_BATCH_10_PREVIEW_READY'
          state['last_verified_checkpoint'] = 'POF_BATCH_10_MAPPED'
          state['next_action'] = 'Validate the clean Batch 10 production boundary and pass the exact production build before advancing to PRODUCTION_READY.'
          state['active_batch_mapping'] = {
              'batch': 10,
              'project_ref': 'kkmlfbxfopwulwkloaoc',
              'mapped_question_rows': 17,
              'visual_keys': 5,
              'database_status': 'MAPPED',
              'exact_match_count': 17,
              'unexpected_owner_count': 0,
              'transactional_update': True,
              'post_commit_readback_verified': True,
              'verified': True,
          }
          state['production_readiness'] = {
              'batch': 10,
              'base_main_commit': '10cf5745d5abb1c9302c9d3d920ad34767465cfc',
              'production_file_count': 15,
              'png_assets': 5,
              'webp_assets': 5,
              'svg_assets': 0,
              'renderer_allowlist_updated': True,
              'temporary_qa_route_removed': True,
              'temporary_workflows_removed': True,
              'temporary_generator_removed': True,
              'pnpm_frozen_lock_install_passed': False,
              'next_build_routes': 20,
              'production_build_passed': False,
              'build_environment_note': 'The candidate build uses inert, step-scoped Supabase placeholders; no production database credential is placed in source or CI.',
              'verified': False,
          }
          save('data/pof-autonomous-state.json', state)

          selection = load('data/pof-batch-10-source-selection.json')
          assert selection['status'] == 'PREVIEW_READY'
          selection['status'] = 'MAPPED'
          for concept in selection['concepts']:
              assert concept['visual_id'] in visual_ids
              concept['status'] = 'MAPPED'
          selection['gates']['mapped'] = True
          selection['next_action'] = 'Validate the exact clean production boundary and pass the production build before promotion to main.'
          save('data/pof-batch-10-source-selection.json', selection)

          manifest = load('data/pof-visual-manifest.json')
          touched = 0
          for visual in manifest['visuals']:
              if visual.get('visual_id') in visual_ids:
                  assert visual['status'] == 'PREVIEW_READY'
                  visual['status'] = 'MAPPED'
                  visual['mapping_verification'] = {
                      'project_ref': 'kkmlfbxfopwulwkloaoc',
                      'database_status': 'MAPPED',
                      'exact_rows_verified': True,
                      'exact_match_count': 17,
                      'duplicate_ownership_absent': True,
                  }
                  touched += 1
          assert touched == 5
          save('data/pof-visual-manifest.json', manifest)
          PY
          git add data/pof-autonomous-state.json data/pof-batch-10-source-selection.json data/pof-visual-manifest.json
          git commit -m "Persist POF Batch 10 MAPPED"
          python scripts/validate_pof_visuals.py
          python scripts/validate_pof_visual_changes.py 10cf5745d5abb1c9302c9d3d920ad34767465cfc

      - name: Assert exact clean production boundary
        run: |
          test ! -e app/pof-visual-qa/page.tsx
          test ! -e scripts/generate_pof_batch10.py
          python - <<'PY'
          import subprocess
          expected = {
              'app/practice/[subject]/components/explanation-image.tsx',
              'data/pof-autonomous-state.json',
              'data/pof-batch-10-source-selection.json',
              'data/pof-visual-manifest.json',
              'scripts/validate_pof_visual_changes.py',
              'public/explanation-images/principles-of-flight/refined-batch-10/pof-adverse-yaw-high-aoa-v1.png',
              'public/explanation-images/principles-of-flight/refined-batch-10/pof-adverse-yaw-high-aoa-v1.webp',
              'public/explanation-images/principles-of-flight/refined-batch-10/pof-level-turn-force-balance-v1.png',
              'public/explanation-images/principles-of-flight/refined-batch-10/pof-level-turn-force-balance-v1.webp',
              'public/explanation-images/principles-of-flight/refined-batch-10/pof-pressure-distribution-lift-v1.png',
              'public/explanation-images/principles-of-flight/refined-batch-10/pof-pressure-distribution-lift-v1.webp',
              'public/explanation-images/principles-of-flight/refined-batch-10/pof-propeller-left-turning-tendencies-v1.png',
              'public/explanation-images/principles-of-flight/refined-batch-10/pof-propeller-left-turning-tendencies-v1.webp',
              'public/explanation-images/principles-of-flight/refined-batch-10/pof-venturi-continuity-v1.png',
              'public/explanation-images/principles-of-flight/refined-batch-10/pof-venturi-continuity-v1.webp',
          }
          actual = set(subprocess.check_output(['git','diff','--name-only','10cf5745d5abb1c9302c9d3d920ad34767465cfc..HEAD'], text=True).splitlines())
          assert actual == expected, f'production boundary mismatch: missing={sorted(expected-actual)} extra={sorted(actual-expected)}'
          PY

      - name: Install frozen production dependencies
        run: pnpm install --frozen-lockfile

      - name: First exact production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://pof-batch10-production-ci.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: pof-batch10-production-ci-anon-placeholder
          SUPABASE_SERVICE_ROLE_KEY: pof-batch10-production-ci-service-role-placeholder
        run: pnpm run build

      - name: Persist PRODUCTION_READY only after green build
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          visual_ids = {
              'pof-pressure-distribution-lift-001',
              'pof-adverse-yaw-high-aoa-001',
              'pof-venturi-continuity-001',
              'pof-level-turn-force-balance-001',
              'pof-propeller-left-turning-tendencies-001',
          }
          def load(path): return json.loads(Path(path).read_text(encoding='utf-8'))
          def save(path, data): Path(path).write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          state = load('data/pof-autonomous-state.json')
          assert state['last_verified_checkpoint'] == 'POF_BATCH_10_MAPPED'
          state['last_verified_checkpoint'] = 'POF_BATCH_10_PRODUCTION_READY'
          state['production_readiness']['pnpm_frozen_lock_install_passed'] = True
          state['production_readiness']['production_build_passed'] = True
          state['production_readiness']['verified'] = True
          state['next_action'] = 'Fast-forward this exact verified Batch 10 production tree to main, wait for the matching Vercel production deployment, then live-verify five assets and 17 exact database rows before lock.'
          save('data/pof-autonomous-state.json', state)

          selection = load('data/pof-batch-10-source-selection.json')
          assert selection['status'] == 'MAPPED'
          selection['status'] = 'PRODUCTION_READY'
          for concept in selection['concepts']:
              assert concept['visual_id'] in visual_ids
              concept['status'] = 'PRODUCTION_READY'
          selection['gates']['production_ready'] = True
          selection['next_action'] = 'Advance the exact green production tree to main, then live-verify all five assets and all 17 database rows before lock.'
          save('data/pof-batch-10-source-selection.json', selection)

          manifest = load('data/pof-visual-manifest.json')
          touched = 0
          for visual in manifest['visuals']:
              if visual.get('visual_id') in visual_ids:
                  assert visual['status'] == 'MAPPED'
                  visual['status'] = 'PRODUCTION_READY'
                  touched += 1
          assert touched == 5
          save('data/pof-visual-manifest.json', manifest)
          PY
          git add data/pof-autonomous-state.json data/pof-batch-10-source-selection.json data/pof-visual-manifest.json
          git commit -m "Verify POF Batch 10 production candidate"

      - name: Revalidate final exact production commit
        run: |
          python scripts/validate_pof_visuals.py
          python scripts/validate_pof_visual_changes.py 10cf5745d5abb1c9302c9d3d920ad34767465cfc
          test "$(git diff --name-only 10cf5745d5abb1c9302c9d3d920ad34767465cfc..HEAD | wc -l)" -eq 15

      - name: Final build on exact commit to be promoted
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://pof-batch10-production-ci.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: pof-batch10-production-ci-anon-placeholder
          SUPABASE_SERVICE_ROLE_KEY: pof-batch10-production-ci-service-role-placeholder
        run: pnpm run build

      - name: Push verified repaired production history
        run: git push --force-with-lease origin HEAD:pof-batch-10-production-v2
