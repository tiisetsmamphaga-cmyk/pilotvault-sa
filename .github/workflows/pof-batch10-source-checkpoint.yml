name: POF Batch 10 source checkpoint

on:
  push:
    branches:
      - pof-batch-10-rebuild
    paths:
      - .github/workflows/pof-batch10-source-checkpoint.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Batch 10 working branch
        uses: actions/checkout@v4
        with:
          ref: pof-batch-10-rebuild
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assert exact Batch 9 lock base
        run: |
          git merge-base --is-ancestor 10cf5745d5abb1c9302c9d3d920ad34767465cfc HEAD
          python scripts/validate_pof_visuals.py

      - name: Persist reuse sweep and Batch 10 SOURCE_FOUND
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def save(path, data):
              Path(path).write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          manifest_path = Path('data/pof-visual-manifest.json')
          state_path = Path('data/pof-autonomous-state.json')
          manifest = load(manifest_path)
          state = load(state_path)

          assert state['current_batch'] == 10
          assert state['last_verified_checkpoint'] == 'POF_BATCH_9_LIVE_VERIFIED'

          reuse = {
              'pof-aircraft-axes-controls-001': {
                  'ids': [1108, 1134, 1308, 1998],
                  'why': 'All mapped questions test the same locked aircraft-axis/primary-control system: pitch about lateral, roll about longitudinal, yaw about vertical, primary surfaces and the CG axis intersection.'
              },
              'pof-bank-load-factor-001': {
                  'ids': [1200, 1240, 1363],
                  'why': 'All mapped questions test the same bank-angle/load-factor relationship shown by the locked chart, including 60 degrees bank = 2.0 G and load increasing as bank increases.'
              },
              'pof-critical-aoa-stall-001': {
                  'ids': [1205, 1208, 1224, 1323, 1334],
                  'why': 'All mapped questions test the same locked critical-AoA rule: the wing stalls at critical angle of attack; weight or bank changes the IAS at which it is reached, not the critical angle itself.'
              },
              'pof-parasite-drag-001': {
                  'ids': [1183, 1356, 1357, 1984],
                  'why': 'All mapped questions read the same locked drag-curve relationships: induced drag falls with speed, parasite drag rises, total drag reaches a minimum at Vmd, and Curve B is parasite/profile drag.'
              },
              'pof-skin-friction-boundary-layer-001': {
                  'ids': [1129, 1349],
                  'why': 'All mapped questions use the same locked boundary-layer teaching relationship: the layer directly touching the aerofoil is the boundary layer and is slowed by viscosity at the surface.'
              },
              'pof-longitudinal-stability-001': {
                  'ids': [1106, 1125],
                  'why': 'All mapped questions use the same locked stable longitudinal arrangement: the CG is forward of the centre of pressure/lift, equivalently the centre of pressure is aft of the CG.'
              },
          }

          found = set()
          for visual in manifest['visuals']:
              vid = visual.get('visual_id')
              if vid not in reuse:
                  continue
              assert visual['status'] == 'LIVE_VERIFIED'
              assert visual['lock']['approved'] is True
              found.add(vid)
              visual['question_ids'] = sorted(set(visual['question_ids']) | set(reuse[vid]['ids']))
              visual['reuse_justification'] = reuse[vid]['why']

          assert found == set(reuse), f'missing locked reuse visual(s): {set(reuse) - found}'

          concepts = [
              {
                  'visual_id': 'pof-pressure-distribution-lift-001',
                  'topic': 'Aerofoils & Lift',
                  'concept': 'Lift is produced by a pressure difference: lower pressure above the aerofoil and higher pressure below it create a net upward force',
                  'question_ids': [1949, 2002],
                  'reuse_justification': 'Both questions ask for the same pressure distribution around a lifting aerofoil: high pressure below and low pressure above.',
                  'source': {
                      'document': 'ac_61-23c_phak_canada.pdf',
                      'page': 5,
                      'figure': '1-9 / 1-10',
                      'notes': 'Bernoulli section and Figures 1-9/1-10 show accelerating flow over the upper surface, lower pressure above, higher pressure below, and the resulting lift force.'
                  },
                  'brief': {
                      'student_must_understand': 'A lifting aerofoil has lower static pressure above and higher static pressure below, so the pressure imbalance produces a net upward lift force.',
                      'preserve': ['A technically credible aerofoil cross-section', 'Upper- and lower-surface airflow direction', 'Clear pressure relationship'],
                      'refine': ['Make high/low pressure zones immediately readable', 'Use sparse pressure arrows without clutter', 'Keep airflow and lift vectors physically consistent'],
                      'add': ['LOW PRESSURE above', 'HIGH PRESSURE below', 'Net LIFT arrow', 'Short pressure-difference takeaway'],
                      'remove': ['Decorative aircraft scene', 'Unrelated Bernoulli prose', 'Baked PilotVault banner']
                  },
                  'assets': {'master_asset': None, 'web_asset': None},
                  'mapping_reason': 'The two questions directly ask which pressure distribution creates lift; the visual will show that exact upper/lower pressure relationship.',
                  'status': 'SOURCE_FOUND',
                  'qa': {'technical': False, 'teaching': False, 'visual': False, 'preview': False, 'live': False},
                  'lock': {'approved': False, 'replacement_reason': None}
              },
              {
                  'visual_id': 'pof-adverse-yaw-high-aoa-001',
                  'topic': 'Aileron Drag',
                  'concept': 'Adverse aileron yaw becomes more noticeable at high angle of attack because the down-going aileron adds angle of attack and induced drag to a wing already operating at higher AoA',
                  'question_ids': [1170, 1191, 1290, 1359],
                  'reuse_justification': 'All four questions test the same relationship: adverse aileron yaw increases as baseline angle of attack increases.',
                  'source': {
                      'document': 'ac_61-23c_phak_canada.pdf',
                      'page': 23,
                      'figure': '1-30',
                      'notes': 'Figure 1-30 shows the lowered aileron increasing local AoA and lift. The handbook induced-drag section on page 8 states induced drag increases directly with angle of attack; together they explain why adverse yaw is stronger at high AoA.'
                  },
                  'brief': {
                      'student_must_understand': 'For the same roll input, a higher baseline AoA creates a larger induced-drag difference between the wings, so adverse yaw is stronger.',
                      'preserve': ['Opposite aileron deflections', 'Correct roll direction', 'Correct adverse-yaw direction'],
                      'refine': ['Compare LOW AoA versus HIGH AoA side by side', 'Show larger drag imbalance only in the high-AoA case', 'Keep local AoA and yaw arrows unambiguous'],
                      'add': ['Low-AoA panel', 'High-AoA panel', 'Induced-drag arrows sized comparatively', 'Adverse yaw stronger at HIGH AoA takeaway'],
                      'remove': ['Generic control-system labels', 'Unrelated stability content', 'Baked PilotVault banner']
                  },
                  'assets': {'master_asset': None, 'web_asset': None},
                  'mapping_reason': 'The questions ask when adverse yaw is most noticeable or how it changes with AoA; a low-vs-high AoA comparison teaches that exact relationship.',
                  'status': 'SOURCE_FOUND',
                  'qa': {'technical': False, 'teaching': False, 'visual': False, 'preview': False, 'live': False},
                  'lock': {'approved': False, 'replacement_reason': None}
              },
              {
                  'visual_id': 'pof-venturi-continuity-001',
                  'topic': 'Basic Aerodynamics',
                  'concept': 'In subsonic flow through a narrowing venturi, mass flow remains constant while velocity increases and static pressure decreases in the throat',
                  'question_ids': [1966],
                  'source': {
                      'document': 'ac_61-23c_phak_canada.pdf',
                      'page': 5,
                      'figure': '1-9',
                      'notes': 'The handbook venturi explanation states that as the passage narrows it contains the same amount of fluid, while flow speed rises and pressure falls.'
                  },
                  'brief': {
                      'student_must_understand': 'A smaller venturi area does not lose mass flow: the flow speeds up through the throat and static pressure falls.',
                      'preserve': ['Wide-to-narrow venturi geometry', 'Continuous flow direction', 'Subsonic continuity relationship'],
                      'refine': ['Make area, velocity and pressure changes readable at a glance', 'Keep inlet and throat states visually paired'],
                      'add': ['A decreases', 'V increases', 'Static P decreases', 'Mass flow remains constant'],
                      'remove': ['Wing illustration', 'Long Bernoulli explanation', 'Baked PilotVault banner']
                  },
                  'assets': {'master_asset': None, 'web_asset': None},
                  'mapping_reason': 'Question 1966 tests the exact continuity/Bernoulli changes through a venturi throat, which the visual will label directly.',
                  'status': 'SOURCE_FOUND',
                  'qa': {'technical': False, 'teaching': False, 'visual': False, 'preview': False, 'live': False},
                  'lock': {'approved': False, 'replacement_reason': None}
              },
              {
                  'visual_id': 'pof-level-turn-force-balance-001',
                  'topic': 'Turns & Load Factor',
                  'concept': 'In a level banked turn, the tilted lift vector has a vertical component that supports weight and a horizontal component that provides centripetal force; more lift/AoA is required and the resultant wing load rises',
                  'question_ids': [1204, 1227, 1231, 1245, 1328, 1360, 1375, 1378],
                  'reuse_justification': 'All eight questions test one banked-turn force system: centripetal force comes from the horizontal component of wing lift, vertical lift must still support weight, and the higher resultant load is produced by the turn.',
                  'source': {
                      'document': 'ac_61-23c_phak_canada.pdf',
                      'page': 26,
                      'figure': '1-33',
                      'notes': 'The handbook explains that banking makes wing lift pull the aeroplane into a curved path, that constant altitude requires increased wing lift/load, and Figures 1-33/1-34 show load rising with bank. Page 25 explains the weight-plus-turning-load resultant.'
                  },
                  'brief': {
                      'student_must_understand': 'Bank tilts lift: its vertical component must equal weight to hold altitude, while its horizontal component turns the aeroplane inward; achieving the larger total lift requires increased AoA and creates a higher load factor.',
                      'preserve': ['Banked aircraft attitude', 'Weight vertically downward', 'Total lift perpendicular to wing plane'],
                      'refine': ['Resolve lift into vertical and horizontal components', 'Point the horizontal component toward the centre of turn', 'Show the increased resultant/load without mixing centripetal and centrifugal reference frames'],
                      'add': ['Vertical lift = weight', 'Horizontal lift = centripetal force', 'Increase AoA/lift to maintain altitude', 'Compact load-factor resultant inset'],
                      'remove': ['Turn-rate formulas', 'Unrelated stall-speed chart', 'Baked PilotVault banner']
                  },
                  'assets': {'master_asset': None, 'web_asset': None},
                  'mapping_reason': 'These questions all ask about the same level-turn force balance, its centripetal source, the AoA increase needed to maintain altitude, or the associated resultant load.',
                  'status': 'SOURCE_FOUND',
                  'qa': {'technical': False, 'teaching': False, 'visual': False, 'preview': False, 'live': False},
                  'lock': {'approved': False, 'replacement_reason': None}
              },
              {
                  'visual_id': 'pof-propeller-left-turning-tendencies-001',
                  'topic': 'Basic Aerodynamics',
                  'concept': 'For a conventional propeller turning clockwise as seen from the cockpit, torque reaction tends to roll left and asymmetric blade effect/P-factor produces a left-yaw tendency that is corrected with right rudder',
                  'question_ids': [1948, 1950],
                  'reuse_justification': 'Both questions test linked propeller-induced left-turning tendencies under the same conventional clockwise-propeller condition: torque reaction for roll and P-factor/asymmetric blade loading for yaw/rudder correction.',
                  'source': {
                      'document': 'ac_61-23c_phak_canada.pdf',
                      'page': 13,
                      'figure': '1-18',
                      'notes': 'The handbook identifies torque reaction and asymmetric propeller loading/P-factor as left-turning forces, notes the tendency is strongest at high power/low speed/high AoA, and states right rudder is used to correct it. The torque-reaction detail continues on page 14.'
                  },
                  'brief': {
                      'student_must_understand': 'Clockwise propeller from the cockpit: torque reaction rolls the aircraft left; at high power/high AoA the descending blade produces more thrust, yawing left, so right rudder is required.',
                      'preserve': ['Explicit cockpit viewing direction', 'Clockwise propeller rotation', 'Separate roll and yaw effects'],
                      'refine': ['Use a two-panel torque versus P-factor layout', 'Make descending-blade thrust difference clear', 'Do not conflate roll from torque with yaw from P-factor'],
                      'add': ['TORQUE: roll LEFT', 'P-FACTOR: yaw LEFT', 'RIGHT RUDDER correction', 'High power + low speed + high AoA emphasis'],
                      'remove': ['Gyroscopic precession detail', 'Spiralling slipstream detail', 'Baked PilotVault banner']
                  },
                  'assets': {'master_asset': None, 'web_asset': None},
                  'mapping_reason': 'Question 1948 asks the torque-reaction roll direction and question 1950 asks the P-factor/right-rudder correction; the two-panel visual separates those exact effects.',
                  'status': 'SOURCE_FOUND',
                  'qa': {'technical': False, 'teaching': False, 'visual': False, 'preview': False, 'live': False},
                  'lock': {'approved': False, 'replacement_reason': None}
              },
          ]

          existing_ids = {v['visual_id'] for v in manifest['visuals']}
          for concept in concepts:
              assert concept['visual_id'] not in existing_ids, f"visual id collision: {concept['visual_id']}"
              manifest['visuals'].append(concept)

          selection = {
              'schema_version': 1,
              'subject': 'principles-of-flight',
              'batch': 10,
              'status': 'SOURCE_FOUND',
              'selected_date': '2026-09-04',
              'batch_limit': 5,
              'source_document': 'ac_61-23c_phak_canada.pdf',
              'source_policy': 'Use the approved POF handbook as technical source of truth. Question-bank and mock-exam material may confirm exam wording/mapping but must not override handbook physics.',
              'reuse_sweep': {
                  'mapped_question_rows': 20,
                  'visual_keys': sorted(reuse.keys()),
                  'database_status': 'LIVE_VERIFIED',
                  'exact_match_count': 20,
                  'mismatch_count': 0,
                  'planned_key_collisions': 0,
                  'verified': True
              },
              'concepts': [{k: v for k, v in c.items() if k not in ('assets','qa','lock')} for c in concepts],
              'coverage': {
                  'new_visual_concepts': 5,
                  'planned_new_question_rows': 17,
                  'reused_live_question_rows': 20,
                  'total_batch10_question_gain_if_new_visuals_lock': 37
              },
              'database_preflight': {
                  'existing_question_rows': 17,
                  'correct_subject_rows': 17,
                  'unowned_question_rows': 17,
                  'already_owned_rows': 0,
                  'planned_key_collisions': 0,
                  'verified': True
              },
              'gates': {
                  'source_selected': True,
                  'refined': False,
                  'qa_approved': False,
                  'preview_ready': False,
                  'mapped': False,
                  'production_ready': False,
                  'live_verified': False
              },
              'next_action': 'Render and refine the five Batch 10 concepts to Batch 1 quality or better, then inspect the actual PNG and WebP outputs before QA approval.'
          }
          save('data/pof-batch-10-source-selection.json', selection)

          state['last_verified_checkpoint'] = 'POF_BATCH_10_SOURCE_FOUND'
          state['next_action'] = selection['next_action']
          state['active_batch_reuse_sweep'] = {
              'batch': 10,
              'mapped_question_rows': 20,
              'reused_live_visuals': 6,
              'database_status': 'LIVE_VERIFIED',
              'exact_match_count': 20,
              'mismatch_count': 0,
              'verified': True
          }
          state['active_batch_source_selection'] = {
              'batch': 10,
              'status': 'SOURCE_FOUND',
              'source_selection_file': 'data/pof-batch-10-source-selection.json',
              'source_documents': ['ac_61-23c_phak_canada.pdf'],
              'visual_concepts': 5,
              'planned_question_rows': 17,
              'visual_keys': [c['visual_id'] for c in concepts],
              'database_preflight': selection['database_preflight'],
              'verified': True
          }
          audit = state['visual_requirement_audit']
          assert audit['live_verified_question_mappings'] == 137
          assert audit['remaining_visual_required'] == 163
          audit['live_verified_question_mappings'] = 157
          audit['remaining_rows_audited'] = 208
          audit['remaining_visual_required'] = 143
          audit['question_coverage_completion_percent'] = 52.3
          audit['verified'] = True

          save(manifest_path, manifest)
          save(state_path, state)
          PY

      - name: Validate SOURCE_FOUND checkpoint
        run: |
          python scripts/validate_pof_visuals.py
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('data/pof-autonomous-state.json').read_text())
          selection = json.loads(Path('data/pof-batch-10-source-selection.json').read_text())
          assert state['last_verified_checkpoint'] == 'POF_BATCH_10_SOURCE_FOUND'
          assert state['visual_requirement_audit']['live_verified_question_mappings'] == 157
          assert selection['database_preflight']['verified'] is True
          assert len(selection['concepts']) == 5
          assert sum(len(c['question_ids']) for c in selection['concepts']) == 17
          print('Batch 10 SOURCE_FOUND checkpoint validated')
          PY

      - name: Commit checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pof-autonomous-state.json data/pof-visual-manifest.json data/pof-batch-10-source-selection.json
          git commit -m "Persist POF Batch 10 SOURCE_FOUND"
          git push origin HEAD:pof-batch-10-rebuild
