name: POF Batch 11 final lock

on:
  push:
    branches: [pof-batch-11-rebuild]
    paths: [.github/workflows/pof-batch11-final-lock.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pof-batch-11-rebuild
          fetch-depth: 0

      - name: Guard exact production content commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "591a8ab30d28d048dd3ec34c7f0a3c6906fa3435"
          ! git ls-remote --exit-code --heads origin pof-batch-11-lock >/dev/null 2>&1
          git worktree add -b pof-batch-11-lock /tmp/pof-b11-lock 591a8ab30d28d048dd3ec34c7f0a3c6906fa3435

      - name: Persist exact LIVE_VERIFIED lock metadata
        working-directory: /tmp/pof-b11-lock
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          sp=Path('data/pof-autonomous-state.json')
          qp=Path('data/pof-batch-11-source-selection.json')
          mp=Path('data/pof-visual-manifest.json')
          s=json.loads(sp.read_text())
          q=json.loads(qp.read_text())
          m=json.loads(mp.read_text())

          ids={
            'pof-trailing-edge-flap-lift-drag-001',
            'pof-flap-stall-speed-001',
            'pof-fowler-flap-wing-area-001',
            'pof-static-dynamic-stability-response-001',
            'pof-directional-fin-weathercock-001',
          }
          rows=[v for v in m['visuals'] if v['visual_id'] in ids]
          assert s['current_batch']==11
          assert s['last_verified_checkpoint']=='POF_BATCH_11_PRODUCTION_READY'
          assert s['active_batch_mapping']['database_status']=='MAPPED'
          assert s['active_batch_mapping']['exact_match_count']==12
          assert s['active_batch_mapping']['unexpected_owner_count']==0
          assert s['production_readiness']['batch']==11 and s['production_readiness']['verified'] is True
          assert q['status']=='PRODUCTION_READY' and q['gates']['production_ready'] is True and q['gates']['live_verified'] is False
          assert len(rows)==5 and sum(len(v['question_ids']) for v in rows)==12
          assert all(v['status']=='PRODUCTION_READY' for v in rows)
          assert all(v['qa']['technical'] and v['qa']['teaching'] and v['qa']['visual'] and v['qa']['preview'] and not v['qa']['live'] for v in rows)
          assert all(v['lock']['approved'] is False for v in rows)

          live={
            'deployment_id':'dpl_6MLdWmykRcmmpfR58Pxs7oUzmYib',
            'production_commit':'591a8ab30d28d048dd3ec34c7f0a3c6906fa3435',
            'domain':'pilotvault.co.za',
            'asset_reachable':True,
            'database_rows_live_verified':True,
          }
          for v in rows:
            v['status']='LIVE_VERIFIED'
            v['qa']['live']=True
            v['lock']['approved']=True
            v['live_verification']=live.copy()

          for c in q['concepts']:
            assert c['visual_id'] in ids
            c['status']='LIVE_VERIFIED'
          q['status']='LIVE_VERIFIED'
          q['gates']['live_verified']=True
          q['next_action']='Begin Batch 12 source selection from the remaining audited visual-required POF rows using the same five-visual fail-closed quality gate.'

          s['current_batch']=12
          s['completed_batches_since_last_user_report']=0
          s['last_user_report_batch']=11
          s['last_verified_checkpoint']='POF_BATCH_11_LIVE_VERIFIED'
          s['production_state']['approved_live_visuals']=55
          s['next_action']='Begin Batch 12 source selection from the remaining audited visual-required POF rows, preserving the five-visual hard quality gate and fail-closed verification rules.'
          s['active_batch_source_selection']=None
          s['active_batch_refinement']=None
          s['active_batch_qa']=None
          s['active_batch_preview']=None
          s['active_batch_mapping']={
            'batch':11,
            'project_ref':'kkmlfbxfopwulwkloaoc',
            'mapped_question_rows':12,
            'visual_keys':5,
            'database_status':'LIVE_VERIFIED',
            'exact_match_count':12,
            'unexpected_owner_count':0,
            'transactional_update':True,
            'post_commit_readback_verified':True,
            'verified':True,
          }
          s['visual_requirement_audit'].update({
            'live_verified_question_mappings':202,
            'remaining_rows_audited':163,
            'remaining_visual_required':98,
            'remaining_no_visual_required':65,
            'total_visual_required_question_universe':300,
            'question_coverage_completion_percent':67.3,
            'verified':True,
          })
          s['live_verification']={
            'batch':11,
            'deployment_id':'dpl_6MLdWmykRcmmpfR58Pxs7oUzmYib',
            'production_commit':'591a8ab30d28d048dd3ec34c7f0a3c6906fa3435',
            'domain':'pilotvault.co.za',
            'production_assets_verified':5,
            'mapped_question_rows':12,
            'reused_live_question_rows':16,
            'exact_deployment_commit_match':True,
            'all_production_webps_reachable':True,
            'live_delivery_content_type':'image/webp',
            'repository_asset_dimensions':'1600x1050',
            'exact_database_rows_live_verified':True,
            'unexpected_database_owners':0,
            'real_renderer_build_verified_on_preview':True,
            'signed_in_student_attempt_inspected':False,
            'github_validation_run':34029215861,
            'preview_preflight_run':33900736232,
            'verification_note':'The exact Batch 11 production content commit reached READY on pilotvault.co.za. All five Batch 11 WebP endpoints returned HTTP 200 image/webp. The exact 12 new Supabase mappings were transactionally advanced from MAPPED to LIVE_VERIFIED and independently read back 12/12 across five keys with zero unexpected owners. Sixteen safe-reuse Batch 11 rows were already LIVE_VERIFIED. Preview rendering used the real ExplanationImage component; no signed-in student-attempt screenshot is claimed.',
            'verified':True,
          }
          assert s['active_batch_reuse_sweep']['batch']==11
          assert s['active_batch_reuse_sweep']['database_status']=='LIVE_VERIFIED'
          assert s['active_batch_reuse_sweep']['mapped_question_rows']==16
          assert s['active_batch_reuse_sweep']['reused_live_visuals']==2

          sp.write_text(json.dumps(s,indent=2,ensure_ascii=False)+'\n')
          qp.write_text(json.dumps(q,indent=2,ensure_ascii=False)+'\n')
          mp.write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n')
          print('Prepared POF_BATCH_11_LIVE_VERIFIED metadata lock.')
          PY

      - name: Validate exact three-file lock boundary and full history
        working-directory: /tmp/pof-b11-lock
        shell: bash
        run: |
          python scripts/validate_pof_visuals.py
          python scripts/validate_pof_visual_changes.py 591a8ab30d28d048dd3ec34c7f0a3c6906fa3435
          python scripts/validate_pof_visual_changes.py 546c2000a613c4e5410b66d86137719785b26ad9
          git add data/pof-autonomous-state.json data/pof-batch-11-source-selection.json data/pof-visual-manifest.json
          git diff --cached --check
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "data/pof-autonomous-state.json data/pof-batch-11-source-selection.json data/pof-visual-manifest.json "
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/pof-autonomous-state.json').read_text())
          q=json.loads(Path('data/pof-batch-11-source-selection.json').read_text())
          m=json.loads(Path('data/pof-visual-manifest.json').read_text())
          ids={c['visual_id'] for c in q['concepts']}; rows=[v for v in m['visuals'] if v['visual_id'] in ids]
          assert s['current_batch']==12 and s['last_verified_checkpoint']=='POF_BATCH_11_LIVE_VERIFIED'
          assert s['production_state']['approved_live_visuals']==55
          assert s['active_batch_mapping']['database_status']=='LIVE_VERIFIED' and s['active_batch_mapping']['exact_match_count']==12 and s['active_batch_mapping']['unexpected_owner_count']==0
          assert s['visual_requirement_audit']['live_verified_question_mappings']==202
          assert s['visual_requirement_audit']['remaining_visual_required']==98
          assert s['visual_requirement_audit']['remaining_no_visual_required']==65
          assert s['visual_requirement_audit']['remaining_rows_audited']==163
          assert s['visual_requirement_audit']['question_coverage_completion_percent']==67.3
          assert q['status']=='LIVE_VERIFIED' and q['gates']['live_verified'] is True
          assert len(rows)==5 and all(v['status']=='LIVE_VERIFIED' and v['qa']['live'] and v['lock']['approved'] for v in rows)
          print('Final Batch 11 lock validation passed.')
          PY

      - name: Commit and push lock branch only
        working-directory: /tmp/pof-b11-lock
        shell: bash
        run: |
          git commit -m "Lock POF Batch 11 after live verification"
          test "$(git rev-parse origin/main)" = "591a8ab30d28d048dd3ec34c7f0a3c6906fa3435"
          git push origin HEAD:refs/heads/pof-batch-11-lock
          echo "LOCK_SHA=$(git rev-parse HEAD)"
