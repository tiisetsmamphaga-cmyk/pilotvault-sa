name: POF Batch 11 source provenance normalization

on:
  push:
    branches:
      - pof-batch-11-rebuild
    paths:
      - .github/workflows/pof-batch11-fix-source-provenance.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Batch 11 work branch
        uses: actions/checkout@v4
        with:
          ref: pof-batch-11-rebuild
          fetch-depth: 0

      - name: Normalize exactly five Batch 11 source records
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path=Path('data/pof-visual-manifest.json')
          selection_path=Path('data/pof-batch-11-source-selection.json')
          state_path=Path('data/pof-autonomous-state.json')
          manifest=json.loads(manifest_path.read_text())
          selection=json.loads(selection_path.read_text())
          state=json.loads(state_path.read_text())

          assert state['last_verified_checkpoint']=='POF_BATCH_11_QA_APPROVED'
          assert selection['status']=='QA_APPROVED'

          provenance={
            'pof-trailing-edge-flap-lift-drag-001': (2, '2-1'),
            'pof-flap-stall-speed-001': (2, '2-1'),
            'pof-fowler-flap-wing-area-001': (2, '2-1'),
            'pof-static-dynamic-stability-response-001': (16, '1-19 / 1-20'),
            'pof-directional-fin-weathercock-001': (24, '1-31'),
          }

          manifest_rows=[v for v in manifest['visuals'] if v['visual_id'] in provenance]
          assert len(manifest_rows)==5
          selection_rows=[c for c in selection['concepts'] if c['visual_id'] in provenance]
          assert len(selection_rows)==5

          for row in manifest_rows:
              page,figure=provenance[row['visual_id']]
              row['source']['page']=page
              row['source']['figure']=figure
          for row in selection_rows:
              page,figure=provenance[row['visual_id']]
              row['source']['page']=page
              row['source']['figure']=figure

          manifest_path.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n')
          selection_path.write_text(json.dumps(selection,indent=2,ensure_ascii=False)+'\n')
          print('Normalized source.page/source.figure for exactly five Batch 11 entries.')
          PY

      - name: Validate canonical manifest after normalization
        run: python scripts/validate_pof_visuals.py

      - name: Persist provenance fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pof-visual-manifest.json data/pof-batch-11-source-selection.json
          git rm .github/workflows/pof-batch11-fix-source-provenance.yml
          git diff --cached --check
          git commit -m "Normalize POF Batch 11 source provenance"
          git push origin HEAD:pof-batch-11-rebuild
