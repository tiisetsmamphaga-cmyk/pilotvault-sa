name: POF Batch 12 mapped checkpoint

on:
  push:
    branches:
      - pof-batch-12-rebuild
    paths:
      - .github/workflows/pof-batch12-mapped-checkpoint.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pof-batch-12-rebuild
          fetch-depth: 0

      - name: Persist exact MAPPED state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def load(p): return json.loads(Path(p).read_text())
          def save(p,d): Path(p).write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          sp='data/pof-autonomous-state.json'; qp='data/pof-batch-12-source-selection.json'; mp='data/pof-visual-manifest.json'
          s=load(sp); q=load(qp); m=load(mp)
          ids={c['visual_id'] for c in q['concepts']}; rows=[v for v in m['visuals'] if v['visual_id'] in ids]
          assert s['current_batch']==12
          assert s['last_verified_checkpoint']=='POF_BATCH_12_PREVIEW_READY'
          assert s['active_batch_preview']['verified'] is True
          assert q['status']=='PREVIEW_READY' and q['gates']['preview_ready'] is True and q['gates']['mapped'] is False
          assert len(rows)==5 and sum(len(v['question_ids']) for v in rows)==10
          assert all(v['status']=='PREVIEW_READY' and v['qa']['preview'] and not v['qa']['live'] for v in rows)

          evidence={
            'project_ref':'kkmlfbxfopwulwkloaoc','database_status':'MAPPED','intended_rows':10,'exact_match_count':10,
            'mapped_status_count':10,'unexpected_owner_count':0,'transactional_update':True,'post_commit_readback_verified':True,
            'preconditions':{'existing_rows':10,'correct_subject_rows':10,'unowned_refining_rows':10,'already_owned_rows':0,'planned_key_collisions':0},
            'verified':True,
            'verification_note':'After PREVIEW_READY, a guarded all-or-nothing Supabase transaction mapped exactly the 10 selected Batch 12 POF rows from untouched REFINING state to the five intended visual keys. Independent readback returned 10/10 exact expected key/url/status mappings across five keys and zero unexpected owners.'
          }
          for v in rows: v['status']='MAPPED'; v['mapping_verification']=evidence.copy()
          for c in q['concepts']: c['status']='MAPPED'
          q['status']='MAPPED'; q['gates']['mapped']=True
          q['next_action']='Construct a clean Batch 12 production candidate preserving exact stage history, excluding temporary QA route, generator and workflows; require full validators and green frozen-lock build before main.'
          s['last_verified_checkpoint']='POF_BATCH_12_MAPPED'
          s['active_batch_source_selection']['status']='MAPPED'; s['active_batch_refinement']['status']='MAPPED'; s['active_batch_qa']['status']='MAPPED'; s['active_batch_preview']['status']='MAPPED'
          s['active_batch_mapping']={'batch':12,'project_ref':'kkmlfbxfopwulwkloaoc','mapped_question_rows':10,'visual_keys':5,'database_status':'MAPPED','exact_match_count':10,'unexpected_owner_count':0,'transactional_update':True,'post_commit_readback_verified':True,'verified':True}
          s['next_action']='Build the clean Batch 12 production candidate from the locked Batch 11 main checkpoint with exact stage history, 5 PNG + 5 WebP, renderer Batch 12 allowlist and data state only; require full validators and green production build before main.'
          save(mp,m); save(qp,q); save(sp,s)
          print('POF_BATCH_12_MAPPED persisted: 10 rows / 5 keys.')
          PY

      - name: Validate mapped checkpoint
        run: |
          python scripts/validate_pof_visuals.py
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/pof-autonomous-state.json').read_text()); q=json.loads(Path('data/pof-batch-12-source-selection.json').read_text()); m=json.loads(Path('data/pof-visual-manifest.json').read_text())
          ids={c['visual_id'] for c in q['concepts']}; rows=[v for v in m['visuals'] if v['visual_id'] in ids]
          assert s['last_verified_checkpoint']=='POF_BATCH_12_MAPPED'
          assert s['active_batch_mapping']['database_status']=='MAPPED' and s['active_batch_mapping']['exact_match_count']==10 and s['active_batch_mapping']['unexpected_owner_count']==0
          assert q['status']=='MAPPED' and q['gates']['mapped'] is True
          assert len(rows)==5 and sum(len(v['question_ids']) for v in rows)==10
          assert all(v['status']=='MAPPED' and v['qa']['preview'] and not v['qa']['live'] for v in rows)
          print('Batch 12 MAPPED checkpoint validation passed.')
          PY

      - name: Commit mapped checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pof-autonomous-state.json data/pof-batch-12-source-selection.json data/pof-visual-manifest.json
          git diff --cached --check
          git commit -m "Mark POF Batch 12 mapped"
          git push origin HEAD:pof-batch-12-rebuild
