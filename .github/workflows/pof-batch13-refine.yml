name: POF Batch 13 refine

on:
  push:
    branches:
      - pof-batch-13-rebuild

permissions:
  contents: write

env:
  SOURCE_SHA: d7f9f06365b2f90eac47de86fb75cc503dbc4c42

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: pof-batch-13-rebuild

      - name: Assert exact SOURCE_FOUND starting point
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/pof-batch13-refine.yml"
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('data/pof-autonomous-state.json').read_text())
          sel=json.loads(Path('data/pof-batch-13-source-selection.json').read_text())
          assert state['last_verified_checkpoint']=='POF_BATCH_13_SOURCE_FOUND'
          assert state['visual_requirement_audit']['live_verified_question_mappings']==224
          assert sel['status']=='SOURCE_FOUND'
          assert len(sel['concepts'])==5
          assert sel['planned_new_question_rows']==19
          PY

      - name: Persist distinct REFINING checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          sp=Path('data/pof-batch-13-source-selection.json')
          sel=json.loads(sp.read_text())
          assert sel['status']=='SOURCE_FOUND'
          sel['status']='REFINING'
          for c in sel['concepts']:
              assert c['status']=='SOURCE_FOUND'
              c['status']='REFINING'
          sel['next_action']='Render exactly five Batch 13 1600x1050 PNG/WebP pairs, inspect the actual WebP and PNG rasters, and fail closed on any defect.'
          sp.write_text(json.dumps(sel,indent=2)+'\n')

          stp=Path('data/pof-autonomous-state.json')
          st=json.loads(stp.read_text())
          assert st['last_verified_checkpoint']=='POF_BATCH_13_SOURCE_FOUND'
          st['last_verified_checkpoint']='POF_BATCH_13_REFINING'
          st['next_action']='Render exactly five Batch 13 1600x1050 PNG/WebP pairs, inspect the actual WebP and PNG rasters, and fail closed on any defect.'
          st['active_batch_source_selection']['status']='REFINING'
          st['active_batch_refinement']={
              'batch':13,
              'status':'REFINING',
              'visual_concepts':5,
              'planned_png_assets':5,
              'planned_webp_assets':5,
              'planned_svg_assets':0,
              'target_dimensions':'1600x1050',
              'output_directory':'public/explanation-images/principles-of-flight/refined-batch-13',
              'verified':True
          }
          stp.write_text(json.dumps(st,indent=2)+'\n')
          PY
          python scripts/validate_pof_visuals.py
          python scripts/validate_pof_visual_changes.py "$SOURCE_SHA"
          rm .github/workflows/pof-batch13-refine.yml
          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA" | sort)
          expected=(data/pof-autonomous-state.json data/pof-batch-13-source-selection.json)
          mapfile -t exp < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq 2
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${exp[@]}")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pof-autonomous-state.json data/pof-batch-13-source-selection.json
          git add -u .github/workflows/pof-batch13-refine.yml
          git commit -m 'Mark POF Batch 13 refining'
          git push origin HEAD:pof-batch-13-rebuild

      - name: Install Pillow
        shell: bash
        run: python -m pip install --disable-pip-version-check pillow

      - name: Render five Batch 13 visual pairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import math, json

          W,H=1600,1050
          BG='#071522'; PANEL='#0d2235'; PANEL2='#102b42'; WHITE='#f7f9fb'; MUTED='#b9c7d5'; GOLD='#f4b400'; GOLD2='#ffd56a'; RED='#ef6b62'; GREEN='#73d6ad'; BLUE='#72b8f4'; LINE='#527089'
          OUT=Path('public/explanation-images/principles-of-flight/refined-batch-13')
          OUT.mkdir(parents=True,exist_ok=True)
          font_path='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          bold_path='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          def F(sz,b=False): return ImageFont.truetype(bold_path if b else font_path,sz)
          def panel(d,box,r=28,fill=PANEL,outline='#21405a',width=2): d.rounded_rectangle(box,radius=r,fill=fill,outline=outline,width=width)
          def txt(d,xy,s,sz=28,fill=WHITE,b=False,anchor=None): d.text(xy,s,font=F(sz,b),fill=fill,anchor=anchor)
          def wrap(d,box,s,sz=26,fill=MUTED,b=False,spacing=8):
              x0,y0,x1,y1=box; words=s.split(); lines=[]; line=''
              for w in words:
                  test=(line+' '+w).strip()
                  if d.textbbox((0,0),test,font=F(sz,b))[2] <= x1-x0: line=test
                  else:
                      if line: lines.append(line)
                      line=w
              if line: lines.append(line)
              y=y0
              for line in lines:
                  d.text((x0,y),line,font=F(sz,b),fill=fill); y+=sz+spacing
              return y
          def arrow(d,p1,p2,fill=GOLD,width=8,head=22):
              x1,y1=p1; x2,y2=p2; d.line((x1,y1,x2,y2),fill=fill,width=width)
              a=math.atan2(y2-y1,x2-x1); pts=[]
              for off in (math.pi*0.82,-math.pi*0.82): pts.append((x2+head*math.cos(a+off),y2+head*math.sin(a+off)))
              d.polygon([(x2,y2),*pts],fill=fill)
          def header(d,title,sub):
              txt(d,(80,56),title,52,WHITE,True); txt(d,(82,120),sub,25,MUTED); d.line((80,165,1520,165),fill=GOLD,width=4)
          def save(im,name):
              png=OUT/f'{name}-v1.png'; web=OUT/f'{name}-v1.webp'; im.save(png,'PNG',optimize=True); im.save(web,'WEBP',quality=92,method=6); return png,web
          def arc_arrow(d,box,start,end,fill=GOLD,width=8):
              d.arc(box,start=start,end=end,fill=fill,width=width)
              # arrowhead approximately at arc end
              cx=(box[0]+box[2])/2; cy=(box[1]+box[3])/2; rx=(box[2]-box[0])/2; ry=(box[3]-box[1])/2
              a=math.radians(end); x=cx+rx*math.cos(a); y=cy+ry*math.sin(a); tang=a+math.pi/2
              pts=[(x,y),(x-22*math.cos(tang-0.6),y-22*math.sin(tang-0.6)),(x-22*math.cos(tang+0.6),y-22*math.sin(tang+0.6))]
              d.polygon(pts,fill=fill)

          # 1 longitudinal dihedral
          im=Image.new('RGB',(W,H),BG); d=ImageDraw.Draw(im); header(d,'Longitudinal Dihedral','Legacy POF term: tailplane incidence lower than mainplane → pitch stability')
          panel(d,(70,205,1030,940)); panel(d,(1060,205,1530,940),fill=PANEL2)
          txt(d,(110,245),'SIDE-VIEW GEOMETRY',26,GOLD,True)
          # fuselage and datum
          d.rounded_rectangle((185,500,890,585),28,fill='#d9e3ec',outline=WHITE,width=3)
          d.polygon([(890,510),(1000,545),(890,575)],fill='#d9e3ec',outline=WHITE)
          d.line((145,615,1000,615),fill=LINE,width=3); txt(d,(150,628),'aircraft longitudinal axis / datum',22,MUTED)
          # wing chord + body
          wing_a=math.radians(-4); cx,cy=485,505; L=330; dx=L/2*math.cos(wing_a); dy=L/2*math.sin(wing_a)
          d.line((cx-dx,cy-dy,cx+dx,cy+dy),fill=GOLD,width=14); txt(d,(330,445),'MAINPLANE chord',24,GOLD,True)
          # tailplane lower incidence 0 deg
          d.line((805,532,985,532),fill=BLUE,width=12); txt(d,(785,465),'TAILPLANE chord',24,BLUE,True)
          # incidence guide/angles
          d.line((320,505,650,505),fill='#668096',width=2); arc_arrow(d,(420,470,555,605),180,192,fill=GOLD,width=5); txt(d,(545,545),'i₍wing₎ ≈ +4°',24,GOLD,True)
          d.line((795,555,995,555),fill='#668096',width=2); txt(d,(795,575),'i₍tail₎ ≈ 0°',24,BLUE,True)
          panel(d,(155,720,950,880),fill='#0a1b2b',outline=GOLD,width=2); txt(d,(190,750),'KEY RELATIONSHIP',24,GOLD,True); wrap(d,(190,790,910,865),'Tailplane set at a LOWER angle of incidence than the mainplane. This is the syllabus relationship called longitudinal dihedral.',28,WHITE,True)
          txt(d,(1100,250),'WHAT STABILITY?',26,GOLD,True); txt(d,(1295,380),'PITCH',42,WHITE,True,anchor='mm')
          # pitch silhouette and axis
          d.ellipse((1225,445,1365,585),outline=WHITE,width=5); d.line((1140,515,1450,515),fill=BLUE,width=7); txt(d,(1295,610),'lateral axis',24,BLUE,True,anchor='mm'); arc_arrow(d,(1135,330,1455,700),210,325,fill=GOLD,width=9); txt(d,(1295,740),'LONGITUDINAL',28,GREEN,True,anchor='mm'); txt(d,(1295,780),'STABILITY',28,GREEN,True,anchor='mm'); wrap(d,(1125,830,1470,915),'Resists pitch disturbances about the lateral axis.',24,MUTED,False)
          save(im,'pof-longitudinal-dihedral-pitch-stability')

          # 2 flap CP pitch
          im=Image.new('RGB',(W,H),BG); d=ImageDraw.Draw(im); header(d,'Plain Flap: Centre of Pressure Shift','For the conventional/plain trailing-edge flap case used in these POF questions')
          panel(d,(70,215,760,900)); panel(d,(840,215,1530,900))
          def airfoil(d,origin,flap_down=False):
              x,y=origin
              # main airfoil polygon
              body=[(x,y),(x+70,y-32),(x+230,y-45),(x+430,y-22),(x+520,y),(x+430,y+24),(x+230,y+35),(x+70,y+25)]
              d.polygon(body,fill='#dce6ee',outline=WHITE)
              hinge=(x+520,y)
              if flap_down:
                  ang=math.radians(24); end=(hinge[0]+150*math.cos(ang), hinge[1]+150*math.sin(ang)); d.line((hinge[0],hinge[1],end[0],end[1]),fill=GOLD,width=26); d.ellipse((hinge[0]-7,hinge[1]-7,hinge[0]+7,hinge[1]+7),fill=WHITE)
              else: d.line((hinge[0],hinge[1],x+670,y),fill=GOLD,width=26)
              return x,y
          txt(d,(415,255),'FLAP UP',30,WHITE,True,anchor='mm'); airfoil(d,(120,500),False); d.line((150,650,700,650),fill=LINE,width=3); txt(d,(150,665),'fixed CG reference',21,MUTED)
          # CG and CP
          d.ellipse((345,625,375,655),fill=WHITE); txt(d,(360,695),'CG',22,WHITE,True,anchor='mm'); d.ellipse((410,482,438,510),fill=GOLD); txt(d,(424,455),'CP',24,GOLD,True,anchor='mm'); arrow(d,(424,480),(424,330),GREEN,9,24); txt(d,(445,330),'LIFT',22,GREEN,True)
          txt(d,(1185,255),'FLAP DOWN',30,WHITE,True,anchor='mm'); airfoil(d,(890,500),True); d.line((920,650,1470,650),fill=LINE,width=3); d.ellipse((1115,625,1145,655),fill=WHITE); txt(d,(1130,695),'CG fixed',22,WHITE,True,anchor='mm'); d.ellipse((1255,520,1283,548),fill=GOLD); txt(d,(1269,490),'CP',24,GOLD,True,anchor='mm'); arrow(d,(1269,518),(1269,340),GREEN,9,24); txt(d,(1290,340),'LIFT',22,GREEN,True)
          arrow(d,(430,760),(1250,760),GOLD,7,24); txt(d,(840,720),'CP SHIFTS AFT',28,GOLD,True,anchor='mm'); arc_arrow(d,(1120,685,1430,930),205,335,fill=RED,width=9); txt(d,(1280,880),'nose-down pitching tendency',24,RED,True,anchor='mm')
          save(im,'pof-flap-centre-pressure-pitch')

          # 3 slip/skid left turn
          im=Image.new('RGB',(W,H),BG); d=ImageDraw.Draw(im); header(d,'Slip, Coordinated Turn & Skid','LEFT TURN: ball inside (left) = slip • centred = coordinated • outside (right) = skid')
          cols=[(70,220,530,900),(570,220,1030,900),(1070,220,1530,900)]; labels=[('SLIP','BALL LEFT = INSIDE',GOLD),('COORDINATED','BALL CENTRED',GREEN),('SKID','BALL RIGHT = OUTSIDE',RED)]; ballpos=[-1,0,1]
          for box,(lab,sub,col),bp in zip(cols,labels,ballpos):
              panel(d,box,fill=PANEL2); cx=(box[0]+box[2])//2
              txt(d,(cx,270),lab,32,col,True,anchor='mm'); txt(d,(cx,315),sub,20,MUTED,True,anchor='mm')
              # left-turn arrow
              arc_arrow(d,(cx-100,360,cx+100,560),40,285,fill=BLUE,width=7); txt(d,(cx,465),'LEFT\nTURN',22,BLUE,True,anchor='mm')
              # inclinometer tube
              tx0,ty0,tx1,ty1=cx-155,650,cx+155,765
              d.arc((tx0,ty0-90,tx1,ty1+20),20,160,fill=WHITE,width=11)
              d.line((cx-45,680,cx-45,755),fill=MUTED,width=5); d.line((cx+45,680,cx+45,755),fill=MUTED,width=5)
              bx=cx+bp*92; by=735 if bp==0 else 720
              d.ellipse((bx-28,by-28,bx+28,by+28),fill=col,outline=WHITE,width=3)
              txt(d,(cx,820),'“Step on the ball”',22,MUTED,False,anchor='mm')
          txt(d,(800,960),'Inside of a LEFT turn is LEFT  ←     →  Outside is RIGHT',24,WHITE,True,anchor='mm')
          save(im,'pof-slip-skid-ball-left-turn')

          # 4 mass balance/flutter
          im=Image.new('RGB',(W,H),BG); d=ImageDraw.Draw(im); header(d,'Control-Surface Mass Balance & Flutter','A counterweight ahead of the hinge reduces inertial unbalance and flutter susceptibility')
          panel(d,(70,215,930,920)); panel(d,(970,215,1530,920),fill=PANEL2)
          txt(d,(115,255),'MASS BALANCE GEOMETRY',26,GOLD,True)
          # fixed surface / hinge / control
          d.polygon([(140,440),(640,390),(640,690),(140,640)],fill='#cbd8e2',outline=WHITE); d.polygon([(640,390),(880,465),(880,615),(640,690)],fill='#4d6c83',outline=WHITE)
          d.line((640,350,640,735),fill=GOLD,width=9); txt(d,(655,355),'HINGE LINE',22,GOLD,True)
          # arm and counterweight ahead hinge
          d.line((690,525,535,505),fill=WHITE,width=12); d.ellipse((485,455,565,535),fill=GOLD,outline=WHITE,width=4); txt(d,(525,430),'COUNTERWEIGHT',21,GOLD,True,anchor='mm'); arrow(d,(525,445),(525,375),GOLD,6,18); txt(d,(510,780),'AHEAD OF HINGE',28,GREEN,True,anchor='mm'); wrap(d,(125,820,875,900),'Mass balancing brings the control surface’s mass distribution toward the hinge and reduces inertial rotation in a flutter mode.',24,MUTED)
          txt(d,(1015,255),'WHAT IS FLUTTER?',26,GOLD,True); txt(d,(1245,365),'SELF-EXCITED',30,RED,True,anchor='mm'); txt(d,(1245,405),'OSCILLATION',30,RED,True,anchor='mm')
          d.line((1090,590,1400,590),fill=WHITE,width=12); d.line((1245,500,1245,680),fill=GOLD,width=7)
          arc_arrow(d,(1100,450,1390,730),195,330,fill=RED,width=9); arc_arrow(d,(1100,450,1390,730),15,150,fill=RED,width=9)
          panel(d,(1040,750,1460,875),fill='#0a1b2b',outline=GREEN,width=2); txt(d,(1250,785),'MASS BALANCE',24,GREEN,True,anchor='mm'); txt(d,(1250,825),'reduces susceptibility',24,WHITE,True,anchor='mm'); txt(d,(1250,860),'— it does not replace full flutter design.',18,MUTED,False,anchor='mm')
          save(im,'pof-control-mass-balance-flutter')

          # 5 aerodynamic horn/inset balance
          im=Image.new('RGB',(W,H),BG); d=ImageDraw.Draw(im); header(d,'Aerodynamic Control Balance','Horn balance and inset hinge put aerodynamic area ahead of the hinge to reduce pilot force')
          panel(d,(70,215,770,910)); panel(d,(830,215,1530,910)); txt(d,(420,260),'HORN BALANCE',30,GOLD,True,anchor='mm'); txt(d,(1180,260),'INSET HINGE',30,GOLD,True,anchor='mm')
          # horn planform
          d.polygon([(150,390),(470,390),(470,720),(150,720)],fill='#cbd8e2',outline=WHITE); d.line((470,340,470,780),fill=GOLD,width=8)
          d.polygon([(470,360),(650,360),(650,720),(470,720),(470,525),(420,525),(420,390),(470,390)],fill='#4d6c83',outline=WHITE)
          d.rectangle((420,390,470,525),fill=BLUE,outline=WHITE); txt(d,(445,345),'area ahead\nof hinge',20,BLUE,True,anchor='mm')
          arrow(d,(445,470),(390,470),BLUE,7,20); arc_arrow(d,(360,430,560,630),200,315,fill=GREEN,width=7); txt(d,(525,650),'assisting moment',20,GREEN,True,anchor='mm')
          txt(d,(485,790),'HINGE',20,GOLD,True,anchor='mm'); wrap(d,(125,820,720,895),'The horn projects forward of the hinge. Air load on that area assists control movement.',22,MUTED)
          # inset hinge
          d.polygon([(900,420),(1080,380),(1450,430),(1450,700),(1080,740),(900,700)],fill='#4d6c83',outline=WHITE)
          d.line((1110,330,1110,790),fill=GOLD,width=8); d.polygon([(930,450),(1110,420),(1110,700),(930,675)],fill=BLUE,outline=WHITE)
          txt(d,(1020,360),'surface area\nahead of hinge',20,BLUE,True,anchor='mm'); arrow(d,(1030,535),(970,535),BLUE,7,20); arc_arrow(d,(1010,440,1250,690),200,315,fill=GREEN,width=7); txt(d,(1290,655),'assisting moment',20,GREEN,True,anchor='mm'); txt(d,(1125,790),'HINGE SET AFT',20,GOLD,True,anchor='mm'); wrap(d,(885,820,1480,895),'Setting the hinge behind the leading edge leaves control-surface area ahead of it to reduce hinge moment.',22,MUTED)
          txt(d,(800,965),'AERODYNAMIC BALANCE ≠ MASS BALANCE',24,WHITE,True,anchor='mm')
          save(im,'pof-control-aerodynamic-balance-horn-inset')

          # verify outputs
          expected=['pof-longitudinal-dihedral-pitch-stability','pof-flap-centre-pressure-pitch','pof-slip-skid-ball-left-turn','pof-control-mass-balance-flutter','pof-control-aerodynamic-balance-horn-inset']
          pngs=sorted(OUT.glob('*.png')); webs=sorted(OUT.glob('*.webp'))
          assert len(pngs)==5 and len(webs)==5
          for p in pngs+webs:
              with Image.open(p) as chk: assert chk.size==(1600,1050), (p,chk.size)
          # contact sheets generated from actual delivery files and masters
          def contact(paths,out):
              sheet=Image.new('RGB',(1800,2200),'#06111d'); sd=ImageDraw.Draw(sheet)
              for idx,p in enumerate(paths):
                  with Image.open(p) as src:
                      thumb=src.convert('RGB'); thumb.thumbnail((820,560),Image.Resampling.LANCZOS)
                  col=idx%2; row=idx//2; x=45+col*875; y=55+row*690
                  sheet.paste(thumb,(x,y)); sd.text((x,y+575),p.name,font=F(24,True),fill='white')
              sheet.save(out,'PNG')
          contact(webs,Path('/tmp/pof-batch13-webp-contact.png')); contact(pngs,Path('/tmp/pof-batch13-png-contact.png'))
          PY

      - name: Register REFINING manifest entries and validate rasters
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          out=Path('public/explanation-images/principles-of-flight/refined-batch-13')
          assert len(list(out.glob('*.png')))==5
          assert len(list(out.glob('*.webp')))==5
          assert len(list(out.glob('*.svg')))==0
          for p in list(out.glob('*.png'))+list(out.glob('*.webp')):
              with Image.open(p) as im: assert im.size==(1600,1050)
          mp=Path('data/pof-visual-manifest.json'); m=json.loads(mp.read_text())
          ids={v.get('visual_id') for v in m['visuals']}
          entries=[
            {
              'visual_id':'pof-longitudinal-dihedral-pitch-stability-001','topic':'Stability','concept':'Longitudinal dihedral is the legacy syllabus relationship in which the tailplane is set at a lower angle of incidence than the mainplane, supporting longitudinal stability in pitch about the lateral axis.','question_ids':[1130,1166,1187,1198,1325,1337],
              'source':{'document':'POF mock exams written by Rihan.pdf','page':16,'figure':None,'location':'STABILITY section, visible pages 15-17','notes':'The syllabus material explicitly defines longitudinal dihedral as tailplane incidence lower than mainplane and links it to stability in the pitching plane/about the lateral axis.'},
              'brief':{'student_must_understand':'Do not confuse longitudinal dihedral with wing dihedral: here it means the tailplane incidence is lower than the mainplane and the stability concerned is pitch/longitudinal stability about the lateral axis.','preserve':['Aircraft longitudinal-axis reference','Separate mainplane and tailplane chord/incidence lines','Pitch/lateral-axis relationship'],'refine':['Use a clean side-view geometry','Make lower tailplane incidence visually explicit','Keep geometric wing dihedral out of the visual'],'add':['MAINPLANE incidence','TAILPLANE lower incidence','PITCH / lateral axis','Longitudinal stability'],'remove':['Wing dihedral front view','Yaw/roll stability material','Baked PilotVault banner']},
              'assets':{'master_asset':'public/explanation-images/principles-of-flight/refined-batch-13/pof-longitudinal-dihedral-pitch-stability-v1.png','web_asset':'public/explanation-images/principles-of-flight/refined-batch-13/pof-longitudinal-dihedral-pitch-stability-v1.webp'},
              'mapping_reason':'All six questions test the same legacy longitudinal-dihedral definition and its pitch/lateral-axis stability relationship.','status':'REFINING','qa':{'technical':False,'teaching':False,'visual':False,'preview':False,'live':False},'lock':{'approved':False,'replacement_reason':None},'reuse_justification':'All six questions test the same exact geometry and stability relationship: tailplane lower incidence than mainplane, providing longitudinal/pitch stability about the lateral axis.'
            },
            {
              'visual_id':'pof-flap-centre-pressure-pitch-001','topic':'Flaps & Glide','concept':'On the conventional/plain trailing-edge flap case used in the questions, flap extension moves the centre of pressure aft and creates a nose-down pitching moment.','question_ids':[1223,1346],
              'source':{'document':'FAA-H-8083-25B Pilot’s Handbook of Aeronautical Knowledge','page':8,'figure':'6-17','location':'Chapter 6, page 6-8','notes':'FAA text states that a plain flap increases camber/lift/drag and moves CP aft, resulting in a nose-down pitching moment.'},
