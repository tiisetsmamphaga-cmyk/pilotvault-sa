name: POF Batch 4 Rendered QA

on:
  push:
    branches:
      - pof-batches-2-4-clean-v2
    paths:
      - '.github/workflows/pof-batch4-contact-sheet.yml'

permissions:
  contents: read

jobs:
  render-contact-sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Pillow
        run: python -m pip install --disable-pip-version-check 'Pillow==12.3.0'
      - name: Build Batch 4 contact sheet
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          folder=Path('public/explanation-images/principles-of-flight/refined-batch-4')
          names=[
            'pof-aircraft-axes-controls-v1.png',
            'pof-critical-aoa-stall-v4.png',
            'pof-stability-types-v1.png',
            'pof-turn-lift-components-v4.png',
            'pof-washout-wing-twist-v1.png',
          ]
          thumbs=[]
          W,H=1200,788
          for name in names:
              p=folder/name
              assert p.exists(), p
              im=Image.open(p).convert('RGB')
              im.thumbnail((W,H-48), Image.Resampling.LANCZOS)
              canvas=Image.new('RGB',(W,H),'white')
              x=(W-im.width)//2
              y=30
              canvas.paste(im,(x,y))
              d=ImageDraw.Draw(canvas)
              d.text((16,H-30),name,fill='black')
              thumbs.append(canvas)
          sheet=Image.new('RGB',(W*2,H*3),(238,238,238))
          for i,im in enumerate(thumbs):
              sheet.paste(im,((i%2)*W,(i//2)*H))
          out=Path('qa-output/pof_batch4_contact.png')
          out.parent.mkdir(exist_ok=True)
          sheet.save(out,optimize=True)
          print(out)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pof-batch4-contact
          path: qa-output/pof_batch4_contact.png
          if-no-files-found: error
          retention-days: 2
