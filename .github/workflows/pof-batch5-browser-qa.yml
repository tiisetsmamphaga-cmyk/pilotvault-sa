name: POF Batch 5 browser rendering QA

on:
  push:
    branches: [pof-batch5-clean-v2]
    paths: [.github/workflows/pof-batch5-browser-qa.yml]

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: browser-qa-anon-placeholder
      SUPABASE_SECRET_KEY: browser-qa-server-placeholder
      PAYSTACK_SECRET_KEY: browser-qa-paystack-placeholder
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pof-batch5-clean-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build exact preview source
        run: pnpm run build
      - name: Install Chromium QA runner
        run: |
          pnpm add --save-dev --ignore-workspace-root-check playwright@1.55.0
          pnpm exec playwright install --with-deps chromium
      - name: Start built app
        run: |
          (pnpm start > /tmp/pof-next.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/pof-visual-qa >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/pof-next.log
          exit 1
      - name: Render and validate five explanation images
        run: |
          cat > .pof-browser-qa.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const out = '/tmp/pof-browser-qa';
          fs.mkdirSync(out, { recursive: true });
          const expected = [
            '/explanation-images/principles-of-flight/refined-batch-5/pof-load-factor-20deg-v2.webp',
            '/explanation-images/principles-of-flight/refined-batch-5/pof-load-factor-50deg-v1.webp',
            '/explanation-images/principles-of-flight/refined-batch-5/pof-load-limit-2-5g-bank-v1.webp',
            '/explanation-images/principles-of-flight/refined-batch-5/pof-load-limit-3-8g-bank-v1.webp',
            '/explanation-images/principles-of-flight/refined-batch-5/pof-fowler-flap-area-v1.webp',
          ];
          const d = { routeStatus: null, responses: [], consoleErrors: [], pageErrors: [], images: [], failure: null };
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1100 } });
          page.on('response', r => {
            const p = new URL(r.url()).pathname;
            if (expected.includes(p)) d.responses.push({ path: p, status: r.status() });
          });
          page.on('console', m => { if (m.type() === 'error') d.consoleErrors.push(m.text()); });
          page.on('pageerror', e => d.pageErrors.push(String(e)));

          let failure;
          try {
            const r = await page.goto('http://127.0.0.1:3000/pof-visual-qa', { waitUntil: 'domcontentloaded' });
            d.routeStatus = r?.status() ?? null;
            if (d.routeStatus !== 200) throw new Error(`route status ${d.routeStatus}`);
            await page.waitForFunction(() => document.querySelectorAll('img').length === 5, null, { timeout: 10000 });
            const sections = page.locator('section');
            if (await sections.count() !== 5) throw new Error('expected 5 sections');
            for (let i = 0; i < 5; i++) {
              await sections.nth(i).scrollIntoViewIfNeeded();
              await page.waitForFunction(index => {
                const img = document.querySelectorAll('img')[index];
                return !!img && img.complete && img.naturalWidth > 0 && img.naturalHeight > 0;
              }, i, { timeout: 10000 });
            }
            d.images = await page.locator('img').evaluateAll(imgs => imgs.map(img => ({
              src: new URL(img.src).pathname,
              complete: img.complete,
              naturalWidth: img.naturalWidth,
              naturalHeight: img.naturalHeight,
              renderedWidth: img.getBoundingClientRect().width,
              renderedHeight: img.getBoundingClientRect().height,
              opacity: getComputedStyle(img).opacity,
              display: getComputedStyle(img).display,
            })));
            const statuses = new Map(d.responses.map(x => [x.path, x.status]));
            if (expected.some(path => statuses.get(path) !== 200)) throw new Error(`non-200 image response: ${JSON.stringify(d.responses)}`);
            if (d.images.length !== 5 || expected.some(path => !d.images.some(x => x.src === path))) throw new Error('wrong image set');
            if (d.images.some(x => !x.complete || x.naturalWidth !== 1600 || x.naturalHeight !== 1050 || x.renderedWidth <= 0 || x.renderedHeight <= 0 || x.display === 'none' || x.opacity === '0')) throw new Error(`invalid rendered image: ${JSON.stringify(d.images)}`);
          } catch (e) {
            failure = e;
            d.failure = e instanceof Error ? `${e.name}: ${e.message}` : String(e);
          } finally {
            if (!d.images.length) {
              d.images = await page.locator('img').evaluateAll(imgs => imgs.map(img => ({
                src: img.src ? new URL(img.src).pathname : null,
                complete: img.complete,
                naturalWidth: img.naturalWidth,
                naturalHeight: img.naturalHeight,
                renderedWidth: img.getBoundingClientRect().width,
                renderedHeight: img.getBoundingClientRect().height,
                opacity: getComputedStyle(img).opacity,
                display: getComputedStyle(img).display,
              })));
            }
            await page.screenshot({ path: `${out}/pof-batch5-browser-qa.png`, fullPage: true });
            fs.writeFileSync(`${out}/results.json`, JSON.stringify(d, null, 2));
            console.log(JSON.stringify(d, null, 2));
            await browser.close();
          }
          if (failure) throw failure;
          NODE
          node .pof-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pof-batch5-browser-qa
          path: /tmp/pof-browser-qa
          if-no-files-found: error
          compression-level: 0
