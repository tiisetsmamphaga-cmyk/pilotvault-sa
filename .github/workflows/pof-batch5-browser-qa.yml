name: POF Batch 5 browser rendering QA

on:
  push:
    branches:
      - pof-batch5-clean-v2
    paths:
      - .github/workflows/pof-batch5-browser-qa.yml

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: browser-qa-anon-placeholder
      SUPABASE_SECRET_KEY: browser-qa-server-placeholder
      PAYSTACK_SECRET_KEY: browser-qa-paystack-placeholder
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pof-batch5-clean-v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build exact preview source
        run: pnpm run build

      - name: Install workspace-local Chromium QA runner
        run: |
          pnpm add --save-dev --ignore-workspace-root-check playwright@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Start built app
        run: |
          (pnpm start > /tmp/pof-next.log 2>&1 & echo $! > /tmp/pof-next.pid)
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/pof-visual-qa >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pof-next.log
          exit 1

      - name: Render and validate all five visuals
        run: |
          cat > .pof-browser-qa.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const outDir = '/tmp/pof-browser-qa';
          fs.mkdirSync(outDir, { recursive: true });

          const expected = [
            '/explanation-images/principles-of-flight/refined-batch-5/pof-load-factor-20deg-v2.webp',
            '/explanation-images/principles-of-flight/refined-batch-5/pof-load-factor-50deg-v1.webp',
            '/explanation-images/principles-of-flight/refined-batch-5/pof-load-limit-2-5g-bank-v1.webp',
            '/explanation-images/principles-of-flight/refined-batch-5/pof-load-limit-3-8g-bank-v1.webp',
            '/explanation-images/principles-of-flight/refined-batch-5/pof-fowler-flap-area-v1.webp',
          ];

          const diagnostics = {
            routeStatus: null,
            expected,
            responses: [],
            consoleErrors: [],
            pageErrors: [],
            images: [],
            failure: null,
          };

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1100 }, deviceScaleFactor: 1 });

          page.on('response', response => {
            const url = new URL(response.url());
            if (expected.includes(url.pathname)) {
              diagnostics.responses.push({ path: url.pathname, status: response.status() });
            }
          });
          page.on('console', message => {
            if (message.type() === 'error') diagnostics.consoleErrors.push(message.text());
          });
          page.on('pageerror', error => diagnostics.pageErrors.push(String(error)));

          let failure = null;
          try {
            const response = await page.goto('http://127.0.0.1:3000/pof-visual-qa', { waitUntil: 'domcontentloaded' });
            diagnostics.routeStatus = response?.status() ?? null;
            if (!response || response.status() !== 200) throw new Error(`QA route status ${response?.status()}`);

            await page.waitForFunction(() => document.querySelectorAll('img').length === 5, null, { timeout: 10000 });
            const sections = page.locator('section');
            if (await sections.count() !== 5) throw new Error(`Expected 5 QA sections, got ${await sections.count()}`);

            // Images 3–5 are intentionally loading="lazy". Exercise the page as a
            // student would by bringing each card into the viewport before checking it.
            for (let index = 0; index < 5; index += 1) {
              await sections.nth(index).scrollIntoViewIfNeeded();
              await page.waitForTimeout(150);
              await page.waitForFunction(
                i => {
                  const img = document.querySelectorAll('img')[i];
                  return Boolean(img && img.complete && img.naturalWidth > 0 && img.naturalHeight > 0);
                },
                index,
                { timeout: 10000 },
              );
            }

            diagnostics.images = await page.locator('img').evaluateAll(imgs => imgs.map(img => ({
              src: new URL(img.src).pathname,
              complete: img.complete,
              naturalWidth: img.naturalWidth,
              naturalHeight: img.naturalHeight,
              renderedWidth: img.getBoundingClientRect().width,
              renderedHeight: img.getBoundingClientRect().height,
              display: getComputedStyle(img).display,
            })));

            if (diagnostics.images.length !== 5) throw new Error(`Expected 5 images, got ${diagnostics.images.length}`);
            const found = new Set(diagnostics.images.map(x => x.src));
            if (found.size !== expected.length || expected.some(path => !found.has(path))) {
              throw new Error(`Unexpected image set: ${JSON.stringify(diagnostics.images)}`);
            }

            const responseByPath = new Map(diagnostics.responses.map(item => [item.path, item.status]));
            const badResponses = expected.filter(path => responseByPath.get(path) !== 200);
            if (badResponses.length) throw new Error(`Expected image responses were not 200: ${JSON.stringify({ badResponses, responses: diagnostics.responses })}`);

            if (diagnostics.images.some(x =>
              !x.complete ||
              x.naturalWidth !== 1600 ||
              x.naturalHeight !== 1050 ||
              x.renderedWidth <= 0 ||
              x.renderedHeight <= 0 ||
              x.display === 'none'
            )) {
              throw new Error(`Invalid image render state: ${JSON.stringify(diagnostics.images)}`);
            }
          } catch (error) {
            failure = error;
            diagnostics.failure = error instanceof Error ? `${error.name}: ${error.message}` : String(error);
          } finally {
            // Capture state even when a gate fails so we never debug blind.
            try {
              if (!diagnostics.images.length) {
                diagnostics.images = await page.locator('img').evaluateAll(imgs => imgs.map(img => ({
                  src: img.src ? new URL(img.src).pathname : null,
                  complete: img.complete,
                  naturalWidth: img.naturalWidth,
                  naturalHeight: img.naturalHeight,
                  renderedWidth: img.getBoundingClientRect().width,
                  renderedHeight: img.getBoundingClientRect().height,
                  display: getComputedStyle(img).display,
                })));
              }
              await page.screenshot({ path: `${outDir}/pof-batch5-browser-qa.png`, fullPage: true });
            } catch (captureError) {
              diagnostics.captureError = String(captureError);
            }
            fs.writeFileSync(`${outDir}/results.json`, JSON.stringify(diagnostics, null, 2));
            console.log(JSON.stringify(diagnostics, null, 2));
            await browser.close();
          }

          if (failure) throw failure;
          NODE
          node .pof-browser-qa.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pof-batch5-browser-qa
          path: /tmp/pof-browser-qa
          if-no-files-found: error
          compression-level: 0
