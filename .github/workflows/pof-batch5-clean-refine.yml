name: Generate clean POF Batch 5 candidates

on:
  push:
    branches:
      - pof-batch5-clean-v2
    paths:
      - .github/workflows/pof-batch5-clean-refine.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pof-batch5-clean-v2
          fetch-depth: 0
      - run: python -m pip install --quiet pillow

      - name: Generate final REFINING raster set
        shell: python
        run: |
          from pathlib import Path
          from math import cos, radians, acos, degrees, sqrt
          from PIL import Image, ImageDraw, ImageFont

          OUT=Path('public/explanation-images/principles-of-flight/refined-batch-5')
          OUT.mkdir(parents=True,exist_ok=True)
          W,H=1600,1050
          BG='#F7F9FC'; WHITE='#FFFFFF'; NAVY='#0B1F33'; DARK='#172033'; MUTED='#667085'; GRID='#DCE3EA'; GOLD='#F4B400'; GOLD_DARK='#A97800'; PALE='#FFF7D6'; BLUE='#EAF1F8'
          REG='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'; BOLD='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          def f(s,b=False): return ImageFont.truetype(BOLD if b else REG,s)
          def rounded(d,box,fill=WHITE,outline=GRID,r=28,w=2): d.rounded_rectangle(box,radius=r,fill=fill,outline=outline,width=w)
          def header(d,title,subtitle):
              d.text((100,62),title,font=f(48,True),fill=DARK); d.text((100,126),subtitle,font=f(25),fill=MUTED); d.line((100,168,1500,168),fill=GRID,width=2)
          def dashed(d,xy,color=GOLD_DARK,width=4,dash=14,gap=10):
              x1,y1,x2,y2=xy
              if abs(x2-x1)>=abs(y2-y1):
                  step=1 if x2>=x1 else -1; x=x1
                  while (x<=x2 if step>0 else x>=x2):
                      xe=x+step*dash
                      if (step>0 and xe>x2) or (step<0 and xe<x2): xe=x2
                      d.line((x,y1,xe,y2),fill=color,width=width); x=xe+step*gap
              else:
                  step=1 if y2>=y1 else -1; y=y1
                  while (y<=y2 if step>0 else y>=y2):
                      ye=y+step*dash
                      if (step>0 and ye>y2) or (step<0 and ye<y2): ye=y2
                      d.line((x1,y,x2,ye),fill=color,width=width); y=ye+step*gap
          def save(im,stem):
              im.save(OUT/f'{stem}.png','PNG',optimize=True)
              im.save(OUT/f'{stem}.webp','WEBP',quality=94,method=6)

          def y_label(im,d,text):
              lab=Image.new('RGBA',(250,55),(0,0,0,0)); ld=ImageDraw.Draw(lab); ld.text((125,28),text,font=f(25,True),fill=DARK,anchor='mm'); lab=lab.rotate(90,expand=True); im.paste(lab,(72,420),lab); return ImageDraw.Draw(im)

          def full_load_chart(stem,bank=None,g=None,weight=None):
              im=Image.new('RGB',(W,H),BG); d=ImageDraw.Draw(im)
              header(d,'LEVEL-TURN LOAD FACTOR','Constant-altitude coordinated turn • Figure 1-34 relationship • n = 1 / cos(bank)')
              rounded(d,(90,205,1090,940)); rounded(d,(1130,235,1510,925))
              L,T,R,B=175,270,1015,835
              def px(x): return L+x/80*(R-L)
              def py(y): return B-(y-1)/5*(B-T)
              for xv in range(0,81,10):
                  x=px(xv); d.line((x,T,x,B),fill=GRID,width=1); d.text((x,B+18),f'{xv}°',font=f(20),fill=MUTED,anchor='ma')
              for yv in range(1,7):
                  y=py(yv); d.line((L,y,R,y),fill=GRID,width=1); d.text((L-18,y),str(yv),font=f(20),fill=MUTED,anchor='rm')
              d.line((L,B,R,B),fill=DARK,width=3); d.line((L,T,L,B),fill=DARK,width=3); d.text(((L+R)/2,892),'BANK ANGLE',font=f(25,True),fill=DARK,anchor='ma'); d=y_label(im,d,'LOAD FACTOR (G)')
              pts=[]
              for i in range(801):
                  phi=80*i/800; pts.append((px(phi),py(1/cos(radians(phi)))))
              d.line(pts,fill=NAVY,width=7,joint='curve')
              if bank is not None:
                  exact=1/cos(radians(bank)); xp,yp=px(bank),py(exact); shown=1.56
              else:
                  exact=g; bank=degrees(acos(1/g)); xp,yp=px(bank),py(g)
              dashed(d,(xp,B,xp,yp)); dashed(d,(L,yp,xp,yp)); d.ellipse((xp-12,yp-12,xp+12,yp+12),fill=GOLD,outline=DARK,width=3)
              d.text((1170,280),'READ-OFF',font=f(20),fill=GOLD_DARK)
              if weight is not None:
                  d.text((1170,325),'50°',font=f(47,True),fill=DARK); d.text((1170,390),'≈ 1.56 G',font=f(47,True),fill=NAVY); d.line((1170,470,1470,470),fill=GRID,width=2)
                  d.text((1170,505),'STRUCTURAL LOAD',font=f(20),fill=MUTED); d.text((1170,550),'4,600 lb',font=f(31,True),fill=DARK); d.text((1170,600),'× 1.56 G',font=f(31,True),fill=DARK); d.line((1170,650,1420,650),fill=DARK,width=2); d.text((1170,680),'≈ 7,160 lb',font=f(31,True),fill=GOLD_DARK); d.text((1170,765),'Use the chart’s approximate',font=f(25),fill=MUTED); d.text((1170,800),'load-factor read-off.',font=f(25),fill=MUTED)
              else:
                  ans=66 if abs(g-2.5)<0.01 else 75
                  d.text((1170,325),f'+{g:.1f} G',font=f(47,True),fill=DARK); d.text((1170,390),f'≈ {ans}°',font=f(47,True),fill=NAVY); d.line((1170,470,1470,470),fill=GRID,width=2)
                  d.text((1170,510),'HOW TO READ IT',font=f(20),fill=MUTED); d.text((1170,555),f'1. Start at {g:.1f} G',font=f(25),fill=DARK); d.text((1170,605),'2. Move to the curve',font=f(25),fill=DARK); d.text((1170,655),f'3. Read ≈ {ans}° bank',font=f(25),fill=DARK); d.text((1170,765),'The level-turn limit is set',font=f(25),fill=MUTED); d.text((1170,800),'by bank angle.',font=f(25),fill=MUTED)
              save(im,stem)

          def low_bank_20():
              im=Image.new('RGB',(W,H),BG); d=ImageDraw.Draw(im)
              header(d,'20° BANK — LOAD-FACTOR READ-OFF','Low-bank zoom of Figure 1-34 relationship • level coordinated turn • n = 1 / cos(bank)')
              rounded(d,(90,205,1090,940)); rounded(d,(1130,235,1510,925))
              L,T,R,B=175,275,1015,835
              def px(x): return L+x/30*(R-L)
              def py(y): return B-(y-1)/0.15*(B-T)
              for xv in range(0,31,5):
                  x=px(xv); d.line((x,T,x,B),fill=GRID,width=1); d.text((x,B+18),f'{xv}°',font=f(20),fill=MUTED,anchor='ma')
              for yv in (1.00,1.025,1.05,1.075,1.10,1.125,1.15):
                  y=py(yv); d.line((L,y,R,y),fill=GRID,width=1); label=f'{yv:.3f}' if yv in (1.025,1.075,1.125) else f'{yv:.2f}'; d.text((L-18,y),label,font=f(18),fill=MUTED,anchor='rm')
              d.line((L,B,R,B),fill=DARK,width=3); d.line((L,T,L,B),fill=DARK,width=3); d.text(((L+R)/2,892),'BANK ANGLE',font=f(25,True),fill=DARK,anchor='ma'); d=y_label(im,d,'LOAD FACTOR (G)')
              pts=[]
              for i in range(601):
                  phi=30*i/600; pts.append((px(phi),py(1/cos(radians(phi)))))
              d.line(pts,fill=NAVY,width=7,joint='curve')
              bank=20; exact=1/cos(radians(bank)); xp,yp=px(bank),py(exact); dashed(d,(L,yp,xp,yp)); dashed(d,(xp,yp,xp,B)); d.ellipse((xp-13,yp-13,xp+13,yp+13),fill=GOLD,outline=DARK,width=3)
              rounded(d,(675,315,995,415),fill=PALE,outline=GOLD_DARK,r=20); d.text((835,365),'20°  →  ≈ 1.06 G',font=f(27,True),fill=GOLD_DARK,anchor='mm')
              d.text((1170,280),'READ-OFF',font=f(20),fill=GOLD_DARK); d.text((1170,325),'20°',font=f(47,True),fill=DARK); d.text((1170,390),'≈ 1.06 G',font=f(47,True),fill=NAVY); d.line((1170,470,1470,470),fill=GRID,width=2)
              d.text((1170,505),'STRUCTURAL LOAD',font=f(20),fill=MUTED); d.text((1170,550),'3,000 lb',font=f(31,True),fill=DARK); d.text((1170,600),'× 1.06 G',font=f(31,True),fill=DARK); d.line((1170,650,1420,650),fill=DARK,width=2); d.text((1170,680),'≈ 3,180 lb',font=f(31,True),fill=GOLD_DARK); d.text((1170,765),'Low-bank zoom makes the',font=f(25),fill=MUTED); d.text((1170,800),'small G change readable.',font=f(25),fill=MUTED)
              save(im,'pof-load-factor-20deg-v2')

          def airfoil(cx,cy,chord,t=0.12,n=100):
              up=[]; low=[]
              for i in range(n+1):
                  x=i/n; yt=5*t*(0.2969*sqrt(max(x,1e-8))-0.1260*x-0.3516*x*x+0.2843*x**3-0.1015*x**4); up.append((cx+x*chord,cy-yt*chord)); low.append((cx+x*chord,cy+yt*chord))
              return up+list(reversed(low))
          def fowler():
              im=Image.new('RGB',(W,H),BG); d=ImageDraw.Draw(im)
              header(d,'FOWLER FLAP — WING AREA INCREASE','Simplified teaching view based on Figure 2-1 • rearward travel increases effective chord and wing area')
              rounded(d,(90,215,1030,915)); d.text((135,255),'SIDE VIEW — MOVEMENT',font=f(31,True),fill=DARK); d.text((135,305),'RETRACTED',font=f(20),fill=MUTED)
              d.polygon(airfoil(180,430,650),fill=BLUE,outline=NAVY); d.line((830,360,830,505),fill=GOLD_DARK,width=3); d.text((830,520),'original trailing edge',font=f(20),fill=MUTED,anchor='ma')
              d.text((135,605),'EXTENDED',font=f(20),fill=MUTED); d.polygon(airfoil(180,735,500,0.13),fill=BLUE,outline=NAVY); d.polygon(airfoil(735,795,250,0.10),fill=PALE,outline=GOLD_DARK); d.line((650,735,790,782),fill=GOLD_DARK,width=5); d.polygon([(790,782),(766,760),(765,790)],fill=GOLD_DARK); d.text((700,700),'slides rearward',font=f(25),fill=GOLD_DARK)
              dashed(d,(830,650,830,850),color=MUTED,width=2,dash=10,gap=8); d.text((830,865),'original trailing edge',font=f(20),fill=MUTED,anchor='ma')
              rounded(d,(1080,215,1510,915)); d.text((1125,255),'WHY AREA INCREASES',font=f(31,True),fill=DARK); d.text((1125,320),'Simplified plan view',font=f(20),fill=MUTED)
              d.rounded_rectangle((1145,400,1440,650),radius=45,fill=BLUE,outline=NAVY,width=4); d.line((1145,590,1440,590),fill=NAVY,width=4); d.text((1292,505),'WING',font=f(31,True),fill=NAVY,anchor='mm'); d.rounded_rectangle((1145,590,1440,745),radius=30,fill=PALE,outline=GOLD_DARK,width=4); dashed(d,(1145,590,1440,590),color=MUTED,width=3,dash=12,gap=8); d.text((1292,668),'FOWLER FLAP',font=f(25),fill=GOLD_DARK,anchor='mm'); d.text((1125,790),'Rearward extension',font=f(25),fill=DARK); d.text((1125,828),'increases effective chord',font=f(25),fill=DARK); d.text((1125,866),'→ wing area increases',font=f(31,True),fill=GOLD_DARK)
              save(im,'pof-fowler-flap-area-v1')

          low_bank_20(); full_load_chart('pof-load-factor-50deg-v1',bank=50,weight=4600); full_load_chart('pof-load-limit-2-5g-bank-v1',g=2.5); full_load_chart('pof-load-limit-3-8g-bank-v1',g=3.8); fowler()

          expected=['pof-load-factor-20deg-v2','pof-load-factor-50deg-v1','pof-load-limit-2-5g-bank-v1','pof-load-limit-3-8g-bank-v1','pof-fowler-flap-area-v1']
          for stem in expected:
              for ext,fmt in [('png','PNG'),('webp','WEBP')]:
                  p=OUT/f'{stem}.{ext}'
                  with Image.open(p) as check:
                      assert check.size==(1600,1050) and check.format==fmt
          assert len(list(OUT.glob('*'))) == 10

      - name: Enter REFINING with only final candidate names
        shell: python
        run: |
          import json
          from pathlib import Path
          stems={
            'pof-load-factor-20deg-001':'pof-load-factor-20deg-v2',
            'pof-load-factor-50deg-001':'pof-load-factor-50deg-v1',
            'pof-load-limit-2-5g-bank-001':'pof-load-limit-2-5g-bank-v1',
            'pof-load-limit-3-8g-bank-001':'pof-load-limit-3-8g-bank-v1',
            'pof-fowler-flap-area-001':'pof-fowler-flap-area-v1'
          }
          root='public/explanation-images/principles-of-flight/refined-batch-5'; p=Path('data/pof-visual-manifest.json'); data=json.loads(p.read_text()); count=0
          for v in data['visuals']:
              if v['visual_id'] not in stems: continue
              assert v['status']=='SOURCE_FOUND'; assert v['assets']=={'master_asset':None,'web_asset':None}; stem=stems[v['visual_id']]; v['assets']={'master_asset':f'{root}/{stem}.png','web_asset':f'{root}/{stem}.webp'}; v['status']='REFINING'; count+=1
          assert count==5; p.write_text(json.dumps(data,indent=2)+'\n')
          sp=Path('data/pof-autonomous-state.json'); state=json.loads(sp.read_text()); state['last_verified_checkpoint']='POF_BATCH_5_REFINING_FINAL_CANDIDATES'; state['next_action']='Inspect all five exact rendered Batch 5 candidates against source fidelity and locked Batch 1 quality; no QA promotion until all five pass'; sp.write_text(json.dumps(state,indent=2)+'\n')

      - name: Validate clean promotion history
        run: |
          ! find public/explanation-images/principles-of-flight/refined-batch-5 -type f -name '*.svg' | grep .
          test "$(find public/explanation-images/principles-of-flight/refined-batch-5 -type f -name '*.png' | wc -l)" -eq 5
          test "$(find public/explanation-images/principles-of-flight/refined-batch-5 -type f -name '*.webp' | wc -l)" -eq 5
          python scripts/validate_pof_visuals.py
          python scripts/validate_pof_visual_changes.py e9247b4fb85f8ff23f29aa6ff22ee872eb495af1

      - name: Commit verified REFINING checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/explanation-images/principles-of-flight/refined-batch-5 data/pof-visual-manifest.json data/pof-autonomous-state.json
          git commit -m "pof: generate clean Batch 5 REFINING candidates [skip ci]"
          git push origin HEAD:pof-batch5-clean-v2
