name: Validate POF Batch 5 production diff

on:
  push:
    branches: [pof-batch5-clean-v2]
    paths: [.github/workflows/pof-batch5-final-validate.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
      SUPABASE_SECRET_KEY: build-placeholder
      PAYSTACK_SECRET_KEY: build-placeholder
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pof-batch5-clean-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate POF manifest and promotion history
        run: |
          python scripts/validate_pof_visuals.py
          python scripts/validate_pof_visual_changes.py e9247b4fb85f8ff23f29aa6ff22ee872eb495af1
      - name: Assert production-only Batch 5 diff
        run: |
          test ! -e app/pof-visual-qa/page.tsx
          test ! -e .github/workflows/pof-batch5-browser-qa.yml
          test ! -e .github/workflows/pof-batch5-promote-preview-ready.yml
          test ! -e .github/workflows/pof-batch5-promote-mapped.yml
          test "$(find public/explanation-images/principles-of-flight/refined-batch-5 -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 5
          test "$(find public/explanation-images/principles-of-flight/refined-batch-5 -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 5
          ! find public/explanation-images/principles-of-flight/refined-batch-5 -type f -name '*.svg' | grep .
      - name: Build production source
        run: pnpm run build
