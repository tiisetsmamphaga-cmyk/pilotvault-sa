name: Lock POF Batch 5 live-verified v2

on:
  push:
    branches: [pof-batch5-live-lock]
    paths: [.github/workflows/pof-batch5-live-lock-v2.yml]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pof-batch5-live-lock
          fetch-depth: 0

      - name: Promote exact Batch 5 entries to LIVE_VERIFIED and lock
        shell: python
        run: |
          import json
          from pathlib import Path

          ids = {
            'pof-load-factor-20deg-001',
            'pof-load-factor-50deg-001',
            'pof-load-limit-2-5g-bank-001',
            'pof-load-limit-3-8g-bank-001',
            'pof-fowler-flap-area-001',
          }
          expected_assets = {
            'pof-load-factor-20deg-001': '/explanation-images/principles-of-flight/refined-batch-5/pof-load-factor-20deg-v2.webp',
            'pof-load-factor-50deg-001': '/explanation-images/principles-of-flight/refined-batch-5/pof-load-factor-50deg-v1.webp',
            'pof-load-limit-2-5g-bank-001': '/explanation-images/principles-of-flight/refined-batch-5/pof-load-limit-2-5g-bank-v1.webp',
            'pof-load-limit-3-8g-bank-001': '/explanation-images/principles-of-flight/refined-batch-5/pof-load-limit-3-8g-bank-v1.webp',
            'pof-fowler-flap-area-001': '/explanation-images/principles-of-flight/refined-batch-5/pof-fowler-flap-area-v1.webp',
          }

          manifest_path = Path('data/pof-visual-manifest.json')
          data = json.loads(manifest_path.read_text())
          targets = [v for v in data['visuals'] if v['visual_id'] in ids]
          assert len(targets) == 5
          for v in targets:
              assert v['status'] == 'PRODUCTION_READY', (v['visual_id'], v['status'])
              assert v['qa'] == {'technical': True, 'teaching': True, 'visual': True, 'preview': True, 'live': False}
              assert v['assets']['web_asset'].removeprefix('public') == expected_assets[v['visual_id']]
              v['status'] = 'LIVE_VERIFIED'
              v['qa']['live'] = True
              v['lock']['approved'] = True
              v['lock']['replacement_reason'] = None
              v['live_verification'] = {
                'deployment_id': 'dpl_DhjDQp31a75bZpPW3C3xnE17wrAu',
                'production_commit': 'c09d25ff49d77843f4565d557f38acd4231d6b3b',
                'domain': 'pilotvault.co.za',
                'all_five_production_assets_verified': True,
                'production_assets_http_200': True,
                'production_assets_content_type_webp': True,
                'db_mapping_verified': True,
                'db_status_live_verified': True,
                'verification_note': 'All five exact Batch 5 WebP assets were verified live on pilotvault.co.za from the READY Vercel deployment, and all five exact Supabase question mappings were fail-closed promoted from MAPPED to LIVE_VERIFIED.'
              }
          manifest_path.write_text(json.dumps(data, indent=2) + '\n')

          state_path = Path('data/pof-autonomous-state.json')
          state = json.loads(state_path.read_text())
          state['current_batch'] = 6
          state['completed_batches_since_last_user_report'] = 1
          state['last_verified_checkpoint'] = 'POF_BATCH_5_LIVE_VERIFIED'
          state['production_state']['approved_live_visuals'] = 25
          state['next_action'] = 'Batch 6: select no more than five remaining question-specific POF visual concepts, verify exact source relationships, and persist SOURCE_FOUND before refinement begins'
          state_path.write_text(json.dumps(state, indent=2) + '\n')

      - name: Validate exact production-ready to live-verified transition
        run: |
          python scripts/validate_pof_visuals.py
          python scripts/validate_pof_visual_changes.py c09d25ff49d77843f4565d557f38acd4231d6b3b

      - name: Commit verified live lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pof-visual-manifest.json data/pof-autonomous-state.json
          git commit -m "pof: lock Batch 5 LIVE_VERIFIED [skip ci]"
          git push origin HEAD:pof-batch5-live-lock
