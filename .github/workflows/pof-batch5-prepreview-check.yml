name: POF Batch 5 pre-preview repository QA

on:
  push:
    branches:
      - pof-batch5-clean-v2
    paths:
      - .github/workflows/pof-batch5-prepreview-check.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pof-batch5-clean-v2
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Parse changed TSX files with installed TypeScript
        shell: node {0}
        run: |
          const fs = require('fs')
          const ts = require('typescript')

          const files = [
            'app/pof-visual-qa/page.tsx',
            'app/practice/[subject]/components/explanation-image.tsx',
          ]

          let failed = false
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8')
            const result = ts.transpileModule(source, {
              fileName: file,
              reportDiagnostics: true,
              compilerOptions: {
                jsx: ts.JsxEmit.ReactJSX,
                target: ts.ScriptTarget.ES2022,
                module: ts.ModuleKind.ESNext,
              },
            })
            const errors = (result.diagnostics || []).filter(
              diagnostic => diagnostic.category === ts.DiagnosticCategory.Error
            )
            if (errors.length) {
              failed = true
              console.error(`TypeScript parse failed for ${file}`)
              for (const diagnostic of errors) {
                console.error(ts.flattenDiagnosticMessageText(diagnostic.messageText, '\n'))
              }
            }
          }
          if (failed) process.exit(1)
          console.log('Changed TSX parse check passed')

      - name: Assert exact Batch 5 preview surface
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          page = Path('app/pof-visual-qa/page.tsx').read_text()
          renderer = Path('app/practice/[subject]/components/explanation-image.tsx').read_text()
          manifest = json.loads(Path('data/pof-visual-manifest.json').read_text())

          expected = {
              '/explanation-images/principles-of-flight/refined-batch-5/pof-load-factor-20deg-v2.webp',
              '/explanation-images/principles-of-flight/refined-batch-5/pof-load-factor-50deg-v1.webp',
              '/explanation-images/principles-of-flight/refined-batch-5/pof-load-limit-2-5g-bank-v1.webp',
              '/explanation-images/principles-of-flight/refined-batch-5/pof-load-limit-3-8g-bank-v1.webp',
              '/explanation-images/principles-of-flight/refined-batch-5/pof-fowler-flap-area-v1.webp',
          }
          found = set(re.findall(r'(/explanation-images/principles-of-flight/refined-batch-5/[^\"\']+\.webp)', page))
          assert found == expected, (found, expected)
          assert 'refined-batch-(?:1|2|3|4|5)' in renderer
          assert 'refined-batch-(?:1|2|3|4|5|6)' not in renderer
          targets = [v for v in manifest['visuals'] if v['visual_id'] in {
              'pof-load-factor-20deg-001', 'pof-load-factor-50deg-001',
              'pof-load-limit-2-5g-bank-001', 'pof-load-limit-3-8g-bank-001',
              'pof-fowler-flap-area-001'
          }]
          assert len(targets) == 5
          assert all(v['status'] == 'QA_APPROVED' for v in targets)
          assert all(v['qa']['technical'] and v['qa']['teaching'] and v['qa']['visual'] for v in targets)
          assert all(not v['qa']['preview'] and not v['qa']['live'] for v in targets)

      - name: Run POF workflow validators
        run: |
          python scripts/validate_pof_visuals.py
          python scripts/validate_pof_visual_changes.py e9247b4fb85f8ff23f29aa6ff22ee872eb495af1
