name: Promote POF Batch 5 preview-ready

on:
  push:
    branches: [pof-batch5-clean-v2]
    paths: [.github/workflows/pof-batch5-promote-preview-ready.yml]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pof-batch5-clean-v2
          fetch-depth: 0
      - name: Promote exact Batch 5 entries
        shell: python
        run: |
          import json
          from pathlib import Path

          ids = {
            'pof-load-factor-20deg-001',
            'pof-load-factor-50deg-001',
            'pof-load-limit-2-5g-bank-001',
            'pof-load-limit-3-8g-bank-001',
            'pof-fowler-flap-area-001',
          }
          p = Path('data/pof-visual-manifest.json')
          data = json.loads(p.read_text())
          targets = [v for v in data['visuals'] if v['visual_id'] in ids]
          assert len(targets) == 5
          for v in targets:
              assert v['status'] == 'QA_APPROVED', (v['visual_id'], v['status'])
              assert v['qa']['technical'] is True
              assert v['qa']['teaching'] is True
              assert v['qa']['visual'] is True
              assert v['visual_inspection']['actual_image_reviewed'] is True
              assert v['visual_inspection']['batch1_quality_reference'] is True
              v['qa']['preview'] = True
              v['status'] = 'PREVIEW_READY'
              v['preview_verification'] = {
                'deployment_id': 'dpl_Fi6AFLi1oah2nxeVB7cPf8UBm7Y8',
                'deployment_commit': '489bfbc27293547c8c17488426529a366cbce5ef',
                'route': '/pof-visual-qa',
                'deployment_ready': True,
                'route_http_verified': True,
                'real_explanation_component_used': True,
                'browser_hydration_render_verified': True,
                'browser_qa_run_id': 33120334538,
                'all_five_expected_assets_rendered': True,
                'static_asset_probe_note': 'Protected Vercel preview returns SSO redirect for direct raw-asset probes; exact commit passed local Chromium HTTP/render checks and authenticated preview route returned 200 with all five asset references.'
              }
          p.write_text(json.dumps(data, indent=2) + '\n')

          sp = Path('data/pof-autonomous-state.json')
          state = json.loads(sp.read_text())
          state['last_verified_checkpoint'] = 'POF_BATCH_5_PREVIEW_READY'
          state['next_action'] = 'Preflight exact Batch 5 question rows in Supabase; map only the five PREVIEW_READY visual concepts in one fail-closed transaction, verify returned URLs/keys/statuses, then promote PREVIEW_READY -> MAPPED'
          sp.write_text(json.dumps(state, indent=2) + '\n')

      - name: Validate promotion history
        run: |
          python scripts/validate_pof_visuals.py
          python scripts/validate_pof_visual_changes.py e9247b4fb85f8ff23f29aa6ff22ee872eb495af1

      - name: Commit preview-ready checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pof-visual-manifest.json data/pof-autonomous-state.json
          git commit -m "pof: promote Batch 5 to PREVIEW_READY [skip ci]"
          git push origin HEAD:pof-batch5-clean-v2
