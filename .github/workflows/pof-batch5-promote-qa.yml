name: Promote POF Batch 5 to QA approved

on:
  push:
    branches:
      - pof-batch5-clean-v2
    paths:
      - .github/workflows/pof-batch5-promote-qa.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pof-batch5-clean-v2
          fetch-depth: 0

      - name: Persist actual pixel QA evidence
        shell: python
        run: |
          import json
          from pathlib import Path

          ids = {
              'pof-load-factor-20deg-001',
              'pof-load-factor-50deg-001',
              'pof-load-limit-2-5g-bank-001',
              'pof-load-limit-3-8g-bank-001',
              'pof-fowler-flap-area-001',
          }
          expected_web = {
              'pof-load-factor-20deg-001': 'pof-load-factor-20deg-v2.webp',
              'pof-load-factor-50deg-001': 'pof-load-factor-50deg-v1.webp',
              'pof-load-limit-2-5g-bank-001': 'pof-load-limit-2-5g-bank-v1.webp',
              'pof-load-limit-3-8g-bank-001': 'pof-load-limit-3-8g-bank-v1.webp',
              'pof-fowler-flap-area-001': 'pof-fowler-flap-area-v1.webp',
          }

          path = Path('data/pof-visual-manifest.json')
          data = json.loads(path.read_text())
          targets = [v for v in data['visuals'] if v['visual_id'] in ids]
          assert len(targets) == 5

          for v in targets:
              vid = v['visual_id']
              assert v['status'] == 'REFINING', (vid, v['status'])
              assert v['qa'] == {
                  'technical': False,
                  'teaching': False,
                  'visual': False,
                  'preview': False,
                  'live': False,
              }, (vid, v['qa'])
              assert v['assets']['master_asset'] and v['assets']['master_asset'].endswith('.png')
              assert v['assets']['web_asset'] and v['assets']['web_asset'].endswith(expected_web[vid])
              assert Path(v['assets']['master_asset']).exists(), v['assets']['master_asset']
              assert Path(v['assets']['web_asset']).exists(), v['assets']['web_asset']

              v['qa']['technical'] = True
              v['qa']['teaching'] = True
              v['qa']['visual'] = True
              v['visual_inspection'] = {
                  'actual_image_reviewed': True,
                  'batch1_quality_reference': True,
                  'teaching_relationship_obvious': True,
                  'technically_credible': True,
                  'generic_placeholder_appearance': False,
                  'review_note': (
                      'Exact rendered WebP reviewed at REFINING against the locked Batch 1 '
                      'pof-bank-load-factor visual. All five final Batch 5 candidates passed. '
                      'The original 20-degree v1 was rejected for compressed low-bank readability; '
                      'Batch 5 was replayed from the clean SOURCE_FOUND checkpoint with reviewed v2, '
                      'so the rejected v1 is absent from this promotion history.'
                  ),
              }
              v['status'] = 'QA_APPROVED'

          path.write_text(json.dumps(data, indent=2) + '\n')

          state_path = Path('data/pof-autonomous-state.json')
          state = json.loads(state_path.read_text())
          assert state['last_verified_checkpoint'] == 'POF_BATCH_5_REFINING_FINAL_CANDIDATES'
          state['last_verified_checkpoint'] = 'POF_BATCH_5_QA_APPROVED'
          state['next_action'] = (
              'Create one intentional preview branch for Batch 5, allow only the explicit refined-batch-5 '
              'path in the POF renderer, verify the real explanation component and all five rendered assets, '
              'then promote QA_APPROVED -> PREVIEW_READY only if preview QA is clean'
          )
          state_path.write_text(json.dumps(state, indent=2) + '\n')

      - name: Run hard QA promotion gates
        run: |
          ! find public/explanation-images/principles-of-flight/refined-batch-5 -type f -name '*.svg' | grep .
          test "$(find public/explanation-images/principles-of-flight/refined-batch-5 -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 5
          test "$(find public/explanation-images/principles-of-flight/refined-batch-5 -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 5
          test ! -e public/explanation-images/principles-of-flight/refined-batch-5/pof-load-factor-20deg-v1.png
          test ! -e public/explanation-images/principles-of-flight/refined-batch-5/pof-load-factor-20deg-v1.webp
          python scripts/validate_pof_visuals.py
          python scripts/validate_pof_visual_changes.py e9247b4fb85f8ff23f29aa6ff22ee872eb495af1

      - name: Commit QA-approved checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pof-visual-manifest.json data/pof-autonomous-state.json
          git diff --cached --quiet && exit 0
          git commit -m "pof: promote Batch 5 to QA_APPROVED [skip ci]"
          git push origin HEAD:pof-batch5-clean-v2
