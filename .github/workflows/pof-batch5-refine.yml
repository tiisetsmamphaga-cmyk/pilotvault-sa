name: Refine POF Batch 5 raster candidates

on:
  push:
    branches:
      - pof-autonomous-batch5
    paths:
      - .github/workflows/pof-batch5-refine.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pof-autonomous-batch5
          fetch-depth: 0

      - name: Install raster tooling
        run: python -m pip install --quiet pillow

      - name: Generate question-specific PNG and WebP candidates
        shell: python
        run: |
          from pathlib import Path
          from math import cos, radians, acos, degrees, sqrt
          from PIL import Image, ImageDraw, ImageFont

          OUT = Path('public/explanation-images/principles-of-flight/refined-batch-5')
          OUT.mkdir(parents=True, exist_ok=True)

          W, H = 1600, 1050
          BG = '#F7F9FC'
          WHITE = '#FFFFFF'
          NAVY = '#0B1F33'
          DARK = '#172033'
          MUTED = '#667085'
          GRID = '#DCE3EA'
          GOLD = '#F4B400'
          GOLD_DARK = '#A97800'
          PALE = '#FFF7D6'
          BLUE_PALE = '#EAF1F8'

          regular_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          bold_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          def font(size, bold=False):
              return ImageFont.truetype(bold_path if bold else regular_path, size)

          F_TITLE = font(48, True)
          F_SUB = font(25)
          F_AXIS = font(25, True)
          F_TICK = font(20)
          F_BIG = font(47, True)
          F_MED = font(31, True)
          F_BODY = font(25)
          F_SMALL = font(20)

          def rounded(draw, box, radius=28, fill=WHITE, outline=GRID, width=2):
              draw.rounded_rectangle(box, radius=radius, fill=fill, outline=outline, width=width)

          def dashed(draw, xy, fill, width=4, dash=14, gap=10):
              x1, y1, x2, y2 = xy
              if abs(x2-x1) >= abs(y2-y1):
                  direction = 1 if x2 >= x1 else -1
                  x = x1
                  while (x <= x2 if direction > 0 else x >= x2):
                      xe = x + direction*dash
                      if (direction > 0 and xe > x2) or (direction < 0 and xe < x2): xe = x2
                      draw.line((x, y1, xe, y2), fill=fill, width=width)
                      x = xe + direction*gap
              else:
                  direction = 1 if y2 >= y1 else -1
                  y = y1
                  while (y <= y2 if direction > 0 else y >= y2):
                      ye = y + direction*dash
                      if (direction > 0 and ye > y2) or (direction < 0 and ye < y2): ye = y2
                      draw.line((x1, y, x2, ye), fill=fill, width=width)
                      y = ye + direction*gap

          def header(draw, title, subtitle):
              draw.text((100, 62), title, font=F_TITLE, fill=DARK)
              draw.text((100, 126), subtitle, font=F_SUB, fill=MUTED)
              draw.line((100, 168, 1500, 168), fill=GRID, width=2)

          def load_chart(filename, highlight_bank=None, highlight_g=None, weight=None):
              im = Image.new('RGB', (W,H), BG)
              d = ImageDraw.Draw(im)
              title = 'LEVEL-TURN LOAD FACTOR'
              subtitle = 'Constant-altitude coordinated turn • Figure 1-34 relationship • n = 1 / cos(bank)'
              header(d, title, subtitle)

              card = (90, 205, 1090, 940)
              rounded(d, card)
              left, top, right, bottom = 175, 270, 1015, 835
              x0, x1 = 0.0, 80.0
              y0, y1 = 1.0, 6.0
              def px(phi): return left + (phi-x0)/(x1-x0)*(right-left)
              def py(n): return bottom - (n-y0)/(y1-y0)*(bottom-top)

              for xv in range(0,81,10):
                  x = px(xv)
                  d.line((x, top, x, bottom), fill=GRID, width=1)
                  d.text((x, bottom+18), f'{xv}°', font=F_TICK, fill=MUTED, anchor='ma')
              for yv in range(1,7):
                  y = py(yv)
                  d.line((left, y, right, y), fill=GRID, width=1)
                  d.text((left-18, y), f'{yv:.0f}', font=F_TICK, fill=MUTED, anchor='rm')
              d.line((left,bottom,right,bottom), fill=DARK, width=3)
              d.line((left,top,left,bottom), fill=DARK, width=3)
              d.text(((left+right)/2, 892), 'BANK ANGLE', font=F_AXIS, fill=DARK, anchor='ma')
              ylab = Image.new('RGBA',(250,55),(0,0,0,0))
              yd = ImageDraw.Draw(ylab)
              yd.text((125,28),'LOAD FACTOR (G)',font=F_AXIS,fill=DARK,anchor='mm')
              ylab = ylab.rotate(90, expand=True)
              im.paste(ylab,(72,420),ylab)
              d = ImageDraw.Draw(im)

              pts=[]
              for i in range(801):
                  phi = 80*i/800
                  n = 1/cos(radians(phi))
                  pts.append((px(phi),py(n)))
              d.line(pts, fill=NAVY, width=7, joint='curve')

              if highlight_bank is not None:
                  bank = float(highlight_bank)
                  n = 1/cos(radians(bank))
              else:
                  n = float(highlight_g)
                  bank = degrees(acos(1/n))
              xp, yp = px(bank), py(n)
              dashed(d,(xp,bottom,xp,yp),GOLD_DARK,4)
              dashed(d,(left,yp,xp,yp),GOLD_DARK,4)
              d.ellipse((xp-12,yp-12,xp+12,yp+12),fill=GOLD,outline=DARK,width=3)

              info=(1130,235,1510,925)
              rounded(d,info,fill=WHITE)
              d.text((1170,280),'READ-OFF',font=F_SMALL,fill=GOLD_DARK)
              if highlight_bank is not None:
                  shown_g = 1.06 if bank == 20 else 1.56
                  d.text((1170,325),f'{bank:.0f}°',font=F_BIG,fill=DARK)
                  d.text((1170,390),f'≈ {shown_g:.2f} G',font=F_BIG,fill=NAVY)
                  d.line((1170,470,1470,470),fill=GRID,width=2)
                  d.text((1170,505),'STRUCTURAL LOAD',font=F_SMALL,fill=MUTED)
                  if weight == 3000:
                      result='3,180 lb'
                  else:
                      result='7,160 lb'
                  d.text((1170,550),f'{weight:,} lb',font=F_MED,fill=DARK)
                  d.text((1170,600),f'× {shown_g:.2f} G',font=F_MED,fill=DARK)
                  d.line((1170,650,1420,650),fill=DARK,width=2)
                  d.text((1170,680),f'≈ {result}',font=F_MED,fill=GOLD_DARK)
                  d.text((1170,765),'Use the chart’s approximate',font=F_BODY,fill=MUTED)
                  d.text((1170,800),'load-factor read-off.',font=F_BODY,fill=MUTED)
              else:
                  g = float(highlight_g)
                  answer = 66 if g == 2.5 else 75
                  d.text((1170,325),f'+{g:.1f} G',font=F_BIG,fill=DARK)
                  d.text((1170,390),f'≈ {answer}°',font=F_BIG,fill=NAVY)
                  d.line((1170,470,1470,470),fill=GRID,width=2)
                  d.text((1170,510),'HOW TO READ IT',font=F_SMALL,fill=MUTED)
                  d.text((1170,555),f'1. Start at {g:.1f} G',font=F_BODY,fill=DARK)
                  d.text((1170,605),'2. Move to the curve',font=F_BODY,fill=DARK)
                  d.text((1170,655),f'3. Read ≈ {answer}° bank',font=F_BODY,fill=DARK)
                  d.text((1170,765),'The level-turn limit is set',font=F_BODY,fill=MUTED)
                  d.text((1170,800),'by bank angle.',font=F_BODY,fill=MUTED)

              png = OUT / f'{filename}.png'
              webp = OUT / f'{filename}.webp'
              im.save(png, 'PNG', optimize=True)
              im.save(webp, 'WEBP', quality=94, method=6)

          def airfoil_points(cx, cy, chord, thickness=0.12, n=100):
              upper=[]; lower=[]
              for i in range(n+1):
                  x=i/n
                  yt=5*thickness*(0.2969*sqrt(max(x,1e-8))-0.1260*x-0.3516*x*x+0.2843*x**3-0.1015*x**4)
                  upper.append((cx+x*chord,cy-yt*chord))
                  lower.append((cx+x*chord,cy+yt*chord))
              return upper + list(reversed(lower))

          def fowler():
              im=Image.new('RGB',(W,H),BG)
              d=ImageDraw.Draw(im)
              header(d,'FOWLER FLAP — WING AREA INCREASE','Simplified teaching view based on Figure 2-1 • rearward travel increases effective chord and wing area')

              # Side-view movement panel
              rounded(d,(90,215,1030,915))
              d.text((135,255),'SIDE VIEW — MOVEMENT',font=F_MED,fill=DARK)
              d.text((135,305),'RETRACTED',font=F_SMALL,fill=MUTED)
              wing=airfoil_points(180,430,650,0.12)
              d.polygon(wing,fill=BLUE_PALE,outline=NAVY)
              d.line((830,360,830,505),fill=GOLD_DARK,width=3)
              d.text((830,520),'original trailing edge',font=F_SMALL,fill=MUTED,anchor='ma')

              d.text((135,605),'EXTENDED',font=F_SMALL,fill=MUTED)
              main=airfoil_points(180,735,500,0.13)
              d.polygon(main,fill=BLUE_PALE,outline=NAVY)
              flap=airfoil_points(735,795,250,0.10)
              d.polygon(flap,fill=PALE,outline=GOLD_DARK)
              d.line((650,735,790,782),fill=GOLD_DARK,width=5)
              # arrow head
              d.polygon([(790,782),(766,760),(765,790)],fill=GOLD_DARK)
              d.text((700,700),'slides rearward',font=F_BODY,fill=GOLD_DARK)
              d.line((830,650,830,850),fill=GRID,width=3)
              dashed(d,(830,650,830,850),MUTED,2,10,8)
              d.text((830,865),'original trailing edge',font=F_SMALL,fill=MUTED,anchor='ma')

              # Planform explanation panel
              rounded(d,(1080,215,1510,915))
              d.text((1125,255),'WHY AREA INCREASES',font=F_MED,fill=DARK)
              d.text((1125,320),'Simplified plan view',font=F_SMALL,fill=MUTED)
              # wing segment planform
              d.rounded_rectangle((1145,400,1440,650),radius=45,fill=BLUE_PALE,outline=NAVY,width=4)
              d.line((1145,590,1440,590),fill=NAVY,width=4)
              d.text((1292,505),'WING',font=F_MED,fill=NAVY,anchor='mm')
              # extended flap band outside old TE
              d.rounded_rectangle((1145,590,1440,745),radius=30,fill=PALE,outline=GOLD_DARK,width=4)
              dashed(d,(1145,590,1440,590),MUTED,3,12,8)
              d.text((1292,668),'FOWLER FLAP',font=F_BODY,fill=GOLD_DARK,anchor='mm')
              d.text((1125,790),'Rearward extension',font=F_BODY,fill=DARK)
              d.text((1125,828),'increases effective chord',font=F_BODY,fill=DARK)
              d.text((1125,866),'→ wing area increases',font=F_MED,fill=GOLD_DARK)

              png=OUT/'pof-fowler-flap-area-v1.png'
              webp=OUT/'pof-fowler-flap-area-v1.webp'
              im.save(png,'PNG',optimize=True)
              im.save(webp,'WEBP',quality=94,method=6)

          load_chart('pof-load-factor-20deg-v1', highlight_bank=20, weight=3000)
          load_chart('pof-load-factor-50deg-v1', highlight_bank=50, weight=4600)
          load_chart('pof-load-limit-2-5g-bank-v1', highlight_g=2.5)
          load_chart('pof-load-limit-3-8g-bank-v1', highlight_g=3.8)
          fowler()

          expected = [
              'pof-load-factor-20deg-v1',
              'pof-load-factor-50deg-v1',
              'pof-load-limit-2-5g-bank-v1',
              'pof-load-limit-3-8g-bank-v1',
              'pof-fowler-flap-area-v1',
          ]
          for stem in expected:
              for ext in ('png','webp'):
                  p=OUT/f'{stem}.{ext}'
                  if not p.exists(): raise SystemExit(f'missing {p}')
                  with Image.open(p) as check:
                      if check.size != (W,H): raise SystemExit(f'wrong dimensions {p}: {check.size}')
                      if ext == 'png' and check.format != 'PNG': raise SystemExit(f'wrong PNG format {p}')
                      if ext == 'webp' and check.format != 'WEBP': raise SystemExit(f'wrong WEBP format {p}')

      - name: Attach assets and enter REFINING
        shell: python
        run: |
          import json
          from pathlib import Path

          mapping = {
            'pof-load-factor-20deg-001': 'pof-load-factor-20deg-v1',
            'pof-load-factor-50deg-001': 'pof-load-factor-50deg-v1',
            'pof-load-limit-2-5g-bank-001': 'pof-load-limit-2-5g-bank-v1',
            'pof-load-limit-3-8g-bank-001': 'pof-load-limit-3-8g-bank-v1',
            'pof-fowler-flap-area-001': 'pof-fowler-flap-area-v1',
          }
          root='public/explanation-images/principles-of-flight/refined-batch-5'
          path=Path('data/pof-visual-manifest.json')
          data=json.loads(path.read_text())
          found=0
          for v in data['visuals']:
              stem=mapping.get(v['visual_id'])
              if not stem: continue
              if v['status'] != 'SOURCE_FOUND':
                  raise SystemExit(f"Unexpected status {v['visual_id']}: {v['status']}")
              if v.get('assets') != {'master_asset': None, 'web_asset': None}:
                  raise SystemExit(f"Unexpected source asset slots: {v['visual_id']}")
              v['assets']={
                  'master_asset': f'{root}/{stem}.png',
                  'web_asset': f'{root}/{stem}.webp',
              }
              v['status']='REFINING'
              found += 1
          if found != 5: raise SystemExit(f'Expected 5 target visuals, found {found}')
          path.write_text(json.dumps(data,indent=2)+'\n')

          state_path=Path('data/pof-autonomous-state.json')
          state=json.loads(state_path.read_text())
          state['last_verified_checkpoint']='POF_BATCH_5_REFINING_CANDIDATES_GENERATED'
          state['next_action']='Batch 5: inspect all five actual rendered raster candidates against source fidelity and locked Batch 1 quality; reject/refine any defect before QA_APPROVED'
          state_path.write_text(json.dumps(state,indent=2)+'\n')

      - name: Validate raster-only and workflow integrity
        run: |
          if find public/explanation-images/principles-of-flight/refined-batch-5 -type f | grep -E '\.svg$'; then
            echo 'SVG found in Batch 5' >&2
            exit 1
          fi
          test "$(find public/explanation-images/principles-of-flight/refined-batch-5 -type f -name '*.png' | wc -l)" -eq 5
          test "$(find public/explanation-images/principles-of-flight/refined-batch-5 -type f -name '*.webp' | wc -l)" -eq 5
          python scripts/validate_pof_visuals.py
          python scripts/validate_pof_visual_changes.py e9247b4fb85f8ff23f29aa6ff22ee872eb495af1

      - name: Commit REFINING candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/explanation-images/principles-of-flight/refined-batch-5 data/pof-visual-manifest.json data/pof-autonomous-state.json
          git diff --cached --quiet && exit 0
          git commit -m "pof: generate Batch 5 REFINING raster candidates [skip ci]"
          git push origin HEAD:pof-autonomous-batch5
