name: Stage POF Batch 5 source-found

on:
  push:
    branches:
      - pof-autonomous-batch5
    paths:
      - .github/workflows/pof-batch5-source-found.yml

permissions:
  contents: write

jobs:
  stage-source-found:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pof-autonomous-batch5
          fetch-depth: 0

      - name: Append verified Batch 5 source briefs
        shell: python
        run: |
          import json
          from pathlib import Path

          manifest_path = Path('data/pof-visual-manifest.json')
          manifest = json.loads(manifest_path.read_text())

          batch5 = [
            {
              "visual_id": "pof-load-factor-20deg-001",
              "topic": "Turns & Load Factor",
              "concept": "A 20 degree level bank gives approximately 1.06 G, so a 3,000 lb aeroplane supports about 3,180 lb",
              "question_ids": [-4],
              "source": {
                "document": "ac_61-23c_phak_canada.pdf",
                "page": 27,
                "figure": "1-34",
                "notes": "Load Factor and Stall Speed chart. In a constant-altitude turn load factor depends on bank angle; at 20 degrees n = 1/cos(20 degrees) about 1.064, matching the question's approximate 1.06 chart read-off."
              },
              "brief": {
                "student_must_understand": "Read approximately 1.06 G at 20 degrees bank, then multiply 3,000 lb by 1.06 to obtain approximately 3,180 lb structural load.",
                "preserve": ["Bank-angle axis", "Load-factor curve relationship", "20 degree to approximately 1.06 G read-off"],
                "refine": ["Use a clean chart crop/reconstruction faithful to Figure 1-34", "Make the 20 degree read-off visually unmistakable", "Keep the worked multiplication separate and uncluttered"],
                "add": ["20 degree guide", "approximately 1.06 G guide", "3,000 lb x 1.06 = approximately 3,180 lb worked result"],
                "remove": ["Unrelated stall-speed emphasis", "Other bank-angle examples", "Baked PilotVault banner"]
              },
              "mapping_reason": "Question -4 explicitly requires the Figure PPL PoF-1 load-factor read-off at 20 degrees and then applies that factor to 3,000 lb.",
              "status": "SOURCE_FOUND",
              "qa": {"technical": false, "teaching": false, "visual": false, "preview": false, "live": false},
              "lock": {"approved": false, "replacement_reason": null}
            },
            {
              "visual_id": "pof-load-factor-50deg-001",
              "topic": "Turns & Load Factor",
              "concept": "A 50 degree level bank gives approximately 1.56 G, so a 4,600 lb aeroplane supports about 7,160 lb",
              "question_ids": [-5],
              "source": {
                "document": "ac_61-23c_phak_canada.pdf",
                "page": 27,
                "figure": "1-34",
                "notes": "Load Factor and Stall Speed chart. The handbook notes load factor rises rapidly after 50 degrees; n = 1/cos(50 degrees) about 1.556, matching the question's approximate 1.56 chart read-off."
              },
              "brief": {
                "student_must_understand": "Read approximately 1.56 G at 50 degrees bank, then multiply 4,600 lb by 1.56 to obtain approximately 7,160 lb structural load.",
                "preserve": ["Bank-angle axis", "Load-factor curve relationship", "50 degree to approximately 1.56 G read-off"],
                "refine": ["Use a clean chart crop/reconstruction faithful to Figure 1-34", "Make the 50 degree read-off visually unmistakable", "Keep the worked multiplication separate and uncluttered"],
                "add": ["50 degree guide", "approximately 1.56 G guide", "4,600 lb x 1.56 = approximately 7,160 lb worked result"],
                "remove": ["Unrelated stall-speed emphasis", "Other bank-angle examples", "Baked PilotVault banner"]
              },
              "mapping_reason": "Question -5 explicitly requires the Figure PPL PoF-1 load-factor read-off at 50 degrees and then applies that factor to 4,600 lb.",
              "status": "SOURCE_FOUND",
              "qa": {"technical": false, "teaching": false, "visual": false, "preview": false, "live": false},
              "lock": {"approved": false, "replacement_reason": null}
            },
            {
              "visual_id": "pof-load-limit-2-5g-bank-001",
              "topic": "Turns & Load Factor",
              "concept": "A +2.5 G level-turn limit corresponds to a maximum bank angle of approximately 66 degrees",
              "question_ids": [-2],
              "source": {
                "document": "ac_61-23c_phak_canada.pdf",
                "page": 27,
                "figure": "1-34",
                "notes": "Load Factor and Stall Speed chart relates bank angle to load factor in a constant-altitude turn. Solving cos(bank)=1/2.5 gives 66.4 degrees, consistent with the chart read-off."
              },
              "brief": {
                "student_must_understand": "Start at 2.5 G on the load-factor scale, meet the level-turn curve, and read approximately 66 degrees bank.",
                "preserve": ["Load-factor axis", "Bank-angle axis", "Figure 1-34 curve geometry"],
                "refine": ["Use a clean chart crop/reconstruction faithful to Figure 1-34", "Make the reverse read-off path from 2.5 G to bank angle obvious"],
                "add": ["2.5 G guide", "Curve intersection marker", "approximately 66 degree bank guide"],
                "remove": ["Structural-load multiplication", "Unrelated chart examples", "Baked PilotVault banner"]
              },
              "mapping_reason": "Question -2 explicitly asks for the bank angle corresponding to a +2.5 G limit on Figure PPL PoF-1.",
              "status": "SOURCE_FOUND",
              "qa": {"technical": false, "teaching": false, "visual": false, "preview": false, "live": false},
              "lock": {"approved": false, "replacement_reason": null}
            },
            {
              "visual_id": "pof-load-limit-3-8g-bank-001",
              "topic": "Turns & Load Factor",
              "concept": "A +3.8 G level-turn limit corresponds to a maximum bank angle of approximately 75 degrees",
              "question_ids": [-1],
              "source": {
                "document": "ac_61-23c_phak_canada.pdf",
                "page": 27,
                "figure": "1-34",
                "notes": "Load Factor and Stall Speed chart relates bank angle to load factor in a constant-altitude turn. Solving cos(bank)=1/3.8 gives 74.7 degrees, consistent with the approximately 75 degree chart read-off."
              },
              "brief": {
                "student_must_understand": "Start at 3.8 G on the load-factor scale, meet the level-turn curve, and read approximately 75 degrees bank.",
                "preserve": ["Load-factor axis", "Bank-angle axis", "Figure 1-34 curve geometry"],
                "refine": ["Use a clean chart crop/reconstruction faithful to Figure 1-34", "Make the reverse read-off path from 3.8 G to bank angle obvious"],
                "add": ["3.8 G guide", "Curve intersection marker", "approximately 75 degree bank guide"],
                "remove": ["Structural-load multiplication", "Unrelated chart examples", "Baked PilotVault banner"]
              },
              "mapping_reason": "Question -1 explicitly asks for the bank angle corresponding to a +3.8 G limit on Figure PPL PoF-1.",
              "status": "SOURCE_FOUND",
              "qa": {"technical": false, "teaching": false, "visual": false, "preview": false, "live": false},
              "lock": {"approved": false, "replacement_reason": null}
            },
            {
              "visual_id": "pof-fowler-flap-area-001",
              "topic": "Flaps & Glide",
              "concept": "A Fowler flap slides rearward before/while deflecting, increasing wing area and camber",
              "question_ids": [1201],
              "source": {
                "document": "ac_61-23c_phak_canada.pdf",
                "page": 1,
                "figure": "2-1",
                "notes": "Figure 2-1 shows the four common flap types. The accompanying handbook text states that a Fowler flap tilts downward and slides rearward on tracks, increasing angle of attack, wing camber, and wing area."
              },
              "brief": {
                "student_must_understand": "The defining movement is rearward travel: the Fowler flap extends the wing's effective chord/area before or as it deflects, so wing area increases.",
                "preserve": ["Retracted trailing-edge geometry", "Rearward track movement", "Extended Fowler-flap position", "Increase in wing area relationship"],
                "refine": ["Use a clean side-on aerofoil comparison derived from Figure 2-1", "Make rearward travel and added wing area immediately readable", "Keep camber increase secondary to the tested wing-area point"],
                "add": ["Rearward-motion arrow", "Retracted versus extended comparison", "Wing area increases callout"],
                "remove": ["Other flap types", "Generic aircraft scene", "Baked PilotVault banner"]
              },
              "mapping_reason": "Question 1201 asks the primary purpose/effect of the Fowler flap; Figure 2-1 and its text directly show that rearward extension increases wing area.",
              "status": "SOURCE_FOUND",
              "qa": {"technical": false, "teaching": false, "visual": false, "preview": false, "live": false},
              "lock": {"approved": false, "replacement_reason": null}
            }
          ]

          existing_ids = {v['visual_id'] for v in manifest['visuals']}
          owned_questions = {qid for v in manifest['visuals'] for qid in v.get('question_ids', [])}
          for visual in batch5:
              if visual['visual_id'] in existing_ids:
                  raise SystemExit(f"Visual already exists: {visual['visual_id']}")
              overlap = owned_questions.intersection(visual['question_ids'])
              if overlap:
                  raise SystemExit(f"Question ownership collision for {visual['visual_id']}: {sorted(overlap)}")
              if 'assets' in visual:
                  raise SystemExit(f"SOURCE_FOUND visual must not attach assets: {visual['visual_id']}")

          manifest['visuals'].extend(batch5)
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          state_path = Path('data/pof-autonomous-state.json')
          state = json.loads(state_path.read_text())
          state['current_batch'] = 5
          state['last_verified_checkpoint'] = 'POF_BATCH_5_SOURCE_FOUND'
          state['next_action'] = 'Batch 5: refine the five verified source briefs into raster candidates; remain in REFINING until every visual passes technical, teaching, and visual inspection gates'
          state_path.write_text(json.dumps(state, indent=2) + '\n')

      - name: Validate source-found gate
        shell: python
        run: |
          import json
          from pathlib import Path
          manifest = json.loads(Path('data/pof-visual-manifest.json').read_text())
          ids = {
            'pof-load-factor-20deg-001',
            'pof-load-factor-50deg-001',
            'pof-load-limit-2-5g-bank-001',
            'pof-load-limit-3-8g-bank-001',
            'pof-fowler-flap-area-001'
          }
          targets = [v for v in manifest['visuals'] if v['visual_id'] in ids]
          assert len(targets) == 5
          assert all(v['status'] == 'SOURCE_FOUND' for v in targets)
          assert all('assets' not in v for v in targets)
          owners = {}
          for v in manifest['visuals']:
              for qid in v.get('question_ids', []):
                  if qid in owners:
                      raise AssertionError(f'duplicate question ownership: {qid}')
                  owners[qid] = v['visual_id']
          state = json.loads(Path('data/pof-autonomous-state.json').read_text())
          assert state['stage_gate']['hard_gate_enabled'] is True
          assert state['stage_gate']['known_defects_may_advance'] is False
          assert state['last_verified_checkpoint'] == 'POF_BATCH_5_SOURCE_FOUND'

      - name: Commit source-found checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pof-visual-manifest.json data/pof-autonomous-state.json
          git diff --cached --quiet && exit 0
          git commit -m "pof: stage Batch 5 verified sources [skip ci]"
          git push origin HEAD:pof-autonomous-batch5
