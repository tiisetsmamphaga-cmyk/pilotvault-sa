name: Lock POF Batch 6 live-verified

on:
  push:
    branches:
      - pof-batch6-live-lock
    paths:
      - .github/workflows/pof-batch6-live-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote exact Batch 6 entries to LIVE_VERIFIED and lock
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('data/pof-visual-manifest.json')
          state_path = Path('data/pof-autonomous-state.json')

          manifest = json.loads(manifest_path.read_text())
          target_ids = {
              'pof-wing-polar-min-drag-001',
              'pof-wing-polar-best-ld-001',
              'pof-wing-polar-critical-aoa-001',
              'pof-induced-drag-vortex-origin-001',
              'pof-vertical-fin-directional-stability-001',
          }

          changed = 0
          for item in manifest['visuals']:
              if item.get('visual_id') not in target_ids:
                  continue
              if item.get('status') != 'PRODUCTION_READY':
                  raise SystemExit(f"Unexpected pre-lock status for {item['visual_id']}: {item.get('status')}")
              if not all(item.get('qa', {}).get(k) is True for k in ('technical','teaching','visual','preview')):
                  raise SystemExit(f"Pre-live QA incomplete for {item['visual_id']}")
              if item.get('qa', {}).get('live') is not False:
                  raise SystemExit(f"Live QA was already set for {item['visual_id']}")
              if item.get('lock', {}).get('approved') is not False:
                  raise SystemExit(f"Lock was already approved for {item['visual_id']}")

              item['status'] = 'LIVE_VERIFIED'
              item['qa']['live'] = True
              item['lock']['approved'] = True
              item['live_verification'] = {
                  'deployment_id': 'dpl_H7WfHDdvjNoA53T59U5Ljz5aLTwV',
                  'production_commit': '840c76a535541a451e3e4fef35fecbffc66357ea',
                  'domain': 'pilotvault.co.za',
                  'all_five_production_assets_verified': True,
                  'production_assets_http_200': True,
                  'production_assets_content_type_webp': True,
                  'db_mapping_verified': True,
                  'db_status_live_verified': True,
                  'verification_note': 'All five exact Batch 6 WebP assets were verified live on pilotvault.co.za from the READY Vercel production deployment. All eight exact Supabase question mappings across the five visuals were fail-closed promoted from MAPPED to LIVE_VERIFIED.'
              }
              changed += 1

          if changed != 5:
              raise SystemExit(f'Expected to lock exactly 5 Batch 6 visuals, changed {changed}')

          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          state = json.loads(state_path.read_text())
          if state.get('current_batch') != 6 or state.get('last_verified_checkpoint') != 'POF_BATCH_6_PRODUCTION_READY':
              raise SystemExit('Autonomous state is not at the exact Batch 6 PRODUCTION_READY checkpoint')
          if state.get('production_state', {}).get('approved_live_visuals') != 25:
              raise SystemExit('Expected 25 previously approved live visuals before Batch 6 lock')

          state['current_batch'] = 7
          state['completed_batches_since_last_user_report'] = int(state.get('completed_batches_since_last_user_report', 0)) + 1
          state['last_verified_checkpoint'] = 'POF_BATCH_6_LIVE_VERIFIED'
          state['production_state']['approved_live_visuals'] = 30
          state['next_action'] = 'Begin Batch 7 exact-question source selection, keep the batch at five concepts maximum, and persist only source-grounded question-specific briefs before refinement.'
          state_path.write_text(json.dumps(state, indent=2) + '\n')
          PY

      - name: Validate final lock and promotion history
        run: |
          python scripts/validate_pof_visuals.py
          python scripts/validate_pof_visual_changes.py 840c76a535541a451e3e4fef35fecbffc66357ea

      - name: Commit verified live lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pof-visual-manifest.json data/pof-autonomous-state.json
          git diff --cached --quiet && exit 0
          git commit -m "pof: lock Batch 6 after live verification"
          git push
