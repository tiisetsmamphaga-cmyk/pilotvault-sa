name: Package POF Batch 6 pixel QA

on:
  push:
    branches:
      - pof-batch6
    paths:
      - .github/workflows/pof-batch6-pixel-qa.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pof-batch6
      - name: Verify QA set
        run: |
          test "$(find public/explanation-images/principles-of-flight/refined-batch-6 -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 5
          test -f public/explanation-images/principles-of-flight/refined-batch-1/pof-bank-load-factor-v1.webp
          ! find public/explanation-images/principles-of-flight/refined-batch-6 -type f -name '*.svg' | grep .
      - name: Stage QA images
        run: |
          mkdir -p /tmp/pof-batch6-qa
          cp public/explanation-images/principles-of-flight/refined-batch-6/*.webp /tmp/pof-batch6-qa/
          cp public/explanation-images/principles-of-flight/refined-batch-1/pof-bank-load-factor-v1.webp /tmp/pof-batch6-qa/BATCH1_REFERENCE__pof-bank-load-factor-v1.webp
      - uses: actions/upload-artifact@v4
        with:
          name: pof-batch6-pixel-qa
          path: /tmp/pof-batch6-qa/*.webp
          if-no-files-found: error
          compression-level: 0
