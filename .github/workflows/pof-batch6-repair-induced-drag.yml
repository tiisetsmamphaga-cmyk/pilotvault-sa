name: Repair POF Batch 6 induced-drag visual

on:
  push:
    branches:
      - pof-batch6
    paths:
      - .github/workflows/pof-batch6-repair-induced-drag.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pof-batch6
          fetch-depth: 0
      - run: python -m pip install --quiet pillow

      - name: Rebuild induced-drag raster at same asset path
        shell: python
        run: |
          from pathlib import Path
          from math import sqrt, cos, sin, pi
          from PIL import Image, ImageDraw, ImageFont

          OUT=Path('public/explanation-images/principles-of-flight/refined-batch-6')
          W,H=1600,1050
          BG='#F7F9FC'; WHITE='#FFFFFF'; NAVY='#0B1F33'; DARK='#172033'; MUTED='#667085'; GRID='#DCE3EA'; GOLD='#F4B400'; GOLD_DARK='#9B7200'; PALE='#FFF7D6'; BLUE='#EAF1F8'; RED='#B42318'
          REG='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'; BOLD='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          def f(s,b=False): return ImageFont.truetype(BOLD if b else REG,s)
          def arrow(d,start,end,fill=NAVY,width=7,head=20):
              d.line((*start,*end),fill=fill,width=width)
              x1,y1=start; x2,y2=end; dx=x2-x1; dy=y2-y1; L=(dx*dx+dy*dy)**0.5 or 1
              ux,uy=dx/L,dy/L; px,py=-uy,ux
              a=(x2-head*ux+head*.55*px,y2-head*uy+head*.55*py); b=(x2-head*ux-head*.55*px,y2-head*uy-head*.55*py)
              d.polygon([end,a,b],fill=fill)

          im=Image.new('RGB',(W,H),BG); d=ImageDraw.Draw(im)
          d.text((100,60),'WHY LIFT CREATES INDUCED DRAG',font=f(45,True),fill=DARK)
          d.text((100,120),'Upper/lower pressure difference → wingtip roll-up → downwash and rearward aerodynamic component',font=f(23),fill=MUTED)
          d.line((100,165,1500,165),fill=GRID,width=2)
          d.rounded_rectangle((90,205,1510,930),radius=28,fill=WHITE,outline=GRID,width=2)

          # 1. Pressure difference
          d.text((140,250),'1  PRESSURE DIFFERENCE',font=f(27,True),fill=DARK)
          cx,cy,chord=170,430,500
          upper=[]; lower=[]
          for i in range(101):
              x=i/100; yt=5*.12*(.2969*sqrt(max(x,1e-8))-.126*x-.3516*x*x+.2843*x**3-.1015*x**4)
              upper.append((cx+x*chord,cy-yt*chord)); lower.append((cx+x*chord,cy+yt*chord))
          d.polygon(upper+list(reversed(lower)),fill=BLUE,outline=NAVY)
          d.text((420,325),'LOW PRESSURE',font=f(24,True),fill=NAVY,anchor='mm')
          d.text((420,535),'HIGH PRESSURE',font=f(24,True),fill=GOLD_DARK,anchor='mm')
          for xx in (250,390,530): arrow(d,(xx,520),(xx,470),fill=GOLD_DARK,width=4,head=14)

          # 2. Tip roll-up
          d.text((720,250),'2  AIR SPILLS AROUND TIP',font=f(27,True),fill=DARK)
          d.rounded_rectangle((760,380,1110,470),radius=28,fill=BLUE,outline=NAVY,width=4)
          d.text((935,425),'WING',font=f(25,True),fill=NAVY,anchor='mm')
          pts=[]; cx2,cy2=1120,475
          for i in range(100):
              t=i/99*2.2*pi; r=85*(1-i/125); pts.append((cx2+r*cos(t),cy2+r*sin(t)))
          d.line(pts,fill=GOLD_DARK,width=7)
          arrow(d,(1060,520),(1120,550),fill=GOLD_DARK,width=4,head=14)
          d.text((950,600),'tip vortex / roll-up',font=f(23,True),fill=GOLD_DARK,anchor='mm')

          # Clean lower divider and dedicated force-vector panel
          d.line((145,655,1365,655),fill=GRID,width=2)
          d.text((140,700),'3  LIFT VECTOR TILTS REARWARD',font=f(27,True),fill=DARK)
          d.text((140,742),'Downwash tilts the aerodynamic force slightly aft.',font=f(21),fill=MUTED)

          base=(560,855)
          arrow(d,base,(560,725),fill=NAVY,width=7,head=20)
          d.text((585,735),'LIFT',font=f(23,True),fill=NAVY)
          arrow(d,base,(500,735),fill=GOLD_DARK,width=7,head=20)
          d.text((285,775),'resultant aerodynamic force',font=f(20),fill=MUTED)
          arrow(d,base,(420,855),fill=RED,width=7,head=20)
          d.text((350,892),'INDUCED DRAG',font=f(24,True),fill=RED,anchor='ma')

          d.rounded_rectangle((900,720,1435,885),radius=22,fill=PALE,outline=GOLD_DARK,width=2)
          d.text((1167,770),'Pressure difference drives tip roll-up.',font=f(23,True),fill=DARK,anchor='mm')
          d.text((1167,815),'The resulting downwash tilts the force aft.',font=f(20),fill=MUTED,anchor='mm')
          d.text((1167,855),'That rearward component is induced drag.',font=f(21,True),fill=GOLD_DARK,anchor='mm')

          png=OUT/'pof-induced-drag-vortex-origin-v1.png'; webp=OUT/'pof-induced-drag-vortex-origin-v1.webp'
          im.save(png,'PNG',optimize=True); im.save(webp,'WEBP',quality=94,method=6)
          for p,fmt in ((png,'PNG'),(webp,'WEBP')):
              with Image.open(p) as chk:
                  assert chk.size==(W,H) and chk.format==fmt

      - name: Persist REFINING repair checkpoint
        shell: python
        run: |
          import json
          from pathlib import Path
          manifest=Path('data/pof-visual-manifest.json'); data=json.loads(manifest.read_text())
          v=next(v for v in data['visuals'] if v['visual_id']=='pof-induced-drag-vortex-origin-001')
          assert v['status']=='REFINING'
          assert v['assets']['web_asset'].endswith('/pof-induced-drag-vortex-origin-v1.webp')
          state_path=Path('data/pof-autonomous-state.json'); state=json.loads(state_path.read_text())
          state['last_verified_checkpoint']='POF_BATCH_6_REFINING_INDUCED_DRAG_REPAIRED'
          state['next_action']='Re-inspect repaired induced-drag raster together with the four already-passed Batch 6 candidates; remain REFINING until all five rendered visuals pass'
          state_path.write_text(json.dumps(state,indent=2)+'\n')

      - name: Validate repair without stage advance
        run: |
          ! find public/explanation-images/principles-of-flight/refined-batch-6 -type f -name '*.svg' | grep .
          python scripts/validate_pof_visuals.py
          python scripts/validate_pof_visual_changes.py edec7a577c6068f7a795d55f051ef0e4e67fa955

      - name: Commit repaired REFINING asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/explanation-images/principles-of-flight/refined-batch-6/pof-induced-drag-vortex-origin-v1.png public/explanation-images/principles-of-flight/refined-batch-6/pof-induced-drag-vortex-origin-v1.webp data/pof-autonomous-state.json
          git commit -m "pof: repair Batch 6 induced-drag visual [skip ci]"
          git push origin HEAD:pof-batch6
