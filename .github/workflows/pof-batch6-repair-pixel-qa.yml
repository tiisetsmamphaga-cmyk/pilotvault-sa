name: Package repaired POF Batch 6 induced-drag pixel QA

on:
  push:
    branches:
      - pof-batch6
    paths:
      - .github/workflows/pof-batch6-repair-pixel-qa.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pof-batch6
      - name: Verify and stage repaired raster
        run: |
          test -f public/explanation-images/principles-of-flight/refined-batch-6/pof-induced-drag-vortex-origin-v1.webp
          mkdir -p /tmp/pof-batch6-repair-qa
          cp public/explanation-images/principles-of-flight/refined-batch-6/pof-induced-drag-vortex-origin-v1.webp /tmp/pof-batch6-repair-qa/
      - uses: actions/upload-artifact@v4
        with:
          name: pof-batch6-repair-pixel-qa
          path: /tmp/pof-batch6-repair-qa/*.webp
          if-no-files-found: error
          compression-level: 0
