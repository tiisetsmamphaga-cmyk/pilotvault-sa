name: Stage POF Batch 6 source-found

on:
  push:
    branches:
      - pof-batch6
    paths:
      - .github/workflows/pof-batch6-source-found.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pof-batch6
          fetch-depth: 0

      - name: Persist five verified SOURCE_FOUND entries
        shell: python
        run: |
          import json
          from pathlib import Path

          manifest_path = Path('data/pof-visual-manifest.json')
          data = json.loads(manifest_path.read_text())
          ids = {v['visual_id'] for v in data['visuals']}
          owned_questions = {qid for v in data['visuals'] for qid in v.get('question_ids', [])}

          entries = [
            {
              'visual_id':'pof-wing-polar-min-drag-001',
              'topic':'Aerofoils & Lift',
              'concept':'On Figure PPL PoF-2, point 3 is the minimum-drag angle of attack at the smallest drag coefficient',
              'question_ids':[-6],
              'source':{'document':'421864604-Principles-of-flight-questions-pdf.pdf','page':22,'figure':'PPL PoF-2','notes':'Question 140 explicitly references the wing polar and identifies point 3 as the angle of attack for minimum drag.'},
              'brief':{
                'student_must_understand':'Minimum drag on the wing polar is read at the smallest drag coefficient, labelled point 3 in the referenced exam figure.',
                'preserve':['CL vertical axis','CD horizontal axis','Original polar-curve geometry','Numbered point 3 relationship'],
                'refine':['Redraw the polar cleanly from the referenced relationship','Make the furthest-left/minimum-CD location unmistakable','Keep all geometry technically consistent'],
                'add':['Gold read-off emphasis on point 3','Short minimum-CD cue'],
                'remove':['Unrelated exam text','Decorative aviation imagery','Baked PilotVault banner']},
              'assets':{'master_asset':None,'web_asset':None},
              'mapping_reason':'The question requires interpreting Figure PPL PoF-2 and specifically identifying point 3 as the minimum-drag angle of attack.',
              'status':'SOURCE_FOUND','qa':{'technical':False,'teaching':False,'visual':False,'preview':False,'live':False},'lock':{'approved':False,'replacement_reason':None}
            },
            {
              'visual_id':'pof-wing-polar-best-ld-001',
              'topic':'Aerofoils & Lift',
              'concept':'On Figure PPL PoF-2, point 4 is the best angle of attack where a tangent from the origin gives maximum lift-to-drag ratio',
              'question_ids':[-8],
              'source':{'document':'421864604-Principles-of-flight-questions-pdf.pdf','page':22,'figure':'PPL PoF-2','notes':'Question 138 explicitly references the wing polar and identifies point 4 as the best angle of attack; the defining relationship is maximum L/D at the tangent from the origin.'},
              'brief':{
                'student_must_understand':'Best angle of attack means maximum L/D and is located where a straight line from the origin is tangent to the polar, labelled point 4.',
                'preserve':['CL vertical axis','CD horizontal axis','Original polar-curve geometry','Origin-to-tangent relationship','Numbered point 4 relationship'],
                'refine':['Redraw the polar cleanly','Make the tangent construction easy to follow','Keep point 4 exactly on the tangency relationship'],
                'add':['Gold tangent line from origin','Gold point-4 emphasis','Short MAX L/D cue'],
                'remove':['Unrelated exam text','Decorative aviation imagery','Baked PilotVault banner']},
              'assets':{'master_asset':None,'web_asset':None},
              'mapping_reason':'The question explicitly asks for the best-angle point on the referenced polar; the visual teaches the maximum-L/D tangent method and point 4.',
              'status':'SOURCE_FOUND','qa':{'technical':False,'teaching':False,'visual':False,'preview':False,'live':False},'lock':{'approved':False,'replacement_reason':None}
            },
            {
              'visual_id':'pof-wing-polar-critical-aoa-001',
              'topic':'Aerofoils & Lift',
              'concept':'On Figure PPL PoF-2, point 6 marks the critical angle of attack at maximum lift coefficient',
              'question_ids':[-7],
              'source':{'document':'421864604-Principles-of-flight-questions-pdf.pdf','page':22,'figure':'PPL PoF-2','notes':'Question 139 explicitly references the wing polar and identifies point 6 as the critical angle of attack; critical AoA corresponds to maximum CL before lift falls.'},
              'brief':{
                'student_must_understand':'Critical angle of attack is found at maximum CL, the top of the polar before the curve turns downward, labelled point 6.',
                'preserve':['CL vertical axis','CD horizontal axis','Original polar-curve geometry','Maximum-CL peak relationship','Numbered point 6 relationship'],
                'refine':['Redraw the polar cleanly','Make the maximum-CL peak unmistakable','Show the post-peak fall without clutter'],
                'add':['Gold horizontal max-CL guide','Gold point-6 emphasis','Short CRITICAL AoA cue'],
                'remove':['Unrelated exam text','Decorative aviation imagery','Baked PilotVault banner']},
              'assets':{'master_asset':None,'web_asset':None},
              'mapping_reason':'The question explicitly asks for the critical-angle point on the referenced polar; point 6 is the maximum-CL peak.',
              'status':'SOURCE_FOUND','qa':{'technical':False,'teaching':False,'visual':False,'preview':False,'live':False},'lock':{'approved':False,'replacement_reason':None}
            },
            {
              'visual_id':'pof-induced-drag-vortex-origin-001',
              'topic':'Drag',
              'concept':'Pressure difference between the lower and upper wing surfaces drives spanwise flow and wingtip vortex roll-up, producing induced drag as a by-product of lift',
              'question_ids':[1178],
              'source':{'document':'ac_61-23c_phak_canada.pdf','page':8,'figure':None,'notes':'Handbook induced-drag section states induced drag is an unavoidable by-product of lift and a rearward component of the lift vector; its wake-turbulence section explains that upper/lower pressure differential rolls airflow around the wingtips into vortices.'},
              'brief':{
                'student_must_understand':'The wing has lower pressure above and higher pressure below; air spills around the tip, creating a vortex/downwash system associated with induced drag.',
                'preserve':['High-pressure lower surface','Low-pressure upper surface','Wingtip roll-up direction','Rearward induced-drag consequence'],
                'refine':['Use one credible wing section/planform','Make the pressure-to-vortex cause-and-effect sequence obvious','Avoid wake-turbulence operational clutter'],
                'add':['Minimal pressure labels','Curved tip-flow arrows','Induced-drag rearward arrow'],
                'remove':['Aircraft traffic scene','ATC labels','Generic decorative vortex effects','Baked PilotVault banner']},
              'assets':{'master_asset':None,'web_asset':None},
              'mapping_reason':'Question 1178 asks what creates induced drag; the visual directly connects the top/bottom pressure difference to wingtip roll-up and the induced-drag consequence.',
              'status':'SOURCE_FOUND','qa':{'technical':False,'teaching':False,'visual':False,'preview':False,'live':False},'lock':{'approved':False,'replacement_reason':None}
            },
            {
              'visual_id':'pof-vertical-fin-directional-stability-001',
              'topic':'Stability',
              'concept':'The vertical fin aft of the CG provides directional/yaw stability by weather-vaning the aircraft back into the relative wind',
              'question_ids':[1173,1177,1193,1196],
              'reuse_justification':'All four questions test the exact same relationship: the vertical fin provides directional stability in the yawing plane.',
              'source':{'document':'ac_61-23c_phak_canada.pdf','page':24,'figure':'1-31','notes':'Handbook states directional stability is accomplished by the vertical stabilizer/fin aft of the CG, acting like a weather vane; Figure 1-31 illustrates yaw control at the fin/rudder.'},
              'brief':{
                'student_must_understand':'A yaw/sideslip exposes the vertical fin to relative airflow; the aerodynamic side force at the tail creates a restoring yaw moment toward the original direction.',
                'preserve':['Vertical fin aft of CG','Vertical/yaw axis','Relative-airflow direction','Restoring yaw sense'],
                'refine':['Use a clean top/three-quarter aircraft view','Separate stability function of fin from pilot rudder-control input','Make restoring moment obvious'],
                'add':['CG marker','Relative-wind arrow','Tail side-force arrow','Restoring-yaw arc'],
                'remove':['Unrelated lateral stability content','Overloaded control-system labels','Baked PilotVault banner']},
              'assets':{'master_asset':None,'web_asset':None},
              'mapping_reason':'These questions all ask the same directional-stability relationship and the approved handbook directly explains the vertical fin weather-vane restoring action.',
              'status':'SOURCE_FOUND','qa':{'technical':False,'teaching':False,'visual':False,'preview':False,'live':False},'lock':{'approved':False,'replacement_reason':None}
            }
          ]

          for e in entries:
              assert e['visual_id'] not in ids, e['visual_id']
              for qid in e['question_ids']:
                  assert qid not in owned_questions, f'question already owned: {qid}'
                  owned_questions.add(qid)
              data['visuals'].append(e)
          manifest_path.write_text(json.dumps(data, indent=2) + '\n')

          state_path=Path('data/pof-autonomous-state.json')
          state=json.loads(state_path.read_text())
          state['current_batch']=6
          state['last_verified_checkpoint']='POF_BATCH_6_SOURCE_FOUND'
          state['next_action']='Batch 6: refine the five verified source concepts into question-specific raster candidates; remain REFINING until every rendered visual passes source, technical, teaching, and visual QA'
          state_path.write_text(json.dumps(state, indent=2) + '\n')

      - name: Validate canonical source gate
        run: |
          python scripts/validate_pof_visuals.py
          python scripts/validate_pof_visual_changes.py edec7a577c6068f7a795d55f051ef0e4e67fa955

      - name: Commit SOURCE_FOUND checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pof-visual-manifest.json data/pof-autonomous-state.json
          git commit -m "pof: persist Batch 6 SOURCE_FOUND checkpoint [skip ci]"
          git push origin HEAD:pof-batch6
