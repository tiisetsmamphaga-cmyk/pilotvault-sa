name: POF Batch 7 generate

on:
  push:
    branches:
      - pof-batch-7-rebuild
    paths:
      - scripts/generate_pof_batch7.py
      - .github/workflows/pof-batch7-generate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic raster dependency
        run: python -m pip install --disable-pip-version-check pillow==12.3.0
      - name: Generate exact Batch 7 raster pairs
        run: python scripts/generate_pof_batch7.py
      - name: Validate canonical manifest
        run: python scripts/validate_pof_visuals.py
      - name: Validate Batch 7 promotion history and raster registration
        run: python scripts/validate_pof_visual_changes.py c9ce30802c250044e30eee81cb0bd6e478f32268
      - name: Upload exact generated pixels for human inspection
        uses: actions/upload-artifact@v4
        with:
          name: pof-batch7-generated-refining
          path: public/explanation-images/principles-of-flight/refined-batch-7/
          if-no-files-found: error
          retention-days: 1
      - name: Commit reviewed-stage rasters while remaining REFINING
        run: |
          git config user.name "pilotvault-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pof-visual-manifest.json public/explanation-images/principles-of-flight/refined-batch-7
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "POF Batch 7: attach refining rasters"
          git push
