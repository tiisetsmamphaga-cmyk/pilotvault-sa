name: POF Batch 7 reference pack

on:
  push:
    branches:
      - pof-batch-7-rebuild
    paths:
      - .github/workflows/pof-batch7-reference-pack.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect locked visual references
        run: |
          mkdir -p qa-reference
          cp public/explanation-images/principles-of-flight/refined-batch-1/*.webp qa-reference/ || true
          cp public/explanation-images/principles-of-flight/refined-batch-6/pof-induced-drag-vortex-origin-v1.png qa-reference/
          cp public/explanation-images/principles-of-flight/refined-batch-6/pof-vertical-fin-directional-stability-v1.png qa-reference/
          cp public/explanation-images/principles-of-flight/refined-batch-6/pof-wing-polar-best-ld-v1.png qa-reference/
          ls -lh qa-reference
      - uses: actions/upload-artifact@v4
        with:
          name: pof-batch7-reference-pack
          path: qa-reference/
          if-no-files-found: error
          retention-days: 1
