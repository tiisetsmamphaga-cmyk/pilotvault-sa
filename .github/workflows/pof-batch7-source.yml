name: POF Batch 7 source checkpoint
on:
  push:
    branches: [pof-batch-7-rebuild]
    paths: [.github/workflows/pof-batch7-source.yml]
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Persist exact Batch 7 SOURCE_FOUND briefs
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          mp=Path('data/pof-visual-manifest.json'); sp=Path('data/pof-autonomous-state.json')
          m=json.loads(mp.read_text()); s=json.loads(sp.read_text())
          def v(vid,topic,concept,qids,reuse,page,figure,notes,understand,preserve,refine,add,remove,reason):
              return {'visual_id':vid,'topic':topic,'concept':concept,'question_ids':qids,'reuse_justification':reuse,'source':{'document':'ac_61-23c_phak_canada.pdf','page':page,'figure':figure,'notes':notes},'brief':{'student_must_understand':understand,'preserve':preserve,'refine':refine,'add':add,'remove':remove},'assets':{'master_asset':None,'web_asset':None},'mapping_reason':reason,'status':'SOURCE_FOUND','qa':{'technical':False,'teaching':False,'visual':False,'preview':False,'live':False},'lock':{'approved':False,'replacement_reason':None}}
          entries=[
          v('pof-airspeed-indicator-limits-001','Airspeed Limitations','The colour-coded ASI places VFE at the top of the white arc, VNO at the top of the green arc/start of yellow, and VNE at the red line',[1264,1267,1270,1369,2020,2022],'All six questions test the same standard ASI limit geometry and operational meaning of VFE, VNO or VNE.',4,'3-4 and 3-4b','Chapter 3 Airspeed Indicator Markings defines the white flap range and VFE upper limit, green normal range and VNO upper limit, yellow caution range, and red-line VNE.','Read VFE, VNO and VNE directly from one standard colour-coded ASI.',['White, green and yellow arc order','Red VNE radial line','Relative VFE/VNO/VNE positions'],['Use a clean credible light-aircraft ASI','Do not invent aircraft-specific speeds','Make the three limit boundaries unmistakable'],['Minimal VFE, VNO and VNE callouts','Short operational cue per limit'],['Aircraft-specific numbers','Unrelated markings','Cockpit decoration','Baked PilotVault banner'],'These questions explicitly test VFE, VNO and VNE meaning/location; one standard ASI teaches those exact boundaries.'),
          v('pof-skin-friction-boundary-layer-001','Drag','Air touching the wing surface is slowed by viscosity, creating skin-friction drag in the boundary layer',[1160,1181,1344,1355,1980],'Each question tests the same surface-contact mechanism and its classification as skin-friction parasite drag.',8,'1-14','The handbook classifies skin friction as parasite drag, explains viscous surface drag, and Figure 1-14 contrasts skin friction with form drag.','Air immediately at the surface is slowed by viscosity; that shear is skin-friction parasite drag.',['Surface-tangent airflow','Low speed at surface versus faster outer flow','Drag opposite airflow'],['Show a simple boundary-layer velocity gradient','Keep the wing/surface technically credible','Make the contact mechanism obvious'],['Velocity-gradient arrows','Skin-friction label','Parasite-drag classification cue'],['Induced-drag vortices','Generic speed lines','Decorative aircraft scene','Baked PilotVault banner'],'These questions ask why air/dust at the wing surface behaves differently and/or how skin-friction resistance is classified.'),
          v('pof-induced-drag-speed-aoa-001','Drag','In level flight, lower speed requires higher AoA and therefore greater induced drag',[1158,1197,1276,1293,1981],'All five questions test the same chain: speed down -> required AoA up -> induced drag up, or equivalently AoA up -> induced drag up.',8,'1-15','The induced-drag section states induced drag rises with AoA and when the airplane is flown slower; Figure 1-15 shows induced drag high at low speed and decreasing with speed.','Low speed in level flight requires higher AoA, so induced drag is high; higher speed lowers required AoA and induced drag.',['Induced-drag curve high at low speed','Low speed linked to higher required AoA','Critical AoA remains unchanged'],['Use one simple speed-versus-induced-drag curve plus two wing-AoA states','Keep axes unambiguous','Avoid unrelated total/parasite drag clutter'],['LOW SPEED / HIGH AoA cue','HIGHER SPEED / LOWER AoA cue','Induced-drag cue'],['Full three-curve chart','Unrelated vortex scene','Decorative aircraft art','Baked PilotVault banner'],'The questions directly test induced drag increasing with lower speed or greater AoA, including total drag below best L/D.'),
          v('pof-air-density-performance-001','ISA & Air Density','Higher altitude, temperature and humidity reduce density; lower density degrades lift/propulsive performance, lengthens take-off and reduces climb',[1266,1268,1269,1345,1350,1961],'These questions test branches of the same density-performance chain: temperature, pressure/altitude and water-vapour content determine density and reduced density degrades performance.',12,'1-17','Figure 1-17 and text connect altitude, temperature and humidity to density, take-off run and rate of climb; warm and humid air are less dense and lower density reduces performance.','Hotter, higher and more humid conditions reduce density; lower density means poorer performance, longer take-off and weaker climb.',['Altitude, temperature and humidity as separate drivers','All arrows lead to lower density','Performance consequences in correct direction'],['Use a clean cause-effect flow, not generic weather art','Make density the central physical link','Use one credible take-off/climb cue'],['Density-down node','Longer take-off arrow','Lower climb-performance arrow'],['Weather icons without aerodynamic meaning','Exact runway numbers','Unrelated ISA constants','Baked PilotVault banner'],'The questions test how temperature, humidity and atmospheric properties affect density and aircraft lift/performance.'),
          v('pof-adverse-yaw-aileron-drag-001','Aileron Drag','The down-going aileron increases local AoA/lift and induced drag, yawing the nose opposite the intended roll unless coordinated with rudder',[1164,1174,2017],'All three questions test the same adverse-yaw mechanism: extra induced drag on the down-going-aileron wing causes initial yaw opposite roll and same-direction rudder coordinates it.',23,'1-30','Figure 1-30 establishes that lowering an aileron increases local AoA and lift. The induced-drag section on page 1-8 establishes greater AoA/lift produces greater induced drag; together with the exact exam relationship this yields adverse yaw.','For a left roll the right aileron goes down, gains lift and drag, so the nose initially yaws right; left rudder coordinates the roll.',['Correct left-roll aileron deflections','More lift/drag on down-going right aileron','Yaw opposite intended roll','Same-direction rudder correction'],['Use a top/rear view where roll and yaw cannot be confused','Show drag asymmetry without exaggerated vortices','Keep rudder correction secondary to cause'],['ROLL LEFT arrow','INITIAL YAW RIGHT arrow','More induced drag on right wing','Small LEFT RUDDER cue'],['Differential/Frise geometry','Slip-skid ball','Generic motion trails','Baked PilotVault banner'],'The questions ask the direction/cause of adverse aileron yaw and its rudder correction; the visual isolates the drag asymmetry that causes it.')]
          ids={e['visual_id'] for e in entries}
          if any(x.get('visual_id') in ids for x in m['visuals']): raise SystemExit('Batch 7 visual id already exists')
          m['visuals'].extend(entries); mp.write_text(json.dumps(m,indent=2)+'\n')
          s['current_batch']=7; s['last_verified_checkpoint']='POF_BATCH_7_SOURCE_FOUND'; s['next_action']='Refine the five persisted Batch 7 concepts into question-specific raster visuals; keep mappings fail-closed until rendered-image QA and intentional preview verification pass.'; sp.write_text(json.dumps(s,indent=2)+'\n')
          PY
      - name: Validate source checkpoint
        run: |
          python3 scripts/validate_pof_visuals.py
          python3 scripts/validate_pof_visual_changes.py c9ce30802c250044e30eee81cb0bd6e478f32268
      - name: Commit verified checkpoint and remove one-shot workflow
        run: |
          git config user.name 'PilotVault Automation'
          git config user.email 'actions@pilotvault.co.za'
          git rm .github/workflows/pof-batch7-source.yml
          git add data/pof-visual-manifest.json data/pof-autonomous-state.json
          git commit -m 'POF Batch 7: lock source-grounded briefs'
          git push
