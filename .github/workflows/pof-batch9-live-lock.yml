name: POF Batch 9 live lock

on:
  push:
    branches:
      - pof-batch-9-rebuild
    paths:
      - .github/workflows/pof-batch9-live-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure lock commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Assert exact Batch 9 production base
        run: |
          test "$(git rev-parse HEAD)" = "2fa8dbf36489bedd89a3d9b1c49b7e7cf3b967fc"
          python scripts/validate_pof_visuals.py
          python scripts/validate_pof_visual_changes.py cc015041d97bf42c8a5afab198b545bd6dda8283

      - name: Persist Batch 9 LIVE_VERIFIED lock
        env:
          DEPLOYMENT_ID: dpl_HJbAmGLQ9rVgAnNwvAHHU6qgtCvt
          PRODUCTION_COMMIT: 2fa8dbf36489bedd89a3d9b1c49b7e7cf3b967fc
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          visual_ids = {
              "pof-climb-force-components-001",
              "pof-best-rate-excess-power-001",
              "pof-vx-obstacle-clearance-001",
              "pof-wind-glide-ground-track-001",
              "pof-elevator-trim-tab-setting-001",
          }

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def save(path, data):
              Path(path).write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          state = load("data/pof-autonomous-state.json")
          assert state["current_batch"] == 9
          assert state["last_verified_checkpoint"] == "POF_BATCH_9_PRODUCTION_READY"
          assert state["production_readiness"]["verified"] is True
          assert state["production_readiness"]["production_build_passed"] is True

          state["current_batch"] = 10
          state["completed_batches_since_last_user_report"] = 2
          state["last_verified_checkpoint"] = "POF_BATCH_9_LIVE_VERIFIED"
          state["production_state"]["approved_live_visuals"] = 45
          state["next_action"] = "Begin Batch 10 source selection from the audited visual-required POF rows, preserving the same five-visual hard stage gate."
          state["active_batch_source_selection"] = None
          state["active_batch_refinement"] = None
          state["active_batch_qa"] = None
          state["active_batch_preview"] = None
          state["active_batch_mapping"] = {
              "batch": 9,
              "project_ref": "kkmlfbxfopwulwkloaoc",
              "mapped_question_rows": 19,
              "visual_keys": 5,
              "database_status": "LIVE_VERIFIED",
              "exact_match_count": 19,
              "unexpected_owner_count": 0,
              "transactional_update": True,
              "post_commit_readback_verified": True,
              "verified": True,
          }
          audit = state["visual_requirement_audit"]
          audit["live_verified_question_mappings"] = 137
          audit["remaining_rows_audited"] = 228
          audit["remaining_visual_required"] = 163
          audit["question_coverage_completion_percent"] = 45.7
          audit["verified"] = True
          state["live_verification"] = {
              "batch": 9,
              "deployment_id": os.environ["DEPLOYMENT_ID"],
              "production_commit": os.environ["PRODUCTION_COMMIT"],
              "domain": "pilotvault.co.za",
              "production_assets_verified": 5,
              "mapped_question_rows": 19,
              "exact_deployment_commit_match": True,
              "all_production_webps_reachable": True,
              "live_delivery_content_type": "image/webp",
              "repository_asset_dimensions": "1600x1050",
              "exact_database_rows_live_verified": True,
              "unexpected_database_owners": 0,
              "real_renderer_build_verified_on_preview": True,
              "signed_in_student_attempt_inspected": False,
              "github_validation_run": 33837776484,
              "verification_note": "The exact Batch 9 main commit reached READY production on pilotvault.co.za. All five production WebP endpoints returned the intended image/webp assets, and all 19 exact Supabase rows were transactionally advanced to LIVE_VERIFIED with independent grouped readback and zero unexpected owners. The protected preview route was statically generated through the real ExplanationImage component with zero runtime errors; no signed-in student-attempt screenshot is claimed.",
              "verified": True,
          }
          save("data/pof-autonomous-state.json", state)

          selection = load("data/pof-batch-9-source-selection.json")
          assert selection["status"] == "PRODUCTION_READY"
          selection["status"] = "LIVE_VERIFIED"
          for concept in selection["concepts"]:
              assert concept["status"] == "PRODUCTION_READY"
              concept["status"] = "LIVE_VERIFIED"
          selection["gates"]["live_verified"] = True
          selection["next_action"] = "Batch 9 is locked and live verified. Begin Batch 10 source selection from the remaining audited visual-required POF rows."
          save("data/pof-batch-9-source-selection.json", selection)

          manifest = load("data/pof-visual-manifest.json")
          touched = 0
          for visual in manifest["visuals"]:
              if visual.get("visual_id") in visual_ids:
                  assert visual["status"] == "PRODUCTION_READY"
                  visual["status"] = "LIVE_VERIFIED"
                  visual["qa"]["live"] = True
                  visual["lock"]["approved"] = True
                  visual["lock"]["replacement_reason"] = None
                  visual["live_verification"] = {
                      "deployment_id": os.environ["DEPLOYMENT_ID"],
                      "production_commit": os.environ["PRODUCTION_COMMIT"],
                      "domain": "pilotvault.co.za",
                      "asset_reachable": True,
                      "database_rows_live_verified": True,
                  }
                  touched += 1
          assert touched == 5, f"expected 5 Batch 9 visuals, touched {touched}"
          save("data/pof-visual-manifest.json", manifest)
          PY

      - name: Validate locked history and canonical manifest
        run: |
          python scripts/validate_pof_visuals.py
          python scripts/validate_pof_visual_changes.py cc015041d97bf42c8a5afab198b545bd6dda8283
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "data/pof-autonomous-state.json data/pof-batch-9-source-selection.json data/pof-visual-manifest.json "

      - name: Build exact lock commit candidate
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://pof-batch9-lock-ci.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: pof-batch9-lock-ci-anon-placeholder
          SUPABASE_SERVICE_ROLE_KEY: pof-batch9-lock-ci-service-role-placeholder
        run: pnpm run build

      - name: Commit and push live lock
        run: |
          git add data/pof-autonomous-state.json data/pof-batch-9-source-selection.json data/pof-visual-manifest.json
          git commit -m "Lock POF Batch 9 after live verification"
          git push origin HEAD:main
