name: POF Batch 9 preview preflight

on:
  push:
    branches:
      - pof-batch-9-rebuild
    paths:
      - .github/workflows/pof-batch9-preview-preflight.yml
      - app/pof-visual-qa/page.tsx
      - app/practice/**
      - data/pof-autonomous-state.json
      - data/pof-visual-manifest.json
      - pnpm-workspace.yaml
      - public/explanation-images/principles-of-flight/refined-batch-9/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate canonical POF manifest
        run: python scripts/validate_pof_visuals.py
      - name: Validate full Batch 9 promotion history
        run: python scripts/validate_pof_visual_changes.py cc015041d97bf42c8a5afab198b545bd6dda8283
      - name: Verify temporary QA route and exact renderer allowlist
        run: |
          test -f app/pof-visual-qa/page.tsx
          grep -F 'refined-batch-(?:1|2|3|4|5|6|7|8|9)' 'app/practice/[subject]/components/explanation-image.tsx'
          test "$(find public/explanation-images/principles-of-flight/refined-batch-9 -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 5
          test "$(find public/explanation-images/principles-of-flight/refined-batch-9 -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 5
          test "$(find public/explanation-images/principles-of-flight/refined-batch-9 -maxdepth 1 -type f -name '*.svg' | wc -l)" -eq 0
      - name: Production Next.js build
        # The build imports both browser and server Supabase clients, but this
        # preflight never connects to a database. Keep production credentials
        # out of Actions and scope inert values to this build step only.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://pof-batch9-ci.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: pof-batch9-ci-anon-placeholder
          SUPABASE_SERVICE_ROLE_KEY: pof-batch9-ci-service-role-placeholder
        run: pnpm run build
