name: Finalize POF live metadata

on:
  push:
    branches:
      - pof-autonomous-batch5
    paths:
      - .github/workflows/pof-finalize-live-metadata.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pof-autonomous-batch5
          fetch-depth: 0

      - name: Promote verified batches and persist checkpoint
        shell: python
        run: |
          import json
          from pathlib import Path

          manifest_path = Path('data/pof-visual-manifest.json')
          manifest = json.loads(manifest_path.read_text())
          targets = []
          for visual in manifest['visuals']:
              web = visual.get('assets', {}).get('web_asset', '')
              if any(f'/refined-batch-{n}/' in web for n in (2, 3, 4)):
                  targets.append(visual)

          if len(targets) != 15:
              raise SystemExit(f'Expected 15 Batch 2-4 visuals, found {len(targets)}')

          for visual in targets:
              if visual.get('status') != 'PRODUCTION_READY':
                  raise SystemExit(f"Unexpected status for {visual.get('visual_id')}: {visual.get('status')}")
              qa = visual.setdefault('qa', {})
              if not all(qa.get(k) is True for k in ('technical', 'teaching', 'visual', 'preview')):
                  raise SystemExit(f"QA gate missing for {visual.get('visual_id')}")
              visual['status'] = 'LIVE_VERIFIED'
              qa['live'] = True
              lock = visual.setdefault('lock', {})
              lock['approved'] = True
              lock['replacement_reason'] = None

          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          state_path = Path('data/pof-autonomous-state.json')
          state = json.loads(state_path.read_text())
          state['current_batch'] = 5
          state['completed_batches_since_last_user_report'] = 0
          state['last_user_report_batch'] = 4
          state['last_verified_checkpoint'] = 'POF_BATCHES_2_4_LIVE_VERIFIED_LOCKED'
          state.setdefault('production_state', {})['approved_live_visuals'] = 20
          state['production_state']['rejected_non_batch_1_mappings'] = 0
          state['production_state']['legacy_bulk_visuals_allowed'] = False
          state['next_action'] = 'Start Batch 5 from exact POF questions and approved handbook sources, continue autonomously through Batches 5-7, and report after Batch 7 unless a genuine stop condition occurs'
          state_path.write_text(json.dumps(state, indent=2) + '\n')

      - name: Validate finalized metadata
        shell: python
        run: |
          import json
          from pathlib import Path
          manifest = json.loads(Path('data/pof-visual-manifest.json').read_text())
          targets = [v for v in manifest['visuals'] if any(f'/refined-batch-{n}/' in v.get('assets', {}).get('web_asset', '') for n in (2,3,4))]
          assert len(targets) == 15
          assert all(v['status'] == 'LIVE_VERIFIED' for v in targets)
          assert all(v['qa']['live'] is True for v in targets)
          assert all(v['lock']['approved'] is True for v in targets)
          state = json.loads(Path('data/pof-autonomous-state.json').read_text())
          assert state['current_batch'] == 5
          assert state['production_state']['approved_live_visuals'] == 20

      - name: Commit checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pof-visual-manifest.json data/pof-autonomous-state.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: lock POF Batches 2-4 live checkpoint [skip ci]"
          git push origin HEAD:pof-autonomous-batch5
