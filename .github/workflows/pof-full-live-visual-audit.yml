name: POF full live visual audit

on:
  push:
    branches:
      - pof-batch-13-rebuild

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build contact sheets and inventory from all LIVE_VERIFIED POF visuals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          manifest=json.loads(Path('data/pof-visual-manifest.json').read_text())
          live=[]
          for v in manifest['visuals']:
              if v.get('status')!='LIVE_VERIFIED':
                  continue
              asset=v.get('assets',{}).get('web_asset')
              if not asset or '/principles-of-flight/' not in asset:
                  continue
              m=re.search(r'/refined-batch-(\d+)/',asset)
              if not m:
                  continue
              live.append((int(m.group(1)),v,Path(asset)))

          live.sort(key=lambda x:(x[0],x[1]['visual_id']))
          assert len(live)==60, len(live)
          out=Path('/tmp/pof-live-audit'); out.mkdir(parents=True,exist_ok=True)
          font='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          bold='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          F=lambda s,b=False: ImageFont.truetype(bold if b else font,s)

          inventory=[]
          by_batch={}
          dims_by_batch={}
          for batch,v,p in live:
              assert p.exists(), p
              with Image.open(p) as im:
                  dims=list(im.size)
              by_batch.setdefault(batch,[]).append((v,p))
              dims_by_batch.setdefault(batch,set()).add(tuple(dims))
              source=v.get('source',{})
              provenance_text=json.dumps(v).lower()
              evidence_terms=['crop','cropped','extract','extracted','source image','source figure used','pdf figure used','redraw from source figure','traced from']
              inventory.append({
                  'batch':batch,
                  'visual_id':v['visual_id'],
                  'web_asset':str(p),
                  'dimensions':dims,
                  'source':source,
                  'question_ids':v.get('question_ids',[]),
                  'visual_inspection':v.get('visual_inspection'),
                  'explicit_pdf_figure_use_evidence': any(t in provenance_text for t in evidence_terms),
              })

          # one 5-up sheet per batch, preserving full image aspect
          for batch,items in sorted(by_batch.items()):
              assert len(items)==5,(batch,len(items))
              canvas=Image.new('RGB',(1800,6000),'#0a1118')
              d=ImageDraw.Draw(canvas)
              d.text((60,30),f'POF LIVE AUDIT — BATCH {batch}',font=F(38,True),fill='white')
              y=100
              for v,p in items:
                  with Image.open(p) as src:
                      im=src.convert('RGB')
                      im.thumbnail((1680,1000),Image.Resampling.LANCZOS)
                  canvas.paste(im,(60,y))
                  y+=im.height+12
                  d.text((60,y),v['visual_id'],font=F(25,True),fill='white')
                  y+=55
              crop=canvas.crop((0,0,1800,min(6000,y+30)))
              crop.save(out/f'batch-{batch:02d}.jpg','JPEG',quality=92)

          # four overview sheets, 15 thumbs each
          for idx in range(4):
              chunk=live[idx*15:(idx+1)*15]
              canvas=Image.new('RGB',(1800,3400),'#0a1118')
              d=ImageDraw.Draw(canvas)
              d.text((50,25),f'POF LIVE OVERVIEW {idx+1}/4',font=F(34,True),fill='white')
              for j,(batch,v,p) in enumerate(chunk):
                  row=j//3; col=j%3
                  x=40+col*585; y=95+row*650
                  with Image.open(p) as src:
                      im=src.convert('RGB'); im.thumbnail((550,500),Image.Resampling.LANCZOS)
                  canvas.paste(im,(x,y))
                  d.text((x,y+510),f'B{batch} · {v["visual_id"]}',font=F(15,True),fill='white')
              canvas.save(out/f'overview-{idx+1}.jpg','JPEG',quality=90)

          Path('/tmp/pof-live-inventory.json').write_text(json.dumps(inventory,indent=2)+'\n')
          summary={
              'live_visuals':len(live),
              'batches':{str(k):len(v) for k,v in sorted(by_batch.items())},
              'dimensions_by_batch':{str(k):[list(x) for x in sorted(v)] for k,v in sorted(dims_by_batch.items())},
              'explicit_pdf_figure_use_evidence_count':sum(1 for x in inventory if x['explicit_pdf_figure_use_evidence']),
          }
          Path('/tmp/pof-live-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY

      - name: Upload audit sheets
        uses: actions/upload-artifact@v4
        with:
          name: pof-full-live-visual-audit
          path: |
            /tmp/pof-live-audit/*.jpg
            /tmp/pof-live-inventory.json
            /tmp/pof-live-summary.json
          retention-days: 1
          if-no-files-found: error
