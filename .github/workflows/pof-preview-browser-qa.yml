name: POF Preview Browser QA

on:
  push:
    branches:
      - pof-batches-2-4-clean-v2
    paths:
      - '.github/workflows/pof-preview-browser-qa.yml'

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify preview gallery in Chromium
        shell: bash
        run: |
          set -euo pipefail
          cat > ./pof-browser-qa.mjs <<'JS'
          import { chromium } from 'playwright'
          import fs from 'node:fs/promises'

          const url = 'https://pilotvault-jpr8a1b3d-tiisetsmamphaga-8884s-projects.vercel.app/pof-visual-qa'
          const browser = await chromium.launch({ headless: true })
          await fs.mkdir('qa-output', { recursive: true })

          async function inspect(name, viewport, isMobile=false) {
            const context = await browser.newContext({ viewport, isMobile, deviceScaleFactor: 1 })
            const page = await context.newPage()
            const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 })
            if (!response || response.status() !== 200) throw new Error(`${name}: preview HTTP ${response?.status()}`)
            await page.waitForSelector('text=Principles of Flight — Batches 2–4', { timeout: 30000 })

            const height = await page.evaluate(() => document.documentElement.scrollHeight)
            for (let y=0; y<height; y+=Math.max(400, viewport.height*0.75)) {
              await page.evaluate(v => window.scrollTo(0, v), y)
              await page.waitForTimeout(180)
            }
            await page.evaluate(() => window.scrollTo(0,0))
            await page.waitForTimeout(400)

            await page.waitForFunction(() => {
              const imgs=[...document.querySelectorAll('main img[src*="/explanation-images/principles-of-flight/refined-batch-"]')]
              return imgs.length === 15 && imgs.every(img => img.complete && img.naturalWidth > 0)
            }, { timeout: 30000 })

            const result = await page.evaluate(() => {
              const imgs=[...document.querySelectorAll('main img[src*="/explanation-images/principles-of-flight/refined-batch-"]')]
              return {
                imageCount: imgs.length,
                loaded: imgs.filter(i => i.complete && i.naturalWidth > 0).length,
                broken: imgs.filter(i => !i.complete || i.naturalWidth === 0).map(i => i.getAttribute('src')),
                visibleErrors: [...document.querySelectorAll('main [role="alert"]')].map(x => x.textContent?.trim()),
                width: document.documentElement.clientWidth,
                scrollWidth: document.documentElement.scrollWidth,
              }
            })
            console.log(name, JSON.stringify(result))
            if (result.imageCount !== 15 || result.loaded !== 15 || result.broken.length || result.visibleErrors.length) {
              throw new Error(`${name}: image/component QA failed: ${JSON.stringify(result)}`)
            }
            if (result.scrollWidth > result.width + 2) {
              throw new Error(`${name}: horizontal overflow ${result.scrollWidth} > ${result.width}`)
            }
            await page.screenshot({ path: `qa-output/pof-preview-${name}.png`, fullPage: true })
            await context.close()
          }

          await inspect('desktop', { width: 1440, height: 1000 })
          await inspect('mobile', { width: 390, height: 844 }, true)
          await browser.close()
          JS
          node ./pof-browser-qa.mjs
          rm -f ./pof-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: pof-preview-browser-qa
          path: qa-output/pof-preview-*.png
          if-no-files-found: error
          retention-days: 2
