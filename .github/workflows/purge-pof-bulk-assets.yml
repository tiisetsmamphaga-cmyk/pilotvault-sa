name: Purge deprecated POF bulk assets

on:
  push:
    branches:
      - fix/pof-quality-gate-reset
    paths:
      - '.github/workflows/purge-pof-bulk-assets.yml'

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pof-quality-gate-reset
          fetch-depth: 0

      - name: Remove deprecated bulk visual library
        shell: bash
        run: |
          set -euo pipefail
          git rm -r public/explanation-images/principles-of-flight/raster-complete
          git config user.name "PilotVault Automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Purge rejected bulk POF raster library"
          git push origin HEAD:fix/pof-quality-gate-reset
