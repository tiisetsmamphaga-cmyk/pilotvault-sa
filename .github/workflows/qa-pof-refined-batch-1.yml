name: QA POF refined batch 1 assets

on:
  push:
    branches:
      - pof-refined-batch-1
    paths:
      - '.github/workflows/qa-pof-refined-batch-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify installed corrected raster set
        shell: bash
        run: |
          set -euo pipefail
          root='public/explanation-images/principles-of-flight/refined-batch-1'
          test -s "$root/pof-bank-load-factor-v1.webp"
          test -s "$root/pof-longitudinal-stability-v1.webp"
          test -s "$root/pof-drag-curves-v1.webp"
          test -s "$root/pof-dihedral-lateral-stability-v1.webp"
          test -s "$root/pof-glide-ld-v1.webp"
          file "$root"/*-v1.webp
          sha256sum "$root"/*-v1.webp > pof-batch-1-sha256.txt

      - name: Upload exact committed QA assets
        uses: actions/upload-artifact@v4
        with:
          name: pof-refined-batch-1-v1-qa
          path: |
            public/explanation-images/principles-of-flight/refined-batch-1/*-v1.webp
            pof-batch-1-sha256.txt
          if-no-files-found: error
          retention-days: 3
