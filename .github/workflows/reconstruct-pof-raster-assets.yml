name: Reconstruct staged POF raster assets

on:
  push:
    branches:
      - pof-refined-batch-1
    paths:
      - '.pof-upload/READY'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify raster assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          stage = Path('.pof-upload')
          output_root = Path('public/explanation-images/principles-of-flight/refined-batch-1')
          output_root.mkdir(parents=True, exist_ok=True)

          staged = [p for p in sorted(stage.iterdir()) if p.is_dir()]
          if not staged:
              raise SystemExit('No staged POF asset directories found')

          for directory in staged:
              parts = sorted(directory.glob('part-*'))
              if not parts:
                  raise SystemExit(f'No chunks found for {directory.name}')

              encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
              payload = base64.b64decode(encoded, validate=True)

              expected_file = directory / 'expected-sha.txt'
              if not expected_file.exists():
                  raise SystemExit(f'Missing expected SHA for {directory.name}')
              expected = expected_file.read_text(encoding='utf-8').strip()

              header = b'blob ' + str(len(payload)).encode() + b'\0'
              actual = hashlib.sha1(header + payload).hexdigest()
              if actual != expected:
                  raise SystemExit(
                      f'SHA mismatch for {directory.name}: expected {expected}, got {actual}'
                  )

              output = output_root / directory.name
              output.write_bytes(payload)
              print(f'VERIFIED {directory.name}: {len(payload)} bytes, SHA {actual}')
          PY

      - name: Commit verified raster assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PilotVault Visual Pipeline'
          git config user.email 'actions@users.noreply.github.com'
          git add public/explanation-images/principles-of-flight/refined-batch-1
          git rm -r .pof-upload
          git commit -m 'Add verified refined POF raster asset'
          git push
