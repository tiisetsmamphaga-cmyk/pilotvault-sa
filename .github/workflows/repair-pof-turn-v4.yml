name: Repair POF balanced-turn v4

on:
  push:
    branches:
      - pof-batch-2-rebuild
    paths:
      - 'scripts/repair_pof_turn_lift_v4.py'
      - '.github/workflows/repair-pof-turn-v4.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Pillow
        run: python -m pip install --disable-pip-version-check 'Pillow==12.3.0'
      - name: Build reviewed v4 and update manifest
        run: python scripts/repair_pof_turn_lift_v4.py
      - name: Verify v4 raster integrity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path('public/explanation-images/principles-of-flight/refined-batch-4')
          for name, fmt in [('pof-turn-lift-components-v4.png','PNG'), ('pof-turn-lift-components-v4.webp','WEBP')]:
              p = root / name
              assert p.exists() and p.stat().st_size > 0, p
              with Image.open(p) as im:
                  assert im.format == fmt, (p, im.format)
                  assert im.size == (1600, 1050), (p, im.size)
          PY
      - name: Remove rejected v1 pair
        run: |
          rm -f public/explanation-images/principles-of-flight/refined-batch-4/pof-turn-lift-components-v1.png
          rm -f public/explanation-images/principles-of-flight/refined-batch-4/pof-turn-lift-components-v1.webp
      - name: Validate manifest
        run: python scripts/validate_pof_visuals.py
      - name: Commit repaired asset atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pof-visual-manifest.json \
            public/explanation-images/principles-of-flight/refined-batch-4/pof-turn-lift-components-v4.png \
            public/explanation-images/principles-of-flight/refined-batch-4/pof-turn-lift-components-v4.webp
          git add -u public/explanation-images/principles-of-flight/refined-batch-4
          if git diff --cached --quiet; then
            echo 'Balanced-turn v4 already repaired.'
            exit 0
          fi
          git commit -m 'Replace rejected balanced-turn visual with reviewed v4'
          git push origin HEAD:pof-batch-2-rebuild
