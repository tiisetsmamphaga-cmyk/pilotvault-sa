name: Replay POF Batches 2-4 QA_APPROVED

on:
  push:
    branches:
      - pof-batches-2-4-clean-v2
    paths:
      - 'scripts/replay_pof_batches_2_4.py'
      - '.github/workflows/replay-pof-batches-2-4-qa.yml'

permissions:
  contents: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch source-plan ref
        run: git fetch origin pof-batch-2-rebuild:refs/remotes/origin/pof-batch-2-rebuild
      - name: Install pinned Pillow
        run: python -m pip install --disable-pip-version-check 'Pillow==12.3.0'
      - name: Verify final 30 raster files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('public/explanation-images/principles-of-flight')
          files=[]
          for batch in (2,3,4):
              folder=root/f'refined-batch-{batch}'
              batch_files=sorted(p for p in folder.iterdir() if p.is_file())
              assert len(batch_files)==10,(folder,len(batch_files),[p.name for p in batch_files])
              files.extend(batch_files)
          assert len(files)==30
          assert not (root/'refined-batch-4/pof-critical-aoa-stall-v3.png').exists()
          assert not (root/'refined-batch-4/pof-critical-aoa-stall-v3.webp').exists()
          assert not (root/'refined-batch-4/pof-turn-lift-components-v1.png').exists()
          assert not (root/'refined-batch-4/pof-turn-lift-components-v1.webp').exists()
          for p in files:
              with Image.open(p) as im:
                  assert im.format in {'PNG','WEBP'},(p,im.format)
                  assert im.width>=1000 and im.height>=600,(p,im.size)
          print('Final raster integrity passed:',len(files))
          PY
      - name: Promote exact assets to QA_APPROVED
        run: python scripts/replay_pof_batches_2_4.py qa-approved
      - name: Validate manifest after QA promotion
        run: python scripts/validate_pof_visuals.py
      - name: Commit QA_APPROVED manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pof-visual-manifest.json
          git commit -m 'Approve POF Batches 2-4 after rendered QA'
          git push origin HEAD:pof-batches-2-4-clean-v2
