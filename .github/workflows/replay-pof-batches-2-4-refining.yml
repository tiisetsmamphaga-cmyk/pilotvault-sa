name: Replay POF Batches 2-4 REFINING

on:
  push:
    branches:
      - pof-batches-2-4-clean-v2
    paths:
      - 'scripts/replay_pof_batches_2_4.py'
      - '.github/workflows/replay-pof-batches-2-4-refining.yml'

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch scratch reviewed-assets ref
        run: git fetch origin pof-batch-2-rebuild:refs/remotes/origin/pof-batch-2-rebuild
      - name: Copy only reviewed refined batch folders
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/pof-batch-2-rebuild -- \
            public/explanation-images/principles-of-flight/refined-batch-2 \
            public/explanation-images/principles-of-flight/refined-batch-3 \
            public/explanation-images/principles-of-flight/refined-batch-4
          test ! -e public/explanation-images/principles-of-flight/refined-batch-4/pof-turn-lift-components-v1.png
          test ! -e public/explanation-images/principles-of-flight/refined-batch-4/pof-turn-lift-components-v1.webp
          test -e public/explanation-images/principles-of-flight/refined-batch-4/pof-turn-lift-components-v4.png
          test -e public/explanation-images/principles-of-flight/refined-batch-4/pof-turn-lift-components-v4.webp
      - name: Install pinned Pillow
        run: python -m pip install --disable-pip-version-check 'Pillow==12.3.0'
      - name: Validate all 30 raster files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path('public/explanation-images/principles-of-flight')
          files=[]
          for batch in (2,3,4):
              folder=root / f'refined-batch-{batch}'
              batch_files=sorted(p for p in folder.iterdir() if p.is_file())
              assert len(batch_files)==10, (folder, len(batch_files), [p.name for p in batch_files])
              files.extend(batch_files)
          assert len(files)==30
          for p in files:
              with Image.open(p) as im:
                  assert im.format in {'PNG','WEBP'}, (p, im.format)
                  assert im.width >= 1000 and im.height >= 600, (p, im.size)
          print('Raster integrity passed for', len(files), 'files')
          PY
      - name: Replay REFINING state
        run: python scripts/replay_pof_batches_2_4.py refining
      - name: Validate manifest structure
        run: python scripts/validate_pof_visuals.py
      - name: Commit REFINING assets and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pof-visual-manifest.json \
            public/explanation-images/principles-of-flight/refined-batch-2 \
            public/explanation-images/principles-of-flight/refined-batch-3 \
            public/explanation-images/principles-of-flight/refined-batch-4
          git commit -m 'Attach reviewed POF Batches 2-4 assets for refinement'
          git push origin HEAD:pof-batches-2-4-clean-v2
