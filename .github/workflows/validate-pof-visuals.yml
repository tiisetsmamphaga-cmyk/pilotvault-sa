name: Validate POF visual workflow

on:
  pull_request:
    paths:
      - 'data/pof-visual-manifest.json'
      - 'data/pof-visual-manifest.schema.json'
      - 'docs/POF_VISUAL_WORKFLOW.md'
      - 'scripts/validate_pof_visuals.py'
      - 'scripts/validate_pof_visual_changes.py'
      - 'public/explanation-images/principles-of-flight/**'
      - 'app/practice/**'
      - '.github/workflows/validate-pof-visuals.yml'
  push:
    branches:
      - main
      - 'pof-visual-*'
      - 'fix/pof-*'
    paths:
      - 'data/pof-visual-manifest.json'
      - 'data/pof-visual-manifest.schema.json'
      - 'docs/POF_VISUAL_WORKFLOW.md'
      - 'scripts/validate_pof_visuals.py'
      - 'scripts/validate_pof_visual_changes.py'
      - 'public/explanation-images/principles-of-flight/**'
      - 'app/practice/**'
      - '.github/workflows/validate-pof-visuals.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate POF manifest and QA gates
        run: python scripts/validate_pof_visuals.py

      - name: Resolve comparison base
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
              BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi
          fi

          if [[ -z "$BASE" ]]; then
            echo "Unable to determine comparison base."
            exit 1
          fi

          echo "POF_BASE_SHA=$BASE" >> "$GITHUB_ENV"

      - name: Validate POF state transitions, asset locks, manifest ownership and no-vector rule
        run: python scripts/validate_pof_visual_changes.py "$POF_BASE_SHA"
