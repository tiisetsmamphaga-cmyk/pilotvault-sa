<text x="196.0" y="452.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#101827">ONLY THE TRIM WHEEL MOVES THE TAB</text>
<text x="196.0" y="488.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">The pilot sets the tab angle with the</text>
<text x="196.0" y="515.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">trim wheel. Moving the control column</text>
<text x="196.0" y="542.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">moves the elevator, not the tab setting.</text>
<rect x="612" y="410" width="540" height="176" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="632.0" y="452.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#101827">TRIM TAB VS BALANCE TAB</text>
<text x="632.0" y="488.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#101827">Adjustable trim tab:</text>
<text x="812.0" y="488.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">stays at the selected angle</text>
<text x="812.0" y="513.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">as the elevator moves.</text>
<text x="632.0" y="538.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#101827">Balance tab:</text>
<text x="812.0" y="538.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">geared to move opposite to</text>
<text x="812.0" y="563.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">the surface every time it moves.</text>
<text x="600" y="642" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#101827">An adjustable trim tab keeps its selected angle whatever the elevator deflection.</text>
</svg>
