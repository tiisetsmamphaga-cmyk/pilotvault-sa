<text x="80.0" y="486.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">LONGERONS</text>
<text x="80.0" y="518.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Main longitudinal members</text>
<text x="80.0" y="543.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">along the fuselage length;</text>
<text x="80.0" y="568.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">they carry the main loads.</text>
<rect x="430" y="452" width="340" height="136" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="450.0" y="486.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">VERTICALS &amp; DIAGONALS</text>
<text x="450.0" y="518.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Tie the longerons into</text>
<text x="450.0" y="543.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">rigid triangles that</text>
<text x="450.0" y="568.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">resist bending and shear.</text>
<rect x="800" y="452" width="340" height="136" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="820.0" y="486.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">COVERING</text>
<text x="820.0" y="518.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Fabric or light panels give</text>
<text x="820.0" y="543.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">the streamlined shape but</text>
<text x="820.0" y="568.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">carry little structural load.</text>
<text x="600" y="642" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#101827">In a truss (girder) fuselage the longerons are the main longitudinal load-carrying members.</text>
