<rect x="666" y="454" width="90" height="28" rx="14" fill="#f4b400"/>
<text x="711.0" y="473.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#06111f">ANSWER</text>
<text x="450.0" y="476.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#101827">MONOCOQUE</text>
<text x="450.0" y="510.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">The skin carries all the</text>
<text x="450.0" y="536.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">loads; formers only</text>
<text x="450.0" y="562.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">hold the shape.</text>
