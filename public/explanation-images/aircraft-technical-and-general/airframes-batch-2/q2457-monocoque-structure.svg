<text x="820.0" y="476.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#101827">SEMI-MONOCOQUE</text>
<text x="820.0" y="510.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Formers and stringers</text>
<text x="820.0" y="536.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">keep the shape; the</text>
<text x="820.0" y="562.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">stressed skin shares the load.</text>
<text x="600" y="642" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#101827">Monocoque: the outer skin carries all the flight loads.</text>
</svg>
