<text x="820.0" y="486.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">REAR SPAR</text>
<text x="820.0" y="518.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Second spanwise member;</text>
<text x="820.0" y="543.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">ailerons and flaps are</text>
<text x="820.0" y="568.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">usually hinged to it.</text>
<text x="600" y="642" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#101827">Ribs give the wing both its aerofoil shape and strength, passing loads to the spars.</text>
