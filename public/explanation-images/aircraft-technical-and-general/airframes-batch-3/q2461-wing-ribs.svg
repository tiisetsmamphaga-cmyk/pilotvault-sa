<text x="80.0" y="486.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">MAIN SPAR</text>
<text x="80.0" y="518.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Main spanwise beam that</text>
