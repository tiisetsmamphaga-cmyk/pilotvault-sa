<text x="711.0" y="485.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#06111f">ANSWER</text>
<text x="450.0" y="486.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">RIBS</text>
<text x="450.0" y="518.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Give the wing its aerofoil</text>
