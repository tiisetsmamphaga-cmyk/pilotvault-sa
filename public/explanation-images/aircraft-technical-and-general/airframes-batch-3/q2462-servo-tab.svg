<text x="66.0" y="536.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#ffffff">2</text>
<text x="92.0" y="536.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#101827">AIR LOAD ON THE TAB ACTS DOWNWARD</text>
<circle cx="66.0" cy="566.0" r="15" fill="#06111f"/>
<text x="66.0" y="572.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#ffffff">3</text>
<text x="92.0" y="572.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#101827">FREE-HINGED SURFACE IS DRIVEN DOWN</text>
