<ellipse cx="-14" cy="-27" rx="34" ry="5" fill="#94a3b8" stroke="#101827" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
<ellipse cx="94" cy="-5" rx="18" ry="3.2" fill="#94a3b8" stroke="#101827" stroke-width="2" vector-effect="non-scaling-stroke"/>
