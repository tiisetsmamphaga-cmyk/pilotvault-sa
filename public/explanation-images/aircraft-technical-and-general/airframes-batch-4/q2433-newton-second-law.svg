<path d="M -100,0 C -100,-17 -82,-24 -52,-24 L 40,-16 L 106,-9 L 108,3 L 40,9 L -52,15 C -86,15 -100,10 -100,0 Z" fill="#dfe5ec" stroke="#101827" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
