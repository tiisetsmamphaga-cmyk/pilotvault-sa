<line x1="-58" y1="14" x2="-60" y2="26" stroke="#101827" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
<line x1="-22" y1="12" x2="-18" y2="25" stroke="#101827" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
<circle cx="-60" cy="29" r="5" fill="#101827"/>
<circle cx="-17" cy="28" r="5" fill="#101827"/>
</g>
<line x1="498.4" y1="338.0" x2="452.4" y2="338.0" stroke="#dc2626" stroke-width="5" stroke-linecap="round" marker-end="url(#aRed)"/>
<text x="480.4" y="382.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#dc2626">THRUST</text>
<line x1="702.6" y1="336.1" x2="720.6" y2="336.1" stroke="#dc2626" stroke-width="5" stroke-linecap="round" marker-end="url(#aRed)"/>
<text x="710.6" y="378.1" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#dc2626">DRAG</text>
<line x1="660.0" y1="260.0" x2="540.0" y2="260.0" stroke="#b7860b" stroke-width="7" stroke-linecap="round" marker-end="url(#aDark)"/>
<text x="600.0" y="244.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#b7860b">ACCELERATES</text>
<text x="600.0" y="410.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#101827">THRUST &gt; DRAG</text>
<text x="600.0" y="474.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">A net force produces</text>
<text x="600.0" y="499.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">acceleration: speeding up,</text>
<text x="600.0" y="524.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">slowing down or turning.</text>
<text x="600.0" y="562.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#101827">F = m × a</text>
<rect x="792" y="142" width="360" height="444" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="812.0" y="178.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#101827">3RD LAW</text>
<text x="812.0" y="206.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#334155">ACTION AND REACTION</text>
<g transform="translate(972.0,338.0) rotate(0.00) scale(0.95)">
