<ellipse cx="-104" cy="0" rx="3.5" ry="27" fill="#64748b" stroke="#101827" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
<line x1="-58" y1="14" x2="-60" y2="26" stroke="#101827" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
