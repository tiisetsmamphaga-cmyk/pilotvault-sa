<circle cx="-60" cy="29" r="5" fill="#101827"/>
<circle cx="-17" cy="28" r="5" fill="#101827"/>
</g>
<line x1="870.4" y1="338.0" x2="826.4" y2="338.0" stroke="#dc2626" stroke-width="5" stroke-linecap="round" marker-end="url(#aRed)"/>
<line x1="882.4" y1="308.0" x2="962.4" y2="308.0" stroke="#1e88e5" stroke-width="5" stroke-linecap="round" marker-end="url(#aBlue)"/>
<line x1="882.4" y1="368.0" x2="962.4" y2="368.0" stroke="#1e88e5" stroke-width="5" stroke-linecap="round" marker-end="url(#aBlue)"/>
<text x="972.0" y="274.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#dc2626">REACTION: AIRCRAFT PUSHED FORWARD</text>
<text x="972.0" y="404.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#1e88e5">ACTION: AIR PUSHED BACK</text>
<text x="972.0" y="474.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Every action has an equal</text>
<text x="972.0" y="499.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">and opposite reaction.</text>
<text x="972.0" y="562.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#101827">Air pushed back, aircraft forward</text>
<text x="600" y="642" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#101827">Newton's second law: a net force causes acceleration or deceleration (F = m × a).</text>
</svg>
