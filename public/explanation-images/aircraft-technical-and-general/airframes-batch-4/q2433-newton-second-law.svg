<text x="600" y="79" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#ffffff">NEWTON'S SECOND LAW</text>
<rect x="0" y="108" width="1200" height="4" fill="#f4b400"/>
<rect x="28" y="130" width="1144" height="470" rx="10" fill="#ffffff" stroke="#d7e0ea" stroke-width="2"/>
<rect x="48" y="142" width="360" height="444" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="68.0" y="178.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#101827">1ST LAW</text>
<text x="68.0" y="206.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#334155">EQUILIBRIUM (INERTIA)</text>
<g transform="translate(228.0,338.0) rotate(0.00) scale(0.95)">
