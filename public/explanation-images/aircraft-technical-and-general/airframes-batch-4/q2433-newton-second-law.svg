<line x1="216.6" y1="366.5" x2="216.6" y2="416.5" stroke="#dc2626" stroke-width="5" stroke-linecap="round" marker-end="url(#aRed)"/>
<text x="216.6" y="438.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#dc2626">WEIGHT</text>
<line x1="126.4" y1="338.0" x2="82.4" y2="338.0" stroke="#dc2626" stroke-width="5" stroke-linecap="round" marker-end="url(#aRed)"/>
<text x="108.4" y="382.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#dc2626">THRUST</text>
<line x1="330.6" y1="336.1" x2="374.6" y2="336.1" stroke="#dc2626" stroke-width="5" stroke-linecap="round" marker-end="url(#aRed)"/>
<text x="350.6" y="378.1" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#dc2626">DRAG</text>
<text x="228.0" y="474.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">An object stays at rest or at</text>
<text x="228.0" y="499.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">constant velocity unless a</text>
<text x="228.0" y="524.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">net force acts on it.</text>
<text x="228.0" y="562.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#101827">Forces balanced: no change</text>
<rect x="420" y="142" width="360" height="444" rx="12" fill="#fff8e1" stroke="#f4b400" stroke-width="4"/>
<rect x="676" y="156" width="90" height="28" rx="14" fill="#f4b400"/>
<text x="721.0" y="175.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#06111f">ANSWER</text>
<text x="440.0" y="178.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#101827">2ND LAW</text>
<text x="440.0" y="206.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#b7860b">ACCELERATION</text>
<g transform="translate(600.0,338.0) rotate(0.00) scale(0.95)">
