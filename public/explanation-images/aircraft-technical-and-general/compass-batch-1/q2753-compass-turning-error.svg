<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="COMPASS TURNING ERROR">
<defs>
  <marker id="aDark" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#101827"/></marker>
  <marker id="aBlue" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 z" fill="#1e88e5"/></marker>
  <marker id="aRed" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,1 L19,10 L0,19 z" fill="#dc2626"/></marker>
  <marker id="aRedS" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0.5 L11,6 L0,11.5 z" fill="#dc2626"/></marker>
</defs>
<rect width="1200" height="680" fill="#ffffff"/>
<rect width="1200" height="112" fill="#06111f"/>
<text x="600" y="34" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3.2" fill="#f4b400">PILOTVAULT AIRCRAFT TECHNICAL &amp; GENERAL</text>
<text x="600" y="79" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#ffffff">COMPASS TURNING ERROR</text>
<rect x="0" y="108" width="1200" height="4" fill="#f4b400"/>
<rect x="28" y="130" width="1144" height="470" rx="10" fill="#ffffff" stroke="#d7e0ea" stroke-width="2"/>
<rect x="40" y="142" width="710" height="444" rx="12" fill="#fff8e1" stroke="#f4b400" stroke-width="4"/>
<text x="60.0" y="176.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#101827">CAUSED BY MAGNETIC DIP + ACCELERATION IN THE TURN</text>
<rect x="60" y="196" width="320" height="150" rx="10" fill="#fde68a" stroke="#f4b400" stroke-width="4"/>
<text x="220.0" y="232.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#101827">NORTHERN HEMISPHERE</text>
<text x="220.0" y="270.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="800" fill="#b7860b">UNOS</text>
<text x="220.0" y="300.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334155">Undershoot North</text>
<text x="220.0" y="322.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334155">Overshoot South</text>
<rect x="400" y="196" width="320" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="560.0" y="232.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#101827">SOUTHERN HEMISPHERE</text>
<text x="560.0" y="270.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="800" fill="#101827">ONUS</text>
<text x="560.0" y="300.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334155">Overshoot North</text>
<text x="560.0" y="322.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334155">Undershoot South</text>
<text x="60.0" y="386.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#101827">EXAMPLE (NH): TURN FROM 030° TO 180° BY THE SHORTEST WAY</text>
<text x="60.0" y="416.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#334155">Right turn onto south: the compass lags, so roll out</text>
<text x="60.0" y="440.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#334155">after it passes south, at about 210° indicated.</text>
<circle cx="600" cy="480" r="72" fill="#ffffff" stroke="#101827" stroke-width="3"/>
<text x="600.0" y="430.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#101827">N</text>
<text x="656.0" y="486.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#101827">E</text>
<text x="600.0" y="542.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#101827">S</text>
<text x="544.0" y="486.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#101827">W</text>
<path d="M 643.0 405.5 A 86 86 0 0 1 557.0 554.5" fill="none" stroke="#b7860b" stroke-width="4" marker-end="url(#aDark)"/>
<text x="490.0" y="570.0" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#b7860b">ROLL OUT AT ~210°</text>
<rect x="770" y="146" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="146" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="180.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">TWO CAUSES</text>
<text x="796.0" y="212.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Magnetic dip and the</text>
<text x="796.0" y="237.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">acceleration forces in the</text>
<text x="796.0" y="262.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">turn.</text>
<rect x="770" y="296" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="296" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="330.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">TURNS THROUGH N AND S</text>
<text x="796.0" y="362.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Error is greatest on</text>
<text x="796.0" y="387.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">northerly and southerly</text>
<text x="796.0" y="412.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">headings.</text>
<rect x="770" y="446" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="446" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="480.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">ALLOW FOR IT</text>
<text x="796.0" y="512.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Roll out early or late, or</text>
<text x="796.0" y="537.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">use the heading indicator.</text>
<text x="600" y="642" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#101827">Compass turning error is caused mainly by magnetic dip and acceleration forces in the turn.</text>
</svg>
