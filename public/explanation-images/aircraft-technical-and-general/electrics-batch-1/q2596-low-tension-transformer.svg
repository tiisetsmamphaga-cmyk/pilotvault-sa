</defs>
<rect width="1200" height="680" fill="#ffffff"/>
<rect width="1200" height="112" fill="#06111f"/>
<text x="600" y="34" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3.2" fill="#f4b400">PILOTVAULT AIRCRAFT TECHNICAL &amp; GENERAL</text>
<text x="600" y="79" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#ffffff">LOW-TENSION IGNITION: TRANSFORMER</text>
<rect x="0" y="108" width="1200" height="4" fill="#f4b400"/>
<rect x="28" y="130" width="1144" height="470" rx="10" fill="#ffffff" stroke="#d7e0ea" stroke-width="2"/>
<rect x="40" y="142" width="710" height="444" rx="12" fill="#fff8e1" stroke="#f4b400" stroke-width="4"/>
<rect x="70" y="300" width="130" height="110" rx="12" fill="#e2e8f0" stroke="#101827" stroke-width="3"/>
<text x="135.0" y="350.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" fill="#101827">LOW-TENSION</text>
<text x="135.0" y="368.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" fill="#101827">MAGNETO</text>
<path d="M 200.0,355.0 L 260.0,355.0 L 260.0,220.0 L 410.0,220.0" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="410" y="194" width="90" height="52" rx="8" fill="#fde68a" stroke="#f4b400" stroke-width="4"/>
<text x="455.0" y="225.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="800" fill="#101827">TRANSFORMER</text>
<path d="M 500.0,220.0 L 600.0,220.0" fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="600" y="210" width="40" height="20" rx="3" fill="#94a3b8" stroke="#101827" stroke-width="2"/>
<text x="660.0" y="225.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" fill="#101827">PLUG</text>
<path d="M 200.0,355.0 L 260.0,355.0 L 260.0,330.0 L 410.0,330.0" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="410" y="304" width="90" height="52" rx="8" fill="#fde68a" stroke="#f4b400" stroke-width="4"/>
<text x="455.0" y="335.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="800" fill="#101827">TRANSFORMER</text>
<path d="M 500.0,330.0 L 600.0,330.0" fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="600" y="320" width="40" height="20" rx="3" fill="#94a3b8" stroke="#101827" stroke-width="2"/>
<text x="660.0" y="335.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" fill="#101827">PLUG</text>
<path d="M 200.0,355.0 L 260.0,355.0 L 260.0,440.0 L 410.0,440.0" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="410" y="414" width="90" height="52" rx="8" fill="#fde68a" stroke="#f4b400" stroke-width="4"/>
<text x="455.0" y="445.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="800" fill="#101827">TRANSFORMER</text>
<path d="M 500.0,440.0 L 600.0,440.0" fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="600" y="430" width="40" height="20" rx="3" fill="#94a3b8" stroke="#101827" stroke-width="2"/>
<text x="660.0" y="445.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" fill="#101827">PLUG</text>
<text x="330.0" y="190.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#b45309">LOW VOLTAGE</text>
<text x="330.0" y="206.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" fill="#b45309">(LONG LEADS)</text>
<text x="550.0" y="190.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#1d4ed8">HIGH VOLTAGE</text>
<text x="550.0" y="206.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" fill="#1d4ed8">(SHORT LEADS)</text>
<text x="395.0" y="540.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334155">Each transformer steps the low voltage up to a high voltage close to its plug.</text>
<rect x="770" y="146" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="146" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="180.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">LOW VOLTAGE HARNESS</text>
<text x="796.0" y="212.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">The magneto sends low</text>
<text x="796.0" y="237.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">voltage along the long</text>
<text x="796.0" y="262.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">ignition leads.</text>
<rect x="770" y="296" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="296" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="330.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">TRANSFORMER AT THE PLUG</text>
<text x="796.0" y="362.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Steps it up to the high</text>
<text x="796.0" y="387.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">voltage needed for the spark.</text>
<rect x="770" y="446" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="446" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="480.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">WHY</text>
<text x="796.0" y="512.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Less risk of flash-over and</text>
<text x="796.0" y="537.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">leakage at altitude.</text>
<text x="600" y="642" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#101827">In a low-tension system a transformer steps the low voltage up to a high voltage for the plug.</text>
</svg>
