<rect width="1200" height="680" fill="#ffffff"/>
<rect width="1200" height="112" fill="#06111f"/>
<text x="600" y="34" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3.2" fill="#f4b400">PILOTVAULT AIRCRAFT TECHNICAL &amp; GENERAL</text>
<text x="600" y="79" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#ffffff">ALTERNATOR VS GENERATOR AT LOW RPM</text>
<rect x="0" y="108" width="1200" height="4" fill="#f4b400"/>
<rect x="28" y="130" width="1144" height="470" rx="10" fill="#ffffff" stroke="#d7e0ea" stroke-width="2"/>
<rect x="40" y="142" width="710" height="444" rx="12" fill="#fff8e1" stroke="#f4b400" stroke-width="4"/>
<line x1="110.0" y1="520.0" x2="670.0" y2="520.0" stroke="#101827" stroke-width="2.5" stroke-linecap="round" marker-end="url(#aDark)"/>
<line x1="110.0" y1="520.0" x2="110.0" y2="220.0" stroke="#101827" stroke-width="2.5" stroke-linecap="round" marker-end="url(#aDark)"/>
<text x="670.0" y="548.0" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#101827">ENGINE RPM</text>
<text x="88" y="370.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#101827" transform="rotate(-90 88 370.0)">ELECTRICAL OUTPUT</text>
<line x1="233.2" y1="520.0" x2="233.2" y2="220.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<text x="233.2" y="548.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" fill="#64748b">IDLE / TAXI</text>
