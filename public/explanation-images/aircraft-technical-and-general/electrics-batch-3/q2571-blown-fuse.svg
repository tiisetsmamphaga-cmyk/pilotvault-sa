<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="BLOWN FUSE">
<defs>
  <marker id="aDark" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#101827"/></marker>
  <marker id="aBlue" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 z" fill="#1e88e5"/></marker>
  <marker id="aRed" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,1 L19,10 L0,19 z" fill="#dc2626"/></marker>
  <marker id="aRedS" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0.5 L11,6 L0,11.5 z" fill="#dc2626"/></marker>
</defs>
<rect width="1200" height="680" fill="#ffffff"/>
<rect width="1200" height="112" fill="#06111f"/>
<text x="600" y="34" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3.2" fill="#f4b400">PILOTVAULT AIRCRAFT TECHNICAL &amp; GENERAL</text>
<text x="600" y="79" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#ffffff">BLOWN FUSE</text>
<rect x="0" y="108" width="1200" height="4" fill="#f4b400"/>
<rect x="28" y="130" width="1144" height="470" rx="10" fill="#ffffff" stroke="#d7e0ea" stroke-width="2"/>
<rect x="48" y="142" width="346" height="444" rx="12" fill="#fff8e1" stroke="#f4b400" stroke-width="4"/>
<text x="68.0" y="176.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#101827">FUSE</text>
<rect x="286" y="158" width="92" height="28" rx="14" fill="#f4b400"/>
<text x="332.0" y="177.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#06111f">ANSWER</text>
<rect x="141" y="226" width="160" height="50" rx="24" fill="#e0f2fe" stroke="#101827" stroke-width="3"/>
<rect x="125" y="232" width="20" height="38" rx="4" fill="#94a3b8" stroke="#101827" stroke-width="2"/>
<rect x="297" y="232" width="20" height="38" rx="4" fill="#94a3b8" stroke="#101827" stroke-width="2"/>
<path d="M 145.0,251.0 L 207.0,251.0" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 235.0,251.0 L 297.0,251.0" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="221.0" y="300.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#101827">5 A</text>
<text x="78.0" y="350.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#101827">Rated in AMPERES</text>
<text x="78.0" y="386.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#101827">Replace ONCE only</text>
<text x="78.0" y="422.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#101827">with the SAME rating</text>
<text x="78.0" y="458.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Blows again: leave it</text>
<text x="78.0" y="494.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">out - there is a fault</text>
<rect x="410" y="142" width="346" height="444" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="430.0" y="176.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#101827">CIRCUIT BREAKER</text>
<rect x="549" y="214" width="68" height="44" rx="8" fill="#1f2937" stroke="#101827" stroke-width="3"/>
<rect x="567" y="190" width="32" height="26" rx="4" fill="#e2e8f0" stroke="#101827" stroke-width="2"/>
<rect x="567" y="190" width="32" height="8" fill="#ffffff"/>
<text x="583.0" y="242.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#ffffff">5</text>
<text x="583.0" y="290.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#dc2626">POPPED OUT = TRIPPED</text>
<text x="440.0" y="350.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#101827">Allow it to COOL first</text>
<text x="440.0" y="386.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#101827">Reset ONCE only</text>
<text x="440.0" y="422.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Trips again: leave it</text>
<text x="440.0" y="458.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">out - there is a fault</text>
<text x="440.0" y="494.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Never hold it in</text>
<rect x="770" y="146" width="378" height="438" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="790.0" y="184.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#101827">WHY ONLY ONCE?</text>
<text x="790.0" y="222.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#334155">A fuse or breaker opens to</text>
<text x="790.0" y="248.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#334155">protect the wiring from</text>
<text x="790.0" y="274.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#334155">overheating.</text>
<text x="790.0" y="326.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#334155">Repeated resetting of a</text>
<text x="790.0" y="352.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#334155">genuine fault can start</text>
<text x="790.0" y="378.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#334155">an electrical fire.</text>
<text x="790.0" y="430.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#334155">Never fit a higher-rated</text>
<text x="790.0" y="456.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#334155">fuse.</text>
<text x="600" y="642" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#101827">A blown fuse may be replaced only once, with a fuse of the same value (rated in amperes).</text>
</svg>
