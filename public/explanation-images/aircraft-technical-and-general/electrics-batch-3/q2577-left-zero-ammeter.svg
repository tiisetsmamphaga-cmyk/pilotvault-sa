<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="LEFT-ZERO AMMETER (LOADMETER)">
<defs>
  <marker id="aDark" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#101827"/></marker>
  <marker id="aBlue" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 z" fill="#1e88e5"/></marker>
  <marker id="aRed" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,1 L19,10 L0,19 z" fill="#dc2626"/></marker>
  <marker id="aRedS" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0.5 L11,6 L0,11.5 z" fill="#dc2626"/></marker>
</defs>
<rect width="1200" height="680" fill="#ffffff"/>
<rect width="1200" height="112" fill="#06111f"/>
<text x="600" y="34" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3.2" fill="#f4b400">PILOTVAULT AIRCRAFT TECHNICAL &amp; GENERAL</text>
<text x="600" y="79" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#ffffff">LEFT-ZERO AMMETER (LOADMETER)</text>
<rect x="0" y="108" width="1200" height="4" fill="#f4b400"/>
<rect x="28" y="130" width="1144" height="470" rx="10" fill="#ffffff" stroke="#d7e0ea" stroke-width="2"/>
<rect x="45" y="142" width="290" height="444" rx="12" fill="#fff8e1" stroke="#f4b400" stroke-width="4"/>
<rect x="234" y="156" width="92" height="28" rx="14" fill="#f4b400"/>
<text x="280.0" y="175.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#06111f">ANSWER</text>
<rect x="70" y="200" width="240" height="170" rx="14" fill="#1f2937" stroke="#101827" stroke-width="3"/>
<path d="M 117.3 298.0 A 84 84 0 0 1 262.7 298.0" fill="none" stroke="#e2e8f0" stroke-width="3"/>
<line x1="124.2" y1="302.0" x2="112.1" y2="295.0" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
<text x="139.8" y="316.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#e2e8f0">0</text>
<line x1="190.0" y1="264.0" x2="190.0" y2="250.0" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
<text x="190.0" y="287.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#e2e8f0">30</text>
<line x1="255.8" y1="302.0" x2="267.9" y2="295.0" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
<text x="240.2" y="316.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#e2e8f0">60</text>
<line x1="190.0" y1="340.0" x2="173.8" y2="263.7" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
<circle cx="190" cy="340" r="6" fill="#f8fafc"/>
<text x="190.0" y="358.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#e2e8f0">LOAD</text>
<text x="190.0" y="430.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#b7860b">ALTERNATOR OUTPUT ONLY</text>
<rect x="375" y="142" width="290" height="444" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="400" y="200" width="240" height="170" rx="14" fill="#1f2937" stroke="#101827" stroke-width="3"/>
<path d="M 447.3 298.0 A 84 84 0 0 1 592.7 298.0" fill="none" stroke="#e2e8f0" stroke-width="3"/>
<line x1="454.2" y1="302.0" x2="442.1" y2="295.0" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
<text x="469.8" y="316.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#e2e8f0">−</text>
<line x1="520.0" y1="264.0" x2="520.0" y2="250.0" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
<text x="520.0" y="287.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#e2e8f0">0</text>
<line x1="585.8" y1="302.0" x2="597.9" y2="295.0" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
<text x="570.2" y="316.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#e2e8f0">+</text>
<line x1="520.0" y1="340.0" x2="549.2" y2="267.7" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
<circle cx="520" cy="340" r="6" fill="#f8fafc"/>
<text x="520.0" y="358.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#e2e8f0">AMPS</text>
<text x="520.0" y="430.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#101827">BATTERY CHARGE / DISCHARGE</text>
<text x="190.0" y="470.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334155">Needle only moves right of</text>
<text x="190.0" y="490.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334155">zero: shows the load taken</text>
<text x="190.0" y="510.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334155">from the alternator.</text>
<text x="520.0" y="470.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#15803d">RIGHT of centre (+): charging</text>
<text x="520.0" y="494.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#dc2626">LEFT of centre (−): battery</text>
<text x="520.0" y="512.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#dc2626">discharging</text>
<rect x="770" y="146" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="146" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="180.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">LEFT-ZERO</text>
<text x="796.0" y="212.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Reads alternator/generator</text>
<text x="796.0" y="237.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">output only (a loadmeter).</text>
<rect x="770" y="296" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="296" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="330.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">CENTRE-ZERO</text>
<text x="796.0" y="362.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">In the battery circuit: shows</text>
<text x="796.0" y="387.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">charge (+) or discharge (−).</text>
<rect x="770" y="446" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="446" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="480.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">IN FLIGHT</text>
<text x="796.0" y="512.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Normal: small charge after</text>
<text x="796.0" y="537.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">start, settling near zero.</text>
<text x="600" y="642" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#101827">A left-zero ammeter shows the alternator or generator output current only.</text>
</svg>
