<rect x="420" y="220" width="110" height="64" rx="8" fill="#ffffff" stroke="#f4b400" stroke-width="5"/>
<text x="475.0" y="257.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#101827">SOLENOID</text>
