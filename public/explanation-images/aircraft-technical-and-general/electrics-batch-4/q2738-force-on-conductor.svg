<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="FORCE ON A CURRENT-CARRYING CONDUCTOR">
<defs>
  <marker id="aDark" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#101827"/></marker>
  <marker id="aBlue" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 z" fill="#1e88e5"/></marker>
  <marker id="aRed" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,1 L19,10 L0,19 z" fill="#dc2626"/></marker>
  <marker id="aRedS" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0.5 L11,6 L0,11.5 z" fill="#dc2626"/></marker>
</defs>
<rect width="1200" height="680" fill="#ffffff"/>
<rect width="1200" height="112" fill="#06111f"/>
<text x="600" y="34" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3.2" fill="#f4b400">PILOTVAULT AIRCRAFT TECHNICAL &amp; GENERAL</text>
<text x="600" y="79" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#ffffff">FORCE ON A CURRENT-CARRYING CONDUCTOR</text>
<rect x="0" y="108" width="1200" height="4" fill="#f4b400"/>
<rect x="28" y="130" width="1144" height="470" rx="10" fill="#ffffff" stroke="#d7e0ea" stroke-width="2"/>
<rect x="40" y="142" width="710" height="444" rx="12" fill="#fff8e1" stroke="#f4b400" stroke-width="4"/>
<rect x="100" y="230" width="90" height="220" rx="8" fill="#ef4444" stroke="#101827" stroke-width="3"/>
<rect x="520" y="230" width="90" height="220" rx="8" fill="#3b82f6" stroke="#101827" stroke-width="3"/>
<text x="145.0" y="348.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#ffffff">N</text>
<text x="565.0" y="348.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" fill="#ffffff">S</text>
<line x1="200.0" y1="260.0" x2="510.0" y2="260.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#aDark)"/>
<line x1="200.0" y1="300.0" x2="510.0" y2="300.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#aDark)"/>
<line x1="200.0" y1="340.0" x2="510.0" y2="340.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#aDark)"/>
<line x1="200.0" y1="380.0" x2="510.0" y2="380.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#aDark)"/>
<line x1="200.0" y1="420.0" x2="510.0" y2="420.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#aDark)"/>
<text x="355.0" y="222.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#64748b">MAGNETIC FIELD (N TO S)</text>
<circle cx="355" cy="340" r="30" fill="#fde68a" stroke="#101827" stroke-width="3"/>
<circle cx="355" cy="340" r="8" fill="#101827"/>
<text x="355.0" y="400.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" fill="#101827">CURRENT OUT OF THE PAGE</text>
<line x1="355.0" y1="306.0" x2="355.0" y2="196.0" stroke="#dc2626" stroke-width="7" stroke-linecap="round" marker-end="url(#aRed)"/>
<text x="372.0" y="200.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#dc2626">FORCE</text>
<text x="355.0" y="520.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334155">The conductor is pushed at right angles to both the field and the current.</text>
<text x="355.0" y="544.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334155">(Fleming's left-hand rule)</text>
<rect x="770" y="146" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="146" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="180.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">FORCE ON THE CONDUCTOR</text>
<text x="796.0" y="212.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">A current across a magnetic</text>
<text x="796.0" y="237.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">field experiences a force.</text>
<rect x="770" y="296" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="296" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="330.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">DIRECTION</text>
<text x="796.0" y="362.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">At right angles to both the</text>
<text x="796.0" y="387.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">field and the current.</text>
<rect x="770" y="446" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="446" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="480.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">MOTOR PRINCIPLE</text>
<text x="796.0" y="512.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">This force is what turns an</text>
<text x="796.0" y="537.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">electric (starter) motor.</text>
<text x="600" y="642" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#101827">Current through a conductor at right angles to a magnetic field produces a force on it.</text>
</svg>
