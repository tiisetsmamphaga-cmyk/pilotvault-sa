<path d="M 344,424 L 416,424 L 398,466 L 362,466 Z" fill="#7dd3fc"/>
<circle cx="362" cy="440" r="4" fill="#78350f"/>
<circle cx="380" cy="440" r="4" fill="#78350f"/>
<circle cx="398" cy="440" r="4" fill="#78350f"/>
<circle cx="362" cy="454" r="4" fill="#78350f"/>
<circle cx="380" cy="454" r="4" fill="#78350f"/>
<circle cx="398" cy="454" r="4" fill="#78350f"/>
<text x="120.0" y="500.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#78350f">WATER AND SEDIMENT</text>
<text x="120.0" y="518.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#78350f">SETTLE IN THE SUMP</text>
<line x1="270.0" y1="496.0" x2="352.0" y2="454.0" stroke="#78350f" stroke-width="2" stroke-linecap="round" marker-end="url(#aDark)"/>
<path d="M 560.0,470.0 L 560.0,380.0" fill="none" stroke="#101827" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 560.0,470.0 L 560.0,380.0" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="560.0" y1="470.0" x2="560.0" y2="540.0" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
<text x="576.0" y="540.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#101827">TO THE ENGINE</text>
<text x="652.0" y="364.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#b7860b">OUTLET</text>
<text x="652.0" y="380.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#b7860b">ABOVE THE</text>
<text x="652.0" y="396.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#b7860b">SUMP</text>
<line x1="648.0" y1="378.0" x2="566.0" y2="382.0" stroke="#b7860b" stroke-width="2" stroke-linecap="round" marker-end="url(#aDark)"/>
<line x1="380.0" y1="470.0" x2="380.0" y2="520.0" stroke="#101827" stroke-width="5" stroke-linecap="round"/>
<rect x="366" y="520" width="28" height="18" rx="3" fill="#94a3b8" stroke="#101827" stroke-width="2"/>
<text x="360.0" y="560.0" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#101827">DRAIN VALVE</text>
<rect x="770" y="146" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="146" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="180.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">OUTLET RAISED</text>
<text x="796.0" y="212.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Fuel is drawn from above</text>
<text x="796.0" y="237.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">the lowest point of the</text>
<text x="796.0" y="262.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">tank.</text>
<rect x="770" y="296" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="296" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="330.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">SUMP COLLECTS</text>
<text x="796.0" y="362.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Heavier water and dirt settle</text>
<text x="796.0" y="387.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">at the bottom, below the</text>
<text x="796.0" y="412.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">outlet.</text>
<rect x="770" y="446" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="446" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="480.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">DRAIN BEFORE FLIGHT</text>
<text x="796.0" y="512.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Take a sample from the</text>
<text x="796.0" y="537.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">drain to check for water.</text>
<text x="600" y="642" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#101827">The fuel outlet is above the sump so water and impurities settle below it and can be drained.</text>
</svg>
