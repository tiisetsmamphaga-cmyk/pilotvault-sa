<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1e88e5"/></marker>
  <marker id="arrowDark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0f172a"/></marker>
  <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-opacity="0.08"/></filter>
</defs>
<rect width="1200" height="900" fill="white"/>
<rect x="0" y="0" width="1200" height="145" fill="#071525"/>
<rect x="0" y="141" width="1200" height="4" fill="#f4b400"/>
<text x="600" y="48" text-anchor="middle" fill="#f4b400" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="3">PILOTVAULT AIRCRAFT TECHNICAL &amp; GENERAL</text>
<text x="600" y="105" text-anchor="middle" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="800">FLOAT-TYPE CARBURETTOR</text>

<rect x="45" y="175" width="1110" height="645" rx="18" fill="#fff" stroke="#d8e0e8" stroke-width="2" filter="url(#shadow)"/>
<rect x="155" y="385" width="420" height="255" rx="30" fill="#fff" stroke="#0f172a" stroke-width="8"/>
<path d="M158 505 Q210 490 260 505 T360 505 T460 505 T572 505 L572 636 L158 636 Z" fill="#d7ebff"/>
<text x="365" y="610" text-anchor="middle" fill="#475569" font-family="Arial" font-size="24" font-weight="700">FLOAT CHAMBER</text>
<path d="M75 455 H154" stroke="#1e88e5" stroke-width="12" marker-end="url(#arrow)"/>
<text x="88" y="428" fill="#0f172a" font-family="Arial" font-size="22" font-weight="700">FUEL INLET</text>
<rect x="150" y="438" width="52" height="38" rx="5" fill="#e2e8f0" stroke="#0f172a" stroke-width="5"/>
<path d="M205 458 L252 438 L252 478 Z" fill="#f4b400" stroke="#0f172a" stroke-width="5"/>
<text x="250" y="402" fill="#0f172a" font-family="Arial" font-size="22" font-weight="700">NEEDLE VALVE</text>
<path d="M262 409 L238 438" stroke="#0f172a" stroke-width="3" marker-end="url(#arrowDark)"/>
<ellipse cx="355" cy="535" rx="92" ry="43" fill="#ffffff" stroke="#0f172a" stroke-width="7"/>
<text x="355" y="545" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="25" font-weight="800">FLOAT</text>
<path d="M268 536 L250 458" stroke="#0f172a" stroke-width="7"/>
<circle cx="268" cy="536" r="8" fill="#0f172a"/>
<text x="250" y="690" fill="#475569" font-family="Arial" font-size="20">As fuel level rises, the float lifts and the needle closes the inlet.</text>
<path d="M720 245 L720 390 Q720 455 785 500 Q720 545 720 610 L720 705" fill="none" stroke="#0f172a" stroke-width="10"/>
<path d="M940 245 L940 390 Q940 455 875 500 Q940 545 940 610 L940 705" fill="none" stroke="#0f172a" stroke-width="10"/>
<path d="M830 220 V400" stroke="#1e88e5" stroke-width="7" marker-end="url(#arrow)"/>
<text x="830" y="205" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="23" font-weight="700">AIRFLOW</text>
<text x="980" y="505" fill="#0f172a" font-family="Arial" font-size="23" font-weight="700">VENTURI</text>
<path d="M950 495 H880" stroke="#0f172a" stroke-width="3" marker-end="url(#arrowDark)"/>
<path d="M575 555 H690 V520 H815" fill="none" stroke="#1e88e5" stroke-width="10" marker-end="url(#arrow)"/>
<rect x="810" y="465" width="26" height="86" rx="6" fill="white" stroke="#0f172a" stroke-width="6"/>
<path d="M823 465 V410" stroke="#1e88e5" stroke-width="7" marker-end="url(#arrow)"/>
<text x="885" y="390" fill="#0f172a" font-family="Arial" font-size="21" font-weight="700">MAIN DISCHARGE NOZZLE</text>
<path d="M900 398 L835 430" stroke="#0f172a" stroke-width="3" marker-end="url(#arrowDark)"/>
<rect x="120" y="735" width="960" height="58" rx="12" fill="#fff8dc" stroke="#f4b400" stroke-width="2"/>
<text x="600" y="772" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="24" font-weight="700">Fuel entering the carburettor is controlled by the FLOAT + NEEDLE VALVE.</text>
</svg>