<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1e88e5"/></marker><marker id="arrowDark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0f172a"/></marker><marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-opacity="0.08"/></filter></defs><rect width="1200" height="900" fill="white"/><rect x="0" y="0" width="1200" height="145" fill="#071525"/><rect x="0" y="141" width="1200" height="4" fill="#f4b400"/><text x="600" y="48" text-anchor="middle" fill="#f4b400" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="3">PILOTVAULT AIRCRAFT TECHNICAL &amp; GENERAL</text><text x="600" y="105" text-anchor="middle" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="800">BLOCKED FUEL TANK VENT</text><rect x="45" y="175" width="1110" height="645" rx="18" fill="white" stroke="#d8e0e8" stroke-width="2" filter="url(#shadow)"/><text x="600" y="220" text-anchor="middle" fill="#475569" font-family="Arial" font-size="22">A blocked vent prevents replacement air entering as fuel is consumed.</text><rect x="180" y="300" width="430" height="360" rx="45" fill="white" stroke="#0f172a" stroke-width="8"/><path d="M184 510 Q245 490 305 510 T425 510 T545 510 T606 510 L606 655 H184 Z" fill="#72b7ee"/><path d="M390 300 V240 H455" fill="none" stroke="#0f172a" stroke-width="8"/><line x1="430" y1="220" x2="475" y2="265" stroke="#dc2626" stroke-width="11"/><line x1="475" y1="220" x2="430" y2="265" stroke="#dc2626" stroke-width="11"/><text x="500" y="250" fill="#dc2626" font-family="Arial" font-size="24" font-weight="800">BLOCKED VENT</text><g stroke="#dc2626" stroke-width="6" marker-end="url(#arrowRed)"><path d="M285 360 V430"/><path d="M395 350 V430"/><path d="M505 360 V430"/></g><text x="395" y="470" text-anchor="middle" fill="#dc2626" font-family="Arial" font-size="27" font-weight="800">VACUUM BUILDS</text><path d="M395 660 V725 H800" fill="none" stroke="#0f172a" stroke-width="10"/><path d="M470 725 H660" stroke="#1e88e5" stroke-width="8" stroke-dasharray="18 14"/><path d="M660 725 H800" stroke="#dc2626" stroke-width="8" stroke-dasharray="10 14"/><text x="645" y="690" text-anchor="middle" fill="#dc2626" font-family="Arial" font-size="22" font-weight="800">FLOW REDUCES → STOPS</text><text x="815" y="735" fill="#0f172a" font-family="Arial" font-size="22" font-weight="800">TO ENGINE</text><rect x="690" y="315" width="330" height="250" rx="20" fill="#fff8dc" stroke="#f4b400" stroke-width="3"/><text x="855" y="360" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="25" font-weight="800">WHY IT HAPPENS AFTER TIME</text><text x="725" y="405" fill="#0f172a" font-family="Arial" font-size="22">1. Engine consumes fuel</text><text x="725" y="448" fill="#0f172a" font-family="Arial" font-size="22">2. Air cannot replace it</text><text x="725" y="491" fill="#0f172a" font-family="Arial" font-size="22">3. Tank pressure falls</text><text x="725" y="534" fill="#0f172a" font-family="Arial" font-size="22">4. Fuel flow stops</text><text x="600" y="790" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="24" font-weight="700">Selecting another properly vented tank restores fuel flow immediately.</text></svg>