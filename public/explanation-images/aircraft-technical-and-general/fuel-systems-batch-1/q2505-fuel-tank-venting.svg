="#1e88e5" stroke-width="6" marker-end="url(#arrow)"><path d="M325 250 V325"/><path d="M280 265 L315 295"/><path d="M370 265 L335 295"/></g><text x="105" y="292" fill="#0f172a" font-family="Arial" font-size="20" font-weight="700">ATMOSPHERIC AIR</text><path d="M225 300 H305" stroke="#0f172a" stroke-width="3" marker-end="url(#arrowDark)"/><path d="M325 650 V730 H500" fill="none" stroke="#0f172a" stroke-width="9"/><path d="M355 730 H500" stroke="#1e88e5" stroke-width="7" marker-end="url(#arrow)"/><text x="385" y="770" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="20" font-weight="700">FUEL FLOWS TO ENGINE</text><rect x="705" y="350" width="340" height="300" rx="40" fill="#fff5f5" stroke="#0f172a" stroke-width="8"/><path d="M709 520 Q760 500 810 520 T910 520 T1041 520 L1041 646 H709 Z" fill="#72b7ee"/><path d="M875 350 V290 H930" fill="none" stroke="#0f172a" stroke-width="8"/><line x1="850" y1="255" x2="900" y2="305" stroke="#dc2626" stroke-width="10"/><line x1="900" y1="255" x2="850" y2="305" stroke="#dc2626" stroke-width="10"/><g stroke="#dc2626" stroke-width="6" marker-end="url(#arrowRed)"><path d="M790 400 V470"/><path d="M875 390 V470"/><path d="M960 400 V470"/></g><text x="875" y="485" text-anchor="middle" fill="#dc2626" font-family="Arial" font-size="25" font-weight="800">VACUUM FORMS</text><path d="M875 650 V730 H1045" fill="none" stroke="#0f172a" stroke-width="9"/><path d="M925 730 H1045" stroke="#dc2626" stroke-width="7" stroke-dasharray="14 12" marker-end="url(#arrowRed)"/><text x="930" y="770" text-anchor="middle" fill="#dc2626" font-family="Arial" font-size="20" font-weight="800">FUEL FLOW REDUCES / STOPS</text><rect x="170" y="795" width="860" height="55" rx="12" fill="#fff8dc" stroke="#f4b400" stroke-width="2"/><text x="600" y="830" text-anchor="middle" fill="#0f172a" font-family="Arial" font-size="23" font-weight="700">The vent replaces consumed fuel volume with air and keeps tank pressure near atmospheric.</text></svg>