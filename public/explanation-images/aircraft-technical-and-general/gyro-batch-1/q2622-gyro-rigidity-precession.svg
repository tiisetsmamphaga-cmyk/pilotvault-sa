<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="GYROSCOPIC RIGIDITY AND PRECESSION">
<defs>
  <marker id="aDark" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#101827"/></marker>
  <marker id="aBlue" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 z" fill="#1e88e5"/></marker>
  <marker id="aRed" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,1 L19,10 L0,19 z" fill="#dc2626"/></marker>
  <marker id="aRedS" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0.5 L11,6 L0,11.5 z" fill="#dc2626"/></marker>
</defs>
<rect width="1200" height="680" fill="#ffffff"/>
<rect width="1200" height="112" fill="#06111f"/>
<text x="600" y="34" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3.2" fill="#f4b400">PILOTVAULT AIRCRAFT TECHNICAL &amp; GENERAL</text>
<text x="600" y="79" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#ffffff">GYROSCOPIC RIGIDITY AND PRECESSION</text>
<rect x="0" y="108" width="1200" height="4" fill="#f4b400"/>
<rect x="28" y="130" width="1144" height="470" rx="10" fill="#ffffff" stroke="#d7e0ea" stroke-width="2"/>
<rect x="48" y="142" width="346" height="444" rx="12" fill="#fff8e1" stroke="#f4b400" stroke-width="4"/>
<text x="68.0" y="176.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#101827">RIGIDITY</text>
<ellipse cx="221" cy="320" rx="70" ry="25.2" fill="#94a3b8" stroke="#101827" stroke-width="3"/>
<line x1="221.0" y1="257.0" x2="221.0" y2="383.0" stroke="#101827" stroke-width="4" stroke-linecap="round"/>
<path d="M 259.5,287.8 A 49.0 14.0 0 0 1 182.5,287.8" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#aRedS)"/>
<line x1="221.0" y1="256.0" x2="221.0" y2="200.0" stroke="#b7860b" stroke-width="5" stroke-linecap="round" marker-end="url(#aDark)"/>
<text x="221.0" y="480.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#101827">A spinning gyro resists</text>
<text x="221.0" y="502.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#101827">any change to the</text>
<text x="221.0" y="524.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#101827">direction of its spin axis</text>
<rect x="410" y="142" width="346" height="444" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="430.0" y="176.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#101827">PRECESSION</text>
<ellipse cx="583" cy="320" rx="70" ry="25.2" fill="#94a3b8" stroke="#101827" stroke-width="3"/>
<line x1="583.0" y1="257.0" x2="583.0" y2="383.0" stroke="#101827" stroke-width="4" stroke-linecap="round"/>
<path d="M 621.5,287.8 A 49.0 14.0 0 0 1 544.5,287.8" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#aRedS)"/>
<line x1="673.0" y1="300.0" x2="673.0" y2="350.0" stroke="#dc2626" stroke-width="4" stroke-linecap="round" marker-end="url(#aRedS)"/>
<text x="679.0" y="290.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" fill="#dc2626">FORCE</text>
<path d="M 543,224 A 60 30 0 0 1 623,224" fill="none" stroke="#b7860b" stroke-width="4" marker-end="url(#aDark)"/>
<text x="583.0" y="480.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#101827">A force on the rim acts</text>
<text x="583.0" y="502.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#101827">90° later in the direction</text>
<text x="583.0" y="524.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#101827">of rotation</text>
<rect x="770" y="146" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="146" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="180.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">TWO PROPERTIES</text>
<text x="796.0" y="212.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Every spinning gyroscope has</text>
<text x="796.0" y="237.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">rigidity and precession.</text>
<rect x="770" y="296" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="296" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="330.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">RIGIDITY</text>
<text x="796.0" y="362.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Reluctance to turn away from</text>
<text x="796.0" y="387.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">its spin axis: used for</text>
<text x="796.0" y="412.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">attitude and heading.</text>
<rect x="770" y="446" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="446" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="480.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">PRECESSION</text>
<text x="796.0" y="512.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Used in the turn indicator;</text>
<text x="796.0" y="537.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">also the cause of wander.</text>
<text x="600" y="642" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#101827">Rigidity: a spinning gyro's reluctance to move from its spin axis. It also has precession.</text>
</svg>
