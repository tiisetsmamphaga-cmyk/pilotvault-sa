<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="WHAT INCREASES GYRO RIGIDITY">
<defs>
  <marker id="aDark" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#101827"/></marker>
  <marker id="aBlue" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 z" fill="#1e88e5"/></marker>
  <marker id="aRed" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,1 L19,10 L0,19 z" fill="#dc2626"/></marker>
  <marker id="aRedS" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0.5 L11,6 L0,11.5 z" fill="#dc2626"/></marker>
</defs>
<rect width="1200" height="680" fill="#ffffff"/>
<rect width="1200" height="112" fill="#06111f"/>
<text x="600" y="34" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3.2" fill="#f4b400">PILOTVAULT AIRCRAFT TECHNICAL &amp; GENERAL</text>
<text x="600" y="79" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#ffffff">WHAT INCREASES GYRO RIGIDITY</text>
<rect x="0" y="108" width="1200" height="4" fill="#f4b400"/>
<rect x="28" y="130" width="1144" height="470" rx="10" fill="#ffffff" stroke="#d7e0ea" stroke-width="2"/>
<rect x="40" y="142" width="710" height="444" rx="12" fill="#fff8e1" stroke="#f4b400" stroke-width="4"/>
<text x="220.0" y="186.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#101827">LIGHT, SLOW ROTOR</text>
<ellipse cx="220" cy="320" rx="50" ry="18.0" fill="#cbd5e1" stroke="#101827" stroke-width="3"/>
<line x1="220.0" y1="275.0" x2="220.0" y2="365.0" stroke="#101827" stroke-width="4" stroke-linecap="round"/>
<path d="M 247.5,297.0 A 35.0 10.0 0 0 1 192.5,297.0" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#aRedS)"/>
<text x="220.0" y="450.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#dc2626">LOW RIGIDITY</text>
<text x="570.0" y="186.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#101827">HEAVY, FAST ROTOR</text>
<ellipse cx="570" cy="320" rx="80" ry="28.8" fill="#64748b" stroke="#101827" stroke-width="3"/>
<line x1="570.0" y1="248.0" x2="570.0" y2="392.0" stroke="#101827" stroke-width="4" stroke-linecap="round"/>
<path d="M 614.0,283.2 A 56.0 16.0 0 0 1 526.0,283.2" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#aRedS)"/>
<text x="570.0" y="450.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#15803d">HIGH RIGIDITY</text>
<text x="395.0" y="510.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#b7860b">Rigidity ∝ moment of inertia × angular speed</text>
<text x="395.0" y="540.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334155">(mass, and how far it is from the axis)  ×  (RPM)</text>
<rect x="770" y="146" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="146" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="180.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">MORE MASS</text>
<text x="796.0" y="212.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">A heavier rotor, with mass</text>
<text x="796.0" y="237.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">near the rim, increases the</text>
<text x="796.0" y="262.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">moment of inertia.</text>
<rect x="770" y="296" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="296" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="330.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">MORE SPEED</text>
<text x="796.0" y="362.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">A faster spinning rotor</text>
<text x="796.0" y="387.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">increases rigidity.</text>
<rect x="770" y="446" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="446" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="480.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">RESULT</text>
<text x="796.0" y="512.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Increase mass and speed:</text>
<text x="796.0" y="537.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">rigidity increases.</text>
<text x="600" y="642" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#101827">Gyro rigidity is proportional to the rotor's moment of inertia and angular speed.</text>
</svg>
