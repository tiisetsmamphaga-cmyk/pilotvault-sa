<text x="450.0" y="564.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#b7860b">floats or skis</text>
<line x1="440.0" y1="540.0" x2="424.0" y2="540.0" stroke="#b7860b" stroke-width="3" stroke-linecap="round"/>
