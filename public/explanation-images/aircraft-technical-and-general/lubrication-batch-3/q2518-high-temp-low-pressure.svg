<text x="395.0" y="500.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#b7860b">A LOW OIL SUPPLY</text>
<text x="395.0" y="540.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#334155">Less oil to carry the heat away, and the pump</text>
<text x="395.0" y="562.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#334155">starts to draw air so pressure cannot be held.</text>
