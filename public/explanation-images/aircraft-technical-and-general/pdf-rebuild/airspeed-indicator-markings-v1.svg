<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="AIRSPEED INDICATOR MARKINGS"><rect width="1200" height="680" fill="#fff"/><rect width="1200" height="112" fill="#06111f"/><text x="600" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3.4" fill="#f4b400">PILOTVAULT AIRCRAFT TECHNICAL &amp; GENERAL</text><text x="600" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="800" fill="#fff">AIRSPEED INDICATOR MARKINGS</text><rect x="54" y="140" width="1092" height="460" rx="10" fill="#fff" stroke="#d7e0ea" stroke-width="2"/><g font-family="Arial,sans-serif"><circle cx="430" cy="370" r="205" fill="#f8fafc" stroke="#06111f" stroke-width="8"/><path d="M300 500A165 165 0 0 1 280 270" fill="none" stroke="#e5e7eb" stroke-width="26"/><path d="M300 500A165 165 0 0 1 250 340" fill="none" stroke="#fff" stroke-width="17"/><path d="M250 340A165 165 0 0 1 430 205" fill="none" stroke="#16a34a" stroke-width="17"/><path d="M430 205A165 165 0 0 1 575 310" fill="none" stroke="#eab308" stroke-width="17"/><line x1="570" y1="300" x2="585" y2="285" stroke="#dc2626" stroke-width="12"/><line x1="430" y1="370" x2="525" y2="290" stroke="#06111f" stroke-width="8"/><circle cx="430" cy="370" r="13" fill="#06111f"/><g font-size="18" font-weight="800"><text x="760" y="245" fill="#16a34a">GREEN ARC — NORMAL OPERATING RANGE</text><text x="760" y="305" fill="#64748b">WHITE ARC — FLAP OPERATING RANGE</text><text x="760" y="365" fill="#b58900">YELLOW ARC — CAUTION RANGE</text><text x="760" y="425" fill="#dc2626">RED LINE — VNE / NEVER EXCEED</text></g></g><text x="600" y="646" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#64748b">Standard ASI colour markings show flap, normal, caution and never-exceed ranges.</text></svg>