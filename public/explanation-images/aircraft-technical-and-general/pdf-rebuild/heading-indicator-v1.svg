<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="HEADING INDICATOR"><rect width="1200" height="680" fill="#fff"/><rect width="1200" height="112" fill="#06111f"/><text x="600" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3.4" fill="#f4b400">PILOTVAULT AIRCRAFT TECHNICAL &amp; GENERAL</text><text x="600" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="800" fill="#fff">HEADING INDICATOR</text><rect x="54" y="140" width="1092" height="460" rx="10" fill="#fff" stroke="#d7e0ea" stroke-width="2"/><g font-family="Arial,sans-serif"><circle cx="420" cy="370" r="205" fill="#f8fafc" stroke="#06111f" stroke-width="8"/><g fill="#06111f" font-size="32" font-weight="800" text-anchor="middle"><text x="420" y="215">N</text><text x="575" y="382">E</text><text x="420" y="540">S</text><text x="260" y="382">W</text></g><polygon points="420,330 400,395 440,395" fill="#f4b400"/><line x1="420" y1="195" x2="420" y2="240" stroke="#06111f" stroke-width="5"/><rect x="730" y="240" width="300" height="280" rx="18" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><circle cx="880" cy="355" r="82" fill="#fff" stroke="#06111f" stroke-width="5"/><line x1="800" y1="355" x2="960" y2="355" stroke="#f4b400" stroke-width="8"/><line x1="880" y1="275" x2="880" y2="435" stroke="#06111f" stroke-width="4"/><text x="880" y="480" text-anchor="middle" font-size="17" font-weight="800" fill="#06111f">HORIZONTAL-AXIS GYRO</text><text x="880" y="555" text-anchor="middle" font-size="16" fill="#64748b">periodically realign with magnetic compass</text></g><text x="600" y="646" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#64748b">The heading indicator uses gyroscopic rigidity; friction and Earth rotation cause drift/wander.</text></svg>