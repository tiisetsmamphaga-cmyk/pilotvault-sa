<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="MAGNETIC COMPASS"><rect width="1200" height="680" fill="#fff"/><rect width="1200" height="112" fill="#06111f"/><text x="600" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3.4" fill="#f4b400">PILOTVAULT AIRCRAFT TECHNICAL &amp; GENERAL</text><text x="600" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="800" fill="#fff">MAGNETIC COMPASS</text><rect x="54" y="140" width="1092" height="460" rx="10" fill="#fff" stroke="#d7e0ea" stroke-width="2"/><g font-family="Arial,sans-serif"><circle cx="410" cy="365" r="205" fill="#f8fafc" stroke="#06111f" stroke-width="8"/><g fill="#06111f" font-size="30" font-weight="800" text-anchor="middle"><text x="410" y="210">N</text><text x="565" y="378">E</text><text x="410" y="535">S</text><text x="255" y="378">W</text></g><line x1="410" y1="245" x2="410" y2="485" stroke="#f4b400" stroke-width="12"/><circle cx="410" cy="365" r="17" fill="#06111f"/><polygon points="410,235 390,275 430,275" fill="#f4b400"/><rect x="720" y="220" width="330" height="310" rx="18" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><rect x="790" y="315" width="190" height="35" rx="18" fill="#dbe4ee" stroke="#06111f" stroke-width="4"/><rect x="790" y="380" width="190" height="35" rx="18" fill="#dbe4ee" stroke="#06111f" stroke-width="4"/><line x1="885" y1="270" x2="885" y2="455" stroke="#06111f" stroke-width="5"/><circle cx="885" cy="365" r="12" fill="#f4b400"/><text x="885" y="490" text-anchor="middle" font-size="17" font-weight="800" fill="#06111f">MAGNETS BELOW HIGH PIVOT</text><text x="885" y="565" text-anchor="middle" font-size="16" fill="#64748b">reduces magnetic-dip effects</text></g><text x="600" y="646" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#64748b">The magnetic compass is direction-seeking; deviation and magnetic dip cause characteristic errors.</text></svg>