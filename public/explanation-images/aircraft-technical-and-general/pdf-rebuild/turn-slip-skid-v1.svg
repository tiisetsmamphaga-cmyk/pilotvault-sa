<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="TURN / SLIP / SKID"><rect width="1200" height="680" fill="#fff"/><rect width="1200" height="112" fill="#06111f"/><text x="600" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3.4" fill="#f4b400">PILOTVAULT AIRCRAFT TECHNICAL &amp; GENERAL</text><text x="600" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="800" fill="#fff">TURN / SLIP / SKID</text><rect x="54" y="140" width="1092" height="460" rx="10" fill="#fff" stroke="#d7e0ea" stroke-width="2"/><g font-family="Arial,sans-serif"><g><text x="250" y="215" text-anchor="middle" font-size="20" font-weight="800" fill="#06111f">BALANCED</text><path d="M120 390Q250 460 380 390" fill="none" stroke="#06111f" stroke-width="8"/><circle cx="250" cy="427" r="22" fill="#f4b400"/></g><g><text x="600" y="215" text-anchor="middle" font-size="20" font-weight="800" fill="#06111f">SLIP</text><path d="M470 390Q600 460 730 390" fill="none" stroke="#06111f" stroke-width="8"/><circle cx="540" cy="415" r="22" fill="#f4b400"/><text x="600" y="490" text-anchor="middle" font-size="16" fill="#64748b">ball to inside of turn</text></g><g><text x="950" y="215" text-anchor="middle" font-size="20" font-weight="800" fill="#06111f">SKID</text><path d="M820 390Q950 460 1080 390" fill="none" stroke="#06111f" stroke-width="8"/><circle cx="1030" cy="415" r="22" fill="#f4b400"/><text x="950" y="490" text-anchor="middle" font-size="16" fill="#64748b">ball to outside of turn</text></g><text x="600" y="555" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">STEP ON THE BALL TO RESTORE COORDINATION</text></g><text x="600" y="646" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#64748b">The inclinometer ball indicates whether a turn is balanced, slipping or skidding.</text></svg>