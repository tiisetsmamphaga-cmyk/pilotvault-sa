<text x="60.0" y="176.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#101827">ICE IN THE VENTURI</text>
<path d="M 155,560 L 155,420 Q 155,380 179,370 Q 155,360 155,320 L 155,210" fill="none" stroke="#101827" stroke-width="5"/>
