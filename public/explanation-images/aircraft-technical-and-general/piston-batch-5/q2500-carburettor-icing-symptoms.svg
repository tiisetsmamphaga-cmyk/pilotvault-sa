<path d="M 185,386 l 14,-8 l 12,10 l -6,14 l -16,2 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
<path d="M 237,380 l 14,-8 l 12,10 l -6,14 l -16,2 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
<line x1="167.0" y1="262.0" x2="263.0" y2="242.0" stroke="#101827" stroke-width="6" stroke-linecap="round"/>
<path d="M 175,250 l 12,-8 l 10,8 l -4,12 l -14,2 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
<path d="M 245,236 l 12,-8 l 10,8 l -4,12 l -14,2 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
<line x1="215.0" y1="550.0" x2="215.0" y2="480.0" stroke="#1e88e5" stroke-width="4" stroke-linecap="round" marker-end="url(#aBlue)"/>
<text x="285.0" y="380.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" fill="#64748b">VENTURI</text>
<text x="285.0" y="256.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" fill="#64748b">THROTTLE</text>
<rect x="400" y="142" width="350" height="444" rx="12" fill="#fff8e1" stroke="#f4b400" stroke-width="4"/>
<text x="420.0" y="176.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#101827">SYMPTOMS (FIXED-PITCH PROP)</text>
<line x1="450.0" y1="470.0" x2="720.0" y2="470.0" stroke="#101827" stroke-width="2.5" stroke-linecap="round" marker-end="url(#aDark)"/>
<line x1="450.0" y1="470.0" x2="450.0" y2="250.0" stroke="#101827" stroke-width="2.5" stroke-linecap="round" marker-end="url(#aDark)"/>
<text x="585.0" y="498.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#101827">TIME</text>
<text x="432" y="360.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#101827" transform="rotate(-90 432 360.0)">RPM</text>
<path d="M 450.0,280.0 L 454.3,280.0 L 458.7,280.0 L 463.0,280.0 L 467.3,280.0 L 471.7,280.0 L 476.0,280.0 L 480.3,280.0 L 484.7,280.0 L 489.0,280.0 L 493.3,280.0 L 497.7,280.0 L 502.0,280.0 L 506.3,280.0 L 510.7,280.0 L 515.0,280.0 L 519.3,282.6 L 523.7,285.2 L 528.0,287.8 L 532.3,290.4 L 536.7,293.0 L 541.0,295.6 L 545.3,298.2 L 549.7,300.8 L 554.0,303.4 L 558.3,311.7 L 562.7,307.8 L 567.0,306.5 L 571.3,320.8 L 575.7,311.7 L 580.0,318.2 L 584.3,327.3 L 588.7,317.4 L 593.0,330.2 L 597.3,331.7 L 601.7,325.5 L 606.0,340.9 L 610.3,335.3 L 614.7,336.1 L 619.0,349.3 L 623.3,339.5 L 627.7,348.0 L 632.0,355.2 L 636.3,345.8 L 640.7,359.7 L 645.0,359.2 L 649.3,354.7 L 653.7,369.9 L 658.0,362.8 L 662.3,365.7 L 666.7,377.6 L 671.0,367.5 L 675.3,377.7 L 679.7,382.9 L 684.0,374.4 L 688.3,389.2 L 692.7,386.6 L 697.0,384.0 L 701.3,398.8 L 705.7,390.4 L 710.0,395.4" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="710.0" y="434.0" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#dc2626">RPM FALLS</text>
<text x="710.0" y="452.0" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#dc2626">SLOWLY</text>
<text x="560.0" y="274.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#dc2626">ROUGH RUNNING</text>
<text x="575.0" y="530.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#334155">Then: gradual loss of power.</text>
<text x="575.0" y="552.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#334155">With a CSU: manifold pressure falls.</text>
<rect x="770" y="146" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="146" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="180.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">CAUSE</text>
<text x="796.0" y="212.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Fuel evaporation and the</text>
<text x="796.0" y="237.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">venturi pressure drop cool</text>
<text x="796.0" y="262.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">the air: moisture freezes.</text>
<rect x="770" y="296" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="296" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="330.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">WHEN</text>
<text x="796.0" y="362.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Possible from about -10 to</text>
<text x="796.0" y="387.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">+30 °C in humid air, worst</text>
<text x="796.0" y="412.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">at low power.</text>
<rect x="770" y="446" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="446" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="480.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">ACTION</text>
<text x="796.0" y="512.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Full carburettor heat; expect</text>
<text x="796.0" y="537.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">brief extra roughness as</text>
<text x="796.0" y="562.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">the ice melts.</text>
<text x="600" y="642" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#101827">An engine that starts to run rough and then slowly loses power probably has carburettor icing.</text>
</svg>
