<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="ALTERNATE AIR (FUEL INJECTION)">
<defs>
  <marker id="aDark" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#101827"/></marker>
  <marker id="aBlue" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 z" fill="#1e88e5"/></marker>
  <marker id="aRed" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,1 L19,10 L0,19 z" fill="#dc2626"/></marker>
  <marker id="aRedS" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0.5 L11,6 L0,11.5 z" fill="#dc2626"/></marker>
</defs>
<rect width="1200" height="680" fill="#ffffff"/>
<rect width="1200" height="112" fill="#06111f"/>
<text x="600" y="34" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3.2" fill="#f4b400">PILOTVAULT AIRCRAFT TECHNICAL &amp; GENERAL</text>
<text x="600" y="79" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#ffffff">ALTERNATE AIR (FUEL INJECTION)</text>
<rect x="0" y="108" width="1200" height="4" fill="#f4b400"/>
<rect x="28" y="130" width="1144" height="470" rx="10" fill="#ffffff" stroke="#d7e0ea" stroke-width="2"/>
<rect x="40" y="142" width="710" height="444" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="60" y="190" width="670" height="360" rx="30" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="12 8"/>
<text x="80.0" y="214.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#64748b">ENGINE COWLING</text>
<line x1="40.0" y1="300.0" x2="110.0" y2="300.0" stroke="#1e88e5" stroke-width="5" stroke-linecap="round" marker-end="url(#aBlue)"/>
<text x="62.0" y="282.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" fill="#1e88e5">RAM AIR</text>
<rect x="110" y="270" width="70" height="60" rx="6" fill="#e5e7eb" stroke="#101827" stroke-width="3"/>
<line x1="118.0" y1="274.0" x2="118.0" y2="326.0" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
<line x1="128.0" y1="274.0" x2="128.0" y2="326.0" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
<line x1="138.0" y1="274.0" x2="138.0" y2="326.0" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
<line x1="148.0" y1="274.0" x2="148.0" y2="326.0" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
<line x1="158.0" y1="274.0" x2="158.0" y2="326.0" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
<line x1="168.0" y1="274.0" x2="168.0" y2="326.0" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
<text x="145.0" y="356.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#101827">AIR FILTER</text>
<path d="M 128,288 L 162,312 M 162,288 L 128,312" stroke="#dc2626" stroke-width="4"/>
<text x="145.0" y="250.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" fill="#dc2626">BLOCKED / ICED</text>
<path d="M 180.0,300.0 L 420.0,300.0" fill="none" stroke="#94a3b8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="300" y="312" width="60" height="16" rx="3" fill="#f4b400" stroke="#101827" stroke-width="2.5" transform="rotate(35 300 320)"/>
<line x1="270.0" y1="420.0" x2="290.0" y2="332.0" stroke="#f97316" stroke-width="4" stroke-linecap="round" marker-end="url(#aDark)"/>
<line x1="300.0" y1="420.0" x2="320.0" y2="332.0" stroke="#f97316" stroke-width="4" stroke-linecap="round" marker-end="url(#aDark)"/>
<line x1="330.0" y1="420.0" x2="350.0" y2="332.0" stroke="#f97316" stroke-width="4" stroke-linecap="round" marker-end="url(#aDark)"/>
<text x="300.0" y="450.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#b7860b">WARM AIR FROM INSIDE</text>
<text x="300.0" y="468.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#b7860b">THE COWLING</text>
<text x="366.0" y="372.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#b7860b">ALTERNATE AIR DOOR</text>
<rect x="420" y="270" width="90" height="60" rx="6" fill="#e2e8f0" stroke="#101827" stroke-width="3"/>
<text x="465.0" y="306.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#101827">SERVO</text>
<path d="M 510.0,300.0 L 560.0,300.0" fill="none" stroke="#94a3b8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="560" y="240" width="140" height="130" rx="12" fill="#cbd5e1" stroke="#101827" stroke-width="3"/>
<text x="630.0" y="310.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#101827">ENGINE</text>
<rect x="770" y="146" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="146" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="180.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">PURPOSE</text>
<text x="796.0" y="212.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Keeps air reaching the engine</text>
<text x="796.0" y="237.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">if the intake or filter is</text>
<text x="796.0" y="262.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">blocked, e.g. by ice.</text>
<rect x="770" y="296" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="296" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="330.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">WHERE THE AIR COMES FROM</text>
<text x="796.0" y="362.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">From within the engine</text>
<text x="796.0" y="387.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">cowling: warmer and</text>
<text x="796.0" y="412.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">unfiltered.</text>
<rect x="770" y="446" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="446" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="480.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">OPERATION</text>
<text x="796.0" y="512.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Manual control, or a door</text>
<text x="796.0" y="537.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">that opens automatically</text>
<text x="796.0" y="562.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">on suction.</text>
<text x="600" y="642" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#101827">Alternate air feeds air from within the engine cowling to the induction system.</text>
</svg>
