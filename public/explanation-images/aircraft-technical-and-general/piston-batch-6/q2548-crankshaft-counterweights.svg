<rect width="1200" height="680" fill="#ffffff"/>
<rect width="1200" height="112" fill="#06111f"/>
<text x="600" y="34" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3.2" fill="#f4b400">PILOTVAULT AIRCRAFT TECHNICAL &amp; GENERAL</text>
<text x="600" y="79" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#ffffff">CRANKSHAFT COUNTERWEIGHTS</text>
<rect x="0" y="108" width="1200" height="4" fill="#f4b400"/>
<rect x="28" y="130" width="1144" height="470" rx="10" fill="#ffffff" stroke="#d7e0ea" stroke-width="2"/>
<rect x="40" y="142" width="710" height="444" rx="12" fill="#fff8e1" stroke="#f4b400" stroke-width="4"/>
<line x1="70.0" y1="360.0" x2="720.0" y2="360.0" stroke="#64748b" stroke-width="22" stroke-linecap="round"/>
<rect x="140" y="256" width="22" height="118" rx="6" fill="#94a3b8" stroke="#101827" stroke-width="2.5"/>
<rect x="198" y="256" width="22" height="118" rx="6" fill="#94a3b8" stroke="#101827" stroke-width="2.5"/>
<line x1="162.0" y1="270.0" x2="198.0" y2="270.0" stroke="#475569" stroke-width="22" stroke-linecap="round"/>
<path d="M 136,400 L 224,400 L 214,460 L 146,460 Z" fill="#f4b400" stroke="#101827" stroke-width="2.5"/>
<rect x="300" y="346" width="22" height="118" rx="6" fill="#94a3b8" stroke="#101827" stroke-width="2.5"/>
<rect x="358" y="346" width="22" height="118" rx="6" fill="#94a3b8" stroke="#101827" stroke-width="2.5"/>
<line x1="322.0" y1="450.0" x2="358.0" y2="450.0" stroke="#475569" stroke-width="22" stroke-linecap="round"/>
<path d="M 296,260 L 384,260 L 374,320 L 306,320 Z" fill="#f4b400" stroke="#101827" stroke-width="2.5"/>
<rect x="460" y="256" width="22" height="118" rx="6" fill="#94a3b8" stroke="#101827" stroke-width="2.5"/>
<rect x="518" y="256" width="22" height="118" rx="6" fill="#94a3b8" stroke="#101827" stroke-width="2.5"/>
<line x1="482.0" y1="270.0" x2="518.0" y2="270.0" stroke="#475569" stroke-width="22" stroke-linecap="round"/>
<path d="M 456,400 L 544,400 L 534,460 L 466,460 Z" fill="#f4b400" stroke="#101827" stroke-width="2.5"/>
<rect x="600" y="346" width="22" height="118" rx="6" fill="#94a3b8" stroke="#101827" stroke-width="2.5"/>
<rect x="658" y="346" width="22" height="118" rx="6" fill="#94a3b8" stroke="#101827" stroke-width="2.5"/>
<line x1="622.0" y1="450.0" x2="658.0" y2="450.0" stroke="#475569" stroke-width="22" stroke-linecap="round"/>
<path d="M 596,260 L 684,260 L 674,320 L 606,320 Z" fill="#f4b400" stroke="#101827" stroke-width="2.5"/>
<text x="180.0" y="236.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#101827">CRANK THROW</text>
<text x="180.0" y="492.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#b7860b">COUNTERWEIGHT</text>
<text x="395.0" y="560.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#334155">Each counterweight sits opposite a crank throw to balance it.</text>
<rect x="770" y="146" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="146" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="180.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">BALANCE</text>
<text x="796.0" y="212.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Weights opposite the crank</text>
<text x="796.0" y="237.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">throws balance the rotating</text>
<text x="796.0" y="262.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">masses.</text>
<rect x="770" y="296" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="296" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="330.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">LESS VIBRATION</text>
<text x="796.0" y="362.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Reduces the vibration that</text>
<text x="796.0" y="387.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">could damage the engine</text>
<text x="796.0" y="412.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">and airframe.</text>
<rect x="770" y="446" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="446" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="480.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">SMOOTHER RUNNING</text>
<text x="796.0" y="512.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Lower bearing loads and</text>
<text x="796.0" y="537.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">smoother power delivery.</text>
<text x="600" y="642" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#101827">Counterweights are fitted to the crankshaft to prevent damage from vibration.</text>
</svg>
