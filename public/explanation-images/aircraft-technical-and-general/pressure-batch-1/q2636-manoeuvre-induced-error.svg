<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="MANOEUVRE-INDUCED ERROR">
<defs>
  <marker id="aDark" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#101827"/></marker>
  <marker id="aBlue" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 z" fill="#1e88e5"/></marker>
  <marker id="aRed" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,1 L19,10 L0,19 z" fill="#dc2626"/></marker>
  <marker id="aRedS" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0.5 L11,6 L0,11.5 z" fill="#dc2626"/></marker>
</defs>
<rect width="1200" height="680" fill="#ffffff"/>
<rect width="1200" height="112" fill="#06111f"/>
<text x="600" y="34" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3.2" fill="#f4b400">PILOTVAULT AIRCRAFT TECHNICAL &amp; GENERAL</text>
<text x="600" y="79" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#ffffff">MANOEUVRE-INDUCED ERROR</text>
<rect x="0" y="108" width="1200" height="4" fill="#f4b400"/>
<rect x="28" y="130" width="1144" height="470" rx="10" fill="#ffffff" stroke="#d7e0ea" stroke-width="2"/>
<rect x="40" y="142" width="710" height="444" rx="12" fill="#fff8e1" stroke="#f4b400" stroke-width="4"/>
<rect x="60" y="170" width="320" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="220.0" y="200.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#101827">STEADY FLIGHT</text>
<g transform="rotate(0 220 320)"><path d="M 100,320 Q 120,296 180,294 L 320,306 L 340,320 L 320,332 L 180,342 Q 120,340 100,320 Z" fill="#e2e8f0" stroke="#101827" stroke-width="3"/>
<circle cx="220" cy="340" r="6" fill="#f4b400" stroke="#101827" stroke-width="2"/></g>
<text x="220.0" y="430.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#15803d">Steady static pressure</text>
<rect x="400" y="170" width="320" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="560.0" y="200.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#101827">RAPID ATTITUDE CHANGE</text>
<g transform="rotate(-14 560 320)"><path d="M 440,320 Q 460,296 520,294 L 660,306 L 680,320 L 660,332 L 520,342 Q 460,340 440,320 Z" fill="#e2e8f0" stroke="#101827" stroke-width="3"/>
<circle cx="560" cy="340" r="6" fill="#f4b400" stroke="#101827" stroke-width="2"/></g>
<path d="M 540,370 q 4,-8 8,0 q 4,8 8,0" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<path d="M 552,370 q 4,-8 8,0 q 4,8 8,0" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<path d="M 564,370 q 4,-8 8,0 q 4,8 8,0" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<path d="M 576,370 q 4,-8 8,0 q 4,8 8,0" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<text x="560.0" y="420.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#dc2626">Pressure fluctuates at</text>
<text x="560.0" y="440.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#dc2626">the static vent</text>
<text x="395.0" y="520.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#b7860b">Result: brief false readings on the pressure instruments.</text>
<text x="395.0" y="546.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334155">Most VSIs damp this with a small counterbalance weight.</text>
<rect x="770" y="146" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="146" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="180.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">CAUSE</text>
<text x="796.0" y="212.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Airflow round the static vent</text>
<text x="796.0" y="237.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">changes during rapid attitude</text>
<text x="796.0" y="262.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">and altitude changes.</text>
<rect x="770" y="296" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="296" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="330.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">EFFECT</text>
<text x="796.0" y="362.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">The static pressure fluctuates:</text>
<text x="796.0" y="387.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">a false indication, e.g. a</text>
<text x="796.0" y="412.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">false climb or descent.</text>
<rect x="770" y="446" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="446" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="480.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">TEMPORARY</text>
<text x="796.0" y="512.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Settles once the manoeuvre</text>
<text x="796.0" y="537.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">is complete.</text>
<text x="600" y="642" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#101827">Manoeuvre-induced error: static-pressure fluctuations during rapid changes cause false readings.</text>
</svg>
