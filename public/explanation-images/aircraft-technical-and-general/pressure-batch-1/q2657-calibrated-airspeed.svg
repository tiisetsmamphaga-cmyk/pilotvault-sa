<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="CALIBRATED (RECTIFIED) AIRSPEED">
<defs>
  <marker id="aDark" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#101827"/></marker>
  <marker id="aBlue" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 z" fill="#1e88e5"/></marker>
  <marker id="aRed" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,1 L19,10 L0,19 z" fill="#dc2626"/></marker>
  <marker id="aRedS" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0.5 L11,6 L0,11.5 z" fill="#dc2626"/></marker>
</defs>
<rect width="1200" height="680" fill="#ffffff"/>
<rect width="1200" height="112" fill="#06111f"/>
<text x="600" y="34" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3.2" fill="#f4b400">PILOTVAULT AIRCRAFT TECHNICAL &amp; GENERAL</text>
<text x="600" y="79" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#ffffff">CALIBRATED (RECTIFIED) AIRSPEED</text>
<rect x="0" y="108" width="1200" height="4" fill="#f4b400"/>
<rect x="28" y="130" width="1144" height="470" rx="10" fill="#ffffff" stroke="#d7e0ea" stroke-width="2"/>
<rect x="40" y="142" width="710" height="444" rx="12" fill="#fff8e1" stroke="#f4b400" stroke-width="4"/>
<rect x="90" y="190" width="240" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="110.0" y="222.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#101827">IAS</text>
<text x="110.0" y="244.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334155">Indicated airspeed</text>
<text x="350.0" y="232.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#64748b">as read on the ASI</text>
<line x1="210.0" y1="262.0" x2="210.0" y2="292.0" stroke="#b7860b" stroke-width="4" stroke-linecap="round" marker-end="url(#aDark)"/>
<text x="232.0" y="284.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#b7860b">+ instrument &amp; position error</text>
<rect x="90" y="292" width="240" height="70" rx="10" fill="#fde68a" stroke="#f4b400" stroke-width="4"/>
<text x="110.0" y="324.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#101827">CAS / RAS</text>
<text x="110.0" y="346.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334155">Calibrated (rectified)</text>
<line x1="210.0" y1="364.0" x2="210.0" y2="394.0" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#aDark)"/>
<text x="232.0" y="386.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#64748b">(+ compressibility)</text>
<rect x="90" y="394" width="240" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="110.0" y="426.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#101827">EAS</text>
<text x="110.0" y="448.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334155">Equivalent airspeed</text>
<text x="350.0" y="436.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#64748b">(compressibility, high speed)</text>
<line x1="210.0" y1="466.0" x2="210.0" y2="496.0" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#aDark)"/>
<text x="232.0" y="488.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#64748b">+ density (altitude and temperature)</text>
<rect x="90" y="496" width="240" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="110.0" y="528.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#101827">TAS</text>
<text x="110.0" y="550.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#334155">True airspeed</text>
<text x="350.0" y="538.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#64748b">speed through the air</text>
<rect x="770" y="146" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="146" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="180.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">IAS</text>
<text x="796.0" y="212.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">What the airspeed indicator</text>
<text x="796.0" y="237.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">shows.</text>
<rect x="770" y="296" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="296" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="330.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">CORRECT FOR</text>
<text x="796.0" y="362.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Instrument error and position</text>
<text x="796.0" y="387.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">(pressure) error.</text>
<rect x="770" y="446" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="446" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="480.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">RESULT</text>
<text x="796.0" y="512.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Calibrated (rectified)</text>
<text x="796.0" y="537.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">airspeed: CAS / RAS.</text>
<text x="600" y="642" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#101827">Calibrated (rectified) airspeed is IAS corrected for instrument and position error.</text>
</svg>
