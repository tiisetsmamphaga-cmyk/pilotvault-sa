<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="INTERNATIONAL STANDARD ATMOSPHERE">
<defs>
  <marker id="aDark" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#101827"/></marker>
  <marker id="aBlue" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 z" fill="#1e88e5"/></marker>
  <marker id="aRed" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,1 L19,10 L0,19 z" fill="#dc2626"/></marker>
  <marker id="aRedS" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0.5 L11,6 L0,11.5 z" fill="#dc2626"/></marker>
</defs>
<rect width="1200" height="680" fill="#ffffff"/>
<rect width="1200" height="112" fill="#06111f"/>
<text x="600" y="34" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3.2" fill="#f4b400">PILOTVAULT AIRCRAFT TECHNICAL &amp; GENERAL</text>
<text x="600" y="79" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#ffffff">INTERNATIONAL STANDARD ATMOSPHERE</text>
<rect x="0" y="108" width="1200" height="4" fill="#f4b400"/>
<rect x="28" y="130" width="1144" height="470" rx="10" fill="#ffffff" stroke="#d7e0ea" stroke-width="2"/>
<rect x="40" y="142" width="710" height="444" rx="12" fill="#fff8e1" stroke="#f4b400" stroke-width="4"/>
<text x="60.0" y="176.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#101827">ISA MEAN SEA-LEVEL VALUES</text>
<rect x="60" y="196" width="320" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="80.0" y="230.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#64748b">TEMPERATURE</text>
<text x="80.0" y="268.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#101827">15 °C</text>
<rect x="400" y="196" width="320" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="420.0" y="230.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#64748b">PRESSURE</text>
<text x="420.0" y="268.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#101827">1013.25 hPa</text>
<rect x="60" y="306" width="320" height="96" rx="10" fill="#fde68a" stroke="#f4b400" stroke-width="4"/>
<text x="80.0" y="340.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#64748b">DENSITY</text>
<text x="80.0" y="378.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#101827">1.225 kg/m³</text>
<rect x="400" y="306" width="320" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="420.0" y="340.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#64748b">LAPSE RATE</text>
<text x="420.0" y="378.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" fill="#101827">1.98 °C / 1,000 ft</text>
<text x="60.0" y="452.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#101827">TEMPERATURE PROFILE</text>
<line x1="90.0" y1="560.0" x2="700.0" y2="560.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
<line x1="90.0" y1="560.0" x2="90.0" y2="462.0" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#aDark)"/>
<text x="96.0" y="474.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="800" fill="#64748b">HEIGHT</text>
<text x="700.0" y="578.0" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="800" fill="#64748b">WARMER →</text>
<path d="M 620.0,560.0 L 300.0,478.0 L 300.0,462.0" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="630.0" y="552.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#dc2626">+15 °C at MSL</text>
<text x="310.0" y="478.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#dc2626">−56.5 °C at 36,090 ft (tropopause), then constant</text>
<rect x="770" y="146" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="146" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="180.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">SEA-LEVEL DENSITY</text>
<text x="796.0" y="212.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">1.225 kg/m³ (ISA), used to</text>
<text x="796.0" y="237.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">calibrate the ASI.</text>
<rect x="770" y="296" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="296" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="330.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">TEMPERATURE</text>
<text x="796.0" y="362.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">15 °C at sea level, falling</text>
<text x="796.0" y="387.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">1.98 °C per 1,000 ft.</text>
<rect x="770" y="446" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="446" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="480.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">TROPOPAUSE</text>
<text x="796.0" y="512.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">36,090 ft: temperature</text>
<text x="796.0" y="537.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">then constant at −56.5 °C.</text>
<text x="600" y="642" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#101827">In the ISA, sea-level air density is 1.225 kg/m³.</text>
</svg>
