<text x="700.0" y="228.0" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" fill="#101827">ACTUAL RATE</text>
<text x="216.0" y="228.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#b7860b">IVSI: ALMOST INSTANT</text>
<text x="410.0" y="326.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#dc2626">CONVENTIONAL VSI: LAGS</text>
<text x="410.0" y="344.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#dc2626">FOR A FEW SECONDS</text>
<text x="56.0" y="414.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#101827">VSI ERRORS</text>
<rect x="56" y="424" width="218" height="146" rx="10" fill="#fde68a" stroke="#f4b400" stroke-width="4"/>
<text x="72.0" y="452.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#101827">TIME LAG</text>
<text x="72.0" y="479.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#334155">Conventional VSI: a few</text>
<text x="72.0" y="499.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#334155">seconds' delay. The IVSI's</text>
<text x="72.0" y="519.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#334155">accelerometer removes it.</text>
<rect x="286" y="424" width="218" height="146" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="302.0" y="452.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#101827">MANOEUVRE-</text>
<text x="302.0" y="471.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#101827">INDUCED ERROR</text>
<text x="302.0" y="498.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#334155">Still present: an IVSI</text>
<text x="302.0" y="518.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#334155">can even read falsely in</text>
<text x="302.0" y="538.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#334155">steep turns.</text>
<rect x="516" y="424" width="218" height="146" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="532.0" y="452.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#101827">POSITION ERROR</text>
<text x="532.0" y="479.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#334155">Still present: both</text>
<text x="532.0" y="499.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#334155">instruments use the</text>
<text x="532.0" y="519.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#334155">static vent.</text>
<rect x="770" y="146" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="146" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="180.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">CONVENTIONAL VSI</text>
<text x="796.0" y="212.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">The pressure difference</text>
<text x="796.0" y="237.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">takes a few seconds to build</text>
<text x="796.0" y="262.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">up: the reading lags.</text>
<rect x="770" y="296" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="296" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="330.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">IVSI ACCELEROMETER</text>
<text x="796.0" y="362.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">A vertical-acceleration pump</text>
<text x="796.0" y="387.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">changes capsule pressure at</text>
<text x="796.0" y="412.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">once: instant indication.</text>
<rect x="770" y="446" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="446" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="480.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">OTHER ERRORS REMAIN</text>
<text x="796.0" y="512.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Position and manoeuvre-</text>
<text x="796.0" y="537.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">induced errors still apply.</text>
<text x="600" y="642" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#101827">The IVSI's accelerometer overcomes the time lag of the conventional VSI.</text>
</svg>
