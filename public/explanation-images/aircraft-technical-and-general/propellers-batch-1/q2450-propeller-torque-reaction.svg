<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="PROPELLER TORQUE REACTION">
<defs>
  <marker id="aDark" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#101827"/></marker>
  <marker id="aBlue" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 z" fill="#1e88e5"/></marker>
  <marker id="aRed" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,1 L19,10 L0,19 z" fill="#dc2626"/></marker>
  <marker id="aRedS" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0.5 L11,6 L0,11.5 z" fill="#dc2626"/></marker>
</defs>
<rect width="1200" height="680" fill="#ffffff"/>
<rect width="1200" height="112" fill="#06111f"/>
<text x="600" y="34" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3.2" fill="#f4b400">PILOTVAULT AIRCRAFT TECHNICAL &amp; GENERAL</text>
<text x="600" y="79" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#ffffff">PROPELLER TORQUE REACTION</text>
<rect x="0" y="108" width="1200" height="4" fill="#f4b400"/>
<rect x="28" y="130" width="1144" height="470" rx="10" fill="#ffffff" stroke="#d7e0ea" stroke-width="2"/>
<rect x="40" y="142" width="710" height="444" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="60.0" y="172.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#101827">VIEWED FROM THE COCKPIT (BEHIND)</text>
<rect x="65" y="370" width="660" height="20" rx="8" fill="#dfe5ec" stroke="#101827" stroke-width="2.5"/>
<circle cx="395" cy="380" r="46" fill="#dfe5ec" stroke="#101827" stroke-width="3"/>
<line x1="395.0" y1="380.0" x2="395.0" y2="210.0" stroke="#94a3b8" stroke-width="14" stroke-linecap="round" stroke-dasharray="10 8"/>
<path d="M 395,380 Q 395,290 361,212" fill="none" stroke="#101827" stroke-width="18" stroke-linecap="round"/>
<path d="M 395,380 Q 395,290 361,212" fill="none" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
<line x1="395.0" y1="380.0" x2="395.0" y2="550.0" stroke="#94a3b8" stroke-width="14" stroke-linecap="round" stroke-dasharray="10 8"/>
<path d="M 395,380 Q 395,470 429,548" fill="none" stroke="#101827" stroke-width="18" stroke-linecap="round"/>
<path d="M 395,380 Q 395,470 429,548" fill="none" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
<circle cx="395" cy="380" r="16" fill="#475569" stroke="#101827" stroke-width="2.5"/>
<path d="M 515,230 A 190 190 0 0 1 580,360" fill="none" stroke="#101827" stroke-width="4" marker-end="url(#aDark)"/>
<text x="575.0" y="230.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#101827">PROPELLER ROTATION</text>
<text x="575.0" y="248.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#101827">(CLOCKWISE)</text>
<path d="M 303,472 A 130 130 0 0 0 487,472" fill="none" stroke="#dc2626" stroke-width="6" marker-end="url(#aRed)"/>
<text x="395.0" y="570.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#dc2626">REACTION TORQUE ON THE AIRCRAFT</text>
<text x="395.0" y="590.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#dc2626">(OPPOSITE TO ROTATION: LEFT WING DOWN)</text>
<rect x="770" y="146" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="146" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="180.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">EQUAL AND OPPOSITE</text>
<text x="796.0" y="212.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Turning the propeller one way</text>
<text x="796.0" y="237.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">twists the aircraft the other</text>
<text x="796.0" y="262.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">way (Newton's third law).</text>
<rect x="770" y="296" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="296" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="330.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">ROLL AND YAW</text>
<text x="796.0" y="362.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">Clockwise propeller: the</text>
<text x="796.0" y="387.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">aircraft tends to roll left.</text>
<rect x="770" y="446" width="378" height="138" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="770" y="446" width="8" height="138" rx="4" fill="#f4b400"/>
<text x="796.0" y="480.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">GREATEST</text>
<text x="796.0" y="512.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">At high power and low</text>
<text x="796.0" y="537.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#334155">airspeed, e.g. take-off.</text>
<text x="600" y="642" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#101827">A rotating propeller produces a reaction force opposite to its rotation: torque.</text>
</svg>
