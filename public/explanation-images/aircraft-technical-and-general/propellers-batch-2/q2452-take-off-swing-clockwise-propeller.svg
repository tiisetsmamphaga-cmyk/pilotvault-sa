<text x="335.0" y="245.0" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#b7860b">NOSE YAWS LEFT</text>
<rect x="339.0" y="420.5" width="12" height="24" rx="3" fill="#dc2626"/>
<rect x="439.0" y="420.5" width="12" height="24" rx="3" fill="#101827"/>
<rect x="389.0" y="295.5" width="12" height="24" rx="3" fill="#101827"/>
<text x="230.0" y="452.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#dc2626">MORE LOAD ON</text>
<text x="230.0" y="468.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#dc2626">LEFT WHEEL</text>
<line x1="262.0" y1="442.0" x2="337.0" y2="428.5" stroke="#dc2626" stroke-width="2" stroke-linecap="round" marker-end="url(#aRedS)"/>
