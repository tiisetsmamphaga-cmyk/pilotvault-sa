<text x="108.0" y="406.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#101827">RPM BACK TO SELECTED</text>
<text x="108.0" y="428.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#334155">Extra power becomes thrust</text>
