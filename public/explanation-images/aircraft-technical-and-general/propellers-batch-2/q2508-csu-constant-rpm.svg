<text x="108.0" y="190.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#101827">PILOT ADDS POWER</text>
<text x="108.0" y="212.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#334155">Throttle opened slowly</text>
