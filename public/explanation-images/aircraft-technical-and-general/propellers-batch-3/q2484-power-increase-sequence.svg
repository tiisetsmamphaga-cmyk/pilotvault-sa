<text x="370.0" y="472.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#101827">MIXTURE</text>
<rect x="480" y="142" width="330" height="444" rx="12" fill="#fff8e1" stroke="#f4b400" stroke-width="4"/>
<text x="500.0" y="176.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">INCREASING POWER</text>
<circle cx="520.0" cy="244.0" r="15" fill="#06111f"/>
<text x="520.0" y="250.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#ffffff">1</text>
<text x="548.0" y="250.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#101827">Mixture: rich</text>
<line x1="520.0" y1="264.0" x2="520.0" y2="312.0" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" marker-end="url(#aDark)"/>
<circle cx="520.0" cy="334.0" r="15" fill="#06111f"/>
<text x="520.0" y="340.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#ffffff">2</text>
<text x="548.0" y="340.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#101827">RPM: increase</text>
<line x1="520.0" y1="354.0" x2="520.0" y2="402.0" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" marker-end="url(#aDark)"/>
<circle cx="520.0" cy="424.0" r="15" fill="#06111f"/>
<text x="520.0" y="430.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#ffffff">3</text>
<text x="548.0" y="430.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#101827">Throttle (MP): increase</text>
<text x="645.0" y="560.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#b7860b">RICH → REVS → THROTTLE</text>
<rect x="820" y="142" width="330" height="444" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="840.0" y="176.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">DECREASING POWER</text>
<circle cx="860.0" cy="244.0" r="15" fill="#06111f"/>
<text x="860.0" y="250.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#ffffff">1</text>
<text x="888.0" y="250.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#101827">Throttle (MP): reduce</text>
<line x1="860.0" y1="264.0" x2="860.0" y2="312.0" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" marker-end="url(#aDark)"/>
<circle cx="860.0" cy="334.0" r="15" fill="#06111f"/>
<text x="860.0" y="340.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#ffffff">2</text>
<text x="888.0" y="340.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#101827">RPM: reduce</text>
<line x1="860.0" y1="354.0" x2="860.0" y2="402.0" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" marker-end="url(#aDark)"/>
<circle cx="860.0" cy="424.0" r="15" fill="#06111f"/>
<text x="860.0" y="430.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#ffffff">3</text>
<text x="888.0" y="430.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#101827">Mixture: as required</text>
<text x="985.0" y="560.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#64748b">THROTTLE → REVS → MIXTURE</text>
<text x="600" y="642" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#101827">To increase power: richen the mixture, increase RPM, then increase manifold pressure.</text>
</svg>
