<text x="250.0" y="266.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" fill="#ffffff">RPM</text>
<text x="250.0" y="472.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#101827">PROPELLER</text>
<rect x="362" y="200" width="16" height="240" rx="8" fill="#cbd5e1" stroke="#101827" stroke-width="2"/>
<rect x="336" y="202.0" width="68" height="36" rx="10" fill="#dc2626" stroke="#101827" stroke-width="2.5"/>
