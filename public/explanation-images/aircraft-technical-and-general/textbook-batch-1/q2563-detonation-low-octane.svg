<text x="600" y="629" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#64748b">Detonation is an explosive pressure rise, not the normal progressive burn from the spark plug.</text>
<text x="600" y="653" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#94a3b8">Source reference: Pilot&#x27;s Handbook, Figure 2-9 and &#x27;Proper Fuel is Essential&#x27;</text>
