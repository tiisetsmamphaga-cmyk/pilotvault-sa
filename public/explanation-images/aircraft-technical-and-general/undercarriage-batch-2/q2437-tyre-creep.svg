<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="TYRE CREEP AND CREEP MARKS">
<defs>
  <marker id="aDark" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0,1 L15,8 L0,15 z" fill="#101827"/></marker>
  <marker id="aBlue" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 z" fill="#1e88e5"/></marker>
  <marker id="aRed" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M0,1 L19,10 L0,19 z" fill="#dc2626"/></marker>
  <marker id="aRedS" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0.5 L11,6 L0,11.5 z" fill="#dc2626"/></marker>
</defs>
<rect width="1200" height="680" fill="#ffffff"/>
<rect width="1200" height="112" fill="#06111f"/>
<text x="600" y="34" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3.2" fill="#f4b400">PILOTVAULT AIRCRAFT TECHNICAL &amp; GENERAL</text>
<text x="600" y="79" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#ffffff">TYRE CREEP AND CREEP MARKS</text>
<rect x="0" y="108" width="1200" height="4" fill="#f4b400"/>
<rect x="28" y="130" width="1144" height="470" rx="10" fill="#ffffff" stroke="#d7e0ea" stroke-width="2"/>
<rect x="48" y="142" width="542" height="262" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="68.0" y="174.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">CREEP MARKS ALIGNED</text>
<circle cx="238" cy="290" r="100" fill="#334155" stroke="#101827" stroke-width="3"/>
<circle cx="238" cy="290" r="86" fill="none" stroke="#475569" stroke-width="2"/>
<circle cx="238" cy="290" r="50" fill="#cbd5e1" stroke="#101827" stroke-width="3"/>
<circle cx="238" cy="290" r="16" fill="#64748b" stroke="#101827" stroke-width="2"/>
<path d="M 244.0,234.0 L 244.0,196.0 L 232.0,196.0 L 232.0,234.0 Z" fill="#f8fafc" stroke="#101827" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M 244.0,262.0 L 244.0,240.0 L 232.0,240.0 L 232.0,262.0 Z" fill="#f8fafc" stroke="#101827" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="254.4" y1="278.5" x2="290.4" y2="253.3" stroke="#f4b400" stroke-width="7" stroke-linecap="round"/>
<text x="378.0" y="224.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#101827">PAINT MARK ON TYRE</text>
<text x="378.0" y="243.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#101827">LINES UP WITH MARK</text>
<text x="378.0" y="262.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#101827">ON THE WHEEL RIM</text>
<line x1="374.0" y1="230.0" x2="246.0" y2="210.0" stroke="#101827" stroke-width="2.5" stroke-linecap="round" marker-end="url(#aDark)"/>
<text x="378.0" y="318.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#b7860b">INNER-TUBE VALVE</text>
<text x="378.0" y="337.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#b7860b">STEM UPRIGHT</text>
<line x1="374.0" y1="322.0" x2="291.7" y2="255.6" stroke="#b7860b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#aDark)"/>
<rect x="610" y="142" width="542" height="262" rx="12" fill="#fff8e1" stroke="#f4b400" stroke-width="4"/>
<text x="630.0" y="174.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">TYRE HAS CREPT ON THE RIM</text>
<circle cx="800" cy="290" r="100" fill="#334155" stroke="#101827" stroke-width="3"/>
<circle cx="800" cy="290" r="86" fill="none" stroke="#475569" stroke-width="2"/>
<circle cx="800" cy="290" r="50" fill="#cbd5e1" stroke="#101827" stroke-width="3"/>
<circle cx="800" cy="290" r="16" fill="#64748b" stroke="#101827" stroke-width="2"/>
<path d="M 831.6,243.4 L 849.4,209.8 L 838.8,204.2 L 821.0,237.7 Z" fill="#f8fafc" stroke="#101827" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M 806.0,262.0 L 806.0,240.0 L 794.0,240.0 L 794.0,262.0 Z" fill="#f8fafc" stroke="#101827" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M 837.7 263.6 Q 847.7 281.6 863.7 287.6" fill="none" stroke="#f4b400" stroke-width="7" stroke-linecap="round"/>
<line x1="816.4" y1="278.5" x2="837.7" y2="263.6" stroke="#f4b400" stroke-width="7" stroke-linecap="round"/>
<path d="M 855.4 185.8 A 118 118 0 0 1 912.2 253.5" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#aRedS)"/>
<text x="940.0" y="224.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#dc2626">MARKS NO LONGER</text>
<text x="940.0" y="243.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#dc2626">LINE UP</text>
<text x="940.0" y="318.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#dc2626">VALVE STEM DRAGGED</text>
<text x="940.0" y="337.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#dc2626">BY THE TUBE: CAN</text>
<text x="940.0" y="356.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#dc2626">TEAR OFF</text>
<line x1="936.0" y1="322.0" x2="867.7" y2="285.6" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" marker-end="url(#aRedS)"/>
<rect x="48" y="418" width="356" height="168" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="48" y="418" width="8" height="168" rx="4" fill="#f4b400"/>
<text x="74.0" y="452.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">CAUSE</text>
<text x="74.0" y="486.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#334155">Heavy braking on landing</text>
<text x="74.0" y="512.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#334155">makes the tyre slip round</text>
<text x="74.0" y="538.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#334155">the wheel rim.</text>
<rect x="420" y="418" width="356" height="168" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="420" y="418" width="8" height="168" rx="4" fill="#f4b400"/>
<text x="446.0" y="452.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">RISK</text>
<text x="446.0" y="486.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#334155">The inner tube moves with the</text>
<text x="446.0" y="512.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#334155">tyre and its valve can be torn</text>
<text x="446.0" y="538.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#334155">off: sudden deflation / blow-out.</text>
<rect x="792" y="418" width="356" height="168" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<rect x="792" y="418" width="8" height="168" rx="4" fill="#f4b400"/>
<text x="818.0" y="452.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#101827">CHECK</text>
<text x="818.0" y="486.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#334155">Inspect creep marks before</text>
<text x="818.0" y="512.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#334155">flight; if out of alignment,</text>
<text x="818.0" y="538.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#334155">have the tyre inspected.</text>
<text x="600" y="642" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#101827">Tyre creep (usually from heavy braking) can drag the tube valve until it breaks away.</text>
</svg>
