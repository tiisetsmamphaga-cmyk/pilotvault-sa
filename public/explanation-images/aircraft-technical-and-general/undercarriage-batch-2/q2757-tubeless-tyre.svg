<line x1="946.0" y1="364.0" x2="818.4" y2="385.2" stroke="#b7860b" stroke-width="2.5" stroke-linecap="round" marker-end="url(#aDark)"/>
<rect x="48" y="418" width="542" height="76" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="80.0" cy="456.0" r="15" fill="#06111f"/>
<text x="80.0" y="462.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#ffffff">1</text>
<text x="108.0" y="462.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#101827">The wheel rim must provide an airtight seal</text>
<rect x="494" y="442" width="80" height="28" rx="14" fill="#15803d"/>
<text x="534.0" y="461.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#ffffff">TRUE</text>
<rect x="610" y="418" width="542" height="76" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="642.0" cy="456.0" r="15" fill="#06111f"/>
<text x="642.0" y="462.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#ffffff">2</text>
<text x="670.0" y="462.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#101827">An inner tube is required to retain pressure</text>
<rect x="1056" y="442" width="80" height="28" rx="14" fill="#dc2626"/>
<text x="1096.0" y="461.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#ffffff">FALSE</text>
<rect x="48" y="504" width="542" height="76" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="80.0" cy="542.0" r="15" fill="#06111f"/>
<text x="80.0" y="548.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#ffffff">3</text>
<text x="108.0" y="548.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#101827">No friction between an inner tube and the tyre</text>
<rect x="494" y="528" width="80" height="28" rx="14" fill="#15803d"/>
<text x="534.0" y="547.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#ffffff">TRUE</text>
<rect x="610" y="504" width="542" height="76" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="642.0" cy="542.0" r="15" fill="#06111f"/>
<text x="642.0" y="548.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#ffffff">4</text>
<text x="670.0" y="548.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#101827">Damage to the rim sealing surface can cause leakage</text>
<rect x="1056" y="528" width="80" height="28" rx="14" fill="#15803d"/>
<text x="1096.0" y="547.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#ffffff">TRUE</text>
<text x="600" y="642" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#101827">Statements 1, 3 and 4 are correct: a tubeless tyre seals against an airtight rim.</text>
</svg>
