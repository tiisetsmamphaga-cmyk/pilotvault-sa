<text x="950.0" y="290.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#15803d">BEADS SEAL AIRTIGHT</text>
<text x="950.0" y="309.0" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#15803d">AGAINST THE RIM</text>
