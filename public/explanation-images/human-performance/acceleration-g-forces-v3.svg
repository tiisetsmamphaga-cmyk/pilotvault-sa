<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">HOW G-FORCES AFFECT BLOOD FLOW</text><rect x="85" y="185" width="1030" height="405" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g transform="translate(125 225)"><g><rect width="430" height="315" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="215" y="45" text-anchor="middle" fill="#06111f" font-size="23" font-weight="700">POSITIVE G (+G)</text><circle cx="215" cy="115" r="28" fill="#06111f"/><rect x="190" y="145" width="50" height="105" rx="22" fill="#06111f"/><line x1="215" y1="165" x2="215" y2="245" stroke="#f4b400" stroke-width="11"/><polygon points="215,270 198,240 232,240" fill="#f4b400"/><text x="215" y="290" text-anchor="middle" fill="#475569" font-size="17">Blood moves away from the head</text><text x="215" y="315" text-anchor="middle" fill="#92400e" font-size="17" font-weight="700">grey-out → black-out → G-LOC</text></g><g transform="translate(500 0)"><rect width="430" height="315" rx="20" fill="#06111f"/><text x="215" y="45" text-anchor="middle" fill="#f4b400" font-size="23" font-weight="700">NEGATIVE G (−G)</text><circle cx="215" cy="115" r="28" fill="#fff"/><rect x="190" y="145" width="50" height="105" rx="22" fill="#fff"/><line x1="215" y1="240" x2="215" y2="165" stroke="#f4b400" stroke-width="11"/><polygon points="215,140 198,170 232,170" fill="#f4b400"/><text x="215" y="290" text-anchor="middle" fill="#fff" font-size="17">Blood moves toward the head</text><text x="215" y="315" text-anchor="middle" fill="#f4b400" font-size="17" font-weight="700">may produce red-out</text></g></g><text x="600" y="645" text-anchor="middle" fill="#475569" font-size="19">High positive G can also reduce retinal blood flow and produce tunnel vision before complete blackout.</text></g></svg>