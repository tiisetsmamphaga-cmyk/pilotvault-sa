<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">How G-forces affect blood flow</title><desc id="desc">Positive G moves blood away from the head and negative G moves blood toward the head.</desc><rect width="1200" height="720" fill="#ffffff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial, sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#ffffff" font-size="31" font-weight="800">HOW G-FORCES AFFECT BLOOD FLOW</text><rect x="70" y="170" width="1060" height="470" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><rect x="110" y="205" width="455" height="375" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="635" y="205" width="455" height="375" rx="20" fill="#06111f"/><text x="338" y="250" text-anchor="middle" fill="#06111f" font-size="23" font-weight="700">POSITIVE G (+G)</text><text x="863" y="250" text-anchor="middle" fill="#f4b400" font-size="23" font-weight="700">NEGATIVE G (-G)</text><g transform="translate(0,8)"><circle cx="338" cy="340" r="34" fill="#06111f"/><rect x="306" y="380" width="64" height="125" rx="28" fill="#06111f"/><line x1="338" y1="405" x2="338" y2="490" stroke="#f4b400" stroke-width="12" stroke-linecap="round"/><polygon points="338,520 319,486 357,486" fill="#f4b400"/><circle cx="863" cy="340" r="34" fill="#ffffff"/><rect x="831" y="380" width="64" height="125" rx="28" fill="#ffffff"/><line x1="863" y1="488" x2="863" y2="403" stroke="#f4b400" stroke-width="12" stroke-linecap="round"/><polygon points="863,373 844,407 882,407" fill="#f4b400"/></g><g text-anchor="middle"><text x="338" y="540" fill="#475569" font-size="18">Blood moves away from the head</text><text x="338" y="568" fill="#92400e" font-size="18" font-weight="700">Grey-out → black-out → G-LOC</text><text x="863" y="540" fill="#ffffff" font-size="18">Blood moves toward the head</text><text x="863" y="568" fill="#f4b400" font-size="18" font-weight="700">May produce red-out</text></g><text x="600" y="680" text-anchor="middle" fill="#475569" font-size="19">Positive G reduces blood flow to the brain; negative G drives blood toward the head.</text></g></svg>