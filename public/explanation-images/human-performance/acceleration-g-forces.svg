<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="32" font-weight="800">HOW G-FORCES AFFECT THE BODY</text><g transform="translate(0,15)"><circle cx="350" cy="390" r="105" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><circle cx="350" cy="300" r="34" fill="#06111f"/><rect x="323" y="335" width="54" height="150" rx="25" fill="#06111f"/><line x1="350" y1="360" x2="350" y2="485" stroke="#f4b400" stroke-width="12"/><path d="M350 465 L325 430 M350 465 L375 430" stroke="#f4b400" stroke-width="8" fill="none"/><text x="350" y="545" text-anchor="middle" fill="#06111f" font-size="24" font-weight="700">+G</text><text x="350" y="578" text-anchor="middle" fill="#475569" font-size="19">Blood moves away from head</text><text x="350" y="608" text-anchor="middle" fill="#475569" font-size="19">Grey-out → black-out → G-LOC</text><circle cx="850" cy="390" r="105" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><circle cx="850" cy="300" r="34" fill="#06111f"/><rect x="823" y="335" width="54" height="150" rx="25" fill="#06111f"/><line x1="850" y1="455" x2="850" y2="330" stroke="#f4b400" stroke-width="12"/><path d="M850 350 L825 385 M850 350 L875 385" stroke="#f4b400" stroke-width="8" fill="none"/><text x="850" y="545" text-anchor="middle" fill="#06111f" font-size="24" font-weight="700">−G</text><text x="850" y="578" text-anchor="middle" fill="#475569" font-size="19">Blood moves toward head</text><text x="850" y="608" text-anchor="middle" fill="#475569" font-size="19">May produce red-out</text></g></g></svg>