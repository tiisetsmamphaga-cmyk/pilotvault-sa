<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="32" font-weight="800">AIRMANSHIP STARTS WITH RESPONSIBILITY</text><rect x="120" y="190" width="960" height="420" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><circle cx="310" cy="370" r="90" fill="#06111f"/><path d="M250 385 Q310 330 370 385" fill="none" stroke="#f4b400" stroke-width="10"/><circle cx="310" cy="335" r="18" fill="#f4b400"/><text x="310" y="505" text-anchor="middle" fill="#06111f" font-size="23" font-weight="700">PILOT-IN-COMMAND</text><g fill="#475569" font-size="22"><text x="500" y="280">• Prepare the flight properly</text><text x="500" y="340">• Recognise personal and aircraft limits</text><text x="500" y="400">• Follow procedures and checklists</text><text x="500" y="460">• Resist pressure that compromises safety</text><text x="500" y="520">• Take final responsibility for decisions</text></g><text x="600" y="655" text-anchor="middle" fill="#92400e" font-size="21" font-weight="700">Good judgement is part of flying skill.</text></g></svg>