<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">GAS EXCHANGE IN THE ALVEOLI</text><rect x="100" y="185" width="1000" height="410" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><circle cx="360" cy="380" r="120" fill="#fff" stroke="#60a5fa" stroke-width="6"/><text x="360" y="365" text-anchor="middle" fill="#06111f" font-size="24" font-weight="700">ALVEOLUS</text><text x="360" y="402" text-anchor="middle" fill="#475569" font-size="19">Air sac</text><path d="M610 255 C850 270 850 490 610 505" fill="none" stroke="#ef4444" stroke-width="28" stroke-linecap="round"/><text x="770" y="550" text-anchor="middle" fill="#475569" font-size="19">Pulmonary capillary</text><line x1="475" y1="330" x2="640" y2="330" stroke="#f4b400" stroke-width="7"/><polygon points="640,330 615,315 615,345" fill="#f4b400"/><text x="555" y="305" text-anchor="middle" fill="#06111f" font-size="20" font-weight="700">O₂ INTO BLOOD</text><line x1="640" y1="440" x2="475" y2="440" stroke="#64748b" stroke-width="7"/><polygon points="475,440 500,425 500,455" fill="#64748b"/><text x="555" y="475" text-anchor="middle" fill="#06111f" font-size="20" font-weight="700">CO₂ INTO ALVEOLUS</text><text x="600" y="645" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">Gas moves down its partial-pressure gradient across the thin alveolar membrane.</text></g></svg>