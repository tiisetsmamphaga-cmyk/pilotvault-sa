<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">ANGINA OR HEART ATTACK?</text><rect x="95" y="185" width="1010" height="405" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g text-anchor="middle"><rect x="145" y="235" width="420" height="280" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="355" y="280" fill="#06111f" font-size="23" font-weight="700">ANGINA</text><text x="355" y="330" fill="#475569" font-size="19">Chest discomfort often with effort</text><text x="355" y="365" fill="#475569" font-size="19">may ease with rest</text><text x="355" y="420" fill="#92400e" font-size="18" font-weight="700">May include breathlessness or dizziness</text><rect x="635" y="235" width="420" height="280" rx="20" fill="#06111f"/><text x="845" y="280" fill="#f4b400" font-size="23" font-weight="700">HEART ATTACK</text><text x="845" y="330" fill="#fff" font-size="19">Severe or persistent chest pain</text><text x="845" y="365" fill="#fff" font-size="19">collapse may occur</text><text x="845" y="420" fill="#f4b400" font-size="18" font-weight="700">Treat as a medical emergency</text></g><text x="600" y="650" text-anchor="middle" fill="#475569" font-size="20">Do not dismiss significant chest pain in flight.</text></g></svg>