<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">WHAT DRY AIR IS MADE OF</text><rect x="100" y="190" width="1000" height="390" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><circle cx="390" cy="385" r="155" fill="#dbeafe"/><path d="M390 230 A155 155 0 1 1 240 424 L390 385 Z" fill="#06111f"/><path d="M390 385 L240 424 A155 155 0 0 1 390 230 Z" fill="#f4b400"/><g font-size="22" font-weight="700"><text x="655" y="300" fill="#06111f">NITROGEN ≈ 78%</text><text x="655" y="375" fill="#92400e">OXYGEN ≈ 21%</text><text x="655" y="450" fill="#475569">OTHER GASES ≈ 1%</text></g><text x="600" y="630" text-anchor="middle" fill="#475569" font-size="20">The percentages stay nearly constant with altitude, while total pressure and oxygen partial pressure fall.</text></g></svg>