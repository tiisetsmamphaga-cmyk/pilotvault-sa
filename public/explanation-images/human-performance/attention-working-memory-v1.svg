<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">ATTENTION AND WORKING MEMORY</text><rect x="95" y="185" width="1010" height="405" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g text-anchor="middle"><rect x="140" y="235" width="350" height="260" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="315" y="280" fill="#06111f" font-size="22" font-weight="700">SELECTIVE ATTENTION</text><text x="315" y="335" fill="#475569" font-size="18">Many inputs arrive</text><text x="315" y="370" fill="#475569" font-size="18">Only the important ones</text><text x="315" y="400" fill="#475569" font-size="18">receive focus</text><rect x="710" y="235" width="350" height="260" rx="18" fill="#06111f"/><text x="885" y="280" fill="#f4b400" font-size="22" font-weight="700">WORKING MEMORY</text><text x="885" y="335" fill="#fff" font-size="18">Limited capacity</text><text x="885" y="375" fill="#fff" font-size="26" font-weight="700">≈ 7 unrelated items</text><text x="885" y="420" fill="#fff" font-size="18">Chunking combines items</text></g><line x1="490" y1="365" x2="710" y2="365" stroke="#f4b400" stroke-width="7"/><polygon points="710,365 685,350 685,380" fill="#f4b400"/><text x="600" y="650" text-anchor="middle" fill="#475569" font-size="20">Good information management protects attention and reduces overload.</text></g></svg>