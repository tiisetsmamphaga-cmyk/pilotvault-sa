<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">AUTOKINESIS AND EMPTY-FIELD MYOPIA</text><g text-anchor="middle"><rect x="100" y="195" width="465" height="390" rx="24" fill="#06111f"/><text x="332" y="245" fill="#f4b400" font-size="23" font-weight="700">AUTOKINESIS</text><circle cx="332" cy="385" r="10" fill="#fff"/><path d="M265 340 C300 300 360 300 395 340 M265 430 C300 470 360 470 395 430" fill="none" stroke="#64748b" stroke-width="4" stroke-dasharray="10 8"/><text x="332" y="495" fill="#fff" font-size="19">Stationary light can appear to move</text><text x="332" y="525" fill="#cbd5e1" font-size="18">against a dark featureless background</text><rect x="635" y="195" width="465" height="390" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="868" y="245" fill="#06111f" font-size="23" font-weight="700">EMPTY-FIELD MYOPIA</text><circle cx="760" cy="385" r="65" fill="#fff" stroke="#06111f" stroke-width="4"/><circle cx="760" cy="385" r="18" fill="#06111f"/><line x1="825" y1="385" x2="990" y2="385" stroke="#f4b400" stroke-width="5"/><circle cx="900" cy="385" r="9" fill="#ef4444"/><text x="868" y="495" fill="#475569" font-size="19">With no clear target, the eyes rest</text><text x="868" y="525" fill="#475569" font-size="19">at a relatively short focus distance</text></g><text x="600" y="650" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">Keep scanning and use reliable visual or instrument references.</text></g></svg>