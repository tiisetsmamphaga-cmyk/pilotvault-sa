<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">AUTOKINESIS AND EMPTY-FIELD MYOPIA</text><g transform="translate(85 190)"><rect width="490" height="390" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="245" y="45" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">AUTOKINESIS</text><rect x="55" y="85" width="380" height="205" rx="14" fill="#06111f"/><circle cx="245" cy="185" r="9" fill="#f4b400"/><path d="M220 160 C180 125 165 210 210 225" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8 7"/><path d="M270 160 C315 125 330 210 280 225" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8 7"/><text x="245" y="325" text-anchor="middle" fill="#475569" font-size="18">A stationary light can appear to move</text><text x="245" y="353" text-anchor="middle" fill="#475569" font-size="18">against a dark, featureless background.</text><rect x="540" width="490" height="390" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="785" y="45" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">EMPTY-FIELD MYOPIA</text><circle cx="785" cy="180" r="95" fill="#fff" stroke="#64748b" stroke-width="3"/><circle cx="785" cy="180" r="18" fill="#06111f"/><line x1="610" y1="180" x2="750" y2="180" stroke="#f4b400" stroke-width="5"/><line x1="820" y1="180" x2="960" y2="180" stroke="#cbd5e1" stroke-width="5" stroke-dasharray="12 10"/><text x="785" y="315" text-anchor="middle" fill="#475569" font-size="18">With no clear object to focus on, the eyes</text><text x="785" y="343" text-anchor="middle" fill="#475569" font-size="18">settle at a short resting focus distance.</text></g><text x="600" y="645" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">KEEP A DELIBERATE VISUAL SCAN — DO NOT STARE AT A SINGLE LIGHT OR EMPTY SKY</text></g></svg>