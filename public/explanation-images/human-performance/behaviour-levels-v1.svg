<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">SKILL, RULE AND KNOWLEDGE-BASED BEHAVIOUR</text><rect x="80" y="185" width="1040" height="405" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g text-anchor="middle"><rect x="120" y="235" width="290" height="260" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="265" y="280" fill="#06111f" font-size="22" font-weight="700">SKILL-BASED</text><text x="265" y="335" fill="#475569" font-size="18">Well-practised action</text><text x="265" y="370" fill="#475569" font-size="18">little conscious attention</text><rect x="455" y="235" width="290" height="260" rx="18" fill="#06111f"/><text x="600" y="280" fill="#f4b400" font-size="22" font-weight="700">RULE-BASED</text><text x="600" y="335" fill="#fff" font-size="18">Apply stored procedures</text><text x="600" y="370" fill="#fff" font-size="18">and memorised rules</text><rect x="790" y="235" width="290" height="260" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="935" y="280" fill="#06111f" font-size="22" font-weight="700">KNOWLEDGE-BASED</text><text x="935" y="335" fill="#475569" font-size="18">Conscious reasoning</text><text x="935" y="370" fill="#475569" font-size="18">for novel situations</text></g><text x="600" y="650" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">Practice can turn a conscious procedure into an automatic motor programme.</text></g></svg>