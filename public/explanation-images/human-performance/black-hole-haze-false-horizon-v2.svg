<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="30" font-weight="800">VISUAL ILLUSIONS IN POOR REFERENCES</text><g text-anchor="middle"><rect x="75" y="190" width="320" height="390" rx="24" fill="#06111f"/><text x="235" y="235" fill="#f4b400" font-size="22" font-weight="700">BLACK-HOLE APPROACH</text><polygon points="145,500 325,500 290,405 180,405" fill="#475569"/><g fill="#fff"><circle cx="175" cy="420" r="5"/><circle cx="295" cy="420" r="5"/><circle cx="155" cy="485" r="5"/><circle cx="315" cy="485" r="5"/></g><path d="M100 340 Q235 440 370 340" fill="none" stroke="#ef4444" stroke-width="5"/><text x="235" y="545" fill="#fff" font-size="18">Tendency: approach too low</text><rect x="440" y="190" width="320" height="390" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="600" y="235" fill="#06111f" font-size="22" font-weight="700">HAZE</text><circle cx="600" cy="370" r="55" fill="#dbeafe" stroke="#94a3b8" stroke-width="3"/><circle cx="600" cy="370" r="12" fill="#06111f"/><circle cx="685" cy="370" r="20" fill="#cbd5e1"/><line x1="612" y1="370" x2="665" y2="370" stroke="#94a3b8" stroke-width="5"/><text x="600" y="475" fill="#475569" font-size="19">Reduced contrast makes objects</text><text x="600" y="505" fill="#475569" font-size="19">appear farther away</text><rect x="805" y="190" width="320" height="390" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="965" y="235" fill="#06111f" font-size="22" font-weight="700">FALSE HORIZON</text><line x1="855" y1="410" x2="1075" y2="330" stroke="#64748b" stroke-width="8"/><line x1="855" y1="370" x2="1075" y2="370" stroke="#f4b400" stroke-width="5" stroke-dasharray="12 10"/><path d="M955 330 l20 40 h-40 z" fill="#06111f"/><text x="965" y="475" fill="#475569" font-size="19">Sloping cloud or terrain can</text><text x="965" y="505" fill="#475569" font-size="19">be mistaken for level horizon</text></g><text x="600" y="650" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">When visual references are unreliable, trust the instruments and known approach cues.</text></g></svg>