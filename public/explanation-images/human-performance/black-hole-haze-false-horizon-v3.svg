<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="30" font-weight="800">WHEN VISUAL REFERENCES MISLEAD YOU</text><g transform="translate(65 185)"><g><rect width="335" height="390" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="167" y="45" text-anchor="middle" fill="#06111f" font-size="21" font-weight="700">BLACK-HOLE APPROACH</text><rect x="35" y="90" width="265" height="180" rx="12" fill="#06111f"/><polygon points="115,235 220,235 205,170 130,170" fill="#64748b"/><g fill="#f4b400"><circle cx="130" cy="205" r="4"/><circle cx="205" cy="205" r="4"/><circle cx="143" cy="185" r="4"/><circle cx="192" cy="185" r="4"/></g><path d="M70 140 C115 155 135 180 155 210" fill="none" stroke="#ef4444" stroke-width="5"/><text x="167" y="310" text-anchor="middle" fill="#475569" font-size="17">Few ground cues at night can make</text><text x="167" y="336" text-anchor="middle" fill="#475569" font-size="17">you feel too high.</text><text x="167" y="367" text-anchor="middle" fill="#92400e" font-size="18" font-weight="700">Risk: LOW approach / undershoot</text></g><g transform="translate(365 0)"><rect width="335" height="390" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="167" y="45" text-anchor="middle" fill="#06111f" font-size="21" font-weight="700">HAZE</text><rect x="35" y="90" width="265" height="180" rx="12" fill="#e2e8f0"/><circle cx="220" cy="165" r="28" fill="#94a3b8"/><path d="M60 235 L275 115" stroke="#cbd5e1" stroke-width="18" opacity="0.8"/><text x="167" y="310" text-anchor="middle" fill="#475569" font-size="17">Reduced contrast makes objects appear</text><text x="167" y="336" text-anchor="middle" fill="#475569" font-size="17">farther away than they really are.</text><text x="167" y="367" text-anchor="middle" fill="#92400e" font-size="18" font-weight="700">Do not judge distance by contrast alone</text></g><g transform="translate(730 0)"><rect width="335" height="390" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="167" y="45" text-anchor="middle" fill="#06111f" font-size="21" font-weight="700">FALSE HORIZON</text><rect x="35" y="90" width="265" height="180" rx="12" fill="#dbeafe"/><line x1="45" y1="225" x2="290" y2="145" stroke="#64748b" stroke-width="8"/><line x1="45" y1="190" x2="290" y2="190" stroke="#f4b400" stroke-width="4" stroke-dasharray="12 9"/><path d="M135 170 l65 20 l-65 20 l18-20 z" fill="#06111f"/><text x="167" y="310" text-anchor="middle" fill="#475569" font-size="17">Sloping clouds or lights may be mistaken</text><text x="167" y="336" text-anchor="middle" fill="#475569" font-size="17">for the true horizon.</text><text x="167" y="367" text-anchor="middle" fill="#92400e" font-size="18" font-weight="700">Cross-check the flight instruments</text></g></g><text x="600" y="645" text-anchor="middle" fill="#475569" font-size="19">Poor or misleading visual references can produce strong but incorrect perceptions of height, distance and attitude.</text></g></svg>