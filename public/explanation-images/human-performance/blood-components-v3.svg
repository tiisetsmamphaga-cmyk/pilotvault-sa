<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">WHAT EACH BLOOD COMPONENT DOES</text><rect x="85" y="185" width="1030" height="400" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g transform="translate(125 235)"><g><rect width="275" height="280" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="138" cy="110" r="58" fill="#ef4444"/><circle cx="138" cy="110" r="24" fill="#fff" opacity="0.28"/><text x="138" y="205" text-anchor="middle" fill="#06111f" font-size="21" font-weight="700">RED BLOOD CELLS</text><text x="138" y="240" text-anchor="middle" fill="#475569" font-size="18">Carry oxygen using haemoglobin</text></g><g transform="translate(330 0)"><rect width="275" height="280" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="138" cy="110" r="58" fill="#fff" stroke="#64748b" stroke-width="4"/><path d="M110 105 C120 70 160 75 164 108 C168 140 125 150 110 120Z" fill="#94a3b8"/><text x="138" y="205" text-anchor="middle" fill="#06111f" font-size="21" font-weight="700">WHITE BLOOD CELLS</text><text x="138" y="240" text-anchor="middle" fill="#475569" font-size="18">Defend against infection and disease</text></g><g transform="translate(660 0)"><rect width="275" height="280" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><g fill="#f4b400"><circle cx="110" cy="95" r="18"/><circle cx="150" cy="115" r="15"/><circle cx="125" cy="140" r="13"/><circle cx="165" cy="155" r="11"/></g><text x="138" y="205" text-anchor="middle" fill="#06111f" font-size="21" font-weight="700">PLATELETS</text><text x="138" y="240" text-anchor="middle" fill="#475569" font-size="18">Help form clots and stop bleeding</text></g></g><text x="600" y="640" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">RED = OXYGEN TRANSPORT · WHITE = DEFENCE · PLATELETS = CLOTTING</text></g></svg>