<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="32" font-weight="800">WHAT EACH BLOOD COMPONENT DOES</text><rect x="100" y="190" width="1000" height="390" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g text-anchor="middle"><circle cx="270" cy="350" r="72" fill="#ef4444"/><text x="270" y="345" fill="#fff" font-size="22" font-weight="700">RED CELLS</text><text x="270" y="382" fill="#fff" font-size="18">Carry oxygen</text><circle cx="600" cy="350" r="72" fill="#fff" stroke="#94a3b8" stroke-width="4"/><text x="600" y="345" fill="#06111f" font-size="21" font-weight="700">WHITE CELLS</text><text x="600" y="382" fill="#475569" font-size="18">Fight infection</text><circle cx="930" cy="350" r="72" fill="#f4b400"/><text x="930" y="345" fill="#06111f" font-size="22" font-weight="700">PLATELETS</text><text x="930" y="382" fill="#06111f" font-size="18">Help clot blood</text></g><path d="M215 490 C355 440 445 540 600 490 C755 440 845 540 985 490" fill="none" stroke="#06111f" stroke-width="10"/><text x="600" y="548" text-anchor="middle" fill="#475569" font-size="20">The circulatory system transports oxygen, nutrients, heat and waste products around the body.</text><text x="600" y="645" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">Red = oxygen · White = defence · Platelets = clotting</text></g></svg>