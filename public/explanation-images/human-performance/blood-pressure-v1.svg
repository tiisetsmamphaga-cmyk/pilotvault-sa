<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">SYSTOLIC AND DIASTOLIC PRESSURE</text><rect x="100" y="190" width="1000" height="390" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g text-anchor="middle"><rect x="170" y="245" width="360" height="250" rx="18" fill="#06111f"/><text x="350" y="295" fill="#f4b400" font-size="23" font-weight="700">SYSTOLIC</text><text x="350" y="345" fill="#fff" font-size="20">Higher reading</text><text x="350" y="385" fill="#fff" font-size="18">Pressure while the heart</text><text x="350" y="415" fill="#fff" font-size="18">contracts and ejects blood</text><rect x="670" y="245" width="360" height="250" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="850" y="295" fill="#06111f" font-size="23" font-weight="700">DIASTOLIC</text><text x="850" y="345" fill="#475569" font-size="20">Lower reading</text><text x="850" y="385" fill="#475569" font-size="18">Pressure while the heart</text><text x="850" y="415" fill="#475569" font-size="18">relaxes between beats</text></g><text x="600" y="650" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">Blood pressure is the force of blood against artery walls.</text></g></svg>