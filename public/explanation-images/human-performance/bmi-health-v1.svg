<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">BODY MASS INDEX</text><rect x="110" y="190" width="980" height="390" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="600" y="270" text-anchor="middle" fill="#06111f" font-size="30" font-weight="700">BMI = weight (kg) ÷ height² (m²)</text><rect x="250" y="325" width="700" height="125" rx="20" fill="#06111f"/><text x="600" y="375" text-anchor="middle" fill="#f4b400" font-size="25" font-weight="700">EXAMPLE: 90 kg ÷ (2.0 m × 2.0 m)</text><text x="600" y="420" text-anchor="middle" fill="#fff" font-size="32" font-weight="800">BMI = 22.5</text><text x="600" y="515" text-anchor="middle" fill="#475569" font-size="20">Severe obesity increases cardiovascular and hypertension risk.</text><text x="600" y="650" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">BMI is a screening measure, not a complete assessment of fitness to fly.</text></g></svg>