<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">WHY BRIGHT LIGHT AT ALTITUDE CAN HARM EYES</text><rect x="105" y="190" width="990" height="405" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><circle cx="300" cy="370" r="78" fill="#f4b400"/><g stroke="#f4b400" stroke-width="8"><line x1="300" y1="245" x2="300" y2="205"/><line x1="300" y1="535" x2="300" y2="495"/><line x1="175" y1="370" x2="135" y2="370"/><line x1="465" y1="370" x2="425" y2="370"/><line x1="210" y1="280" x2="180" y2="250"/><line x1="390" y1="460" x2="420" y2="490"/></g><path d="M395 330 H620" stroke="#60a5fa" stroke-width="12"/><path d="M395 375 H620" stroke="#7c3aed" stroke-width="12"/><text x="505" y="315" text-anchor="middle" fill="#1e3a8a" font-size="18" font-weight="700">BLUE LIGHT</text><text x="505" y="410" text-anchor="middle" fill="#6d28d9" font-size="18" font-weight="700">ULTRAVIOLET</text><path d="M760 300 Q700 370 760 440 Q860 485 930 370 Q860 255 760 300" fill="#fff" stroke="#06111f" stroke-width="5"/><circle cx="795" cy="370" r="28" fill="#06111f"/><path d="M635 330 L735 345 M635 375 L735 385" stroke="#f4b400" stroke-width="5"/><g fill="#475569" font-size="20"><text x="650" y="520">At altitude, exposure to intense sunlight and UV can be greater.</text><text x="650" y="555">Quality sunglasses reduce glare and harmful radiation.</text></g><text x="600" y="650" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">Protect the eyes from intense blue and ultraviolet radiation.</text></g></svg>