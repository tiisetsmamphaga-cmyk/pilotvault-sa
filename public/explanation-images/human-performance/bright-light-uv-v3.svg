<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">BRIGHT LIGHT, BLUE LIGHT AND UV EXPOSURE</text><rect x="90" y="185" width="1020" height="410" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g transform="translate(135 225)"><circle cx="120" cy="155" r="65" fill="#f4b400"/><g stroke="#f4b400" stroke-width="8"><line x1="120" y1="55" x2="120" y2="20"/><line x1="120" y1="255" x2="120" y2="290"/><line x1="20" y1="155" x2="-15" y2="155"/><line x1="220" y1="155" x2="255" y2="155"/><line x1="50" y1="85" x2="25" y2="60"/><line x1="190" y1="85" x2="215" y2="60"/><line x1="50" y1="225" x2="25" y2="250"/><line x1="190" y1="225" x2="215" y2="250"/></g><text x="120" y="162" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">SUN</text><path d="M240 120 H470" stroke="#60a5fa" stroke-width="8"/><polygon points="485,120 458,105 458,135" fill="#60a5fa"/><path d="M240 190 H470" stroke="#7c3aed" stroke-width="8"/><polygon points="485,190 458,175 458,205" fill="#7c3aed"/><text x="355" y="100" text-anchor="middle" fill="#1e3a8a" font-size="18" font-weight="700">BLUE LIGHT</text><text x="355" y="228" text-anchor="middle" fill="#6d28d9" font-size="18" font-weight="700">ULTRAVIOLET</text><ellipse cx="640" cy="155" rx="105" ry="75" fill="#fff" stroke="#64748b" stroke-width="4"/><circle cx="585" cy="155" r="21" fill="#06111f"/><path d="M725 95 Q760 155 725 215" fill="none" stroke="#ef4444" stroke-width="8"/><text x="640" y="270" text-anchor="middle" fill="#475569" font-size="18">At altitude there is less atmospheric filtering.</text><rect x="775" y="55" width="250" height="235" rx="18" fill="#06111f"/><text x="900" y="100" text-anchor="middle" fill="#f4b400" font-size="21" font-weight="700">PROTECTION</text><text x="900" y="145" text-anchor="middle" fill="#fff" font-size="18">Use suitable sunglasses</text><text x="900" y="178" text-anchor="middle" fill="#fff" font-size="18">with effective UV protection.</text><text x="900" y="225" text-anchor="middle" fill="#cbd5e1" font-size="17">Avoid staring into intense light.</text></g><text x="600" y="650" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">BRIGHT LIGHT AT ALTITUDE CAN CONTAIN A GREATER PROPORTION OF DAMAGING BLUE AND UV RADIATION</text></g></svg>