<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">WHY CARBON MONOXIDE IS DANGEROUS</text><rect x="90" y="185" width="1020" height="405" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g transform="translate(140 230)"><circle cx="180" cy="145" r="75" fill="#ef4444"/><text x="180" y="138" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">Hb</text><text x="180" y="170" text-anchor="middle" fill="#fff" font-size="17">haemoglobin</text><path d="M265 115 H385" stroke="#60a5fa" stroke-width="7"/><polygon points="400,115 375,101 375,129" fill="#60a5fa"/><circle cx="455" cy="115" r="42" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/><text x="455" y="123" text-anchor="middle" fill="#1e3a8a" font-size="23" font-weight="700">O₂</text><path d="M265 180 H385" stroke="#06111f" stroke-width="7"/><polygon points="400,180 375,166 375,194" fill="#06111f"/><circle cx="455" cy="180" r="42" fill="#06111f"/><text x="455" y="188" text-anchor="middle" fill="#f4b400" font-size="23" font-weight="700">CO</text><rect x="560" y="45" width="360" height="230" rx="20" fill="#06111f"/><text x="740" y="90" text-anchor="middle" fill="#f4b400" font-size="21" font-weight="700">WHAT HAPPENS</text><text x="740" y="135" text-anchor="middle" fill="#fff" font-size="18">CO binds strongly to haemoglobin,</text><text x="740" y="165" text-anchor="middle" fill="#fff" font-size="18">reducing oxygen transport to</text><text x="740" y="195" text-anchor="middle" fill="#fff" font-size="18">the brain and muscles.</text><text x="740" y="240" text-anchor="middle" fill="#cbd5e1" font-size="17">Headache · nausea · dizziness · weakness</text></g><text x="600" y="645" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">CO IS COLOURLESS AND ODOURLESS — UNEXPLAINED HEADACHE OR NAUSEA WITH CABIN HEAT IS A WARNING SIGN</text></g></svg>