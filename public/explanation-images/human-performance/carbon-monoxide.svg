<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="32" font-weight="800">WHY CARBON MONOXIDE IS DANGEROUS</text><rect x="105" y="185" width="990" height="405" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><circle cx="295" cy="365" r="90" fill="#ef4444"/><text x="295" y="352" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">Hb</text><text x="295" y="390" text-anchor="middle" fill="#fff" font-size="18">Haemoglobin</text><line x1="395" y1="330" x2="515" y2="270" stroke="#60a5fa" stroke-width="8"/><circle cx="560" cy="248" r="45" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/><text x="560" y="256" text-anchor="middle" fill="#1e3a8a" font-size="23" font-weight="700">O₂</text><line x1="395" y1="400" x2="515" y2="470" stroke="#06111f" stroke-width="8"/><circle cx="560" cy="490" r="45" fill="#06111f"/><text x="560" y="498" text-anchor="middle" fill="#f4b400" font-size="23" font-weight="700">CO</text><path d="M650 365 H820" stroke="#f4b400" stroke-width="8"/><polygon points="820,365 795,350 795,380" fill="#f4b400"/><rect x="825" y="260" width="220" height="210" rx="22" fill="#06111f"/><text x="935" y="315" text-anchor="middle" fill="#f4b400" font-size="22" font-weight="700">RESULT</text><text x="935" y="360" text-anchor="middle" fill="#fff" font-size="19">Less oxygen</text><text x="935" y="392" text-anchor="middle" fill="#fff" font-size="19">transported to</text><text x="935" y="424" text-anchor="middle" fill="#fff" font-size="19">brain &amp; muscles</text><text x="600" y="635" text-anchor="middle" fill="#475569" font-size="20">CO is colourless and odourless and binds strongly