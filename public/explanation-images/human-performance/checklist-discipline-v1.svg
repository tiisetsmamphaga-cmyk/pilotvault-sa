<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">CHECKLIST DISCIPLINE AFTER AN INTERRUPTION</text><rect x="110" y="185" width="980" height="415" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g font-size="22"><rect x="190" y="245" width="320" height="250" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="350" y="290" text-anchor="middle" fill="#06111f" font-weight="700">INTERRUPTION</text><text x="225" y="345" fill="#475569">1. Stop the sequence</text><text x="225" y="390" fill="#475569">2. Resolve the interruption</text><text x="225" y="435" fill="#475569">3. Re-orient yourself</text><rect x="690" y="245" width="320" height="250" rx="18" fill="#06111f"/><text x="850" y="290" text-anchor="middle" fill="#f4b400" font-weight="700">RESTART SAFELY</text><text x="725" y="345" fill="#fff">Restart at least one item</text><text x="725" y="385" fill="#fff">before the interruption point.</text><text x="725" y="435" fill="#f4b400" font-weight="700">Do not rush for ATC.</text></g><line x1="510" y1="370" x2="690" y2="370" stroke="#f4b400" stroke-width="7"/><polygon points="690,370 665,355 665,385" fill="#f4b400"/><text x="600" y="655" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">Complete the checks correctly before accepting the next phase of flight.</text></g></svg>