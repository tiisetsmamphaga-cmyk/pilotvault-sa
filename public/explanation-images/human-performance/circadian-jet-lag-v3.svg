<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">HOW JET LAG SHIFTS THE BODY CLOCK</text><rect x="85" y="185" width="1030" height="405" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g transform="translate(125 225)"><circle cx="465" cy="165" r="105" fill="#fff" stroke="#06111f" stroke-width="4"/><g stroke="#06111f" stroke-width="3"><line x1="465" y1="70" x2="465" y2="88"/><line x1="465" y1="242" x2="465" y2="260"/><line x1="370" y1="165" x2="388" y2="165"/><line x1="542" y1="165" x2="560" y2="165"/></g><line x1="465" y1="165" x2="465" y2="105" stroke="#06111f" stroke-width="7"/><line x1="465" y1="165" x2="515" y2="195" stroke="#f4b400" stroke-width="7"/><text x="465" y="315" text-anchor="middle" fill="#06111f" font-size="20" font-weight="700">INTERNAL BODY CLOCK</text><path d="M340 155 C260 135 215 100 180 55" fill="none" stroke="#f4b400" stroke-width="7"/><polygon points="170,42 198,54 178,73" fill="#f4b400"/><text x="150" y="105" text-anchor="middle" fill="#06111f" font-size="21" font-weight="700">WESTWARD</text><text x="150" y="140" text-anchor="middle" fill="#475569" font-size="17">Local bedtime becomes later</text><text x="150" y="170" text-anchor="middle" fill="#475569" font-size="17">→ delay the body clock</text><text x="150" y="215" text-anchor="middle" fill="#92400e" font-size="18" font-weight="700">Usually easier to adapt</text><path d="M590 155 C670 135 715 100 750 55" fill="none" stroke="#ef4444" stroke-width="7"/><polygon points="760,42 732,54 752,73" fill="#ef4444"/><text x="800" y="105" text-anchor="middle" fill="#06111f" font-size="21" font-weight="700">EASTWARD</text><text x="800" y="140" text-anchor="middle" fill="#475569" font-size="17">Local bedtime becomes earlier</text><text x="800" y="170" text-anchor="middle" fill="#475569" font-size="17">→ advance the body clock</text><text x="800" y="215" text-anchor="middle" fill="#92400e" font-size="18" font-weight="700">Usually harder to adapt</text></g><text x="600" y="645" text-anchor="middle" fill="#475569" font-size="19">Most people adjust more easily by staying awake later than by trying to sleep significantly earlier.</text></g></svg>