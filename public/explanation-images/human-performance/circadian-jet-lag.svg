<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="32" font-weight="800">HOW JET LAG SHIFTS THE BODY CLOCK</text><rect x="100" y="200" width="1000" height="360" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><circle cx="600" cy="380" r="120" fill="#fff" stroke="#06111f" stroke-width="4"/><line x1="600" y1="380" x2="600" y2="295" stroke="#06111f" stroke-width="7"/><line x1="600" y1="380" x2="665" y2="420" stroke="#f4b400" stroke-width="7"/><g fill="#475569" font-size="18" text-anchor="middle"><text x="600" y="235">LOCAL TIME</text><text x="790" y="315">EASTWARD</text><text x="410" y="315">WESTWARD</text></g><path d="M780 390 C860 350 900 300 925 245" fill="none" stroke="#ef4444" stroke-width="7"/><polygon points="925,245 900,255 918,274" fill="#ef4444"/><path d="M420 390 C340 350 300 300 275 245" fill="none" stroke="#f4b400" stroke-width="7"/><polygon points="275,245 300,255 282,274" fill="#f4b400"/><text x="875" y="470" text-anchor="middle" fill="#475569" font-size="20">Advance sleep earlier</text><text x="325" y="470" text-anchor="middle" fill="#475569" font-size="20">Delay sleep later</text><text x="600" y="625" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">Most people adjust more easily by delaying sleep than by advancing it.</text></g></svg>