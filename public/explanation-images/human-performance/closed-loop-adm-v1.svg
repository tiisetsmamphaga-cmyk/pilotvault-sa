<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">CLOSED-LOOP DECISION MAKING</text><rect x="100" y="190" width="1000" height="390" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g text-anchor="middle"><rect x="150" y="280" width="220" height="140" rx="18" fill="#06111f"/><text x="260" y="335" fill="#f4b400" font-size="22" font-weight="700">DECIDE</text><text x="260" y="375" fill="#fff" font-size="18">Choose an action</text><rect x="490" y="280" width="220" height="140" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="335" fill="#06111f" font-size="22" font-weight="700">ACT</text><text x="600" y="375" fill="#475569" font-size="18">Apply the control</text><rect x="830" y="280" width="220" height="140" rx="18" fill="#06111f"/><text x="940" y="335" fill="#f4b400" font-size="22" font-weight="700">COMPARE</text><text x="940" y="375" fill="#fff" font-size="18">Result vs desired state</text></g><line x1="370" y1="350" x2="490" y2="350" stroke="#f4b400" stroke-width="7"/><polygon points="490,350 465,335 465,365" fill="#f4b400"/><line x1="710" y1="350" x2="830" y2="350" stroke="#f4b400" stroke-width="7"/><polygon points="830,350 805,335 805,365" fill="#f4b400"/><path d="M940 430 C940 525 260 525 260 430" fill="none" stroke="#64748b" stroke-width="6"/><polygon points="260,430 245,455 275,455" fill="#64748b"/><text x="600" y="545" text-anchor="middle" fill="#475569" font-size="19">Feedback closes the loop and supports correction.</text><text x="600" y="650" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">If conditions are unsafe, the correct decision may be to stop or reschedule.</text></g></svg>