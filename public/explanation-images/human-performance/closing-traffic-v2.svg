<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">WHY HEAD-ON TRAFFIC CAN SURPRISE YOU</text><rect x="95" y="190" width="1010" height="390" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g text-anchor="middle"><path d="M185 385 l80 -35 l-20 35 l20 35 z" fill="#06111f"/><path d="M1015 385 l-80 -35 l20 35 l-20 35 z" fill="#06111f"/><line x1="285" y1="385" x2="915" y2="385" stroke="#f4b400" stroke-width="6" stroke-dasharray="16 14"/><text x="600" y="330" fill="#06111f" font-size="26" font-weight="700">CLOSING SPEED = BOTH AIRCRAFT SPEEDS ADDED</text><text x="600" y="435" fill="#475569" font-size="21">A head-on aircraft stays near the same bearing and looks small for longer than expected.</text><text x="600" y="485" fill="#475569" font-size="21">Its apparent size increases rapidly only close to impact.</text><rect x="360" y="525" width="480" height="80" rx="18" fill="#06111f"/><text x="600" y="575" fill="#f4b400" font-size="23" font-weight="700">3 km at 180 kt closing ≈ 34 seconds</text></g><text x="600" y="655" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">Constant bearing + increasing size = collision threat.</text></g></svg>