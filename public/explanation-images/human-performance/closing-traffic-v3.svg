<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">WHY HEAD-ON TRAFFIC CAN BE HARD TO SEE</text><rect x="90" y="185" width="1020" height="410" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g transform="translate(140 230)"><text x="205" y="0" text-anchor="middle" fill="#06111f" font-size="21" font-weight="700">EARLY</text><circle cx="205" cy="130" r="20" fill="#06111f"/><path d="M150 130 H260 M180 112 L205 130 L180 148 M230 112 L205 130 L230 148" stroke="#06111f" stroke-width="5" fill="none"/><text x="205" y="205" text-anchor="middle" fill="#475569" font-size="18">Aircraft appears very small.</text><text x="205" y="235" text-anchor="middle" fill="#475569" font-size="18">Relative movement may be slight.</text><path d="M390 130 H520" stroke="#f4b400" stroke-width="7"/><polygon points="520,130 495,115 495,145" fill="#f4b400"/><text x="645" y="0" text-anchor="middle" fill="#06111f" font-size="21" font-weight="700">SECONDS LATER</text><circle cx="645" cy="130" r="52" fill="#06111f"/><path d="M540 130 H750 M585 92 L645 130 L585 168 M705 92 L645 130 L705 168" stroke="#06111f" stroke-width="8" fill="none"/><text x="645" y="215" text-anchor="middle" fill="#475569" font-size="18">Image size increases rapidly</text><text x="645" y="245" text-anchor="middle" fill="#475569" font-size="18">near the collision point.</text></g><rect x="235" y="510" width="730" height="60" rx="14" fill="#06111f"/><text x="600" y="548" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">TIME TO IMPACT = DISTANCE ÷ COMBINED CLOSING SPEED</text><text x="600" y="655" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">USE AN ACTIVE SCAN — A CONSTANT-BEARING TARGET WITH GROWING SIZE IS A COLLISION WARNING</text></g></svg>