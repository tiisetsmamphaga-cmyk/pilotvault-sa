<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">WHERE CARBON MONOXIDE COMES FROM</text><rect x="90" y="185" width="1020" height="405" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g text-anchor="middle"><rect x="140" y="235" width="260" height="250" rx="18" fill="#06111f"/><text x="270" y="280" fill="#f4b400" font-size="22" font-weight="700">SOURCE</text><text x="270" y="330" fill="#fff" font-size="18">Leaking exhaust</text><text x="270" y="365" fill="#fff" font-size="18">or heater system</text><rect x="470" y="235" width="260" height="250" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="280" fill="#06111f" font-size="22" font-weight="700">WHY HIDDEN</text><text x="600" y="330" fill="#475569" font-size="18">Colourless</text><text x="600" y="365" fill="#475569" font-size="18">and odourless</text><rect x="800" y="235" width="260" height="250" rx="18" fill="#06111f"/><text x="930" y="280" fill="#f4b400" font-size="22" font-weight="700">BODY EFFECT</text><text x="930" y="330" fill="#fff" font-size="18">Binds strongly to</text><text x="930" y="365" fill="#fff" font-size="18">haemoglobin</text><text x="930" y="410" fill="#f4b400" font-size="18" font-weight="700">Less O₂ delivered</text></g><text x="600" y="645" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">Early clues can include headache, nausea and weakness.</text></g></svg>