<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">GOOD COCKPIT DISPLAY AND CONTROL DESIGN</text><rect x="90" y="185" width="1020" height="405" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g text-anchor="middle"><rect x="145" y="235" width="420" height="280" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="355" y="280" fill="#06111f" font-size="22" font-weight="700">ANALOGUE DISPLAY</text><circle cx="355" cy="380" r="75" fill="#fff" stroke="#06111f" stroke-width="4"/><line x1="355" y1="380" x2="405" y2="335" stroke="#f4b400" stroke-width="7"/><text x="355" y="490" fill="#475569" font-size="18">Best for trend and rate of change</text><rect x="635" y="235" width="420" height="280" rx="20" fill="#06111f"/><text x="845" y="280" fill="#f4b400" font-size="22" font-weight="700">CONTROL DESIGN</text><text x="845" y="340" fill="#fff" font-size="18">Standardise position, direction,</text><text x="845" y="375" fill="#fff" font-size="18">shape and operating sense</text><text x="845" y="430" fill="#f4b400" font-size="18" font-weight="700">Reduce confusion under workload</text></g><text x="600" y="650" text-anchor="middle" fill="#475569" font-size="20">Human-centred design makes important information easy to recognise and act on.</text></g></svg>