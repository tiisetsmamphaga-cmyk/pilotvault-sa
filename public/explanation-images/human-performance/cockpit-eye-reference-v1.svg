<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">WHY EYE POSITION MATTERS IN THE COCKPIT</text><rect x="85" y="175" width="1030" height="455" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g text-anchor="middle"><rect x="130" y="225" width="420" height="330" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="340" y="265" fill="#06111f" font-size="22" font-weight="700">TOO LOW</text><circle cx="340" cy="350" r="28" fill="#06111f"/><line x1="340" y1="350" x2="510" y2="315" stroke="#f4b400" stroke-width="5"/><rect x="430" y="390" width="90" height="75" fill="#64748b"/><text x="340" y="505" fill="#475569" font-size="18">Undershoot area can be hidden</text><rect x="650" y="225" width="420" height="330" rx="20" fill="#06111f"/><text x="860" y="265" fill="#f4b400" font-size="22" font-weight="700">TOO HIGH</text><circle cx="860" cy="325" r="28" fill="#fff"/><line x1="860" y1="325" x2="1030" y2="295" stroke="#f4b400" stroke-width="5"/><rect x="950" y="390" width="90" height="75" fill="#fff"/><text x="860" y="492" fill="#fff" font-size="18">Better downward view, but some</text><text x="860" y="520" fill="#fff" font-size="18">instruments/upward view may suffer</text></g><text x="600" y="675" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">Use the aircraft’s correct eye-reference position before judging approach picture.</text></g></svg>