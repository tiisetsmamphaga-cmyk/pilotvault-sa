<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">DALTON’S LAW OF PARTIAL PRESSURES</text><rect x="105" y="190" width="990" height="390" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g text-anchor="middle"><rect x="165" y="245" width="250" height="215" rx="18" fill="#06111f"/><text x="290" y="295" fill="#f4b400" font-size="22" font-weight="700">N₂</text><text x="290" y="350" fill="#fff" font-size="19">Partial pressure</text><rect x="475" y="245" width="250" height="215" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="295" fill="#06111f" font-size="22" font-weight="700">O₂</text><text x="600" y="350" fill="#475569" font-size="19">Partial pressure</text><rect x="785" y="245" width="250" height="215" rx="18" fill="#06111f"/><text x="910" y="295" fill="#f4b400" font-size="22" font-weight="700">OTHER</text><text x="910" y="350" fill="#fff" font-size="19">Partial pressures</text></g><text x="600" y="515" text-anchor="middle" fill="#06111f" font-size="26" font-weight="700">TOTAL PRESSURE = sum of all partial pressures</text><text x="600" y="650" text-anchor="middle" fill="#475569" font-size="20">As total atmospheric pressure falls with altitude, each gas partial pressure falls too.</text></g></svg>