<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">DECOMPRESSION SICKNESS EFFECTS</text><rect x="85" y="185" width="1030" height="405" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g text-anchor="middle"><rect x="125" y="240" width="285" height="250" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="268" y="285" fill="#06111f" font-size="22" font-weight="700">THE CREEPS</text><text x="268" y="340" fill="#475569" font-size="18">Nitrogen bubbles</text><text x="268" y="375" fill="#475569" font-size="18">in the skin</text><text x="268" y="415" fill="#92400e" font-size="18">itching / crawling</text><rect x="458" y="240" width="285" height="250" rx="18" fill="#06111f"/><text x="600" y="285" fill="#f4b400" font-size="22" font-weight="700">THE BENDS</text><text x="600" y="340" fill="#fff" font-size="18">Nitrogen bubbles</text><text x="600" y="375" fill="#fff" font-size="18">around joints</text><text x="600" y="415" fill="#f4b400" font-size="18">joint pain</text><rect x="790" y="240" width="285" height="250" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="932" y="285" fill="#06111f" font-size="22" font-weight="700">THE CHOKES</text><text x="932" y="340" fill="#475569" font-size="18">Nitrogen bubbles</text><text x="932" y="375" fill="#475569" font-size="18">affecting lungs</text><text x="932" y="415" fill="#92400e" font-size="18">breathing symptoms</text></g><text x="600" y="650" text-anchor="middle" fill="#475569" font-size="20">Rapid pressure reduction can allow dissolved nitrogen to form bubbles in tissues.</text></g></svg>