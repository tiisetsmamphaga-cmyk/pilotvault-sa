<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">HOW SOUND TRAVELS THROUGH THE EAR</text><rect x="85" y="190" width="1030" height="400" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g text-anchor="middle"><text x="230" y="235" fill="#06111f" font-size="22" font-weight="700">OUTER EAR</text><path d="M140 390 Q180 300 245 350 Q280 390 235 455 Q175 500 145 430" fill="#dbeafe" stroke="#60a5fa" stroke-width="4"/><line x1="245" y1="390" x2="360" y2="390" stroke="#06111f" stroke-width="7"/><text x="470" y="235" fill="#06111f" font-size="22" font-weight="700">MIDDLE EAR</text><circle cx="420" cy="390" r="24" fill="#f4b400"/><circle cx="475" cy="390" r="20" fill="#f4b400"/><circle cx="525" cy="390" r="16" fill="#f4b400"/><line x1="525" y1="390" x2="590" y2="390" stroke="#06111f" stroke-width="6"/><text x="470" y="485" fill="#475569" font-size="18">Ossicles transmit vibration</text><text x="805" y="235" fill="#06111f" font-size="22" font-weight="700">INNER EAR</text><path d="M670 390 C670 310 790 310 790 390 C790 465 700 485 700 420 C700 370 760 360 765 405" fill="none" stroke="#ef4444" stroke-width="12"/><text x="730" y="505" fill="#475569" font-size="18">Cochlea converts vibration</text><text x="730" y="532" fill="#475569" font-size="18">to electrical nerve signals</text><line x1="800" y1="390" x2="950" y2="330" stroke="#f4b400" stroke-width="6"/><text x="980" y="320" fill="#06111f" font-size="19" font-weight="700">AUDITORY NERVE</text><path d="M485 420 Q505 515 560 550" fill="none" stroke="#64748b" stroke-width="7"/><text x="570" y="575" fill="#475569" font-size="18">Eustachian tube equalises pressure</text></g><text x="600" y="650" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">Outer collects · Middle transmits · Inner converts · Nerve carries to brain</text></g></svg>