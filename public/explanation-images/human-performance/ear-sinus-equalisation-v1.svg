<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">EAR AND SINUS PRESSURE ON DESCENT</text><rect x="95" y="185" width="1010" height="405" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g text-anchor="middle"><rect x="145" y="235" width="360" height="270" rx="18" fill="#06111f"/><text x="325" y="280" fill="#f4b400" font-size="22" font-weight="700">DESCENT</text><text x="325" y="335" fill="#fff" font-size="18">Outside pressure rises</text><text x="325" y="370" fill="#fff" font-size="18">trapped gas must equalise</text><text x="325" y="420" fill="#f4b400" font-size="18" font-weight="700">Blocked sinuses → pain</text><rect x="695" y="235" width="360" height="270" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="875" y="280" fill="#06111f" font-size="22" font-weight="700">VALSALVA</text><text x="875" y="335" fill="#475569" font-size="18">Gentle pressure helps open</text><text x="875" y="370" fill="#475569" font-size="18">the Eustachian tubes</text><text x="875" y="420" fill="#92400e" font-size="18" font-weight="700">Equalises middle-ear pressure</text></g><line x1="505" y1="370" x2="695" y2="370" stroke="#f4b400" stroke-width="7"/><polygon points="695,370 670,355 670,385" fill="#f4b400"/><text x="600" y="650" text-anchor="middle" fill="#475569" font-size="20">Do not fly with significant congestion when pressure equalisation may be impaired.</text></g></svg>