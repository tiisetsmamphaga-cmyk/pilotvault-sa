<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">COMMON HUMAN-ERROR TRAPS</text><rect x="80" y="185" width="1040" height="405" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g text-anchor="middle"><rect x="115" y="230" width="290" height="275" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="260" y="275" fill="#06111f" font-size="21" font-weight="700">ACTION SLIP</text><text x="260" y="330" fill="#475569" font-size="18">Decision is correct</text><text x="260" y="365" fill="#475569" font-size="18">physical action is wrong</text><rect x="455" y="230" width="290" height="275" rx="18" fill="#06111f"/><text x="600" y="275" fill="#f4b400" font-size="21" font-weight="700">CONFIRMATION BIAS</text><text x="600" y="330" fill="#fff" font-size="18">Notice supporting evidence</text><text x="600" y="365" fill="#fff" font-size="18">ignore conflicting evidence</text><rect x="795" y="230" width="290" height="275" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="940" y="275" fill="#06111f" font-size="21" font-weight="700">HAZARDOUS ATTITUDE</text><text x="940" y="325" fill="#475569" font-size="18">Impulsivity: act now</text><text x="940" y="360" fill="#475569" font-size="18">Anti-authority: rules</text><text x="940" y="390" fill="#475569" font-size="18">do not apply to me</text></g><text x="600" y="650" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">Recognising the trap early creates time to correct it.</text></g></svg>