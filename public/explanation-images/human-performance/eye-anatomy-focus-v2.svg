<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">HOW THE EYE FOCUSES AND SEES DETAIL</text><ellipse cx="455" cy="385" rx="250" ry="165" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><path d="M225 385 Q275 265 330 385 Q275 505 225 385" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/><ellipse cx="342" cy="385" rx="35" ry="70" fill="#fff" stroke="#06111f" stroke-width="4"/><circle cx="288" cy="385" r="25" fill="#06111f"/><path d="M620 280 Q690 385 620 490" fill="none" stroke="#ef4444" stroke-width="9"/><circle cx="610" cy="385" r="10" fill="#f4b400"/><line x1="342" y1="385" x2="610" y2="385" stroke="#f4b400" stroke-width="5"/><g fill="#06111f" font-size="20" font-weight="700"><text x="248" y="235">IRIS / PUPIL</text><text x="315" y="555">LENS</text><text x="590" y="235">RETINA</text><text x="650" y="390">FOVEA</text></g><g fill="#475569" font-size="19"><text x="760" y="265">Iris controls pupil size and light entry.</text><text x="760" y="325">Lens changes curvature for accommodation.</text><text x="760" y="385">Retina contains rods and cones.</text><text x="760" y="445">Fovea gives greatest visual acuity.</text><text x="760" y="505">Clear detail depends on accurate focus.</text></g><text x="600" y="650" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">Iris = light control · Lens = focus · Retina = sensing · Fovea = sharpest detail</text></g></svg>