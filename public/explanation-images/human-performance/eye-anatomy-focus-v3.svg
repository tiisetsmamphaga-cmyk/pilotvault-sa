<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">HOW THE EYE FOCUSES AND SEES DETAIL</text><rect x="70" y="175" width="1060" height="445" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g transform="translate(95 205)"><path d="M70 210 C120 70 320 35 455 130 C545 195 545 225 455 290 C320 385 120 350 70 210Z" fill="#eef6ff" stroke="#64748b" stroke-width="4"/><path d="M70 210 C105 145 135 145 170 210 C135 275 105 275 70 210Z" fill="#dbeafe" stroke="#60a5fa" stroke-width="4"/><circle cx="142" cy="210" r="22" fill="#06111f"/><ellipse cx="205" cy="210" rx="30" ry="62" fill="#fff" stroke="#06111f" stroke-width="4"/><path d="M455 130 Q505 210 455 290" fill="none" stroke="#ef4444" stroke-width="10"/><circle cx="447" cy="210" r="9" fill="#f4b400"/><line x1="20" y1="150" x2="447" y2="210" stroke="#f4b400" stroke-width="4"/><line x1="20" y1="270" x2="447" y2="210" stroke="#f4b400" stroke-width="4"/><g stroke="#64748b" stroke-width="2"><line x1="142" y1="165" x2="95" y2="95"/><line x1="205" y1="148" x2="205" y2="78"/><line x1="455" y1="145" x2="520" y2="85"/><line x1="447" y1="210" x2="535" y2="210"/></g><g fill="#06111f" font-size="18" font-weight="700"><text x="55" y="83">PUPIL / IRIS</text><text x="205" y="65" text-anchor="middle">LENS</text><text x="525" y="78">RETINA</text><text x="545" y="216">FOVEA</text></g></g><g transform="translate(690 215)"><rect width="375" height="335" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="28" y="50" fill="#06111f" font-size="20" font-weight="700">WHAT EACH PART DOES</text><g fill="#475569" font-size="18"><text x="28" y="98">Iris changes pupil size to control light.</text><text x="28" y="145">Lens changes shape to focus near or far.</text><text x="28" y="192">Retina contains the light-sensitive cells.</text><text x="28" y="239">Fovea is cone-rich and gives sharp detail.</text><text x="28" y="286">Rods support peripheral and night vision.</text></g></g><text x="600" y="665" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">IRIS = LIGHT CONTROL · LENS = FOCUS · RETINA = SENSING · FOVEA = SHARPEST DETAIL</text></g></svg>