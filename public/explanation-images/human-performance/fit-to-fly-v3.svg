<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">ARE YOU FIT TO FLY?</text><rect x="95" y="185" width="1010" height="405" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g transform="translate(155 225)" font-size="20"><g fill="#06111f" font-weight="700"><text x="0" y="40">CHECK BEFORE FLIGHT</text></g><g fill="#475569"><text x="0" y="95">□ Illness or pain affecting performance?</text><text x="0" y="145">□ Medication with sedating or impairing effects?</text><text x="0" y="195">□ Fatigue, poor sleep or dehydration?</text><text x="0" y="245">□ Alcohol, drugs or other impairing substances?</text><text x="0" y="295">□ Stress or emotion reducing judgement?</text></g><rect x="650" y="20" width="255" height="285" rx="24" fill="#06111f"/><circle cx="778" cy="115" r="65" fill="#fff"/><path d="M740 115 L770 145 L820 90" fill="none" stroke="#f4b400" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><text x="778" y="220" text-anchor="middle" fill="#f4b400" font-size="22" font-weight="700">SAFE DECISION</text><text x="778" y="255" text-anchor="middle" fill="#fff" font-size="17">If impairment is possible,</text><text x="778" y="282" text-anchor="middle" fill="#fff" font-size="17">do not act as flight crew.</text></g><text x="600" y="650" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">FITNESS TO FLY IS ABOUT PERFORMANCE AND JUDGEMENT, NOT JUST WHETHER YOU FEEL “SICK”</text></g></svg>