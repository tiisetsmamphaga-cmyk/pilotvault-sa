<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="32" font-weight="800">FIT TO FLY?</text><rect x="120" y="190" width="960" height="405" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g font-size="21" fill="#475569"><text x="210" y="265">✓ Illness or pain controlled?</text><text x="210" y="325">✓ Medication compatible with flying?</text><text x="210" y="385">✓ Adequately rested and hydrated?</text><text x="210" y="445">✓ No alcohol or impairing substances?</text><text x="210" y="505">✓ Emotionally and mentally fit to operate?</text></g><circle cx="895" cy="375" r="110" fill="#06111f"/><path d="M835 375 L880 420 L960 315" fill="none" stroke="#f4b400" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="650" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">If your condition could impair judgement or performance, do not fly until fit.</text></g></svg>