<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">WAIT BEFORE YOU FLY</text><rect x="95" y="185" width="1010" height="405" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g text-anchor="middle"><rect x="135" y="235" width="290" height="260" rx="20" fill="#06111f"/><text x="280" y="280" fill="#f4b400" font-size="22" font-weight="700">BLOOD DONATION</text><text x="280" y="355" fill="#fff" font-size="38" font-weight="800">72 h</text><text x="280" y="410" fill="#fff" font-size="18">minimum before acting as crew</text><rect x="455" y="235" width="290" height="260" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="280" fill="#06111f" font-size="22" font-weight="700">SCUBA → &gt;8 000 ft</text><text x="600" y="355" fill="#92400e" font-size="38" font-weight="800">24 h</text><text x="600" y="410" fill="#475569" font-size="18">recommended after any dive</text><rect x="775" y="235" width="290" height="260" rx="20" fill="#06111f"/><text x="920" y="280" fill="#f4b400" font-size="22" font-weight="700">ALCOHOL</text><text x="920" y="350" fill="#fff" font-size="30" font-weight="800">≈1 h / unit</text><text x="920" y="410" fill="#fff" font-size="18">elimination is slow and variable</text></g><text x="600" y="650" text-anchor="middle" fill="#475569" font-size="20">A legal minimum does not replace a fit-to-fly judgement.</text></g></svg>