<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">HEARING LOSS, NOISE AND TINNITUS</text><rect x="100" y="190" width="1000" height="405" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g text-anchor="middle"><rect x="150" y="245" width="260" height="230" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="280" y="290" fill="#06111f" font-size="22" font-weight="700">NORMAL RANGE</text><text x="280" y="350" fill="#f4b400" font-size="30" font-weight="800">20–20 000 Hz</text><text x="280" y="405" fill="#475569" font-size="18">Healthy young person</text><rect x="470" y="245" width="260" height="230" rx="22" fill="#06111f"/><text x="600" y="290" fill="#f4b400" font-size="22" font-weight="700">NOISE DAMAGE</text><text x="600" y="350" fill="#fff" font-size="30" font-weight="800">≈ 90 dB+</text><text x="600" y="405" fill="#cbd5e1" font-size="18">Continuous exposure may</text><text x="600" y="432" fill="#cbd5e1" font-size="18">cause permanent inner-ear loss</text><rect x="790" y="245" width="260" height="230" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="920" y="290" fill="#06111f" font-size="22" font-weight="700">TERMS</text><text x="920" y="340" fill="#475569" font-size="18">Presbycusis = age-related loss</text><text x="920" y="385" fill="#475569" font-size="18">Tinnitus = ringing / buzzing</text><text x="920" y="430" fill="#475569" font-size="18">Conductive = outer/middle ear</text></g><text x="600" y="650" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">Noise-induced damage usually involves the inner ear and may be permanent.</text></g></svg>