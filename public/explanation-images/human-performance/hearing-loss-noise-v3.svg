<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">CONDUCTIVE VS SENSORINEURAL HEARING LOSS</text><g transform="translate(80 185)"><g><rect width="500" height="390" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="250" y="45" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">CONDUCTIVE LOSS</text><path d="M70 165 C85 100 150 95 175 135 C195 170 165 215 120 220 C80 225 65 200 70 165Z" fill="#dbeafe" stroke="#60a5fa" stroke-width="4"/><line x1="175" y1="165" x2="260" y2="165" stroke="#06111f" stroke-width="7"/><g fill="#f4b400" stroke="#06111f" stroke-width="2"><circle cx="300" cy="165" r="18"/><circle cx="345" cy="165" r="15"/></g><path d="M365 165 H420" stroke="#cbd5e1" stroke-width="6" stroke-dasharray="10 8"/><text x="250" y="265" text-anchor="middle" fill="#475569" font-size="18">Problem in the outer or middle ear.</text><text x="250" y="295" text-anchor="middle" fill="#475569" font-size="18">Sound transmission is reduced.</text><text x="250" y="340" text-anchor="middle" fill="#92400e" font-size="18" font-weight="700">May be temporary or treatable</text></g><g transform="translate(540 0)"><rect width="500" height="390" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="250" y="45" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">SENSORINEURAL LOSS</text><path d="M120 165 C120 105 210 95 250 135 C290 175 260 225 215 225 C175 225 160 195 180 170 C200 145 235 150 240 180" fill="none" stroke="#ef4444" stroke-width="11"/><g stroke="#64748b" stroke-width="4"><line x1="145" y1="130" x2="130" y2="110"/><line x1="165" y1="115" x2="155" y2="90"/><line x1="190" y1="110" x2="190" y2="82"/><line x1="215" y1="115" x2="225" y2="90"/></g><path d="M300 165 H400" stroke="#f4b400" stroke-width="7"/><polygon points="415,165 390,152 390,178" fill="#f4b400"/><text x="250" y="265" text-anchor="middle" fill="#475569" font-size="18">Damage to the cochlea or auditory nerve.</text><text x="250" y="295" text-anchor="middle" fill="#475569" font-size="18">Noise exposure is a common cause.</text><text x="250" y="340" text-anchor="middle" fill="#92400e" font-size="18" font-weight="700">Often permanent</text></g></g><rect x="250" y="600" width="700" height="58" rx="14" fill="#06111f"/><text x="600" y="637" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">CONTINUOUS EXPOSURE AROUND 90 dB OR MORE CAN DAMAGE HEARING</text></g></svg>