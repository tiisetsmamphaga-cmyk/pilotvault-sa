<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">HOW THE HEART DRIVES CIRCULATION</text><rect x="95" y="185" width="1010" height="405" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g text-anchor="middle"><circle cx="410" cy="385" r="120" fill="#fff" stroke="#ef4444" stroke-width="6"/><text x="410" y="355" fill="#06111f" font-size="22" font-weight="700">HEART</text><text x="410" y="395" fill="#475569" font-size="18">Ventricles pump</text><text x="410" y="425" fill="#475569" font-size="18">blood out</text><path d="M530 340 C660 255 810 265 915 340" fill="none" stroke="#ef4444" stroke-width="18"/><path d="M915 430 C810 505 660 515 530 430" fill="none" stroke="#60a5fa" stroke-width="18"/><polygon points="915,340 885,323 890,355" fill="#ef4444"/><polygon points="530,430 560,412 555,446" fill="#60a5fa"/><text x="760" y="290" fill="#92400e" font-size="19" font-weight="700">Oxygen-rich blood to body</text><text x="760" y="510" fill="#1e3a8a" font-size="19" font-weight="700">Blood returns to heart</text><text x="410" y="545" fill="#06111f" font-size="20" font-weight="700">LEFT VENTRICLE → BODY</text></g><text x="600" y="650" text-anchor="middle" fill="#475569" font-size="20">The circulatory system maintains continuous blood flow to tissues and organs.</text></g></svg>