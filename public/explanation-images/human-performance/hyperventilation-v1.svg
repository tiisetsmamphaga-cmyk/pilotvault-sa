<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">HYPERVENTILATION: WHAT CHANGES?</text><rect x="100" y="190" width="1000" height="395" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g text-anchor="middle"><rect x="150" y="235" width="270" height="250" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="285" y="280" fill="#06111f" font-size="22" font-weight="700">OVER-BREATHING</text><text x="285" y="335" fill="#475569" font-size="18">Too fast / too deep</text><text x="285" y="370" fill="#475569" font-size="18">for the body’s need</text><rect x="465" y="235" width="270" height="250" rx="18" fill="#06111f"/><text x="600" y="280" fill="#f4b400" font-size="22" font-weight="700">CO₂ FALLS</text><text x="600" y="335" fill="#fff" font-size="18">Blood carbon dioxide</text><text x="600" y="370" fill="#fff" font-size="18">becomes abnormally low</text><rect x="780" y="235" width="270" height="250" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="915" y="280" fill="#06111f" font-size="22" font-weight="700">SYMPTOMS</text><text x="915" y="330" fill="#475569" font-size="18">Tingling · dizziness</text><text x="915" y="365" fill="#475569" font-size="18">light-headedness</text><text x="915" y="400" fill="#475569" font-size="18">poor coordination</text></g><line x1="420" y1="360" x2="465" y2="360" stroke="#f4b400" stroke-width="7"/><line x1="735" y1="360" x2="780" y2="360" stroke="#f4b400" stroke-width="7"/><text x="600" y="645" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">Slow and control breathing; use oxygen if hypoxia cannot be ruled out.</text></g></svg>