<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">LOW BLOOD GLUCOSE: RECOGNISE AND ACT</text><rect x="100" y="190" width="1000" height="390" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g text-anchor="middle"><rect x="145" y="235" width="280" height="260" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="285" y="280" fill="#06111f" font-size="22" font-weight="700">CAUSE</text><text x="285" y="335" fill="#475569" font-size="19">Missed meals</text><text x="285" y="370" fill="#475569" font-size="19">or irregular eating</text><rect x="460" y="235" width="280" height="260" rx="18" fill="#06111f"/><text x="600" y="280" fill="#f4b400" font-size="22" font-weight="700">SIGNS</text><text x="600" y="330" fill="#fff" font-size="19">Shaking · dizziness</text><text x="600" y="365" fill="#fff" font-size="19">weakness · sweating</text><rect x="775" y="235" width="280" height="260" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="915" y="280" fill="#06111f" font-size="22" font-weight="700">IF CONSCIOUS</text><text x="915" y="335" fill="#475569" font-size="19">Give fast-acting</text><text x="915" y="370" fill="#475569" font-size="19">carbohydrate and monitor</text></g><text x="600" y="650" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">Hypoglycaemia can impair judgement and performance quickly.</text></g></svg>