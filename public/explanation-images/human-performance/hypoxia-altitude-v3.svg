<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">WHY ALTITUDE CAN CAUSE HYPOXIA</text><rect x="90" y="185" width="1020" height="400" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g transform="translate(135 245)"><rect width="235" height="220" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="117" y="50" text-anchor="middle" fill="#06111f" font-size="21" font-weight="700">CLIMB</text><path d="M70 155 L117 90 L164 155" fill="none" stroke="#f4b400" stroke-width="8"/><polygon points="117,72 103,98 131,98" fill="#f4b400"/><text x="117" y="195" text-anchor="middle" fill="#475569" font-size="17">Altitude increases</text><path d="M250 110 H345" stroke="#f4b400" stroke-width="7"/><polygon points="360,110 335,96 335,124" fill="#f4b400"/><rect x="375" width="235" height="220" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="492" y="50" text-anchor="middle" fill="#06111f" font-size="21" font-weight="700">PRESSURE FALLS</text><text x="492" y="105" text-anchor="middle" fill="#475569" font-size="18">Atmospheric pressure</text><text x="492" y="135" text-anchor="middle" fill="#475569" font-size="18">decreases with altitude</text><text x="492" y="185" text-anchor="middle" fill="#06111f" font-size="19" font-weight="700">O₂ % stays about the same</text><path d="M625 110 H720" stroke="#f4b400" stroke-width="7"/><polygon points="735,110 710,96 710,124" fill="#f4b400"/><rect x="750" width="235" height="220" rx="20" fill="#06111f"/><text x="867" y="50" text-anchor="middle" fill="#f4b400" font-size="21" font-weight="700">HYPOXIA RISK</text><text x="867" y="102" text-anchor="middle" fill="#fff" font-size="18">O₂ partial pressure falls</text><text x="867" y="132" text-anchor="middle" fill="#fff" font-size="18">so less oxygen reaches</text><text x="867" y="162" text-anchor="middle" fill="#fff" font-size="18">brain and tissues</text><text x="867" y="198" text-anchor="middle" fill="#cbd5e1" font-size="16">judgement · vision · coordination</text></g><text x="600" y="650" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">ALTITUDE DOES NOT REMOVE OXYGEN FROM THE AIR — IT REDUCES THE PRESSURE DRIVING OXYGEN INTO THE BODY</text></g></svg>