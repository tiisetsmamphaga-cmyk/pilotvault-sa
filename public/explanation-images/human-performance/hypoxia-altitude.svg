<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="32" font-weight="800">WHY ALTITUDE CAN CAUSE HYPOXIA</text><rect x="100" y="190" width="1000" height="400" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g text-anchor="middle"><circle cx="245" cy="370" r="88" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/><text x="245" y="355" fill="#06111f" font-size="23" font-weight="700">ATMOSPHERE</text><text x="245" y="390" fill="#475569" font-size="19">Lower pressure</text><text x="245" y="420" fill="#475569" font-size="19">with altitude</text><line x1="340" y1="370" x2="455" y2="370" stroke="#f4b400" stroke-width="7"/><polygon points="455,370 430,355 430,385" fill="#f4b400"/><circle cx="555" cy="370" r="88" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="555" y="350" fill="#06111f" font-size="23" font-weight="700">O₂ PARTIAL</text><text x="555" y="382" fill="#06111f" font-size="23" font-weight="700">PRESSURE FALLS</text><text x="555" y="420" fill="#475569" font-size="18">Less driving pressure</text><line x1="650" y1="370" x2="765" y2="370" stroke="#f4b400" stroke-width="7"/><polygon points="765,370 740,355 740,385" fill="#f4b400"/><circle cx="865" cy="370" r="88" fill="#06111f"/><text x="865" y="350" fill="#f4b400" font-size="24" font-weight="700">HYPOXIA</text><text x="865" y="390" fill="#fff" font-size="18">Brain and tissues</text><text x="865" y="420" fill="#fff" font-size="18">receive less oxygen</text></g><text x="600" y="645" text-anchor="middle" fill="#475569" font-size="20">The oxygen percentage stays about the same; its partial pressure decreases as total pressure falls.</text></g></svg>