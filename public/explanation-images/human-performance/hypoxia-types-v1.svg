<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">FOUR WAYS HYPOXIA CAN OCCUR</text><rect x="70" y="180" width="1060" height="430" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g text-anchor="middle"><rect x="110" y="220" width="220" height="300" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="220" y="265" fill="#06111f" font-size="21" font-weight="700">HYPOXIC</text><text x="220" y="320" fill="#475569" font-size="18">Low O₂ partial</text><text x="220" y="350" fill="#475569" font-size="18">pressure reaching lungs</text><rect x="365" y="220" width="220" height="300" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="475" y="265" fill="#06111f" font-size="21" font-weight="700">ANAEMIC</text><text x="475" y="320" fill="#475569" font-size="18">Too little functioning</text><text x="475" y="350" fill="#475569" font-size="18">haemoglobin</text><rect x="620" y="220" width="220" height="300" rx="18" fill="#06111f"/><text x="730" y="265" fill="#f4b400" font-size="21" font-weight="700">STAGNANT</text><text x="730" y="320" fill="#fff" font-size="18">Inadequate blood</text><text x="730" y="350" fill="#fff" font-size="18">flow to tissues</text><rect x="875" y="220" width="220" height="300" rx="18" fill="#06111f"/><text x="985" y="265" fill="#f4b400" font-size="21" font-weight="700">HISTOTOXIC</text><text x="985" y="320" fill="#fff" font-size="18">Cells cannot use</text><text x="985" y="350" fill="#fff" font-size="18">available oxygen</text></g><text x="600" y="655" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">Different causes — same result: insufficient usable oxygen at the tissues.</text></g></svg>