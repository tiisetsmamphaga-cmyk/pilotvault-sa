<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">FROM INFORMATION TO ACTION</text><rect x="75" y="185" width="1050" height="410" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g transform="translate(105 250)"><g><rect width="195" height="175" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="97" y="48" text-anchor="middle" fill="#06111f" font-size="20" font-weight="700">1. INPUT</text><text x="97" y="92" text-anchor="middle" fill="#475569" font-size="17">See · hear · feel</text><text x="97" y="124" text-anchor="middle" fill="#475569" font-size="17">environment cues</text></g><path d="M210 88 H270" stroke="#f4b400" stroke-width="7"/><polygon points="285,88 260,74 260,102" fill="#f4b400"/><g transform="translate(300 0)"><rect width="195" height="175" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="97" y="48" text-anchor="middle" fill="#06111f" font-size="20" font-weight="700">2. PERCEIVE</text><text x="97" y="92" text-anchor="middle" fill="#475569" font-size="17">Attention selects</text><text x="97" y="124" text-anchor="middle" fill="#475569" font-size="17">what matters</text></g><path d="M510 88 H570" stroke="#f4b400" stroke-width="7"/><polygon points="585,88 560,74 560,102" fill="#f4b400"/><g transform="translate(600 0)"><rect width="195" height="175" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="97" y="48" text-anchor="middle" fill="#06111f" font-size="20" font-weight="700">3. DECIDE</text><text x="97" y="92" text-anchor="middle" fill="#475569" font-size="17">Use memory, rules</text><text x="97" y="124" text-anchor="middle" fill="#475569" font-size="17">and judgement</text></g><path d="M810 88 H870" stroke="#f4b400" stroke-width="7"/><polygon points="885,88 860,74 860,102" fill="#f4b400"/><g transform="translate(900 0)"><rect width="195" height="175" rx="18" fill="#06111f"/><text x="97" y="48" text-anchor="middle" fill="#f4b400" font-size="20" font-weight="700">4. ACT</text><text x="97" y="92" text-anchor="middle" fill="#fff" font-size="17">Control movement</text><text x="97" y="124" text-anchor="middle" fill="#fff" font-size="17">or spoken response</text></g></g><g transform="translate(235 475)"><rect width="730" height="75" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="365" y="30" text-anchor="middle" fill="#06111f" font-size="19" font-weight="700">COMMON ERROR PATHS</text><text x="365" y="58" text-anchor="middle" fill="#475569" font-size="17">Wrong interpretation → wrong decision · Correct decision + wrong physical action → action slip</text></g><text x="600" y="650" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">PRACTICE BUILDS MOTOR PROGRAMMES, BUT ATTENTION AND CROSS-CHECKING ARE STILL REQUIRED</text></g></svg>