<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="32" font-weight="800">HOW PILOTS PROCESS INFORMATION</text><rect x="100" y="205" width="1000" height="340" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g text-anchor="middle"><rect x="145" y="300" width="210" height="120" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="250" y="345" fill="#06111f" font-size="22" font-weight="700">SENSE</text><text x="250" y="382" fill="#475569" font-size="18">See · hear · feel</text><line x1="355" y1="360" x2="450" y2="360" stroke="#f4b400" stroke-width="7"/><polygon points="450,360 425,345 425,375" fill="#f4b400"/><rect x="455" y="300" width="290" height="120" rx="20" fill="#06111f"/><text x="600" y="345" fill="#f4b400" font-size="22" font-weight="700">INTERPRET &amp; DECIDE</text><text x="600" y="382" fill="#fff" font-size="18">Attention · memory · judgement</text><line x1="745" y1="360" x2="840" y2="360" stroke="#f4b400" stroke-width="7"/><polygon points="840,360 815,345 815,375" fill="#f4b400"/><rect x="845" y="300" width="210" height="120" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="950" y="345" fill="#06111f" font-size="22" font-weight="700">ACT</text><text x="950" y="382" fill="#475569" font-size="18">Motor response</text></g><text x="600" y="610" text-anchor="middle" fill="#475569" font-size="20">A correct plan with the wrong physical action is an action slip.</text><text x="600" y="650" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">Practice turns repeated actions into motor programmes.</text></g></svg>