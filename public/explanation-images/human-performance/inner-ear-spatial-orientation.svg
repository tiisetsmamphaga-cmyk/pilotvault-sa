<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="32" font-weight="800">HOW THE INNER EAR CAN FOOL YOU</text><rect x="105" y="185" width="990" height="410" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g transform="translate(210 245)"><circle cx="180" cy="130" r="80" fill="#fff" stroke="#06111f" stroke-width="5"/><path d="M180 50 C115 65 105 150 160 190 C210 225 270 190 270 135 C270 90 230 60 180 50" fill="none" stroke="#f4b400" stroke-width="12"/><circle cx="180" cy="130" r="18" fill="#06111f"/><text x="180" y="255" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">SEMICIRCULAR CANALS</text><text x="180" y="287" text-anchor="middle" fill="#475569" font-size="18">Sense angular acceleration</text></g><g transform="translate(650 245)"><rect x="0" y="45" width="260" height="170" rx="28" fill="#fff" stroke="#06111f" stroke-width="4"/><line x1="45" y1="130" x2="215" y2="130" stroke="#f4b400" stroke-width="10"/><polygon points="215,130 190,115 190,145" fill="#f4b400"/><text x="130" y="255" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">SUSTAINED TURN</text><text x="130" y="287" text-anchor="middle" fill="#475569" font-size="18">Sensation can fade with time</text></g><text x="600" y="630" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">When body sensations disagree with the instruments, trust the instruments.</text></g></svg>