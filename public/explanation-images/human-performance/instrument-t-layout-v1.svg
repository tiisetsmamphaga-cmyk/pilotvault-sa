<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">THE STANDARD FLIGHT-INSTRUMENT “T”</text><rect x="170" y="190" width="860" height="390" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g text-anchor="middle"><circle cx="600" cy="315" r="75" fill="#06111f"/><text x="600" y="310" fill="#f4b400" font-size="20" font-weight="700">ATTITUDE</text><text x="600" y="340" fill="#fff" font-size="16">INDICATOR</text><circle cx="410" cy="315" r="65" fill="#fff" stroke="#06111f" stroke-width="4"/><text x="410" y="310" fill="#06111f" font-size="18" font-weight="700">AIRSPEED</text><circle cx="790" cy="315" r="65" fill="#fff" stroke="#06111f" stroke-width="4"/><text x="790" y="310" fill="#06111f" font-size="18" font-weight="700">ALTIMETER</text><circle cx="600" cy="485" r="65" fill="#fff" stroke="#06111f" stroke-width="4"/><text x="600" y="480" fill="#06111f" font-size="18" font-weight="700">HEADING</text><text x="600" y="510" fill="#475569" font-size="15">INDICATOR</text></g><line x1="410" y1="410" x2="790" y2="410" stroke="#f4b400" stroke-width="5"/><line x1="600" y1="390" x2="600" y2="420" stroke="#f4b400" stroke-width="5"/><text x="600" y="645" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">The magnetic compass is not one of the four instruments forming the standard T.</text></g></svg>