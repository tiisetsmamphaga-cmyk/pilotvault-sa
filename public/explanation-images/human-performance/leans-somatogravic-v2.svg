<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">THE LEANS AND FALSE PITCH SENSATIONS</text><g text-anchor="middle"><rect x="85" y="190" width="500" height="395" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="335" y="235" fill="#06111f" font-size="23" font-weight="700">THE LEANS</text><path d="M185 390 Q335 275 485 390" fill="none" stroke="#64748b" stroke-width="7"/><path d="M335 330 l50 75 h-100 z" fill="#06111f" transform="rotate(18 335 380)"/><line x1="210" y1="465" x2="460" y2="465" stroke="#f4b400" stroke-width="5" stroke-dasharray="12 10"/><text x="335" y="520" fill="#475569" font-size="18">After a prolonged turn, rollout can feel</text><text x="335" y="548" fill="#475569" font-size="18">like a turn in the opposite direction.</text><rect x="615" y="190" width="500" height="395" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="865" y="235" fill="#06111f" font-size="23" font-weight="700">SOMATOGRAVIC ILLUSION</text><path d="M760 405 l120 -60 l-15 45 l45 5 l-120 60 z" fill="#06111f"/><line x1="740" y1="480" x2="990" y2="480" stroke="#f4b400" stroke-width="5" stroke-dasharray="12 10"/><path d="M760 330 H650" stroke="#ef4444" stroke-width="7"/><polygon points="650,330 675,315 675,345" fill="#ef4444"/><text x="865" y="520" fill="#475569" font-size="18">Strong forward acceleration can feel like</text><text x="865" y="548" fill="#475569" font-size="18">pitching backward / climbing.</text></g><text x="600" y="650" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">If body sensation disagrees with reliable instruments, trust the instruments.</text></g></svg>