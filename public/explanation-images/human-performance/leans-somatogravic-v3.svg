<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">THE LEANS AND SOMATOGRAVIC ILLUSION</text><g transform="translate(70 185)"><g><rect width="500" height="405" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="250" y="45" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">THE LEANS</text><line x1="65" y1="210" x2="435" y2="210" stroke="#f4b400" stroke-width="5" stroke-dasharray="13 10"/><path d="M215 165 l70 45 l-70 45 l20-45 z" fill="#06111f"/><path d="M120 120 C170 80 225 85 265 115" fill="none" stroke="#60a5fa" stroke-width="6"/><polygon points="270,118 244,103 248,132" fill="#60a5fa"/><path d="M385 300 C335 340 280 335 240 305" fill="none" stroke="#ef4444" stroke-width="6"/><polygon points="235,302 261,317 257,288" fill="#ef4444"/><text x="250" y="292" text-anchor="middle" fill="#475569" font-size="17">A prolonged turn may feel straight and level.</text><text x="250" y="322" text-anchor="middle" fill="#475569" font-size="17">Rolling level can then feel like a turn the other way.</text><text x="250" y="365" text-anchor="middle" fill="#92400e" font-size="18" font-weight="700">BODY SAYS TURN · INSTRUMENTS SAY LEVEL</text></g><g transform="translate(560 0)"><rect width="500" height="405" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="250" y="45" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">SOMATOGRAVIC ILLUSION</text><line x1="65" y1="235" x2="435" y2="235" stroke="#f4b400" stroke-width="5" stroke-dasharray="13 10"/><path d="M170 205 h120 l-38 -28 l20 28 l-20 28 l38 -28" fill="#06111f"/><line x1="120" y1="205" x2="75" y2="205" stroke="#ef4444" stroke-width="7"/><polygon points="60,205 83,192 83,218" fill="#ef4444"/><path d="M300 205 L365 145" stroke="#64748b" stroke-width="6" stroke-dasharray="10 8"/><text x="385" y="140" fill="#475569" font-size="16">felt climb</text><text x="250" y="292" text-anchor="middle" fill="#475569" font-size="17">Strong forward acceleration can feel like</text><text x="250" y="322" text-anchor="middle" fill="#475569" font-size="17">pitching backward or climbing.</text><text x="250" y="365" text-anchor="middle" fill="#92400e" font-size="18" font-weight="700">ACCELERATION CAN CREATE A FALSE PITCH CUE</text></g></g><text x="600" y="645" text-anchor="middle" fill="#475569" font-size="19">When body sensation conflicts with reliable instruments, maintain the instrument indication.</text></g></svg>