<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">BANK ANGLE AND LOAD FACTOR</text><rect x="90" y="180" width="1020" height="430" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><line x1="180" y1="500" x2="1020" y2="500" stroke="#94a3b8" stroke-width="3"/><path d="M260 500 A340 340 0 0 1 940 500" fill="none" stroke="#e2e8f0" stroke-width="3"/><g text-anchor="middle"><text x="260" y="545" fill="#475569" font-size="18">0°</text><text x="465" y="545" fill="#475569" font-size="18">30°</text><text x="670" y="545" fill="#475569" font-size="18">45°</text><text x="875" y="545" fill="#475569" font-size="18">60°</text><text x="875" y="250" fill="#06111f" font-size="24" font-weight="700">60° BANK ≈ 2 G</text><text x="600" y="650" fill="#92400e" font-size="20" font-weight="700">In a balanced level turn, load factor rises rapidly as bank angle increases.</text></g><g transform="translate(875 390) rotate(-60)"><path d="M-80 0 L80 0 L25 -18 L5 -18 L-5 -42 L-18 -42 L-12 -18 L-70 -18 Z" fill="#06111f"/></g><line x1="875" y1="390" x2="875" y2="490" stroke="#f4b400" stroke-width="7"/><polygon points="875,505 860,480 890,480" fill="#f4b400"/></g></svg>