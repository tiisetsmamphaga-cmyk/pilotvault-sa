<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">WHY MOTION SICKNESS HAPPENS</text><rect x="90" y="185" width="1020" height="405" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g transform="translate(130 225)"><rect width="300" height="285" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="150" y="45" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">EYES</text><rect x="75" y="90" width="150" height="85" rx="12" fill="#dbeafe"/><line x1="90" y1="150" x2="210" y2="110" stroke="#64748b" stroke-width="6"/><text x="150" y="220" text-anchor="middle" fill="#475569" font-size="18">May see a relatively</text><text x="150" y="247" text-anchor="middle" fill="#475569" font-size="18">stable cabin</text><rect x="360" width="300" height="285" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="510" y="45" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">INNER EAR</text><circle cx="510" cy="135" r="65" fill="none" stroke="#60a5fa" stroke-width="10"/><ellipse cx="510" cy="135" rx="42" ry="70" fill="none" stroke="#f4b400" stroke-width="8" transform="rotate(55 510 135)"/><text x="510" y="220" text-anchor="middle" fill="#475569" font-size="18">Senses turning, acceleration</text><text x="510" y="247" text-anchor="middle" fill="#475569" font-size="18">or changing motion</text><path d="M680 142 H760" stroke="#f4b400" stroke-width="7"/><polygon points="775,142 750,128 750,156" fill="#f4b400"/><rect x="790" width="300" height="285" rx="20" fill="#06111f"/><text x="940" y="45" text-anchor="middle" fill="#f4b400" font-size="22" font-weight="700">SENSORY CONFLICT</text><text x="940" y="102" text-anchor="middle" fill="#fff" font-size="18">Brain receives mismatched</text><text x="940" y="132" text-anchor="middle" fill="#fff" font-size="18">visual and vestibular cues</text><text x="940" y="190" text-anchor="middle" fill="#cbd5e1" font-size="17">nausea · pallor · sweating</text><text x="940" y="220" text-anchor="middle" fill="#cbd5e1" font-size="17">sometimes vomiting</text></g><text x="600" y="645" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">MOTION SICKNESS IS MAINLY A SENSORY-CONFLICT PROBLEM BETWEEN WHAT YOU SEE AND WHAT THE BALANCE SYSTEM SENSES</text></g></svg>