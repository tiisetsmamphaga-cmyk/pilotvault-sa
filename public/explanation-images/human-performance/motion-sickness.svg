<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="32" font-weight="800">WHY MOTION SICKNESS HAPPENS</text><rect x="110" y="190" width="980" height="400" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><circle cx="310" cy="360" r="90" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/><text x="310" y="347" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">EYES</text><text x="310" y="385" text-anchor="middle" fill="#475569" font-size="18">“Cabin looks still”</text><circle cx="890" cy="360" r="90" fill="#fff" stroke="#06111f" stroke-width="3"/><text x="890" y="347" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">INNER EAR</text><text x="890" y="385" text-anchor="middle" fill="#475569" font-size="18">“Body is moving”</text><line x1="410" y1="360" x2="515" y2="360" stroke="#f4b400" stroke-width="7"/><line x1="790" y1="360" x2="685" y2="360" stroke="#f4b400" stroke-width="7"/><rect x="515" y="285" width="170" height="150" rx="24" fill="#06111f"/><text x="600" y="335" text-anchor="middle" fill="#f4b400" font-size="21" font-weight="700">SENSORY</text><text x="600" y="368" text-anchor="middle" fill="#f4b400" font-size="21" font-weight="700">CONFLICT</text><text x="600" y="405" text-anchor="middle" fill="#fff" font-size="17">Brain receives</text><text x="600" y="430" text-anchor="middle" fill="#fff" font-size="17">different signals</text><text x="600" y="635" text-anchor="middle" fill="#475569" font-size="20">Typical symptoms: nausea · pallor · sweating · sometimes vomiting.</text></g></svg>