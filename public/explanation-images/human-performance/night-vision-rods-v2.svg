<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">HOW TO SEE FAINT OBJECTS AT NIGHT</text><rect x="100" y="190" width="1000" height="410" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><circle cx="315" cy="390" r="120" fill="#06111f"/><circle cx="315" cy="390" r="12" fill="#f4b400"/><circle cx="365" cy="350" r="7" fill="#fff"/><line x1="315" y1="390" x2="365" y2="350" stroke="#f4b400" stroke-width="4" stroke-dasharray="9 8"/><text x="315" y="545" text-anchor="middle" fill="#06111f" font-size="21" font-weight="700">LOOK SLIGHTLY TO ONE SIDE</text><g fill="#475569" font-size="20"><text x="575" y="275">• Fovea is cone-rich and weak in dim light</text><text x="575" y="335">• Rods dominate peripheral low-light vision</text><text x="575" y="395">• Full dark adaptation can take about 30 min</text><text x="575" y="455">• Bright white light rapidly destroys adaptation</text><text x="575" y="515">• Use off-centre viewing for faint targets</text></g><text x="600" y="655" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">Night vision = rods + dark adaptation + off-centre viewing</text></g></svg>