<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">WHY OFF-CENTRE VIEWING HELPS AT NIGHT</text><rect x="85" y="180" width="1030" height="430" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><rect x="125" y="225" width="430" height="330" rx="18" fill="#06111f"/><circle cx="340" cy="390" r="13" fill="#f4b400"/><circle cx="300" cy="350" r="5" fill="#cbd5e1"/><circle cx="385" cy="335" r="4" fill="#cbd5e1"/><circle cx="420" cy="430" r="4" fill="#cbd5e1"/><circle cx="245" cy="450" r="3" fill="#cbd5e1"/><line x1="340" y1="390" x2="340" y2="510" stroke="#ef4444" stroke-width="3"/><text x="340" y="535" text-anchor="middle" fill="#fff" font-size="17">Looking directly at faint light</text><circle cx="340" cy="390" r="45" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="10 8"/><path d="M340 390 C390 365 425 350 465 350" fill="none" stroke="#f4b400" stroke-width="5"/><polygon points="465,350 445,338 445,362" fill="#f4b400"/><text x="430" y="320" text-anchor="middle" fill="#f4b400" font-size="18" font-weight="700">LOOK SLIGHTLY TO ONE SIDE</text><g transform="translate(620 225)"><rect width="445" height="330" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="222" y="45" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">RETINA AT NIGHT</text><circle cx="222" cy="165" r="100" fill="#eef6ff" stroke="#64748b" stroke-width="3"/><circle cx="222" cy="165" r="28" fill="#f4b400"/><g fill="#64748b"><circle cx="150" cy="120" r="8"/><circle cx="130" cy="170" r="8"/><circle cx="155" cy="220" r="8"/><circle cx="290" cy="120" r="8"/><circle cx="315" cy="170" r="8"/><circle cx="290" cy="220" r="8"/></g><text x="222" y="170" text-anchor="middle" fill="#06111f" font-size="16" font-weight="700">FOVEA</text><text x="222" y="288" text-anchor="middle" fill="#475569" font-size="18">Cones dominate the fovea.</text><text x="222" y="315" text-anchor="middle" fill="#475569" font-size="18">Rods dominate away from the centre.</text></g><text x="600" y="660" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">RODS = LOW LIGHT &amp; PERIPHERAL VISION · FULL DARK ADAPTATION CAN TAKE ABOUT 30 MINUTES</text></g></svg>