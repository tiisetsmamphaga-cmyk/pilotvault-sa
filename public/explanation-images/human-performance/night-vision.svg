<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="32" font-weight="800">HOW NIGHT VISION CHANGES</text><rect x="110" y="190" width="980" height="390" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><circle cx="350" cy="365" r="105" fill="#06111f"/><circle cx="350" cy="365" r="48" fill="#fff"/><circle cx="350" cy="365" r="24" fill="#06111f"/><text x="350" y="505" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">RODS</text><text x="350" y="538" text-anchor="middle" fill="#475569" font-size="18">Sensitive in dim light</text><rect x="610" y="275" width="340" height="180" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="780" y="320" text-anchor="middle" fill="#06111f" font-size="21" font-weight="700">DARK ADAPTATION</text><text x="780" y="365" text-anchor="middle" fill="#475569" font-size="19">Cones adapt first</text><text x="780" y="402" text-anchor="middle" fill="#475569" font-size="19">Rods take much longer</text><text x="780" y="438" text-anchor="middle" fill="#f4b400" font-size="22" font-weight="700">≈ 30 min for full adaptation</text><text x="600" y="635" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">Bright light can quickly destroy dark adaptation.</text></g></svg>