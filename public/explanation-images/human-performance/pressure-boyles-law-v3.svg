<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">BOYLE’S LAW AND TRAPPED GAS</text><rect x="95" y="185" width="1010" height="405" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g transform="translate(145 225)"><rect width="360" height="305" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="180" y="48" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">LOW ALTITUDE</text><circle cx="180" cy="155" r="60" fill="#dbeafe" stroke="#60a5fa" stroke-width="4"/><g stroke="#64748b" stroke-width="4"><line x1="80" y1="155" x2="115" y2="155"/><line x1="245" y1="155" x2="280" y2="155"/><line x1="180" y1="55" x2="180" y2="90"/><line x1="180" y1="220" x2="180" y2="255"/></g><text x="180" y="285" text-anchor="middle" fill="#475569" font-size="18">Higher pressure → smaller gas volume</text><path d="M390 150 H505" stroke="#f4b400" stroke-width="7"/><polygon points="520,150 495,136 495,164" fill="#f4b400"/><rect x="550" width="360" height="305" rx="20" fill="#06111f"/><text x="730" y="48" text-anchor="middle" fill="#f4b400" font-size="22" font-weight="700">HIGHER ALTITUDE</text><circle cx="730" cy="155" r="92" fill="#dbeafe" stroke="#60a5fa" stroke-width="4"/><text x="730" y="285" text-anchor="middle" fill="#fff" font-size="18">Lower pressure → trapped gas expands</text></g><text x="600" y="645" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">AT CONSTANT TEMPERATURE: PRESSURE ↓ → GAS VOLUME ↑ · THIS AFFECTS EARS, SINUSES AND OTHER TRAPPED GAS SPACES</text></g></svg>