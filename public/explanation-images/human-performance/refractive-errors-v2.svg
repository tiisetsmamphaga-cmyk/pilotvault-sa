<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="30" font-weight="800">MYOPIA · HYPERMETROPIA · ASTIGMATISM</text><g text-anchor="middle"><rect x="80" y="200" width="320" height="350" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="240" y="250" fill="#06111f" font-size="24" font-weight="700">MYOPIA</text><ellipse cx="240" cy="360" rx="110" ry="75" fill="#fff" stroke="#94a3b8" stroke-width="3"/><circle cx="285" cy="360" r="8" fill="#ef4444"/><line x1="130" y1="330" x2="285" y2="360" stroke="#f4b400" stroke-width="4"/><line x1="130" y1="390" x2="285" y2="360" stroke="#f4b400" stroke-width="4"/><text x="240" y="475" fill="#475569" font-size="19">Focus before retina</text><text x="240" y="510" fill="#92400e" font-size="20" font-weight="700">Correct: CONCAVE lens</text><rect x="440" y="200" width="320" height="350" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="600" y="250" fill="#06111f" font-size="24" font-weight="700">HYPERMETROPIA</text><ellipse cx="600" cy="360" rx="100" ry="75" fill="#fff" stroke="#94a3b8" stroke-width="3"/><circle cx="720" cy="360" r="8" fill="#ef4444"/><line x1="490" y1="330" x2="720" y2="360" stroke="#f4b400" stroke-width="4"/><line x1="490" y1="390" x2="720" y2="360" stroke="#f4b400" stroke-width="4"/><text x="600" y="475" fill="#475569" font-size="19">Focus behind retina</text><text x="600" y="510" fill="#92400e" font-size="20" font-weight="700">Correct: CONVEX lens</text><rect x="800" y="200" width="320" height="350" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="960" y="250" fill="#06111f" font-size="24" font-weight="700">ASTIGMATISM</text><ellipse cx="960" cy="360" rx="105" ry="75" fill="#fff" stroke="#94a3b8" stroke-width="3" transform="rotate(-8 960 360)"/><path d="M855 330 L1030 350 M855 390 L1000 375" stroke="#f4b400" stroke-width="4"/><text x="960" y="475" fill="#475569" font-size="19">Uneven focus</text><text x="960" y="510" fill="#92400e" font-size="20" font-weight="700">Often: misshapen cornea</text></g><text x="600" y="640" text-anchor="middle" fill="#475569" font-size="20">Short-sighted = myopia · Long-sighted = hypermetropia</text></g></svg>