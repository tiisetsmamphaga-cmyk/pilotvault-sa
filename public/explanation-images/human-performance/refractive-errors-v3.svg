<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">MYOPIA AND HYPERMETROPIA</text><g transform="translate(70 185)"><rect width="330" height="385" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="165" y="48" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">NORMAL FOCUS</text><ellipse cx="170" cy="185" rx="115" ry="78" fill="#fff" stroke="#64748b" stroke-width="3"/><ellipse cx="105" cy="185" rx="20" ry="45" fill="#eef6ff" stroke="#06111f" stroke-width="3"/><path d="M265 120 Q300 185 265 250" fill="none" stroke="#ef4444" stroke-width="7"/><line x1="45" y1="145" x2="265" y2="185" stroke="#f4b400" stroke-width="4"/><line x1="45" y1="225" x2="265" y2="185" stroke="#f4b400" stroke-width="4"/><circle cx="265" cy="185" r="7" fill="#06111f"/><text x="165" y="315" text-anchor="middle" fill="#475569" font-size="18">Light focuses on the retina.</text><rect x="365" width="330" height="385" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="530" y="48" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">MYOPIA</text><ellipse cx="535" cy="185" rx="120" ry="78" fill="#fff" stroke="#64748b" stroke-width="3"/><ellipse cx="470" cy="185" rx="20" ry="45" fill="#eef6ff" stroke="#06111f" stroke-width="3"/><path d="M635 120 Q670 185 635 250" fill="none" stroke="#ef4444" stroke-width="7"/><line x1="410" y1="145" x2="585" y2="185" stroke="#f4b400" stroke-width="4"/><line x1="410" y1="225" x2="585" y2="185" stroke="#f4b400" stroke-width="4"/><circle cx="585" cy="185" r="7" fill="#ef4444"/><text x="530" y="285" text-anchor="middle" fill="#475569" font-size="18">Focus falls before retina.</text><text x="530" y="318" text-anchor="middle" fill="#06111f" font-size="19" font-weight="700">Correct with a CONCAVE lens.</text><rect x="730" width="330" height="385" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="895" y="48" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">HYPERMETROPIA</text><ellipse cx="900" cy="185" rx="110" ry="78" fill="#fff" stroke="#64748b" stroke-width="3"/><ellipse cx="835" cy="185" rx="20" ry="45" fill="#eef6ff" stroke="#06111f" stroke-width="3"/><path d="M990 120 Q1025 185 990 250" fill="none" stroke="#ef4444" stroke-width="7"/><line x1="775" y1="145" x2="1040" y2="200" stroke="#f4b400" stroke-width="4"/><line x1="775" y1="225" x2="1040" y2="170" stroke="#f4b400" stroke-width="4"/><circle cx="1040" cy="185" r="7" fill="#ef4444"/><text x="895" y="285" text-anchor="middle" fill="#475569" font-size="18">Focus would fall behind retina.</text><text x="895" y="318" text-anchor="middle" fill="#06111f" font-size="19" font-weight="700">Correct with a CONVEX lens.</text></g><text x="600" y="650" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">MYOPIA = SHORT-SIGHTED · HYPERMETROPIA = LONG-SIGHTED</text></g></svg>