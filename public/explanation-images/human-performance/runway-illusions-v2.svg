<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="30" font-weight="800">HOW RUNWAY SHAPE CAN FOOL YOUR APPROACH</text><g text-anchor="middle"><rect x="75" y="190" width="245" height="400" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="198" y="235" fill="#06111f" font-size="22" font-weight="700">WIDE RUNWAY</text><polygon points="120,500 275,500 250,300 145,300" fill="#64748b"/><line x1="198" y1="300" x2="198" y2="500" stroke="#fff" stroke-width="5" stroke-dasharray="18 16"/><text x="198" y="545" fill="#92400e" font-size="18" font-weight="700">Feels low → fly HIGH</text><rect x="345" y="190" width="245" height="400" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="468" y="235" fill="#06111f" font-size="22" font-weight="700">NARROW RUNWAY</text><polygon points="420,500 515,500 500,300 435,300" fill="#64748b"/><line x1="468" y1="300" x2="468" y2="500" stroke="#fff" stroke-width="5" stroke-dasharray="18 16"/><text x="468" y="545" fill="#92400e" font-size="18" font-weight="700">Feels high → fly LOW</text><rect x="615" y="190" width="245" height="400" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="738" y="235" fill="#06111f" font-size="22" font-weight="700">UPSLOPE</text><polygon points="665,500 810,465 790,300 690,325" fill="#64748b"/><line x1="685" y1="470" x2="790" y2="330" stroke="#fff" stroke-width="5" stroke-dasharray="18 16"/><text x="738" y="545" fill="#92400e" font-size="18" font-weight="700">Feels high → fly LOW</text><rect x="885" y="190" width="245" height="400" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="1008" y="235" fill="#06111f" font-size="22" font-weight="700">DOWNSLOPE</text><polygon points="935,465 1080,500 1055,325 955,300" fill="#64748b"/><line x1="955" y1="330" x2="1060" y2="470" stroke="#fff" stroke-width="5" stroke-dasharray="18 16"/><text x="1008" y="545" fill="#92400e" font-size="18" font-weight="700">Feels low → fly HIGH</text></g><text x="600" y="655" text-anchor="middle" fill="#475569" font-size="20">Unfamiliar width or slope distorts your perception of approach angle.</text></g></svg>