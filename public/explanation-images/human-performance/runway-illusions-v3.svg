<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="30" font-weight="800">HOW RUNWAY SHAPE CAN FOOL YOUR APPROACH</text><g transform="translate(55 180)"><g><rect width="255" height="405" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="127" y="45" text-anchor="middle" fill="#06111f" font-size="21" font-weight="700">WIDE RUNWAY</text><polygon points="45,305 210,305 175,120 80,120" fill="#64748b"/><line x1="127" y1="120" x2="127" y2="305" stroke="#fff" stroke-width="5" stroke-dasharray="18 14"/><text x="127" y="345" text-anchor="middle" fill="#475569" font-size="17">Looks closer / feels low</text><text x="127" y="375" text-anchor="middle" fill="#92400e" font-size="18" font-weight="700">Tendency: fly HIGH</text></g><g transform="translate(275 0)"><rect width="255" height="405" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="127" y="45" text-anchor="middle" fill="#06111f" font-size="21" font-weight="700">NARROW RUNWAY</text><polygon points="75,305 180,305 157,120 98,120" fill="#64748b"/><line x1="127" y1="120" x2="127" y2="305" stroke="#fff" stroke-width="5" stroke-dasharray="18 14"/><text x="127" y="345" text-anchor="middle" fill="#475569" font-size="17">Looks farther / feels high</text><text x="127" y="375" text-anchor="middle" fill="#92400e" font-size="18" font-weight="700">Tendency: fly LOW</text></g><g transform="translate(550 0)"><rect width="255" height="405" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="127" y="45" text-anchor="middle" fill="#06111f" font-size="21" font-weight="700">UPSLOPE</text><polygon points="45,305 210,265 180,115 75,140" fill="#64748b"/><line x1="80" y1="275" x2="175" y2="140" stroke="#fff" stroke-width="5" stroke-dasharray="18 14"/><text x="127" y="345" text-anchor="middle" fill="#475569" font-size="17">Looks steeper / feels high</text><text x="127" y="375" text-anchor="middle" fill="#92400e" font-size="18" font-weight="700">Tendency: fly LOW</text></g><g transform="translate(825 0)"><rect width="255" height="405" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="127" y="45" text-anchor="middle" fill="#06111f" font-size="21" font-weight="700">DOWNSLOPE</text><polygon points="45,265 210,305 180,140 75,115" fill="#64748b"/><line x1="80" y1="140" x2="175" y2="275" stroke="#fff" stroke-width="5" stroke-dasharray="18 14"/><text x="127" y="345" text-anchor="middle" fill="#475569" font-size="17">Looks shallow / feels low</text><text x="127" y="375" text-anchor="middle" fill="#92400e" font-size="18" font-weight="700">Tendency: fly HIGH</text></g></g><text x="600" y="640" text-anchor="middle" fill="#475569" font-size="19">Runway width and slope can distort the apparent approach angle. Use normal visual cues and a stabilised approach.</text></g></svg>