<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">REM AND SLOW-WAVE SLEEP</text><rect x="95" y="190" width="1010" height="390" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g text-anchor="middle"><rect x="155" y="245" width="400" height="260" rx="20" fill="#06111f"/><text x="355" y="295" fill="#f4b400" font-size="24" font-weight="700">REM SLEEP</text><text x="355" y="350" fill="#fff" font-size="19">Rapid eye movement</text><text x="355" y="390" fill="#fff" font-size="19">strongly associated with</text><text x="355" y="425" fill="#f4b400" font-size="19" font-weight="700">mental / brain rejuvenation</text><rect x="645" y="245" width="400" height="260" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="845" y="295" fill="#06111f" font-size="24" font-weight="700">SLOW-WAVE SLEEP</text><text x="845" y="350" fill="#475569" font-size="19">Deep non-REM sleep</text><text x="845" y="390" fill="#475569" font-size="19">strongly associated with</text><text x="845" y="425" fill="#92400e" font-size="19" font-weight="700">physical rejuvenation</text></g><text x="600" y="650" text-anchor="middle" fill="#475569" font-size="20">Adequate natural sleep is needed for both mental and physical recovery.</text></g></svg>