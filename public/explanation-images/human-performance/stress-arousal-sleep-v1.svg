<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">STRESS, AROUSAL AND SLEEP</text><rect x="80" y="180" width="1040" height="430" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><path d="M155 455 C330 525 440 280 600 260 C760 280 870 525 1045 455" fill="none" stroke="#f4b400" stroke-width="9"/><text x="600" y="230" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">MODERATE AROUSAL → BEST PERFORMANCE</text><text x="175" y="520" fill="#475569" font-size="18">Too low</text><text x="970" y="520" fill="#475569" font-size="18">Too high</text><g text-anchor="middle"><rect x="170" y="555" width="250" height="70" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="295" y="598" fill="#06111f" font-size="19" font-weight="700">ACUTE = SHORT-TERM</text><rect x="475" y="555" width="250" height="70" rx="16" fill="#06111f"/><text x="600" y="598" fill="#f4b400" font-size="19" font-weight="700">SLEEP = RECOVERY</text><rect x="780" y="555" width="250" height="70" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="905" y="598" fill="#06111f" font-size="19" font-weight="700">CHRONIC = LONG-TERM</text></g><text x="600" y="675" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">Stressors accumulate; adequate natural sleep prevents fatigue and sleep debt.</text></g></svg>