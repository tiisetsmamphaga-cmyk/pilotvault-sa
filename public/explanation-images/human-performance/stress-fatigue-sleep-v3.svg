<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">STRESS, FATIGUE AND RECOVERY</text><rect x="80" y="185" width="1040" height="410" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g transform="translate(120 225)"><rect width="300" height="300" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="150" y="48" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">STRESS</text><g fill="#475569" font-size="18"><text x="38" y="100">• Narrowed attention</text><text x="38" y="140">• Irritability / tension</text><text x="38" y="180">• Rushed decisions</text><text x="38" y="220">• Reduced spare capacity</text></g><rect x="355" width="300" height="300" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="505" y="48" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">FATIGUE</text><g fill="#475569" font-size="18"><text x="393" y="100">• Slower reactions</text><text x="393" y="140">• Poor concentration</text><text x="393" y="180">• More errors</text><text x="393" y="220">• Microsleep risk</text></g><path d="M675 150 H745" stroke="#f4b400" stroke-width="7"/><polygon points="760,150 735,136 735,164" fill="#f4b400"/><rect x="775" width="300" height="300" rx="20" fill="#06111f"/><text x="925" y="48" text-anchor="middle" fill="#f4b400" font-size="22" font-weight="700">RECOVERY</text><g fill="#fff" font-size="18"><text x="815" y="100">• Restful natural sleep</text><text x="815" y="140">• Adequate rest periods</text><text x="815" y="180">• Hydration and nutrition</text><text x="815" y="220">• Remove the stressor</text></g></g><text x="600" y="645" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">ALCOHOL OR SEDATING MEDICATION DOES NOT REPLACE PROPER SLEEP AND RECOVERY</text></g></svg>