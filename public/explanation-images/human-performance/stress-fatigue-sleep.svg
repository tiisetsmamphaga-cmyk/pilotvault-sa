<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="32" font-weight="800">WHY FATIGUE DEGRADES PERFORMANCE</text><rect x="110" y="190" width="980" height="390" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><g text-anchor="middle"><rect x="155" y="290" width="220" height="130" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="265" y="335" fill="#06111f" font-size="22" font-weight="700">SLEEP LOSS</text><text x="265" y="375" fill="#475569" font-size="18">Less recovery</text><line x1="375" y1="355" x2="465" y2="355" stroke="#f4b400" stroke-width="7"/><polygon points="465,355 440,340 440,370" fill="#f4b400"/><rect x="470" y="290" width="260" height="130" rx="22" fill="#06111f"/><text x="600" y="335" fill="#f4b400" font-size="22" font-weight="700">FATIGUE</text><text x="600" y="375" fill="#fff" font-size="18">Alertness falls</text><line x1="730" y1="355" x2="820" y2="355" stroke="#f4b400" stroke-width="7"/><polygon points="820,355 795,340 795,370" fill="#f4b400"/><rect x="825" y="290" width="220" height="130" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="935" y="330" fill="#06111f" font-size="21" font-weight="700">PERFORMANCE</text><text x="935" y="365" fill="#475569" font-size="18">Slower reactions</text><text x="935" y="392" fill="#475569" font-size="18">Poorer judgement</text></g><text x="600" y="515" text-anchor="middle" fill="#475569" font-size="20">Stress can also narrow attention and increase errors when demands exceed coping capacity.</text><text x="600" y="635" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">The best recovery from fatigue is adequate, uninterrupted sleep.</text></g></svg>