<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="132" fill="#06111f"/><g font-family="Arial,sans-serif"><text x="600" y="42" text-anchor="middle" fill="#f4b400" font-size="19" font-weight="700" letter-spacing="4">PILOTVAULT HUMAN PERFORMANCE</text><text x="600" y="92" text-anchor="middle" fill="#fff" font-size="31" font-weight="800">TIME OF USEFUL CONSCIOUSNESS</text><rect x="95" y="185" width="1010" height="405" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><line x1="180" y1="510" x2="1020" y2="510" stroke="#06111f" stroke-width="4"/><line x1="180" y1="510" x2="180" y2="250" stroke="#06111f" stroke-width="4"/><path d="M210 475 C430 450 580 390 720 320 C850 255 930 225 990 215" fill="none" stroke="#f4b400" stroke-width="9"/><g fill="#475569" font-size="18"><text x="165" y="545">Lower altitude</text><text x="905" y="545">Higher altitude</text><text x="105" y="265" transform="rotate(-90 105 265)">Useful time decreases</text></g><circle cx="760" cy="300" r="10" fill="#06111f"/><text x="775" y="285" fill="#06111f" font-size="20" font-weight="700">≈25 000 ft</text><text x="775" y="318" fill="#92400e" font-size="20" font-weight="700">roughly 2–3 min</text><text x="600" y="650" text-anchor="middle" fill="#475569" font-size="20">Physical activity shortens TUC because the body consumes oxygen faster.</text></g></svg>