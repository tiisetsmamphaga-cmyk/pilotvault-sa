<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Weather occurs in the troposphere</title>
  <desc id="desc">The troposphere extends from the surface to an average height of 11 kilometres and contains most weather.</desc>
  <rect width="1100" height="620" fill="#ffffff"/>

  <g font-family="Arial, sans-serif">
    <line x1="120" y1="540" x2="120" y2="70" stroke="#334155" stroke-width="3"/>
    <path d="M112 84 L120 70 L128 84" fill="none" stroke="#334155" stroke-width="3"/>
    <text x="45" y="310" text-anchor="middle" transform="rotate(-90 45 310)" fill="#475569" font-size="18" font-weight="700">ALTITUDE</text>

    <rect x="165" y="70" width="670" height="250" fill="#dbeafe"/>
    <rect x="165" y="320" width="670" height="220" fill="#bae6fd"/>
    <line x1="165" y1="320" x2="835" y2="320" stroke="#f59e0b" stroke-width="8"/>

    <text x="200" y="142" fill="#1e3a8a" font-size="36" font-weight="700">STRATOSPHERE</text>
    <text x="200" y="382" fill="#075985" font-size="36" font-weight="700">TROPOSPHERE</text>
    <text x="200" y="424" fill="#0c4a6e" font-size="22">Most water vapour</text>
    <text x="200" y="458" fill="#0c4a6e" font-size="22">Cloud and precipitation</text>
    <text x="200" y="492" fill="#0c4a6e" font-size="22">Most weather systems</text>

    <g fill="#ffffff" stroke="#7dd3fc" stroke-width="2">
      <ellipse cx="650" cy="438" rx="88" ry="30"/>
      <circle cx="610" cy="421" r="35"/>
      <circle cx="662" cy="408" r="47"/>
      <circle cx="706" cy="427" r="32"/>
    </g>
    <g stroke="#2563eb" stroke-width="6" stroke-linecap="round">
      <line x1="620" y1="468" x2="608" y2="494"/>
      <line x1="658" y1="468" x2="646" y2="494"/>
      <line x1="696" y1="468" x2="684" y2="494"/>
    </g>

    <g fill="#475569" font-size="18" text-anchor="end">
      <text x="102" y="546">0 km</text>
      <text x="102" y="326">11 km</text>
      <text x="102" y="78">50 km</text>
    </g>
    <g stroke="#64748b" stroke-width="3">
      <line x1="110" y1="540" x2="130" y2="540"/>
      <line x1="110" y1="320" x2="130" y2="320"/>
      <line x1="110" y1="70" x2="130" y2="70"/>
    </g>

    <line x1="835" y1="320" x2="900" y2="320" stroke="#f59e0b" stroke-width="4"/>
    <text x="925" y="304" fill="#92400e" font-size="23" font-weight="700">TROPOPAUSE</text>
    <text x="925" y="340" fill="#334155" font-size="21">11 km</text>
    <text x="925" y="370" fill="#334155" font-size="21">36 090 ft</text>
  </g>
</svg>
