<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Composition of dry atmospheric air</title>
  <desc id="desc">Dry air consists of approximately 78 percent nitrogen, 21 percent oxygen and 1 percent other gases.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="60" y="60" fill="#0f172a" font-family="Arial, sans-serif" font-size="32" font-weight="700">Composition of dry atmospheric air</text>
  <text x="60" y="94" fill="#475569" font-family="Arial, sans-serif" font-size="18">The proportions remain nearly constant, although pressure and gas density decrease with altitude.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="125" width="1080" height="525" rx="18" fill="white"/>
  </g>

  <g font-family="Arial, sans-serif">
    <g transform="translate(350 385) rotate(-90)">
      <circle r="150" fill="none" stroke="#e2e8f0" stroke-width="78"/>
      <circle r="150" fill="none" stroke="#2563eb" stroke-width="78" stroke-dasharray="735.13 207.35"/>
      <circle r="150" fill="none" stroke="#14b8a6" stroke-width="78" stroke-dasharray="197.92 744.56" stroke-dashoffset="-735.13"/>
      <circle r="150" fill="none" stroke="#f59e0b" stroke-width="78" stroke-dasharray="9.42 933.06" stroke-dashoffset="-933.05"/>
    </g>
    <circle cx="350" cy="385" r="98" fill="white"/>
    <text x="350" y="372" text-anchor="middle" fill="#475569" font-size="18" font-weight="700">DRY AIR</text>
    <text x="350" y="414" text-anchor="middle" fill="#0f172a" font-size="30" font-weight="700">100%</text>

    <g>
      <rect x="620" y="210" width="420" height="98" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
      <rect x="646" y="235" width="48" height="48" rx="10" fill="#2563eb"/>
      <text x="720" y="250" fill="#1e3a8a" font-size="18" font-weight="700">NITROGEN</text>
      <text x="1000" y="273" text-anchor="end" fill="#0f172a" font-size="34" font-weight="700">78%</text>
      <text x="720" y="282" fill="#475569" font-size="15">Largest component by volume</text>
    </g>

    <g>
      <rect x="620" y="335" width="420" height="98" rx="14" fill="#f0fdfa" stroke="#99f6e4"/>
      <rect x="646" y="360" width="48" height="48" rx="10" fill="#14b8a6"/>
      <text x="720" y="375" fill="#115e59" font-size="18" font-weight="700">OXYGEN</text>
      <text x="1000" y="398" text-anchor="end" fill="#0f172a" font-size="34" font-weight="700">21%</text>
      <text x="720" y="407" fill="#475569" font-size="15">Supports respiration and combustion</text>
    </g>

    <g>
      <rect x="620" y="460" width="420" height="98" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
      <rect x="646" y="485" width="48" height="48" rx="10" fill="#f59e0b"/>
      <text x="720" y="500" fill="#9a3412" font-size="18" font-weight="700">OTHER GASES</text>
      <text x="1000" y="523" text-anchor="end" fill="#0f172a" font-size="34" font-weight="700">~1%</text>
      <text x="720" y="532" fill="#475569" font-size="15">Mainly argon, plus trace gases</text>
    </g>
  </g>
</svg>
