<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">ISA temperature decreases through the troposphere</title>
  <desc id="desc">ISA temperature is 15 degrees Celsius at mean sea level and falls at 1.98 degrees Celsius per 1000 feet to minus 56.5 degrees Celsius at 36,090 feet.</desc>
  <rect width="1100" height="620" fill="#ffffff"/>

  <g font-family="Arial, sans-serif">
    <line x1="150" y1="520" x2="720" y2="520" stroke="#334155" stroke-width="4"/>
    <line x1="150" y1="520" x2="150" y2="70" stroke="#334155" stroke-width="4"/>
    <path d="M704 511 L720 520 L704 529" fill="none" stroke="#334155" stroke-width="4"/>
    <path d="M141 87 L150 70 L159 87" fill="none" stroke="#334155" stroke-width="4"/>

    <g stroke="#e2e8f0" stroke-width="2">
      <line x1="150" y1="400" x2="720" y2="400"/>
      <line x1="150" y1="280" x2="720" y2="280"/>
      <line x1="150" y1="160" x2="720" y2="160"/>
    </g>

    <line x1="635" y1="520" x2="205" y2="100" stroke="#ef4444" stroke-width="9" stroke-linecap="round"/>
    <circle cx="635" cy="520" r="11" fill="#b91c1c"/>
    <circle cx="205" cy="100" r="11" fill="#b91c1c"/>

    <text x="635" y="566" text-anchor="middle" fill="#0f172a" font-size="25" font-weight="700">15°C</text>
    <text x="635" y="592" text-anchor="middle" fill="#475569" font-size="18">Mean sea level</text>

    <text x="205" y="56" text-anchor="middle" fill="#0f172a" font-size="25" font-weight="700">-56.5°C</text>
    <text x="205" y="82" text-anchor="middle" fill="#475569" font-size="18">36 090 ft</text>

    <rect x="350" y="258" width="310" height="88" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="505" y="293" text-anchor="middle" fill="#9a3412" font-size="23" font-weight="700">STANDARD LAPSE RATE</text>
    <text x="505" y="326" text-anchor="middle" fill="#0f172a" font-size="25" font-weight="700">1.98°C per 1 000 ft</text>

    <g fill="#475569" font-size="18" text-anchor="end">
      <text x="130" y="526">0 ft</text>
      <text x="130" y="406">10 000</text>
      <text x="130" y="286">20 000</text>
      <text x="130" y="166">30 000</text>
      <text x="130" y="106">36 090</text>
    </g>
    <text x="58" y="310" text-anchor="middle" transform="rotate(-90 58 310)" fill="#334155" font-size="21" font-weight="700">ALTITUDE</text>
    <text x="435" y="606" text-anchor="middle" fill="#334155" font-size="21" font-weight="700">TEMPERATURE</text>

    <line x1="790" y1="110" x2="790" y2="510" stroke="#cbd5e1" stroke-width="3"/>
    <text x="835" y="160" fill="#1e3a8a" font-size="22" font-weight="700">ISA MEMORY VALUES</text>
    <text x="835" y="215" fill="#0f172a" font-size="30" font-weight="700">15°C</text>
    <text x="835" y="245" fill="#475569" font-size="19">at mean sea level</text>
    <text x="835" y="320" fill="#0f172a" font-size="30" font-weight="700">1.98°C</text>
    <text x="835" y="350" fill="#475569" font-size="19">per 1 000 ft</text>
    <text x="835" y="425" fill="#0f172a" font-size="30" font-weight="700">36 090 ft</text>
    <text x="835" y="455" fill="#475569" font-size="19">standard tropopause</text>
  </g>
</svg>
