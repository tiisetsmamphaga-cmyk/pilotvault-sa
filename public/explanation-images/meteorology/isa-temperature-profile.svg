<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">International Standard Atmosphere temperature profile</title>
  <desc id="desc">The standard temperature is 15 degrees Celsius at mean sea level and decreases at 1.98 degrees Celsius per 1000 feet to the tropopause at 36,090 feet.</desc>
  <defs>
    <linearGradient id="plot" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="60" y="60" fill="#0f172a" font-family="Arial, sans-serif" font-size="32" font-weight="700">International Standard Atmosphere: temperature</text>
  <text x="60" y="94" fill="#475569" font-family="Arial, sans-serif" font-size="18">ISA provides a common reference model for aircraft performance and instrument calibration.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="125" width="1080" height="525" rx="18" fill="white"/>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="135" y="175" width="610" height="405" rx="12" fill="url(#plot)" stroke="#bfdbfe"/>
    <line x1="210" y1="535" x2="685" y2="535" stroke="#334155" stroke-width="3"/>
    <line x1="210" y1="535" x2="210" y2="205" stroke="#334155" stroke-width="3"/>
    <path d="M672 527 L685 535 L672 543" fill="none" stroke="#334155" stroke-width="3"/>
    <path d="M202 218 L210 205 L218 218" fill="none" stroke="#334155" stroke-width="3"/>

    <g stroke="#cbd5e1" stroke-width="1">
      <line x1="210" y1="455" x2="685" y2="455"/>
      <line x1="210" y1="375" x2="685" y2="375"/>
      <line x1="210" y1="295" x2="685" y2="295"/>
      <line x1="210" y1="215" x2="685" y2="215"/>
      <line x1="290" y1="205" x2="290" y2="535"/>
      <line x1="390" y1="205" x2="390" y2="535"/>
      <line x1="490" y1="205" x2="490" y2="535"/>
      <line x1="590" y1="205" x2="590" y2="535"/>
    </g>

    <g fill="#475569" font-size="14">
      <text x="194" y="540" text-anchor="end">0 ft</text>
      <text x="194" y="460" text-anchor="end">10 000</text>
      <text x="194" y="380" text-anchor="end">20 000</text>
      <text x="194" y="300" text-anchor="end">30 000</text>
      <text x="194" y="220" text-anchor="end">36 090</text>
      <text x="210" y="560" text-anchor="middle">-60</text>
      <text x="310" y="560" text-anchor="middle">-40</text>
      <text x="410" y="560" text-anchor="middle">-20</text>
      <text x="510" y="560" text-anchor="middle">0</text>
      <text x="585" y="560" text-anchor="middle">15°C</text>
    </g>
    <text x="448" y="598" text-anchor="middle" fill="#334155" font-size="17" font-weight="700">Temperature</text>
    <text x="112" y="382" text-anchor="middle" transform="rotate(-90 112 382)" fill="#334155" font-size="17" font-weight="700">Altitude</text>

    <line x1="585" y1="535" x2="228" y2="215" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
    <circle cx="585" cy="535" r="10" fill="#b91c1c"/>
    <circle cx="228" cy="215" r="10" fill="#b91c1c"/>
    <rect x="335" y="337" width="240" height="65" rx="12" fill="white" stroke="#fecaca"/>
    <text x="455" y="365" text-anchor="middle" fill="#991b1b" font-size="17" font-weight="700">Temperature decreases</text>
    <text x="455" y="389" text-anchor="middle" fill="#334155" font-size="16">1.98°C per 1 000 ft</text>

    <g>
      <rect x="790" y="190" width="290" height="118" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="815" y="225" fill="#1e3a8a" font-size="17" font-weight="700">MEAN SEA LEVEL</text>
      <text x="815" y="266" fill="#0f172a" font-size="34" font-weight="700">15°C</text>
      <text x="815" y="291" fill="#475569" font-size="15">Standard pressure: 1013.25 hPa</text>
    </g>
    <g>
      <rect x="790" y="335" width="290" height="132" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="815" y="370" fill="#9a3412" font-size="17" font-weight="700">STANDARD TROPOPAUSE</text>
      <text x="815" y="410" fill="#0f172a" font-size="31" font-weight="700">36 090 ft</text>
      <text x="815" y="442" fill="#475569" font-size="17">Temperature: about -56.5°C</text>
    </g>
    <g>
      <rect x="790" y="495" width="290" height="78" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="935" y="527" text-anchor="middle" fill="#166534" font-size="17" font-weight="700">MEMORY CHECK</text>
      <text x="935" y="554" text-anchor="middle" fill="#334155" font-size="16">15°C · 1.98°C/1 000 ft · 36 090 ft</text>
    </g>
  </g>
</svg>
