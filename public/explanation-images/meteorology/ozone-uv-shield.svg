<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Ozone absorbs harmful ultraviolet radiation</title>
  <desc id="desc">Most harmful ultraviolet radiation is absorbed in the ozone-rich stratosphere before reaching the surface.</desc>
  <rect width="1100" height="620" fill="#ffffff"/>

  <g font-family="Arial, sans-serif">
    <circle cx="150" cy="135" r="68" fill="#fbbf24"/>
    <g stroke="#f59e0b" stroke-width="7" stroke-linecap="round">
      <line x1="150" y1="40" x2="150" y2="18"/>
      <line x1="150" y1="252" x2="150" y2="230"/>
      <line x1="55" y1="135" x2="33" y2="135"/>
      <line x1="267" y1="135" x2="245" y2="135"/>
      <line x1="83" y1="68" x2="67" y2="52"/>
      <line x1="217" y1="68" x2="233" y2="52"/>
    </g>
    <text x="150" y="145" text-anchor="middle" fill="#78350f" font-size="25" font-weight="700">SUN</text>

    <g stroke="#a855f7" stroke-width="8" stroke-linecap="round">
      <line x1="230" y1="105" x2="465" y2="240"/>
      <line x1="245" y1="145" x2="520" y2="258"/>
      <line x1="225" y1="180" x2="580" y2="274"/>
    </g>
    <g fill="#a855f7">
      <path d="M445 224 L474 245 L439 245 Z"/>
      <path d="M498 246 L530 262 L495 267 Z"/>
      <path d="M555 263 L590 277 L556 285 Z"/>
    </g>
    <text x="310" y="88" fill="#7e22ce" font-size="22" font-weight="700">ULTRAVIOLET RADIATION</text>

    <rect x="390" y="245" width="630" height="82" fill="#10b981"/>
    <text x="705" y="278" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">OZONE-RICH STRATOSPHERE</text>
    <text x="705" y="309" text-anchor="middle" fill="#ecfdf5" font-size="20">Most harmful UV is absorbed here</text>

    <g stroke="#c084fc" stroke-width="5" stroke-linecap="round" opacity=".42">
      <line x1="785" y1="331" x2="840" y2="445"/>
    </g>

    <path d="M70 520 Q550 375 1030 520 L1030 590 L70 590 Z" fill="#65a30d"/>
    <path d="M70 520 Q550 375 1030 520" fill="none" stroke="#bef264" stroke-width="8"/>
    <text x="550" y="558" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">EARTH'S SURFACE</text>
  </g>
</svg>
