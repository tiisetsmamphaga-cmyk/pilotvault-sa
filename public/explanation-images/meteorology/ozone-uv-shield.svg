<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The ozone layer absorbs ultraviolet radiation</title>
  <desc id="desc">Ultraviolet radiation from the Sun is mostly absorbed by ozone in the stratosphere before reaching the surface.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17233a"/>
      <stop offset=".65" stop-color="#4779a8"/>
      <stop offset="1" stop-color="#cceeff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="60" y="60" fill="#0f172a" font-family="Arial, sans-serif" font-size="32" font-weight="700">The ozone layer acts as an ultraviolet shield</text>
  <text x="60" y="94" fill="#475569" font-family="Arial, sans-serif" font-size="18">Ozone absorbs much of the Sun's harmful UV radiation in the stratosphere.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="125" width="1080" height="525" rx="18" fill="url(#space)"/>
  </g>

  <g font-family="Arial, sans-serif">
    <circle cx="190" cy="235" r="72" fill="#fbbf24"/>
    <g stroke="#fbbf24" stroke-width="8" stroke-linecap="round">
      <line x1="190" y1="135" x2="190" y2="110"/>
      <line x1="190" y1="360" x2="190" y2="335"/>
      <line x1="90" y1="235" x2="65" y2="235"/>
      <line x1="315" y1="235" x2="290" y2="235"/>
      <line x1="120" y1="165" x2="100" y2="145"/>
      <line x1="260" y1="165" x2="280" y2="145"/>
      <line x1="120" y1="305" x2="100" y2="325"/>
      <line x1="260" y1="305" x2="280" y2="325"/>
    </g>
    <text x="190" y="240" text-anchor="middle" fill="#78350f" font-size="24" font-weight="700">SUN</text>

    <rect x="420" y="305" width="650" height="78" rx="20" fill="#34d399" opacity=".88"/>
    <g fill="#ecfdf5" font-size="19" font-weight="700" text-anchor="middle">
      <text x="745" y="337">OZONE-RICH STRATOSPHERE</text>
      <text x="745" y="365" font-size="16">Most harmful ultraviolet radiation is absorbed here</text>
    </g>

    <g stroke="#c084fc" stroke-width="9" stroke-linecap="round">
      <line x1="290" y1="225" x2="465" y2="315"/>
      <line x1="310" y1="260" x2="535" y2="330"/>
      <line x1="275" y1="195" x2="575" y2="315"/>
      <line x1="300" y1="295" x2="650" y2="345"/>
    </g>
    <g fill="#c084fc">
      <path d="M447 302 L473 319 L443 322 Z"/>
      <path d="M515 320 L543 332 L515 340 Z"/>
      <path d="M555 302 L584 318 L554 324 Z"/>
      <path d="M627 335 L660 346 L630 354 Z"/>
    </g>
    <text x="355" y="185" fill="#f3e8ff" font-size="18" font-weight="700">ULTRAVIOLET RADIATION</text>

    <g stroke="#c084fc" stroke-width="5" stroke-linecap="round" opacity=".55">
      <line x1="835" y1="385" x2="900" y2="502"/>
      <line x1="930" y1="385" x2="960" y2="500"/>
    </g>

    <path d="M90 590 Q600 455 1110 590 L1110 650 L90 650 Z" fill="#75a955"/>
    <path d="M90 590 Q600 455 1110 590" fill="none" stroke="#d7e7bf" stroke-width="8"/>
    <text x="600" y="620" text-anchor="middle" fill="white" font-size="20" font-weight="700">EARTH'S SURFACE</text>

    <g>
      <rect x="735" y="170" width="335" height="90" rx="12" fill="white" opacity=".94"/>
      <text x="902" y="205" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">Main protective effect</text>
      <text x="902" y="235" text-anchor="middle" fill="#475569" font-size="17">Less harmful UV reaches the lower atmosphere.</text>
    </g>
  </g>
</svg>
