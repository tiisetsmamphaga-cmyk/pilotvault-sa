<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Tropopause height varies with latitude</title>
  <desc id="desc">The tropopause is higher over the warm equator and lower over the cold poles.</desc>
  <defs>
    <linearGradient id="air" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#dff4ff"/>
      <stop offset="1" stop-color="#9cc9e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="60" y="60" fill="#0f172a" font-family="Arial, sans-serif" font-size="32" font-weight="700">Why the troposphere is deepest at the equator</text>
  <text x="60" y="94" fill="#475569" font-family="Arial, sans-serif" font-size="18">Strong solar heating expands the tropical air column and raises the tropopause.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="125" width="1080" height="525" rx="18" fill="white"/>
    <rect x="105" y="170" width="990" height="400" rx="14" fill="url(#air)"/>
  </g>

  <g font-family="Arial, sans-serif">
    <path d="M160 535 Q600 355 1040 535" fill="#d7e7bf" stroke="#5d8a43" stroke-width="4"/>
    <path d="M135 330 Q285 295 410 265 Q600 210 790 265 Q915 295 1065 330" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    <text x="600" y="195" text-anchor="middle" fill="#92400e" font-size="18" font-weight="700">TROPOPAUSE</text>

    <g stroke="#ef4444" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M520 480 C500 430 505 375 525 325"/>
      <path d="M600 485 C580 425 585 350 600 285"/>
      <path d="M680 480 C700 430 695 375 675 325"/>
    </g>
    <g fill="#ef4444">
      <path d="M514 334 L525 312 L535 336 Z"/>
      <path d="M589 296 L601 270 L611 297 Z"/>
      <path d="M665 336 L675 312 L686 334 Z"/>
    </g>

    <g>
      <circle cx="600" cy="410" r="48" fill="#fbbf24"/>
      <g stroke="#f59e0b" stroke-width="5">
        <line x1="600" y1="340" x2="600" y2="320"/>
        <line x1="600" y1="500" x2="600" y2="480"/>
        <line x1="530" y1="410" x2="510" y2="410"/>
        <line x1="690" y1="410" x2="670" y2="410"/>
        <line x1="550" y1="360" x2="535" y2="345"/>
        <line x1="650" y1="360" x2="665" y2="345"/>
      </g>
    </g>

    <g fill="#0f172a" font-size="18" font-weight="700">
      <text x="155" y="607">SOUTH POLE</text>
      <text x="600" y="607" text-anchor="middle">EQUATOR</text>
      <text x="1045" y="607" text-anchor="end">NORTH POLE</text>
    </g>

    <g>
      <rect x="465" y="145" width="270" height="78" rx="12" fill="#fff7ed" stroke="#fdba74"/>
      <text x="600" y="178" text-anchor="middle" fill="#9a3412" font-size="17" font-weight="700">Equatorial tropopause</text>
      <text x="600" y="207" text-anchor="middle" fill="#0f172a" font-size="24" font-weight="700">about 16-18 km</text>
    </g>
    <g>
      <rect x="105" y="245" width="250" height="76" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="230" y="277" text-anchor="middle" fill="#1e3a8a" font-size="17" font-weight="700">Polar tropopause</text>
      <text x="230" y="305" text-anchor="middle" fill="#0f172a" font-size="23" font-weight="700">about 8-10 km</text>
    </g>
    <g>
      <rect x="845" y="245" width="250" height="76" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="970" y="277" text-anchor="middle" fill="#1e3a8a" font-size="17" font-weight="700">Polar tropopause</text>
      <text x="970" y="305" text-anchor="middle" fill="#0f172a" font-size="23" font-weight="700">about 8-10 km</text>
    </g>
  </g>
</svg>
