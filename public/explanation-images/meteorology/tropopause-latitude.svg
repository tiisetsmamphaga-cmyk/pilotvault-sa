<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">The tropopause is highest over the equator</title>
  <desc id="desc">The tropopause is about 16 to 18 kilometres high over the equator and about 8 to 10 kilometres high over the poles.</desc>
  <rect width="1100" height="620" fill="#ffffff"/>

  <g font-family="Arial, sans-serif">
    <path d="M80 510 Q550 300 1020 510" fill="#dcfce7" stroke="#4d7c0f" stroke-width="5"/>
    <path d="M95 310 Q300 278 445 212 Q550 168 655 212 Q800 278 1005 310" fill="none" stroke="#f59e0b" stroke-width="9" stroke-linecap="round"/>

    <line x1="550" y1="455" x2="550" y2="235" stroke="#ef4444" stroke-width="5"/>
    <path d="M538 250 L550 226 L562 250 Z" fill="#ef4444"/>
    <text x="550" y="474" text-anchor="middle" fill="#991b1b" font-size="20" font-weight="700">STRONGER HEATING</text>

    <text x="550" y="115" text-anchor="middle" fill="#92400e" font-size="25" font-weight="700">TROPOPAUSE</text>

    <text x="550" y="188" text-anchor="middle" fill="#0f172a" font-size="30" font-weight="700">16-18 km</text>
    <text x="550" y="218" text-anchor="middle" fill="#475569" font-size="20">over the equator</text>

    <text x="130" y="272" fill="#0f172a" font-size="27" font-weight="700">8-10 km</text>
    <text x="130" y="300" fill="#475569" font-size="19">over the poles</text>

    <text x="970" y="272" text-anchor="end" fill="#0f172a" font-size="27" font-weight="700">8-10 km</text>
    <text x="970" y="300" text-anchor="end" fill="#475569" font-size="19">over the poles</text>

    <text x="90" y="560" fill="#334155" font-size="19" font-weight="700">SOUTH POLE</text>
    <text x="550" y="560" text-anchor="middle" fill="#334155" font-size="19" font-weight="700">EQUATOR</text>
    <text x="1010" y="560" text-anchor="end" fill="#334155" font-size="19" font-weight="700">NORTH POLE</text>
  </g>
</svg>
