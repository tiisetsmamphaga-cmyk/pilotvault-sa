<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="72" fill="#06111f"/><rect y="68" width="1200" height="4" fill="#f4b400"/><g font-family="Arial, sans-serif"><text x="44" y="45" fill="#fff" font-size="24" font-weight="700">PILOTVAULT SA</text><text x="1150" y="45" text-anchor="end" fill="#f4b400" font-size="18" font-weight="700">NAVIGATION</text><text x="600" y="122" text-anchor="middle" fill="#06111f" font-size="30" font-weight="700">ADF RELATIVE BEARING</text><circle cx="470" cy="390" r="200" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><line x1="470" y1="390" x2="470" y2="190" stroke="#06111f" stroke-width="6"/><polygon points="470,190 455,220 485,220" fill="#06111f"/><text x="470" y="175" text-anchor="middle" fill="#06111f" font-size="21" font-weight="700">AIRCRAFT HEADING 090°</text><circle cx="560" cy="234" r="14" fill="#f4b400"/><text x="592" y="232" fill="#92400e" font-size="21" font-weight="700">NDB</text><line x1="470" y1="390" x2="560" y2="234" stroke="#f4b400" stroke-width="7"/><path d="M470 300 A90 90 0 0 1 515 312.1" fill="none" stroke="#64748b" stroke-width="5"/><text x="528" y="342" fill="#475569" font-size="19" font-weight="700">Relative</text><text x="528" y="366" fill="#475569" font-size="19" font-weight="700">bearing 030°</text><rect x="790" y="230" width="330" height="310" rx="18" fill="#06111f"/><text x="955" y="275" text-anchor="middle" fill="#f4b400" font-size="22" font-weight="700">WORKING RULE</text><text x="830" y="335" fill="#fff" font-size="20">Magnetic bearing TO NDB</text><text x="830" y="375" fill="#fff" font-size="20">= magnetic heading</text><text x="830" y="415" fill="#fff" font-size="20">+ relative bearing</text><text x="955" y="475" text-anchor="middle" fill="#f4b400" font-size="26" font-weight="700">090° + 030° = 120°</text><text x="600" y="650" text-anchor="middle" fill="#475569" font-size="20">Reduce answers to 000°–359°. Relative bearing is measured clockwise from the aircraft nose.</text></g></svg>