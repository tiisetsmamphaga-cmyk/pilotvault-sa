<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Airspeed relationship</title><desc id="desc">A simple chain from indicated airspeed through calibrated airspeed to true airspeed and groundspeed.</desc><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="72" fill="#06111f"/><rect y="68" width="1200" height="4" fill="#f4b400"/><g font-family="Arial, sans-serif"><text x="44" y="45" fill="#fff" font-size="24" font-weight="700">PILOTVAULT SA</text><text x="1150" y="45" text-anchor="end" fill="#f4b400" font-size="18" font-weight="700">NAVIGATION</text><text x="600" y="122" text-anchor="middle" fill="#06111f" font-size="30" font-weight="700">AIRSPEED RELATIONSHIP</text><g><rect x="70" y="260" width="220" height="150" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="180" y="310" text-anchor="middle" fill="#06111f" font-size="28" font-weight="700">IAS</text><text x="180" y="350" text-anchor="middle" fill="#475569" font-size="18">Instrument reading</text><text x="180" y="380" text-anchor="middle" fill="#475569" font-size="17">before corrections</text><rect x="350" y="260" width="220" height="150" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="460" y="310" text-anchor="middle" fill="#06111f" font-size="28" font-weight="700">CAS / RAS</text><text x="460" y="350" text-anchor="middle" fill="#475569" font-size="18">IAS corrected for</text><text x="460" y="380" text-anchor="middle" fill="#475569" font-size="17">instrument + position error</text><rect x="630" y="260" width="220" height="150" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="740" y="310" text-anchor="middle" fill="#06111f" font-size="28" font-weight="700">TAS</text><text x="740" y="350" text-anchor="middle" fill="#475569" font-size="18">CAS / RAS corrected for</text><text x="740" y="380" text-anchor="middle" fill="#475569" font-size="17">altitude + temperature</text><rect x="910" y="260" width="220" height="150" rx="18" fill="#06111f"/><text x="1020" y="310" text-anchor="middle" fill="#f4b400" font-size="28" font-weight="700">GS</text><text x="1020" y="350" text-anchor="middle" fill="#fff" font-size="18">TAS adjusted for</text><text x="1020" y="380" text-anchor="middle" fill="#cbd5e1" font-size="17">wind</text></g><g stroke="#f4b400" stroke-width="6"><line x1="290" y1="335" x2="350" y2="335"/><line x1="570" y1="335" x2="630" y2="335"/><line x1="850" y1="335" x2="910" y2="335"/></g><g fill="#f4b400"><polygon points="350,335 332,324 332,346"/><polygon points="630,335 612,324 612,346"/><polygon points="910,335 892,324 892,346"/></g><text x="600" y="500" text-anchor="middle" fill="#06111f" font-size="23" font-weight="700">Wind does not change TAS — it changes groundspeed.</text><text x="600" y="555" text-anchor="middle" fill="#475569" font-size="20">The exact correction sequence depends on the terminology used by the question and aircraft data.</text></g></svg>