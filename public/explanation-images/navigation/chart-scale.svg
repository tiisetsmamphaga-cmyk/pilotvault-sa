<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Chart scale and distance</title><desc id="desc">Representative fraction scale and relationship between map distance and ground distance.</desc><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="72" fill="#06111f"/><rect y="68" width="1200" height="4" fill="#f4b400"/><g font-family="Arial, sans-serif"><text x="44" y="45" fill="#fff" font-size="24" font-weight="700">PILOTVAULT SA</text><text x="1150" y="45" text-anchor="end" fill="#f4b400" font-size="18" font-weight="700">NAVIGATION</text><text x="600" y="122" text-anchor="middle" fill="#06111f" font-size="30" font-weight="700">CHART SCALE</text><rect x="125" y="185" width="950" height="135" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="230" text-anchor="middle" fill="#06111f" font-size="26" font-weight="700">1 : 1 000 000</text><text x="600" y="275" text-anchor="middle" fill="#475569" font-size="21">1 unit on the chart = 1 000 000 of the same units on the ground</text><line x1="210" y1="430" x2="990" y2="430" stroke="#06111f" stroke-width="5"/><g stroke="#06111f" stroke-width="4"><line x1="210" y1="410" x2="210" y2="450"/><line x1="405" y1="410" x2="405" y2="450"/><line x1="600" y1="410" x2="600" y2="450"/><line x1="795" y1="410" x2="795" y2="450"/><line x1="990" y1="410" x2="990" y2="450"/></g><g fill="#475569" font-size="19" text-anchor="middle"><text x="210" y="485">0</text><text x="405" y="485">5 cm</text><text x="600" y="485">10 cm</text><text x="795" y="485">15 cm</text><text x="990" y="485">20 cm</text></g><line x1="210" y1="535" x2="990" y2="535" stroke="#f4b400" stroke-width="8"/><text x="600" y="575" text-anchor="middle" fill="#92400e" font-size="22" font-weight="700">20 cm on chart = 200 km on ground at 1:1 000 000</text><rect x="330" y="610" width="540" height="60" rx="14" fill="#06111f"/><text x="600" y="648" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Distance = chart measurement × scale denominator</text></g></svg>