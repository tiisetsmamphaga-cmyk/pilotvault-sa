<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Navigation unit conversions</title><desc id="desc">Common aviation navigation conversion factors for nautical miles, kilometres, US gallons and litres.</desc><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="72" fill="#06111f"/><rect y="68" width="1200" height="4" fill="#f4b400"/><g font-family="Arial, sans-serif"><text x="44" y="45" fill="#fff" font-size="24" font-weight="700">PILOTVAULT SA</text><text x="1150" y="45" text-anchor="end" fill="#f4b400" font-size="18" font-weight="700">NAVIGATION</text><text x="600" y="122" text-anchor="middle" fill="#06111f" font-size="30" font-weight="700">COMMON CONVERSIONS</text><rect x="115" y="185" width="455" height="190" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="342" y="235" text-anchor="middle" fill="#06111f" font-size="24" font-weight="700">DISTANCE</text><text x="342" y="290" text-anchor="middle" fill="#f4b400" font-size="30" font-weight="700">1 NM = 1.852 km</text><text x="342" y="335" text-anchor="middle" fill="#475569" font-size="20">1° latitude ≈ 60 NM</text><rect x="630" y="185" width="455" height="190" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="858" y="235" text-anchor="middle" fill="#06111f" font-size="24" font-weight="700">VOLUME</text><text x="858" y="290" text-anchor="middle" fill="#f4b400" font-size="30" font-weight="700">1 US gal = 3.785 L</text><text x="858" y="335" text-anchor="middle" fill="#475569" font-size="20">Litres ÷ 3.785 = US gallons</text><rect x="215" y="455" width="770" height="135" rx="18" fill="#06111f"/><text x="600" y="500" text-anchor="middle" fill="#f4b400" font-size="22" font-weight="700">QUICK METHOD</text><text x="600" y="545" text-anchor="middle" fill="#fff" font-size="21">Write the conversion factor first, keep units visible, then round only at the end.</text><text x="600" y="645" text-anchor="middle" fill="#475569" font-size="20">This prevents the most common unit-conversion mistakes in navigation calculations.</text></g></svg>