<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Compass rose and quadrantal directions</title><desc id="desc">Cardinal and quadrantal directions with their degree values.</desc><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="72" fill="#06111f"/><rect x="0" y="68" width="1200" height="4" fill="#f4b400"/><g font-family="Arial, sans-serif"><text x="44" y="45" fill="#fff" font-size="24" font-weight="700">PILOTVAULT SA</text><text x="1150" y="45" text-anchor="end" fill="#f4b400" font-size="18" font-weight="700">NAVIGATION</text><text x="600" y="125" text-anchor="middle" fill="#06111f" font-size="30" font-weight="700">COMPASS ROSE</text><circle cx="600" cy="395" r="190" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><circle cx="600" cy="395" r="125" fill="none" stroke="#e2e8f0" stroke-width="2"/><g stroke="#06111f" stroke-width="4"><line x1="600" y1="228" x2="600" y2="585"/><line x1="410" y1="395" x2="790" y2="395"/></g><g stroke="#94a3b8" stroke-width="3"><line x1="465.7" y1="260.7" x2="734.3" y2="529.3"/><line x1="734.3" y1="260.7" x2="465.7" y2="529.3"/></g><polygon points="600,205 587,234 613,234" fill="#f4b400"/><g fill="#06111f" font-size="24" font-weight="700"><text x="600" y="188" text-anchor="middle">N  000° / 360°</text><text x="805" y="403">E 090°</text><text x="600" y="622" text-anchor="middle">S 180°</text><text x="395" y="403" text-anchor="end">W 270°</text></g><g fill="#475569" font-size="21" font-weight="700"><text x="760" y="240">NE 045°</text><text x="760" y="566">SE 135°</text><text x="440" y="566" text-anchor="end">SW 225°</text><text x="440" y="240" text-anchor="end">NW 315°</text></g><circle cx="600" cy="395" r="8" fill="#f4b400"/><text x="600" y="680" text-anchor="middle" fill="#475569" font-size="20">Headings are measured clockwise from North.</text></g></svg>