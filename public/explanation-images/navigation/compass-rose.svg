<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Compass rose and quadrantal directions</title><desc id="desc">Cardinal and quadrantal directions with their degree values.</desc><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="72" fill="#06111f"/><rect x="0" y="68" width="1200" height="4" fill="#f4b400"/><g font-family="Arial, sans-serif"><text x="44" y="45" fill="#fff" font-size="24" font-weight="700">PILOTVAULT SA</text><text x="1150" y="45" text-anchor="end" fill="#f4b400" font-size="18" font-weight="700">NAVIGATION</text><text x="600" y="125" text-anchor="middle" fill="#06111f" font-size="30" font-weight="700">COMPASS ROSE</text><circle cx="600" cy="385" r="220" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><circle cx="600" cy="385" r="150" fill="none" stroke="#e2e8f0" stroke-width="2"/><g stroke="#06111f" stroke-width="4"><line x1="600" y1="145" x2="600" y2="625"/><line x1="360" y1="385" x2="840" y2="385"/></g><g stroke="#94a3b8" stroke-width="3"><line x1="430" y1="215" x2="770" y2="555"/><line x1="770" y1="215" x2="430" y2="555"/></g><polygon points="600,145 588,176 612,176" fill="#f4b400"/><g fill="#06111f" font-size="24" font-weight="700" text-anchor="middle"><text x="600" y="188">N</text><text x="600" y="216" font-size="18">000° / 360°</text><text x="824" y="393">E 090°</text><text x="600" y="598">S 180°</text><text x="376" y="393">W 270°</text></g><g fill="#475569" font-size="21" font-weight="700" text-anchor="middle"><text x="750" y="250">NE 045°</text><text x="750" y="535">SE 135°</text><text x="450" y="535">SW 225°</text><text x="450" y="250">NW 315°</text></g><circle cx="600" cy="385" r="8" fill="#f4b400"/><text x="600" y="675" text-anchor="middle" fill="#475569" font-size="20">Headings are measured clockwise from North.</text></g></svg>