<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Density altitude calculation</title><desc id="desc">A clear three-step flow from pressure altitude to ISA deviation and density altitude, followed by performance effects.</desc><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="72" fill="#06111f"/><rect y="68" width="1200" height="4" fill="#f4b400"/><g font-family="Arial, sans-serif"><text x="44" y="45" fill="#fff" font-size="24" font-weight="700">PILOTVAULT SA</text><text x="1150" y="45" text-anchor="end" fill="#f4b400" font-size="18" font-weight="700">NAVIGATION</text><text x="600" y="122" text-anchor="middle" fill="#06111f" font-size="30" font-weight="700">DENSITY ALTITUDE</text><rect x="70" y="190" width="300" height="145" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="220" y="232" text-anchor="middle" fill="#06111f" font-size="21" font-weight="700">1. PRESSURE ALTITUDE</text><text x="220" y="278" text-anchor="middle" fill="#475569" font-size="18">Elevation + (1013 − QNH) × 30</text><text x="220" y="309" text-anchor="middle" fill="#64748b" font-size="16">Approximation in feet</text><line x1="370" y1="262" x2="445" y2="262" stroke="#f4b400" stroke-width="6"/><polygon points="445,262 425,250 425,274" fill="#f4b400"/><rect x="450" y="190" width="300" height="145" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="232" text-anchor="middle" fill="#06111f" font-size="21" font-weight="700">2. ISA DEVIATION</text><text x="600" y="278" text-anchor="middle" fill="#475569" font-size="18">Actual temperature − ISA temperature</text><text x="600" y="309" text-anchor="middle" fill="#64748b" font-size="16">Hotter than ISA = positive</text><line x1="750" y1="262" x2="825" y2="262" stroke="#f4b400" stroke-width="6"/><polygon points="825,262 805,250 805,274" fill="#f4b400"/><rect x="830" y="190" width="300" height="145" rx="18" fill="#06111f"/><text x="980" y="232" text-anchor="middle" fill="#f4b400" font-size="21" font-weight="700">3. DENSITY ALTITUDE</text><text x="980" y="278" text-anchor="middle" fill="#fff" font-size="19">PA + (ISA deviation × 120)</text><text x="980" y="309" text-anchor="middle" fill="#cbd5e1" font-size="16">Approximation in feet</text><rect x="155" y="420" width="890" height="165" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="462" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">PERFORMANCE EFFECT</text><text x="600" y="505" text-anchor="middle" fill="#475569" font-size="20">Higher density altitude → thinner air → reduced aircraft performance</text><text x="600" y="543" text-anchor="middle" fill="#475569" font-size="20">Longer take-off roll · lower climb performance</text><text x="600" y="575" text-anchor="middle" fill="#92400e" font-size="18" font-weight="700">Hot + high + low pressure = higher density altitude</text><text x="600" y="657" text-anchor="middle" fill="#475569" font-size="19">Use the exact method required by the question or flight computer when provided.</text></g></svg>