<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Density altitude calculation</title><desc id="desc">Pressure altitude and temperature correction steps used to estimate density altitude.</desc><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="72" fill="#06111f"/><rect y="68" width="1200" height="4" fill="#f4b400"/><g font-family="Arial, sans-serif"><text x="44" y="45" fill="#fff" font-size="24" font-weight="700">PILOTVAULT SA</text><text x="1150" y="45" text-anchor="end" fill="#f4b400" font-size="18" font-weight="700">NAVIGATION</text><text x="600" y="122" text-anchor="middle" fill="#06111f" font-size="30" font-weight="700">DENSITY ALTITUDE</text><rect x="115" y="190" width="310" height="130" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="270" y="230" text-anchor="middle" fill="#06111f" font-size="21" font-weight="700">1. PRESSURE ALTITUDE</text><text x="270" y="270" text-anchor="middle" fill="#475569" font-size="19">Elevation + (1013 − QNH) × 30</text><text x="270" y="300" text-anchor="middle" fill="#475569" font-size="17">Approximation in feet</text><path d="M425 255 H540" stroke="#f4b400" stroke-width="6"/><polygon points="540,255 520,243 520,267" fill="#f4b400"/><rect x="545" y="190" width="310" height="130" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="700" y="230" text-anchor="middle" fill="#06111f" font-size="21" font-weight="700">2. ISA DEVIATION</text><text x="700" y="270" text-anchor="middle" fill="#475569" font-size="19">Actual temp − ISA temp</text><text x="700" y="300" text-anchor="middle" fill="#475569" font-size="17">Hotter than ISA = positive</text><path d="M855 255 H970" stroke="#f4b400" stroke-width="6"/><polygon points="970,255 950,243 950,267" fill="#f4b400"/><rect x="775" y="375" width="310" height="145" rx="18" fill="#06111f"/><text x="930" y="415" text-anchor="middle" fill="#f4b400" font-size="21" font-weight="700">3. DENSITY ALTITUDE</text><text x="930" y="458" text-anchor="middle" fill="#fff" font-size="20">PA + (ISA dev × 120)</text><text x="930" y="492" text-anchor="middle" fill="#cbd5e1" font-size="17">Approximation in feet</text><line x1="700" y1="320" x2="830" y2="390" stroke="#f4b400" stroke-width="5"/><rect x="120" y="390" width="560" height="180" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="400" y="430" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">PERFORMANCE EFFECT</text><text x="165" y="475" fill="#475569" font-size="20">Higher density altitude → thinner air</text><text x="165" y="515" fill="#475569" font-size="20">Longer take-off roll · lower climb performance</text><text x="165" y="555" fill="#475569" font-size="20">Hot + high + low pressure = high density altitude</text><text x="600" y="655" text-anchor="middle" fill="#475569" font-size="20">Use the exact method required by the question or flight computer when provided.</text></g></svg>