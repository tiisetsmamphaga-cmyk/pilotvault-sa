<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="72" fill="#06111f"/><rect y="68" width="1200" height="4" fill="#f4b400"/><g font-family="Arial, sans-serif"><text x="44" y="45" fill="#fff" font-size="24" font-weight="700">PILOTVAULT SA</text><text x="1150" y="45" text-anchor="end" fill="#f4b400" font-size="18" font-weight="700">NAVIGATION</text><text x="600" y="122" text-anchor="middle" fill="#06111f" font-size="30" font-weight="700">LATITUDE &amp; LONGITUDE</text><circle cx="470" cy="385" r="210" fill="#fff" stroke="#06111f" stroke-width="3"/><ellipse cx="470" cy="385" rx="210" ry="70" fill="none" stroke="#f4b400" stroke-width="5"/><ellipse cx="470" cy="385" rx="85" ry="210" fill="none" stroke="#94a3b8" stroke-width="3"/><line x1="260" y1="385" x2="680" y2="385" stroke="#f4b400" stroke-width="5"/><line x1="470" y1="175" x2="470" y2="595" stroke="#06111f" stroke-width="4"/><text x="700" y="395" fill="#92400e" font-size="20" font-weight="700">EQUATOR = 0° LAT</text><text x="485" y="170" fill="#06111f" font-size="20" font-weight="700">PRIME MERIDIAN = 0° LONG</text><rect x="780" y="220" width="330" height="315" rx="18" fill="#06111f"/><text x="945" y="270" text-anchor="middle" fill="#f4b400" font-size="22" font-weight="700">KEY RULES</text><text x="820" y="325" fill="#fff" font-size="20">Latitude: N / S of equator</text><text x="820" y="375" fill="#fff" font-size="20">Longitude: E / W of Greenwich</text><text x="820" y="425" fill="#fff" font-size="20">1° latitude ≈ 60 NM</text><text x="820" y="475" fill="#fff" font-size="20">1' latitude ≈ 1 NM</text><text x="600" y="660" text-anchor="middle" fill="#475569" font-size="20">Meridians run pole-to-pole; parallels remain parallel to the equator.</text></g></svg>