<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="72" fill="#06111f"/><rect y="68" width="1200" height="4" fill="#f4b400"/><g font-family="Arial, sans-serif"><text x="44" y="45" fill="#fff" font-size="24" font-weight="700">PILOTVAULT SA</text><text x="1150" y="45" text-anchor="end" fill="#f4b400" font-size="18" font-weight="700">NAVIGATION</text><text x="600" y="125" text-anchor="middle" fill="#06111f" font-size="30" font-weight="700">EARTH ROTATION &amp; POLAR AXIS</text><circle cx="600" cy="380" r="190" fill="#dbeafe" stroke="#06111f" stroke-width="3"/><line x1="500" y1="165" x2="700" y2="595" stroke="#06111f" stroke-width="5"/><text x="465" y="165" fill="#06111f" font-size="20" font-weight="700">TRUE NORTH</text><text x="700" y="625" fill="#06111f" font-size="20" font-weight="700">TRUE SOUTH</text><path d="M410 360 C430 220 760 190 790 340" fill="none" stroke="#f4b400" stroke-width="8"/><polygon points="790,340 770,325 772,350" fill="#f4b400"/><text x="600" y="235" text-anchor="middle" fill="#92400e" font-size="25" font-weight="700">WEST → EAST</text><text x="600" y="530" text-anchor="middle" fill="#06111f" font-size="27" font-weight="700">360° in 24 h = 15° per hour</text><text x="600" y="665" text-anchor="middle" fill="#475569" font-size="20">The Earth rotates about the polar axis joining true north and true south.</text></g></svg>