<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="72" fill="#06111f"/><rect y="68" width="1200" height="4" fill="#f4b400"/><g font-family="Arial, sans-serif"><text x="44" y="45" fill="#fff" font-size="24" font-weight="700">PILOTVAULT SA</text><text x="1150" y="45" text-anchor="end" fill="#f4b400" font-size="18" font-weight="700">NAVIGATION</text><text x="600" y="122" text-anchor="middle" fill="#06111f" font-size="30" font-weight="700">GREAT CIRCLE vs RHUMB LINE</text><rect x="90" y="180" width="650" height="400" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><g stroke="#e2e8f0" stroke-width="2"><line x1="150" y1="240" x2="680" y2="240"/><line x1="150" y1="330" x2="680" y2="330"/><line x1="150" y1="420" x2="680" y2="420"/><line x1="150" y1="510" x2="680" y2="510"/><line x1="230" y1="210" x2="230" y2="550"/><line x1="350" y1="210" x2="350" y2="550"/><line x1="470" y1="210" x2="470" y2="550"/><line x1="590" y1="210" x2="590" y2="550"/></g><circle cx="210" cy="470" r="8" fill="#06111f"/><circle cx="640" cy="300" r="8" fill="#06111f"/><path d="M210 470 Q420 205 640 300" fill="none" stroke="#f4b400" stroke-width="7"/><line x1="210" y1="470" x2="640" y2="300" stroke="#64748b" stroke-width="5" stroke-dasharray="12 9"/><text x="370" y="255" fill="#92400e" font-size="21" font-weight="700">Great circle: shortest route</text><text x="380" y="430" fill="#475569" font-size="21" font-weight="700">Rhumb line: constant angle</text><rect x="795" y="220" width="320" height="300" rx="18" fill="#06111f"/><text x="955" y="265" text-anchor="middle" fill="#f4b400" font-size="22" font-weight="700">REMEMBER</text><text x="835" y="325" fill="#fff" font-size="19">• Great circle = shortest distance</text><text x="835" y="375" fill="#fff" font-size="19">• Rhumb = constant direction</text><text x="835" y="425" fill="#fff" font-size="19">• Equator is both</text><text x="835" y="475" fill="#fff" font-size="19">• Meridians are great circles</text><text x="600" y="655" text-anchor="middle" fill="#475569" font-size="20">On a Lambert chart, a great-circle track changes direction slightly along the route.</text></g></svg>