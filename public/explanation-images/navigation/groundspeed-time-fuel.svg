<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Flight planning groundspeed and fuel</title><desc id="desc">A simple flow from wind-adjusted groundspeed to time and trip fuel.</desc><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="72" fill="#06111f"/><rect y="68" width="1200" height="4" fill="#f4b400"/><g font-family="Arial, sans-serif"><text x="44" y="45" fill="#fff" font-size="24" font-weight="700">PILOTVAULT SA</text><text x="1150" y="45" text-anchor="end" fill="#f4b400" font-size="18" font-weight="700">NAVIGATION</text><text x="600" y="122" text-anchor="middle" fill="#06111f" font-size="30" font-weight="700">GROUNDSPEED · TIME · FUEL</text><rect x="80" y="220" width="300" height="135" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="230" y="262" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">1. GROUNDSPEED</text><text x="230" y="305" text-anchor="middle" fill="#475569" font-size="20">TAS ± wind component</text><text x="230" y="335" text-anchor="middle" fill="#475569" font-size="17">Headwind subtracts · tailwind adds</text><path d="M380 288 H465" stroke="#f4b400" stroke-width="6"/><polygon points="465,288 445,276 445,300" fill="#f4b400"/><rect x="470" y="220" width="300" height="135" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="620" y="262" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">2. TIME</text><text x="620" y="305" text-anchor="middle" fill="#475569" font-size="20">Time = distance ÷ GS</text><text x="620" y="335" text-anchor="middle" fill="#475569" font-size="17">Hours unless converted to minutes</text><path d="M770 288 H855" stroke="#f4b400" stroke-width="6"/><polygon points="855,288 835,276 835,300" fill="#f4b400"/><rect x="860" y="220" width="260" height="135" rx="18" fill="#06111f"/><text x="990" y="262" text-anchor="middle" fill="#f4b400" font-size="22" font-weight="700">3. TRIP FUEL</text><text x="990" y="305" text-anchor="middle" fill="#fff" font-size="20">Time × fuel flow</text><rect x="245" y="440" width="710" height="150" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="482" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">TOTAL FUEL MAY ALSO INCLUDE</text><text x="600" y="530" text-anchor="middle" fill="#475569" font-size="20">Taxi / take-off &amp; climb + cruise + reserve + any required contingency</text><text x="600" y="565" text-anchor="middle" fill="#92400e" font-size="18" font-weight="700">Use exactly the fuel items specified in the question.</text><text x="600" y="655" text-anchor="middle" fill="#475569" font-size="20">Wind changes groundspeed, groundspeed changes time, and time changes fuel used.</text></g></svg>