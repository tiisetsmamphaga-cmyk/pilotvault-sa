<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">One in sixty rule</title><desc id="desc">Track error and closing angle using the one in sixty rule.</desc><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="72" fill="#06111f"/><rect y="68" width="1200" height="4" fill="#f4b400"/><g font-family="Arial, sans-serif"><text x="44" y="45" fill="#fff" font-size="24" font-weight="700">PILOTVAULT SA</text><text x="1150" y="45" text-anchor="end" fill="#f4b400" font-size="18" font-weight="700">NAVIGATION</text><text x="600" y="122" text-anchor="middle" fill="#06111f" font-size="30" font-weight="700">1-IN-60 RULE</text><line x1="150" y1="510" x2="1040" y2="510" stroke="#06111f" stroke-width="5"/><text x="150" y="548" fill="#475569" font-size="19">A</text><text x="1035" y="548" fill="#475569" font-size="19">B</text><line x1="150" y1="510" x2="620" y2="430" stroke="#ef4444" stroke-width="5"/><circle cx="620" cy="430" r="10" fill="#ef4444"/><line x1="620" y1="430" x2="1040" y2="510" stroke="#f4b400" stroke-width="5" stroke-dasharray="14 10"/><line x1="620" y1="430" x2="620" y2="510" stroke="#64748b" stroke-width="3" stroke-dasharray="8 8"/><text x="640" y="475" fill="#475569" font-size="20" font-weight="700">Off track</text><text x="315" y="445" fill="#b91c1c" font-size="21" font-weight="700">Distance flown</text><text x="795" y="455" fill="#92400e" font-size="21" font-weight="700">Distance to go</text><path d="M205 502 A58 58 0 0 1 214 493" fill="none" stroke="#ef4444" stroke-width="4"/><text x="190" y="470" fill="#b91c1c" font-size="20" font-weight="700">Opening angle</text><path d="M986 500 A60 60 0 0 0 978 490" fill="none" stroke="#f4b400" stroke-width="4"/><text x="835" y="585" fill="#92400e" font-size="20" font-weight="700">Closing angle</text><rect x="200" y="175" width="800" height="175" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="220" text-anchor="middle" fill="#06111f" font-size="23" font-weight="700">TRACK ERROR ≈ OFF TRACK × 60 ÷ DISTANCE FLOWN</text><text x="600" y="270" text-anchor="middle" fill="#06111f" font-size="23" font-weight="700">CLOSING ANGLE ≈ OFF TRACK × 60 ÷ DISTANCE TO GO</text><text x="600" y="320" text-anchor="middle" fill="#f4b400" font-size="23" font-weight="700">TOTAL CORRECTION = OPENING + CLOSING</text></g></svg>