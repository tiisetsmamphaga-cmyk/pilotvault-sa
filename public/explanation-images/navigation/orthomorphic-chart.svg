<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Orthomorphic chart concept</title><desc id="desc">Meridians and parallels intersect at right angles on an orthomorphic conformal chart.</desc><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="72" fill="#06111f"/><rect y="68" width="1200" height="4" fill="#f4b400"/><g font-family="Arial, sans-serif"><text x="44" y="45" fill="#fff" font-size="24" font-weight="700">PILOTVAULT SA</text><text x="1150" y="45" text-anchor="end" fill="#f4b400" font-size="18" font-weight="700">NAVIGATION</text><text x="600" y="122" text-anchor="middle" fill="#06111f" font-size="30" font-weight="700">ORTHOMORPHIC / CONFORMAL CHART</text><rect x="130" y="175" width="640" height="410" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><g stroke="#94a3b8" stroke-width="3"><line x1="250" y1="210" x2="250" y2="550"/><line x1="410" y1="210" x2="410" y2="550"/><line x1="570" y1="210" x2="570" y2="550"/><line x1="730" y1="210" x2="730" y2="550"/><line x1="170" y1="270" x2="730" y2="270"/><line x1="170" y1="370" x2="730" y2="370"/><line x1="170" y1="470" x2="730" y2="470"/></g><rect x="395" y="355" width="30" height="30" fill="none" stroke="#f4b400" stroke-width="5"/><text x="450" y="340" fill="#92400e" font-size="20" font-weight="700">90°</text><text x="450" y="625" text-anchor="middle" fill="#475569" font-size="20">Meridians and parallels cross at right angles.</text><rect x="835" y="200" width="300" height="350" rx="18" fill="#06111f"/><text x="985" y="245" text-anchor="middle" fill="#f4b400" font-size="22" font-weight="700">WHAT IT PRESERVES</text><text x="875" y="300" fill="#fff" font-size="20">• Local angles</text><text x="875" y="345" fill="#fff" font-size="20">• Small shapes</text><text x="875" y="390" fill="#fff" font-size="20">• Direction locally</text><text x="985" y="455" text-anchor="middle" fill="#f4b400" font-size="21" font-weight="700">KEY IDEA</text><text x="985" y="495" text-anchor="middle" fill="#cbd5e1" font-size="19">Conformal = orthomorphic</text><text x="600" y="665" text-anchor="middle" fill="#475569" font-size="20">No flat chart removes all distortion; orthomorphic charts preserve angles locally.</text></g></svg>