<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="72" fill="#06111f"/><rect y="68" width="1200" height="4" fill="#f4b400"/><g font-family="Arial, sans-serif"><text x="44" y="45" fill="#fff" font-size="24" font-weight="700">PILOTVAULT SA</text><text x="1150" y="45" text-anchor="end" fill="#f4b400" font-size="18" font-weight="700">NAVIGATION</text><text x="600" y="122" text-anchor="middle" fill="#06111f" font-size="30" font-weight="700">QDM · QDR · QTE · QUJ</text><circle cx="360" cy="385" r="55" fill="#06111f"/><text x="360" y="393" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">STN</text><polygon points="790,360 835,385 790,410" fill="#f4b400"/><text x="815" y="450" text-anchor="middle" fill="#06111f" font-size="20" font-weight="700">AIRCRAFT</text><line x1="420" y1="350" x2="780" y2="350" stroke="#f4b400" stroke-width="7"/><polygon points="780,350 758,338 758,362" fill="#f4b400"/><line x1="780" y1="420" x2="420" y2="420" stroke="#64748b" stroke-width="7"/><polygon points="420,420 442,408 442,432" fill="#64748b"/><text x="600" y="325" text-anchor="middle" fill="#92400e" font-size="22" font-weight="700">FROM station → aircraft</text><text x="600" y="470" text-anchor="middle" fill="#475569" font-size="22" font-weight="700">aircraft → TO station</text><rect x="140" y="545" width="920" height="90" rx="16" fill="#06111f"/><text x="600" y="580" text-anchor="middle" fill="#f4b400" font-size="21" font-weight="700">QDR = magnetic FROM · QTE = true FROM · QDM = magnetic TO · QUJ = true TO</text><text x="600" y="615" text-anchor="middle" fill="#fff" font-size="18">Direction (TO/FROM) and reference (magnetic/true) are the two things to identify first.</text></g></svg>