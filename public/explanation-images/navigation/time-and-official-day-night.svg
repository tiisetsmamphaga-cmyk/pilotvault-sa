<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">UTC longitude and official day night timing</title><desc id="desc">Time conversion by longitude and South African official day and night relationship to sunrise and sunset.</desc><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="72" fill="#06111f"/><rect y="68" width="1200" height="4" fill="#f4b400"/><g font-family="Arial, sans-serif"><text x="44" y="45" fill="#fff" font-size="24" font-weight="700">PILOTVAULT SA</text><text x="1150" y="45" text-anchor="end" fill="#f4b400" font-size="18" font-weight="700">NAVIGATION</text><text x="600" y="122" text-anchor="middle" fill="#06111f" font-size="30" font-weight="700">TIME &amp; OFFICIAL DAY / NIGHT</text><rect x="90" y="180" width="470" height="390" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="325" y="225" text-anchor="middle" fill="#06111f" font-size="23" font-weight="700">LONGITUDE &amp; TIME</text><line x1="150" y1="350" x2="500" y2="350" stroke="#06111f" stroke-width="4"/><g fill="#475569" font-size="18" text-anchor="middle"><text x="150" y="390">30°W</text><text x="325" y="390">0°</text><text x="500" y="390">30°E</text></g><line x1="325" y1="305" x2="325" y2="395" stroke="#f4b400" stroke-width="5"/><text x="325" y="285" text-anchor="middle" fill="#92400e" font-size="20" font-weight="700">GREENWICH / UTC</text><text x="325" y="455" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">15° longitude = 1 hour</text><text x="325" y="495" text-anchor="middle" fill="#475569" font-size="20">1° = 4 minutes</text><text x="325" y="535" text-anchor="middle" fill="#475569" font-size="19">East = later · West = earlier</text><rect x="640" y="180" width="470" height="390" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="875" y="225" text-anchor="middle" fill="#06111f" font-size="23" font-weight="700">SOUTH AFRICAN EXAM CONVENTION</text><line x1="700" y1="390" x2="1050" y2="390" stroke="#06111f" stroke-width="4"/><circle cx="780" cy="390" r="10" fill="#f4b400"/><circle cx="970" cy="390" r="10" fill="#f4b400"/><text x="780" y="355" text-anchor="middle" fill="#06111f" font-size="20" font-weight="700">SUNRISE</text><text x="970" y="355" text-anchor="middle" fill="#06111f" font-size="20" font-weight="700">SUNSET</text><line x1="725" y1="435" x2="780" y2="435" stroke="#f4b400" stroke-width="5"/><text x="752" y="470" text-anchor="middle" fill="#475569" font-size="18">15 min</text><line x1="970" y1="435" x2="1025" y2="435" stroke="#f4b400" stroke-width="5"/><text x="998" y="470" text-anchor="middle" fill="#475569" font-size="18">15 min</text><text x="725" y="515" text-anchor="middle" fill="#06111f" font-size="18" font-weight="700">Official day begins</text><text x="1025" y="515" text-anchor="middle" fill="#06111f" font-size="18" font-weight="700">Official night begins</text><text x="600" y="650" text-anchor="middle" fill="#475569" font-size="20">South African civil time is UTC+2; use the wording and convention specified by the exam question.</text></g></svg>