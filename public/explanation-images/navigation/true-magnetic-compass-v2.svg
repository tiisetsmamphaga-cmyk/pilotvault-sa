<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">True magnetic and compass north</title><desc id="desc">Relationship between true north, magnetic north, variation, deviation and compass north.</desc><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="72" fill="#06111f"/><rect y="68" width="1200" height="4" fill="#f4b400"/><g font-family="Arial, sans-serif"><text x="44" y="45" fill="#fff" font-size="24" font-weight="700">PILOTVAULT SA</text><text x="1150" y="45" text-anchor="end" fill="#f4b400" font-size="18" font-weight="700">NAVIGATION</text><text x="600" y="122" text-anchor="middle" fill="#06111f" font-size="30" font-weight="700">TRUE · MAGNETIC · COMPASS</text><circle cx="600" cy="370" r="185" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><g stroke-linecap="round"><line x1="600" y1="370" x2="600" y2="192" stroke="#06111f" stroke-width="7"/><line x1="600" y1="370" x2="663.3" y2="201.5" stroke="#f4b400" stroke-width="7"/><line x1="600" y1="370" x2="697" y2="218.4" stroke="#64748b" stroke-width="7"/></g><g font-size="20" font-weight="700"><text x="600" y="176" text-anchor="middle" fill="#06111f">TRUE NORTH</text><text x="676" y="194" fill="#a16207">MAGNETIC NORTH</text><text x="732" y="232" fill="#475569">COMPASS NORTH</text></g><path d="M600 280 A90 90 0 0 1 631.7 285.8" fill="none" stroke="#f4b400" stroke-width="4"/><text x="588" y="292" text-anchor="end" fill="#92400e" font-size="20" font-weight="700">Variation</text><path d="M638.7 267 A110 110 0 0 1 659.3 277.3" fill="none" stroke="#64748b" stroke-width="4"/><text x="668" y="302" fill="#475569" font-size="20" font-weight="700">Deviation</text><rect x="190" y="565" width="820" height="95" rx="16" fill="#06111f"/><text x="600" y="605" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">TRUE ± VARIATION = MAGNETIC ± DEVIATION = COMPASS</text><text x="600" y="638" text-anchor="middle" fill="#f4b400" font-size="18">Use the sign convention taught with your working method and keep it consistent.</text></g></svg>