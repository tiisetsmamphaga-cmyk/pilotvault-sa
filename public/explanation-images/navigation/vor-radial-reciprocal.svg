<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">VOR radial and reciprocal course</title><desc id="desc">A VOR radial is the magnetic bearing from the station; inbound course is the reciprocal.</desc><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="72" fill="#06111f"/><rect y="68" width="1200" height="4" fill="#f4b400"/><g font-family="Arial, sans-serif"><text x="44" y="45" fill="#fff" font-size="24" font-weight="700">PILOTVAULT SA</text><text x="1150" y="45" text-anchor="end" fill="#f4b400" font-size="18" font-weight="700">NAVIGATION</text><text x="600" y="122" text-anchor="middle" fill="#06111f" font-size="30" font-weight="700">VOR RADIALS</text><circle cx="600" cy="390" r="205" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><circle cx="600" cy="390" r="44" fill="#06111f"/><text x="600" y="398" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">VOR</text><line x1="600" y1="390" x2="440" y2="535" stroke="#f4b400" stroke-width="8"/><circle cx="440" cy="535" r="10" fill="#f4b400"/><text x="395" y="570" fill="#92400e" font-size="22" font-weight="700">215° RADIAL</text><line x1="440" y1="535" x2="600" y2="390" stroke="#06111f" stroke-width="3" stroke-dasharray="12 10"/><text x="455" y="430" fill="#06111f" font-size="22" font-weight="700" transform="rotate(-42 455 430)">INBOUND 035°</text><line x1="600" y1="185" x2="600" y2="595" stroke="#e2e8f0" stroke-width="2"/><text x="600" y="175" text-anchor="middle" fill="#475569" font-size="20" font-weight="700">360° / 000°</text><rect x="830" y="230" width="300" height="300" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="980" y="275" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">KEY RULE</text><text x="860" y="325" fill="#475569" font-size="20">Radial = FROM station</text><text x="860" y="370" fill="#475569" font-size="20">Inbound = reciprocal</text><text x="860" y="415" fill="#475569" font-size="20">Reciprocal = ±180°</text><text x="980" y="475" text-anchor="middle" fill="#f4b400" font-size="25" font-weight="700">215° ↔ 035°</text><text x="600" y="655" text-anchor="middle" fill="#475569" font-size="20">A radial is named by the magnetic bearing from the VOR station.</text></g></svg>