<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Wind triangle</title><desc id="desc">Air vector (heading and TAS) plus wind vector (W/V) gives the ground vector (track and groundspeed). Drift is the angle from heading to track.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#06111f"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f4b400"/></marker><marker id="w" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="72" fill="#06111f"/><rect y="68" width="1200" height="4" fill="#f4b400"/><g font-family="Arial, sans-serif"><text x="44" y="45" fill="#fff" font-size="24" font-weight="700">PILOTVAULT SA</text><text x="1150" y="45" text-anchor="end" fill="#f4b400" font-size="18" font-weight="700">NAVIGATION</text><g id="shapes"><line x1="130" y1="610" x2="770" y2="450" stroke="#f4b400" stroke-width="9" marker-end="url(#g)"/><line x1="430" y1="190" x2="767" y2="448" stroke="#64748b" stroke-width="8" marker-end="url(#w)"/><line x1="130" y1="610" x2="430" y2="190" stroke="#06111f" stroke-width="8" marker-end="url(#a)"/><circle cx="130" cy="610" r="12" fill="#06111f"/><path d="M185.2,532.7 A95,95 0 0 1 222.2,587" fill="none" stroke="#b45309" stroke-width="3"/><rect x="850" y="170" width="310" height="300" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/></g><g id="labels"><text x="268.6" y="391.9" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700" transform="rotate(-54.5 268.6 391.9)">AIR VECTOR · HDG / TAS</text><text x="608.5" y="308.9" text-anchor="middle" fill="#475569" font-size="22" font-weight="700" transform="rotate(37.4 608.5 308.9)">WIND VECTOR · W/V</text><text x="458.3" y="563" text-anchor="middle" fill="#92400e" font-size="22" font-weight="700" transform="rotate(-14 458.3 563)">GROUND VECTOR · TR / GS</text><text x="236" y="545" fill="#b45309" font-size="18" font-weight="700">DRIFT</text><text x="1005" y="212" text-anchor="middle" fill="#06111f" font-size="22" font-weight="700">REMEMBER</text><text x="872" y="262" fill="#475569" font-size="18">HDG = where the nose points</text><text x="872" y="304" fill="#475569" font-size="18">TAS = speed through the air</text><text x="872" y="346" fill="#475569" font-size="18">TR = path over the ground</text><text x="872" y="388" fill="#475569" font-size="18">GS = speed over the ground</text><text x="872" y="430" fill="#475569" font-size="18">Drift = angle from HDG to TR</text><text x="600" y="668" text-anchor="middle" fill="#475569" font-size="20">Air vector (HDG/TAS) + wind vector (W/V) = ground vector (TR/GS)</text></g></g></svg>
