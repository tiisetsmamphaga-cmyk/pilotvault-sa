<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Wind triangle</title><desc id="desc">Air vector, wind vector and ground vector forming a wind triangle.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#06111f"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f4b400"/></marker><marker id="w" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1200" height="720" fill="#f8fafc"/><rect width="1200" height="72" fill="#06111f"/><rect y="68" width="1200" height="4" fill="#f4b400"/><g font-family="Arial, sans-serif"><text x="44" y="45" fill="#fff" font-size="24" font-weight="700">PILOTVAULT SA</text><text x="1150" y="45" text-anchor="end" fill="#f4b400" font-size="18" font-weight="700">NAVIGATION</text><text x="600" y="122" text-anchor="middle" fill="#06111f" font-size="30" font-weight="700">WIND TRIANGLE</text><circle cx="240" cy="515" r="12" fill="#06111f"/><line x1="240" y1="515" x2="540" y2="220" stroke="#06111f" stroke-width="8" marker-end="url(#a)"/><line x1="540" y1="220" x2="835" y2="360" stroke="#64748b" stroke-width="8" marker-end="url(#w)"/><line x1="240" y1="515" x2="835" y2="360" stroke="#f4b400" stroke-width="9" marker-end="url(#g)"/><text x="345" y="335" fill="#06111f" font-size="23" font-weight="700" transform="rotate(-44 345 335)">AIR VECTOR — TAS &amp; HEADING</text><text x="655" y="260" fill="#475569" font-size="22" font-weight="700" transform="rotate(25 655 260)">WIND VECTOR</text><text x="500" y="470" fill="#92400e" font-size="24" font-weight="700" transform="rotate(-15 500 470)">GROUND VECTOR — GS &amp; TRACK</text><rect x="850" y="180" width="290" height="300" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="995" y="225" text-anchor="middle" fill="#06111f" font-size="23" font-weight="700">REMEMBER</text><text x="885" y="275" fill="#475569" font-size="20">Heading = where nose points</text><text x="885" y="320" fill="#475569" font-size="20">Track = path over ground</text><text x="885" y="365" fill="#475569" font-size="20">TAS = speed through air</text><text x="885" y="410" fill="#475569" font-size="20">GS = speed over ground</text><text x="600" y="650" text-anchor="middle" fill="#475569" font-size="20">Air vector + wind vector = ground vector.</text></g></svg>