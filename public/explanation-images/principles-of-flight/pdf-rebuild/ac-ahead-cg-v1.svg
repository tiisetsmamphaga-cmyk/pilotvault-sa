<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Aerodynamic centre and centre of gravity stability"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b91c1c"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">AERODYNAMIC CENTRE AHEAD OF CG</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><line x1="180" y1="405" x2="1000" y2="405" stroke="#06111f" stroke-width="8"/><circle cx="470" cy="405" r="12" fill="#b91c1c"/><text x="470" y="350" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#b91c1c">AERODYNAMIC CENTRE</text><circle cx="650" cy="405" r="12" fill="#1f4e79"/><text x="650" y="350" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#1f4e79">CG</text><line x1="470" y1="405" x2="470" y2="250" stroke="#b91c1c" stroke-width="9" marker-end="url(#red)"/><text x="350" y="240" font-family="Arial" font-size="19" font-weight="800" fill="#b91c1c">LIFT CHANGE</text><path d="M570 520 C450 565 330 500 330 390" fill="none" stroke="#b91c1c" stroke-width="8" marker-end="url(#red)"/><text x="300" y="575" font-family="Arial" font-size="20" font-weight="800" fill="#b91c1c">DESTABILISING PITCHING MOMENT</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">If the wing aerodynamic centre is ahead of the CG, a lift change can create a pitching moment that reinforces the disturbance.</text></svg>