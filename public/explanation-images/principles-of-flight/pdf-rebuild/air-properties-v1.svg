<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="BASIC PROPERTIES OF AIR"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker><marker id="s" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b91c1c"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">BASIC PROPERTIES OF AIR</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>
<g font-family="Arial"><rect x="115" y="270" width="220" height="230" rx="16" fill="#f8fafc" stroke="#d7e0ea"/><text x="225" y="320" text-anchor="middle" font-size="22" font-weight="800" fill="#06111f">HAS MASS</text><circle cx="225" cy="405" r="40" fill="#1f4e79"/><text x="225" y="465" text-anchor="middle" font-size="17" fill="#64748b">therefore inertia</text><rect x="365" y="270" width="220" height="230" rx="16" fill="#f8fafc" stroke="#d7e0ea"/><text x="475" y="320" text-anchor="middle" font-size="22" font-weight="800" fill="#06111f">COMPRESSIBLE</text><path d="M410 400 L540 400" stroke="#1f4e79" stroke-width="5"/><path d="M430 360 L430 440 M520 360 L520 440" stroke="#64748b" stroke-width="6"/><text x="475" y="465" text-anchor="middle" font-size="17" fill="#64748b">density can change</text><rect x="615" y="270" width="220" height="230" rx="16" fill="#f8fafc" stroke="#d7e0ea"/><text x="725" y="320" text-anchor="middle" font-size="22" font-weight="800" fill="#06111f">CAN FLOW</text><path d="M655 405 C690 365 750 445 795 395" fill="none" stroke="#1f4e79" stroke-width="7"/><text x="725" y="465" text-anchor="middle" font-size="17" fill="#64748b">changes shape easily</text><rect x="865" y="270" width="220" height="230" rx="16" fill="#f8fafc" stroke="#d7e0ea"/><text x="975" y="320" text-anchor="middle" font-size="22" font-weight="800" fill="#06111f">KINETIC ENERGY</text><line x1="910" y1="410" x2="1040" y2="410" stroke="#f4b400" stroke-width="9" marker-end="url(#g)"/><text x="975" y="465" text-anchor="middle" font-size="17" fill="#64748b">when moving</text></g><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Air has mass, is compressible, can flow under pressure differences and carries kinetic energy when moving.</text></svg>