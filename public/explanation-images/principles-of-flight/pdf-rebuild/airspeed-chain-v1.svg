<line x1="340" y1="375" x2="470" y2="375" stroke="#f4b400" stroke-width="7" marker-end="url(#arrG)"/><text x="405" y="340" text-anchor="middle" font-size="16" font-weight="700" fill="#64748b">CORRECT</text><text x="405" y="360" text-anchor="middle" font-size="15" fill="#64748b">instrument + position</text>
