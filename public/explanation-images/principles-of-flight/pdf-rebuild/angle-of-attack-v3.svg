<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">PilotVault Principles of Flight — Angle of Attack</title>
<desc id="desc">A textbook-style angle-of-attack diagram showing aircraft path opposite relative airflow, a cambered aerofoil, chord line, and the angle between the chord and airflow direction.</desc>
<rect width="1200" height="680" fill="#ffffff"/>
<rect width="1200" height="112" fill="#06111f"/>
<text x="600" y="36" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text>
<text x="600" y="78" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#ffffff">ANGLE OF ATTACK</text>

<g font-family="Arial,Helvetica,sans-serif">
  <rect x="54" y="140" width="1092" height="470" rx="10" fill="#ffffff" stroke="#d7e0ea" stroke-width="2"/>

  <text x="230" y="265" text-anchor="middle" font-size="17" font-weight="800" fill="#06111f">AIRCRAFT PATH</text>
  <polygon points="110,305 175,267 175,286 350,286 350,324 175,324 175,343" fill="#1f4e79"/>

  <text x="230" y="365" text-anchor="middle" font-size="17" font-weight="800" fill="#06111f">RELATIVE AIRFLOW</text>
  <polygon points="110,386 285,386 285,367 350,405 285,443 285,424 110,424" fill="#64748b"/>

  <path d="M430 340 C515 282 710 283 1010 455 C875 425 740 396 610 374 C515 357 458 347 430 340 Z"
        fill="#f8fafc" stroke="#06111f" stroke-width="5"/>
  <path d="M430 340 C485 382 640 425 1010 455 C820 461 660 446 535 414 C475 399 442 370 430 340 Z"
        fill="#ffffff" stroke="#06111f" stroke-width="5"/>

  <line x1="430" y1="340" x2="1010" y2="455" stroke="#f4b400" stroke-width="6"/>
  <line x1="430" y1="340" x2="615" y2="340" stroke="#1f4e79" stroke-width="3" stroke-dasharray="10 8" opacity="0.75"/>

  <path d="M515 340 A85 85 0 0 1 513.4 356.2" fill="none" stroke="#f4b400" stroke-width="7" stroke-linecap="round"/>
  <text x="530" y="385" font-size="28" font-weight="900" fill="#06111f">α</text>

  <text x="390" y="250" font-size="18" font-weight="700" fill="#06111f">LEADING EDGE</text>
  <line x1="475" y1="258" x2="438" y2="331" stroke="#64748b" stroke-width="2.5"/>

  <text x="650" y="230" font-size="18" font-weight="700" fill="#06111f">CHORD LINE</text>
  <line x1="712" y1="238" x2="738" y2="401" stroke="#64748b" stroke-width="2.5"/>

  <text x="810" y="280" font-size="18" font-weight="700" fill="#06111f">UPPER CAMBER</text>
  <line x1="870" y1="287" x2="835" y2="337" stroke="#64748b" stroke-width="2.5"/>

  <text x="625" y="500" font-size="18" font-weight="700" fill="#06111f">LOWER CAMBER</text>
  <line x1="700" y1="482" x2="690" y2="428" stroke="#64748b" stroke-width="2.5"/>

  <text x="930" y="515" font-size="18" font-weight="700" fill="#06111f">TRAILING EDGE</text>
  <line x1="990" y1="495" x2="1008" y2="457" stroke="#64748b" stroke-width="2.5"/>

  <text x="600" y="650" text-anchor="middle" font-size="18" fill="#64748b">Angle of attack is the angle between the aerofoil chord line and the relative airflow.</text>
</g>
</svg>
