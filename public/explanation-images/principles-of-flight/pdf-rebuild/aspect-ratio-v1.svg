<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Wing Aspect Ratio">
<defs>
 <marker id="arrB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker>
 <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker>
 <marker id="arrS" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker>
 <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b91c1c"/></marker>
</defs>
<rect width="1200" height="720" fill="#fff"/>
<rect width="1200" height="120" fill="#06111f"/>
<text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text>
<text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">WING ASPECT RATIO</text>
<rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>

<rect x="160" y="300" width="400" height="90" rx="45" fill="#f8fafc" stroke="#06111f" stroke-width="5"/>
<rect x="720" y="260" width="210" height="170" rx="60" fill="#f8fafc" stroke="#06111f" stroke-width="5"/>
<text x="360" y="250" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#1f4e79">HIGH ASPECT RATIO</text>
<text x="825" y="220" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#f4b400">LOW ASPECT RATIO</text>
<text x="360" y="450" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">long span / small mean chord</text>
<text x="825" y="480" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">shorter span / larger mean chord</text>
<text x="600" y="560" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#06111f">AR ≈ SPAN ÷ MEAN AERODYNAMIC CHORD</text>

<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">Higher aspect ratio generally reduces induced drag compared with a lower aspect ratio wing.</text>
</svg>