<rect width="1200" height="720" fill="#fff"/>
<rect width="1200" height="120" fill="#06111f"/>
<text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text>
<text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">AIRCRAFT AXES &amp; PRIMARY CONTROLS</text>
<rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>

<g transform="translate(600 410)" stroke="#06111f" fill="none"><path d="M-280 0 L-80 -35 L120 -25 L280 0 L120 25 L-80 35 Z" stroke-width="7"/></g>
<circle cx="600" cy="410" r="9" fill="#06111f"/>
<line x1="600" y1="220" x2="600" y2="600" stroke="#64748b" stroke-width="5"/><text x="620" y="230" font-family="Arial" font-size="18" font-weight="700" fill="#64748b">VERTICAL AXIS → YAW → RUDDER</text>
<line x1="250" y1="410" x2="950" y2="410" stroke="#1f4e79" stroke-width="5"/><text x="600" y="375" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1f4e79">LATERAL AXIS → PITCH → ELEVATOR</text>
<line x1="380" y1="560" x2="820" y2="260" stroke="#f4b400" stroke-width="5"/><text x="400" y="610" font-family="Arial" font-size="18" font-weight="700" fill="#f4b400">LONGITUDINAL AXIS → ROLL → AILERONS</text>

<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">The three axes intersect at the centre of gravity and are mutually perpendicular.</text>
</svg>