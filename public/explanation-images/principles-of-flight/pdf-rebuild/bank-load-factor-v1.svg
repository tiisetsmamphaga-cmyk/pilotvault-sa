<line x1="190" y1="575" x2="1010" y2="575" stroke="#06111f" stroke-width="4"/><line x1="190" y1="575" x2="190" y2="220" stroke="#06111f" stroke-width="4"/>
<path d="M210 555 C400 550 560 525 700 470 C830 415 910 330 970 235" fill="none" stroke="#f4b400" stroke-width="8"/>
