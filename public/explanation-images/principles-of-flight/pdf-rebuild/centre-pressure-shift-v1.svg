<text x="600" y="575" text-anchor="middle" font-size="19" fill="#64748b">Near/after stall, separation changes the pressure distribution and the CP may shift aft.</text></g><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Centre of pressure is the point through which the resultant aerodynamic lift force is treated as acting.</text></svg>