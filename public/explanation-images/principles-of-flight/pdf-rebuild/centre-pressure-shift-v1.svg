<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="CENTRE OF PRESSURE MOVEMENT"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker><marker id="s" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b91c1c"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">CENTRE OF PRESSURE MOVEMENT</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>
<g font-family="Arial"><text x="325" y="220" text-anchor="middle" font-size="21" font-weight="800" fill="#06111f">LOWER AoA</text><text x="875" y="220" text-anchor="middle" font-size="21" font-weight="800" fill="#06111f">HIGHER AoA — BEFORE STALL</text>
<path d="M135 405 C190 330 340 330 505 390 C530 399 550 410 565 418 C460 430 300 438 205 435 C165 434 143 425 135 405Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><line x1="135" y1="405" x2="565" y2="418" stroke="#d7e0ea" stroke-width="3"/><circle cx="420" cy="415" r="11" fill="#f4b400"/><text x="420" y="475" text-anchor="middle" font-size="19" font-weight="800" fill="#f4b400">CP</text>
