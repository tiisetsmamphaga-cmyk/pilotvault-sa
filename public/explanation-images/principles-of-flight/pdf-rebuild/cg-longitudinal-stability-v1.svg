<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="CG &amp; Longitudinal Stability">
<defs>
 <marker id="arrB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker>
 <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker>
 <marker id="arrS" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker>
 <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b91c1c"/></marker>
</defs>
<rect width="1200" height="720" fill="#fff"/>
<rect width="1200" height="120" fill="#06111f"/>
<text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text>
<text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">CG &amp; LONGITUDINAL STABILITY</text>
<rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>

<line x1="150" y1="420" x2="1050" y2="420" stroke="#06111f" stroke-width="8"/>
<circle cx="450" cy="420" r="12" fill="#06111f"/><text x="450" y="470" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#06111f">CG</text>
<circle cx="610" cy="420" r="12" fill="#f4b400"/><text x="610" y="470" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#f4b400">CENTRE OF PRESSURE</text>
<line x1="610" y1="420" x2="610" y2="255" stroke="#f4b400" stroke-width="8" marker-end="url(#arrG)"/>
<line x1="450" y1="420" x2="450" y2="580" stroke="#64748b" stroke-width="8" marker-end="url(#arrS)"/>
<text x="760" y="290" font-family="Arial" font-size="19" font-weight="800" fill="#06111f">FORWARD CG</text><text x="760" y="322" font-family="Arial" font-size="18" fill="#64748b">greater longitudinal stability</text>
<text x="760" y="375" font-family="Arial" font-size="19" font-weight="800" fill="#b91c1c">AFT CG</text><text x="760" y="407" font-family="Arial" font-size="18" fill="#64748b">reduced pitch stability and control margin</text>

<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">Moving the CG aft reduces longitudinal stability; a more forward CG increases it.</text>
</svg>