<text x="600" y="625" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#64748b">POWER →</text>
<text x="100" y="405" transform="rotate(-90 100 405)" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#64748b">RATE OF DESCENT</text>
<text x="470" y="350" font-family="Arial" font-size="20" font-weight="800" fill="#1f4e79">MORE POWER → LOWER RATE OF DESCENT</text>

<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">At constant speed, increasing power reduces rate of descent; reducing power increases it.</text>
