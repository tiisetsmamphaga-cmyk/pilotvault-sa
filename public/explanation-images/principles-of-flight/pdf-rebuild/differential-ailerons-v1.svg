<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Differential Ailerons">
<defs>
 <marker id="arrB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker>
 <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker>
 <marker id="arrS" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker>
 <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b91c1c"/></marker>
</defs>
<rect width="1200" height="720" fill="#fff"/>
<rect width="1200" height="120" fill="#06111f"/>
<text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text>
<text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">DIFFERENTIAL AILERONS</text>
<rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>

<line x1="250" y1="420" x2="950" y2="420" stroke="#06111f" stroke-width="14"/>
<line x1="350" y1="420" x2="350" y2="325" stroke="#1f4e79" stroke-width="14"/>
<line x1="850" y1="420" x2="850" y2="475" stroke="#f4b400" stroke-width="14"/>
<text x="350" y="285" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#1f4e79">UP AILERON — GREATER DEFLECTION</text>
<text x="850" y="525" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#f4b400">DOWN AILERON — SMALLER DEFLECTION</text>
<text x="600" y="600" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#64748b">Differential travel reduces the drag imbalance.</text>

<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">The up-going aileron moves through a greater angle than the down-going aileron to reduce adverse yaw.</text>
</svg>