<text x="600" y="230" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#1f4e79">OSCILLATIONS DECREASE WITH TIME</text><text x="620" y="620" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#64748b">TIME →</text><text x="105" y="405" text-anchor="middle" transform="rotate(-90 105 405)" font-family="Arial" font-size="20" font-weight="700" fill="#64748b">DISPLACEMENT</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Positive dynamic stability damps the oscillations of a statically stable aircraft until equilibrium is restored.</text></svg>