<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">PilotVault Principles of Flight — Excess Thrust and Best Angle of Climb</title>
<desc id="desc">Graph showing thrust available and thrust required versus airspeed, with the maximum vertical separation representing maximum excess thrust and best angle of climb speed Vx.</desc>
<defs>
  <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker>
</defs>
<rect width="1200" height="680" fill="#fff"/>
<rect width="1200" height="112" fill="#06111f"/>
<text x="600" y="36" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text>
<text x="600" y="78" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="800" fill="#fff">EXCESS THRUST &amp; BEST ANGLE OF CLIMB</text>
<rect x="54" y="140" width="1092" height="430" rx="10" fill="#fff" stroke="#d7e0ea" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif">
  <line x1="190" y1="520" x2="1000" y2="520" stroke="#06111f" stroke-width="4"/>
  <line x1="190" y1="520" x2="190" y2="200" stroke="#06111f" stroke-width="4"/>
  <text x="600" y="558" text-anchor="middle" font-size="20" font-weight="700" fill="#64748b">AIRSPEED →</text>
  <text x="115" y="360" text-anchor="middle" transform="rotate(-90 115 360)" font-size="20" font-weight="700" fill="#64748b">THRUST</text>
  <path d="M220 275 C400 285 600 305 955 365" fill="none" stroke="#f4b400" stroke-width="8"/>
  <text x="790" y="300" font-size="20" font-weight="800" fill="#f4b400">THRUST AVAILABLE</text>
  <path d="M220 305 C330 390 425 448 540 452 C675 455 805 390 955 315" fill="none" stroke="#1f4e79" stroke-width="8"/>
  <text x="725" y="420" font-size="20" font-weight="800" fill="#1f4e79">THRUST REQUIRED (DRAG)</text>
  <line x1="520" y1="298" x2="520" y2="452" stroke="#06111f" stroke-width="3" stroke-dasharray="8 7"/>
  <line x1="520" y1="307" x2="520" y2="441" stroke="#f4b400" stroke-width="8"/>
  <path d="M508 313 L520 295 L532 313" fill="#f4b400"/>
  <path d="M508 435 L520 453 L532 435" fill="#f4b400"/>
  <text x="545" y="355" font-size="18" font-weight="800" fill="#06111f">MAXIMUM</text>
  <text x="545" y="378" font-size="18" font-weight="800" fill="#06111f">EXCESS THRUST</text>
  <line x1="520" y1="453" x2="520" y2="520" stroke="#b91c1c" stroke-width="3"/>
  <text x="520" y="545" text-anchor="middle" font-size="20" font-weight="900" fill="#b91c1c">Vx</text>
  <rect x="760" y="195" width="300" height="86" rx="9" fill="#f8fafc" stroke="#d7e0ea"/>
  <text x="910" y="225" text-anchor="middle" font-size="17" font-weight="800" fill="#06111f">BEST ANGLE OF CLIMB</text>
  <text x="910" y="250" text-anchor="middle" font-size="17" font-weight="700" fill="#64748b">occurs where excess thrust</text>
  <text x="910" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#64748b">is greatest.</text>
  <text x="600" y="650" text-anchor="middle" font-size="18" fill="#64748b">Maximum climb angle is determined by maximum excess thrust; Vx is the corresponding airspeed.</text>
</g>
</svg>