<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Flap vs No-Flap Approach">
<defs>
 <marker id="arrB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker>
 <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker>
 <marker id="arrS" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker>
 <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b91c1c"/></marker>
</defs>
<rect width="1200" height="720" fill="#fff"/>
<rect width="1200" height="120" fill="#06111f"/>
<text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text>
<text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">FLAP VS NO-FLAP APPROACH</text>
<rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>

<line x1="160" y1="560" x2="1040" y2="560" stroke="#06111f" stroke-width="5"/>
<line x1="250" y1="300" x2="550" y2="560" stroke="#1f4e79" stroke-width="7"/>
<line x1="650" y1="360" x2="950" y2="560" stroke="#f4b400" stroke-width="7"/>
<text x="370" y="285" font-family="Arial" font-size="20" font-weight="800" fill="#1f4e79">FLAPLESS: HIGHER NOSE / FASTER APPROACH</text>
<text x="690" y="335" font-family="Arial" font-size="20" font-weight="800" fill="#f4b400">FULL FLAP: LOWER NOSE / STEEPER PATH</text>

<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">Compared with a full-flap approach, a flapless approach normally requires a higher nose attitude and higher landing speed.</text>
</svg>