<text x="470" y="285" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#1f4e79">AREA AHEAD OF HINGE = AERODYNAMIC BALANCE</text>
<text x="690" y="520" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">The hinge is set back behind part of the control-surface leading edge.</text>

<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">A horn balance places some control-surface area ahead of the hinge to reduce pilot control force.</text>
