<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Lift &amp; Drag Directions">
<defs>
 <marker id="arrB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker>
 <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker>
 <marker id="arrS" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker>
 <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b91c1c"/></marker>
</defs>
<rect width="1200" height="720" fill="#fff"/>
<rect width="1200" height="120" fill="#06111f"/>
<text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text>
<text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">LIFT &amp; DRAG DIRECTIONS</text>
<rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>

<path d="M250 420 C330 315 620 300 950 405 C995 418 1030 428 1050 435 C900 447 650 458 420 455 C330 453 275 442 250 420Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/>
<line x1="210" y1="560" x2="1040" y2="560" stroke="#1f4e79" stroke-width="6" marker-end="url(#arrB)"/>
<text x="620" y="610" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#1f4e79">RELATIVE AIRFLOW</text>
<circle cx="650" cy="430" r="9" fill="#06111f"/>
<line x1="650" y1="430" x2="650" y2="235" stroke="#f4b400" stroke-width="9" marker-end="url(#arrG)"/>
<text x="650" y="205" text-anchor="middle" font-family="Arial" font-size="24" font-weight="800" fill="#06111f">LIFT</text>
<line x1="650" y1="430" x2="900" y2="430" stroke="#64748b" stroke-width="9" marker-end="url(#arrS)"/>
<text x="980" y="438" text-anchor="middle" font-family="Arial" font-size="24" font-weight="800" fill="#64748b">DRAG</text>
<path d="M600 500 A80 80 0 0 1 650 420" fill="none" stroke="#64748b" stroke-width="3"/><text x="585" y="448" font-family="Arial" font-size="18" font-weight="700" fill="#64748b">90°</text>

<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">Lift acts perpendicular to relative airflow; drag acts parallel to it.</text>
</svg>