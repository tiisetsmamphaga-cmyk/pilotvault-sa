<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Lift Formula">
<defs>
 <marker id="arrB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker>
 <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker>
 <marker id="arrS" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker>
 <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b91c1c"/></marker>
</defs>
<rect width="1200" height="720" fill="#fff"/>
<rect width="1200" height="120" fill="#06111f"/>
<text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text>
<text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">LIFT FORMULA</text>
<rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>

<text x="600" y="265" text-anchor="middle" font-family="Arial" font-size="44" font-weight="800" fill="#06111f">L = ½ ρ V² S C<tspan baseline-shift="sub" font-size="28">L</tspan></text>
<g font-family="Arial" font-size="20" fill="#64748b">
<text x="220" y="355">ρ = air density</text><text x="220" y="400">V = true airspeed</text>
<text x="700" y="355">S = wing area</text><text x="700" y="400">C<tspan baseline-shift="sub" font-size="14">L</tspan> = lift coefficient</text>
</g>
<line x1="250" y1="505" x2="450" y2="505" stroke="#1f4e79" stroke-width="12"/>
<line x1="750" y1="505" x2="950" y2="505" stroke="#1f4e79" stroke-width="24"/>
<text x="350" y="555" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">V</text>
<text x="850" y="555" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">2V → 4× V² TERM</text>

<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">With the other factors unchanged, aerodynamic force varies with the square of airspeed.</text>
</svg>