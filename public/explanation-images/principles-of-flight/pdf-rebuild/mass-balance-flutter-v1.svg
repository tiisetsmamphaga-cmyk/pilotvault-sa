<text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text>
<text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">MASS BALANCE &amp; FLUTTER</text>
<rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>

<line x1="240" y1="390" x2="920" y2="390" stroke="#06111f" stroke-width="16"/>
<circle cx="760" cy="390" r="12" fill="#06111f"/><text x="760" y="350" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#06111f">HINGE</text>
<line x1="760" y1="390" x2="860" y2="305" stroke="#f4b400" stroke-width="10"/>
<circle cx="870" cy="295" r="30" fill="#f4b400" stroke="#06111f" stroke-width="4"/>
<text x="870" y="245" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#f4b400">MASS AHEAD OF HINGE</text>
<path d="M330 500 C380 450 430 550 480 500 C530 450 580 550 630 500" fill="none" stroke="#b91c1c" stroke-width="6"/>
<text x="480" y="570" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#b91c1c">FLUTTER = OSCILLATORY AEROELASTIC MOTION</text>

<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">A mass balance ahead of the hinge line is used to reduce the risk of control-surface flutter.</text>
