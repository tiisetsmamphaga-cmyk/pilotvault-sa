<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Newton&#x27;s Laws in Flight">
<defs>
 <marker id="arrB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker>
 <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker>
 <marker id="arrS" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker>
 <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b91c1c"/></marker>
</defs>
<rect width="1200" height="720" fill="#fff"/>
<rect width="1200" height="120" fill="#06111f"/>
<text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text>
<text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">NEWTON&#x27;S LAWS IN FLIGHT</text>
<rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>

<g font-family="Arial">
<rect x="100" y="260" width="300" height="250" rx="14" fill="#f8fafc" stroke="#d7e0ea"/><text x="250" y="310" text-anchor="middle" font-size="25" font-weight="800" fill="#06111f">1ST LAW</text><text x="250" y="355" text-anchor="middle" font-size="20" fill="#64748b">Equilibrium / inertia</text><line x1="160" y1="420" x2="340" y2="420" stroke="#1f4e79" stroke-width="8"/><circle cx="250" cy="420" r="24" fill="#f4b400"/>
<rect x="450" y="260" width="300" height="250" rx="14" fill="#f8fafc" stroke="#d7e0ea"/><text x="600" y="310" text-anchor="middle" font-size="25" font-weight="800" fill="#06111f">2ND LAW</text><text x="600" y="355" text-anchor="middle" font-size="20" fill="#64748b">Force produces acceleration</text><text x="600" y="435" text-anchor="middle" font-size="34" font-weight="800" fill="#1f4e79">F = ma</text>
<rect x="800" y="260" width="300" height="250" rx="14" fill="#f8fafc" stroke="#d7e0ea"/><text x="950" y="310" text-anchor="middle" font-size="25" font-weight="800" fill="#06111f">3RD LAW</text><text x="950" y="355" text-anchor="middle" font-size="20" fill="#64748b">Action &amp; reaction</text><line x1="950" y1="430" x2="840" y2="430" stroke="#1f4e79" stroke-width="8" marker-end="url(#arrB)"/><line x1="950" y1="430" x2="1060" y2="430" stroke="#f4b400" stroke-width="8" marker-end="url(#arrG)"/>
</g>

<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">The question bank associates the first law with equilibrium, second with acceleration, and third with action–reaction.</text>
</svg>