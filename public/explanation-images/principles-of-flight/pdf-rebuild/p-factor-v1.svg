<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="P-factor asymmetric propeller loading">
<defs><marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b91c1c"/></marker><marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker></defs>
<rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/>
<text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">P-FACTOR — ASYMMETRIC PROPELLER LOADING</text>
<rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>
<text x="600" y="205" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#64748b">HIGH POWER + HIGH ANGLE OF ATTACK</text>
<circle cx="510" cy="405" r="155" fill="none" stroke="#06111f" stroke-width="5"/><line x1="510" y1="260" x2="510" y2="550" stroke="#06111f" stroke-width="11"/>
<path d="M665 405 L790 405" stroke="#f4b400" stroke-width="12" marker-end="url(#arrG)"/><text x="825" y="395" font-family="Arial" font-size="20" font-weight="800" fill="#06111f">DESCENDING BLADE</text><text x="825" y="425" font-family="Arial" font-size="18" fill="#64748b">greater AoA → greater thrust</text>
<path d="M455 590 C390 620 330 620 265 585" fill="none" stroke="#b91c1c" stroke-width="9" marker-end="url(#arrR)"/><text x="160" y="555" font-family="Arial" font-size="21" font-weight="800" fill="#b91c1c">YAW LEFT</text>
<text x="775" y="535" font-family="Arial" font-size="21" font-weight="800" fill="#1f4e79">CORRECTION: RIGHT RUDDER</text>
<text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">For a conventional clockwise propeller viewed from the cockpit, the descending blade on the right produces more thrust at high AoA.</text></svg>