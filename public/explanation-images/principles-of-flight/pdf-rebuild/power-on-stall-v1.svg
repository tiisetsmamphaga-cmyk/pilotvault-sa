<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="POWER EFFECT AT THE STALL"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker><marker id="s" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b91c1c"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">POWER EFFECT AT THE STALL</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><g font-family="Arial"><text x="310" y="230" text-anchor="middle" font-size="22" font-weight="800" fill="#06111f">POWER OFF</text><path d="M150 420 C215 345 365 345 505 400 C420 430 260 438 150 420Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><line x1="150" y1="520" x2="500" y2="520" stroke="#64748b" stroke-width="6"/><text x="310" y="570" text-anchor="middle" font-size="19" fill="#64748b">baseline stall speed</text><text x="865" y="230" text-anchor="middle" font-size="22" font-weight="800" fill="#06111f">POWER MAINTAINED</text><path d="M700 420 C765 345 915 345 1055 400 C970 430 810 438 700 420Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><line x1="700" y1="500" x2="1020" y2="500" stroke="#1f4e79" stroke-width="7" marker-end="url(#b)"/><text x="860" y="550" text-anchor="middle" font-size="19" font-weight="800" fill="#1f4e79">QUESTION-BANK EFFECT: LOWER STALL SPEED</text></g><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">The PilotVault POF question bank treats maintained engine power as reducing the indicated speed at which the stall occurs.</text></svg>