<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Static, Dynamic &amp; Total Pressure">
<defs>
 <marker id="arrB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker>
 <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker>
 <marker id="arrS" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker>
 <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b91c1c"/></marker>
</defs>
<rect width="1200" height="720" fill="#fff"/>
<rect width="1200" height="120" fill="#06111f"/>
<text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text>
<text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">STATIC, DYNAMIC &amp; TOTAL PRESSURE</text>
<rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>

<circle cx="440" cy="400" r="70" fill="#f8fafc" stroke="#06111f" stroke-width="5"/>
<line x1="160" y1="400" x2="360" y2="400" stroke="#1f4e79" stroke-width="10" marker-end="url(#arrB)"/>
<text x="240" y="350" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#1f4e79">MOVING AIR</text>
<text x="440" y="395" text-anchor="middle" font-family="Arial" font-size="24" font-weight="800" fill="#06111f">STAGNATION</text><text x="440" y="425" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">velocity = 0</text>
<text x="760" y="325" font-family="Arial" font-size="24" font-weight="800" fill="#06111f">TOTAL = STATIC + DYNAMIC</text>
<text x="760" y="390" font-family="Arial" font-size="22" font-weight="700" fill="#1f4e79">q = TOTAL − STATIC</text>
<text x="760" y="450" font-family="Arial" font-size="22" font-weight="700" fill="#f4b400">q = ½ ρ V²</text>

<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">Dynamic pressure is the pressure rise associated with bringing a moving airflow to rest.</text>
</svg>