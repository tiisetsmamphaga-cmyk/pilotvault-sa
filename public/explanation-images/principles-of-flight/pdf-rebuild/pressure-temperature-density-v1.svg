<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Pressure, Temperature &amp; Density">
<defs>
 <marker id="arrB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker>
 <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker>
 <marker id="arrS" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker>
 <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b91c1c"/></marker>
</defs>
<rect width="1200" height="720" fill="#fff"/>
<rect width="1200" height="120" fill="#06111f"/>
<text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text>
<text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">PRESSURE, TEMPERATURE &amp; DENSITY</text>
<rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>

<g font-family="Arial">
<rect x="130" y="280" width="420" height="250" rx="14" fill="#f8fafc" stroke="#d7e0ea"/><text x="340" y="330" text-anchor="middle" font-size="22" font-weight="800" fill="#06111f">PRESSURE CONSTANT</text><text x="340" y="400" text-anchor="middle" font-size="28" font-weight="800" fill="#b91c1c">TEMPERATURE ↑</text><text x="340" y="460" text-anchor="middle" font-size="28" font-weight="800" fill="#1f4e79">DENSITY ↓</text>
<rect x="650" y="280" width="420" height="250" rx="14" fill="#f8fafc" stroke="#d7e0ea"/><text x="860" y="330" text-anchor="middle" font-size="22" font-weight="800" fill="#06111f">TEMPERATURE CONSTANT</text><text x="860" y="400" text-anchor="middle" font-size="28" font-weight="800" fill="#f4b400">PRESSURE ↑</text><text x="860" y="460" text-anchor="middle" font-size="28" font-weight="800" fill="#1f4e79">DENSITY ↑</text>
</g>

<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">At constant pressure, warmer air is less dense; at constant temperature, higher pressure gives higher density.</text>
</svg>