<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Propeller Left-Turning Tendencies">
<defs>
 <marker id="arrB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker>
 <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker>
 <marker id="arrS" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker>
 <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b91c1c"/></marker>
</defs>
<rect width="1200" height="720" fill="#fff"/>
<rect width="1200" height="120" fill="#06111f"/>
<text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text>
<text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">PROPELLER LEFT-TURNING TENDENCIES</text>
<rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>

<circle cx="390" cy="405" r="135" fill="none" stroke="#06111f" stroke-width="6"/>
<line x1="390" y1="270" x2="390" y2="540" stroke="#06111f" stroke-width="12"/>
<path d="M470 300 A130 130 0 0 1 520 430" fill="none" stroke="#1f4e79" stroke-width="7" marker-end="url(#arrB)"/>
<text x="390" y="585" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#64748b">CONVENTIONAL PROPELLER — HIGH POWER / LOW SPEED</text>
<text x="760" y="285" font-family="Arial" font-size="21" font-weight="800" fill="#06111f">HIGH POWER • LOW SPEED • HIGH AoA</text>
<text x="760" y="340" font-family="Arial" font-size="20" fill="#64748b">• torque reaction</text>
<text x="760" y="380" font-family="Arial" font-size="20" fill="#64748b">• spiralling slipstream</text>
<text x="760" y="420" font-family="Arial" font-size="20" fill="#64748b">• gyroscopic precession</text>
<text x="760" y="460" font-family="Arial" font-size="20" fill="#64748b">• asymmetric propeller loading (P-factor)</text>
<line x1="920" y1="520" x2="760" y2="520" stroke="#b91c1c" stroke-width="8" marker-end="url(#arrR)"/><text x="970" y="528" font-family="Arial" font-size="20" font-weight="800" fill="#b91c1c">LEFT-TURNING</text>

<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">High power, low speed and high angle of attack make conventional propeller left-turning tendencies more noticeable.</text>
</svg>