<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Flight Path &amp; Relative Airflow">
<defs>
 <marker id="arrB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker>
 <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker>
 <marker id="arrS" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker>
 <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b91c1c"/></marker>
</defs>
<rect width="1200" height="720" fill="#fff"/>
<rect width="1200" height="120" fill="#06111f"/>
<text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text>
<text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">FLIGHT PATH &amp; RELATIVE AIRFLOW</text>
<rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>

<g font-family="Arial" font-weight="700" fill="#06111f">
<text x="220" y="220" text-anchor="middle" font-size="20">CLIMB</text>
<text x="600" y="220" text-anchor="middle" font-size="20">LEVEL FLIGHT</text>
<text x="980" y="220" text-anchor="middle" font-size="20">DESCENT</text></g>
<line x1="320" y1="320" x2="120" y2="430" stroke="#64748b" stroke-width="6" marker-end="url(#arrS)"/>
<line x1="120" y1="525" x2="320" y2="415" stroke="#1f4e79" stroke-width="6" marker-end="url(#arrB)"/>
<line x1="710" y1="365" x2="490" y2="365" stroke="#64748b" stroke-width="6" marker-end="url(#arrS)"/>
<line x1="490" y1="475" x2="710" y2="475" stroke="#1f4e79" stroke-width="6" marker-end="url(#arrB)"/>
<line x1="1080" y1="430" x2="880" y2="320" stroke="#64748b" stroke-width="6" marker-end="url(#arrS)"/>
<line x1="880" y1="415" x2="1080" y2="525" stroke="#1f4e79" stroke-width="6" marker-end="url(#arrB)"/>
<text x="600" y="595" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#64748b">GREY = FLIGHT PATH</text>
<text x="600" y="630" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#1f4e79">BLUE = RELATIVE AIRFLOW</text>

<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">Relative airflow is parallel to and opposite the flight path through the air mass.</text>
</svg>