<rect width="1200" height="720" fill="#fff"/>
<rect width="1200" height="120" fill="#06111f"/>
<text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text>
<text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">SKIN FRICTION</text>
<rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>

<rect x="180" y="390" width="820" height="55" fill="#f8fafc" stroke="#06111f" stroke-width="4"/>
<g stroke="#1f4e79" stroke-width="4">
<line x1="200" y1="320" x2="990" y2="320" marker-end="url(#arrB)"/>
<line x1="200" y1="345" x2="900" y2="345" marker-end="url(#arrB)"/>
<line x1="200" y1="370" x2="720" y2="370" marker-end="url(#arrB)"/>
</g>
<text x="600" y="285" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#1f4e79">AIR SPEED DECREASES TOWARD THE SURFACE</text>
<text x="600" y="500" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#06111f">VISCOUS SHEAR → SKIN-FRICTION DRAG</text>
<circle cx="350" cy="420" r="6" fill="#64748b"/><circle cx="550" cy="420" r="6" fill="#64748b"/><circle cx="750" cy="420" r="6" fill="#64748b"/>
<text x="600" y="555" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Rough or dirty surfaces increase skin-friction drag.</text>

<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">The boundary-layer air in immediate contact with the surface is slowed by viscosity.</text>
</svg>