<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Slip, Balanced Turn &amp; Skid">
<defs>
 <marker id="arrB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker>
 <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker>
 <marker id="arrS" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker>
 <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b91c1c"/></marker>
</defs>
<rect width="1200" height="720" fill="#fff"/>
<rect width="1200" height="120" fill="#06111f"/>
<text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text>
<text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">SLIP, BALANCED TURN &amp; SKID</text>
<rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>

<text x="600" y="225" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#64748b">LEFT TURN EXAMPLE</text>
<g font-family="Arial">
<rect x="110" y="260" width="300" height="280" rx="14" fill="#f8fafc" stroke="#d7e0ea"/><text x="260" y="310" text-anchor="middle" font-size="22" font-weight="800" fill="#06111f">SLIP</text><path d="M170 390 Q260 450 350 390" fill="none" stroke="#06111f" stroke-width="6"/><circle cx="205" cy="405" r="22" fill="#f4b400"/><text x="260" y="500" text-anchor="middle" font-size="18" fill="#64748b">ball to inside / low side</text>
<rect x="450" y="260" width="300" height="280" rx="14" fill="#f8fafc" stroke="#d7e0ea"/><text x="600" y="310" text-anchor="middle" font-size="22" font-weight="800" fill="#06111f">BALANCED</text><path d="M510 390 Q600 450 690 390" fill="none" stroke="#06111f" stroke-width="6"/><circle cx="600" cy="420" r="22" fill="#f4b400"/><text x="600" y="500" text-anchor="middle" font-size="18" fill="#64748b">ball centred</text>
<rect x="790" y="260" width="300" height="280" rx="14" fill="#f8fafc" stroke="#d7e0ea"/><text x="940" y="310" text-anchor="middle" font-size="22" font-weight="800" fill="#06111f">SKID</text><path d="M850 390 Q940 450 1030 390" fill="none" stroke="#06111f" stroke-width="6"/><circle cx="995" cy="405" r="22" fill="#f4b400"/><text x="940" y="500" text-anchor="middle" font-size="18" fill="#64748b">ball to outside / high side</text>
</g>

<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">The slip/skid ball indicates coordination: centred = balanced; displaced = slip or skid depending on the turn.</text>
</svg>