<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Spin Recovery Principle">
<defs>
 <marker id="arrB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker>
 <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker>
 <marker id="arrS" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker>
 <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b91c1c"/></marker>
</defs>
<rect width="1200" height="720" fill="#fff"/>
<rect width="1200" height="120" fill="#06111f"/>
<text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text>
<text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">SPIN RECOVERY PRINCIPLE</text>
<rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>

<g font-family="Arial">
<circle cx="220" cy="390" r="85" fill="#f8fafc" stroke="#06111f" stroke-width="4"/><text x="220" y="380" text-anchor="middle" font-size="26" font-weight="800" fill="#06111f">1</text><text x="220" y="415" text-anchor="middle" font-size="18" fill="#64748b">Identify spin</text>
<line x1="305" y1="390" x2="420" y2="390" stroke="#f4b400" stroke-width="7" marker-end="url(#arrG)"/>
<circle cx="505" cy="390" r="85" fill="#f8fafc" stroke="#06111f" stroke-width="4"/><text x="505" y="380" text-anchor="middle" font-size="26" font-weight="800" fill="#06111f">2</text><text x="505" y="415" text-anchor="middle" font-size="18" fill="#64748b">Opposite rudder</text>
<line x1="590" y1="390" x2="705" y2="390" stroke="#f4b400" stroke-width="7" marker-end="url(#arrG)"/>
<circle cx="790" cy="390" r="85" fill="#f8fafc" stroke="#06111f" stroke-width="4"/><text x="790" y="380" text-anchor="middle" font-size="26" font-weight="800" fill="#06111f">3</text><text x="790" y="415" text-anchor="middle" font-size="18" fill="#64748b">Then elevator</text>
<line x1="875" y1="390" x2="990" y2="390" stroke="#f4b400" stroke-width="7" marker-end="url(#arrG)"/>
<text x="600" y="540" text-anchor="middle" font-size="21" font-weight="800" fill="#b91c1c">QUESTION-BANK PRINCIPLE: RUDDER IS APPLIED BEFORE ELEVATOR</text></g>

<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">For the questions in this bank, the key sequence point is that rudder is applied before elevator.</text>
</svg>