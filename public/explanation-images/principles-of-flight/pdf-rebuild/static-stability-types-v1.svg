<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Positive neutral and negative stability">
<rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">POSITIVE, NEUTRAL &amp; NEGATIVE STABILITY</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>
<g font-family="Arial">
<text x="250" y="225" text-anchor="middle" font-size="22" font-weight="800" fill="#15803d">POSITIVE</text><path d="M120 330 Q250 545 380 330" fill="none" stroke="#06111f" stroke-width="8"/><circle cx="250" cy="417" r="20" fill="#f4b400"/><text x="250" y="565" text-anchor="middle" font-size="17" fill="#64748b">tends back toward equilibrium</text>
<text x="600" y="225" text-anchor="middle" font-size="22" font-weight="800" fill="#64748b">NEUTRAL</text><line x1="455" y1="430" x2="745" y2="430" stroke="#06111f" stroke-width="8"/><circle cx="600" cy="410" r="20" fill="#f4b400"/><text x="600" y="565" text-anchor="middle" font-size="17" fill="#64748b">remains at the displaced position</text>
<text x="950" y="225" text-anchor="middle" font-size="22" font-weight="800" fill="#b91c1c">NEGATIVE</text><path d="M820 470 Q950 260 1080 470" fill="none" stroke="#06111f" stroke-width="8"/><circle cx="950" cy="345" r="20" fill="#f4b400"/><text x="950" y="565" text-anchor="middle" font-size="17" fill="#64748b">moves farther from equilibrium</text>
</g><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Static stability describes the initial tendency after a disturbance from equilibrium.</text></svg>