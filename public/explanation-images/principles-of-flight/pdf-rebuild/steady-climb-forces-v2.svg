<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">PilotVault Principles of Flight — Forces in a Steady Climb</title>
<desc id="desc">A clean textbook-style vector diagram for a steady climb. Thrust and drag act along the climb path, lift acts perpendicular to it, weight acts vertically down, and an inset resolves weight into components.</desc>
<defs>
  <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker>
  <marker id="arrowSlate" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker>
</defs>
<rect width="1200" height="680" fill="#fff"/>
<rect width="1200" height="112" fill="#06111f"/>
<text x="600" y="36" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text>
<text x="600" y="78" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#fff">FORCES IN A STEADY CLIMB</text>
<rect x="54" y="140" width="1092" height="430" rx="10" fill="#fff" stroke="#d7e0ea" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif">
  <line x1="155" y1="505" x2="1025" y2="188" stroke="#d7e0ea" stroke-width="5"/>
  <text x="770" y="300" transform="rotate(-20 770 300)" font-size="18" font-weight="700" fill="#64748b">CLIMB PATH</text>
  <g transform="translate(560 350) rotate(-20)">
    <path d="M-64 5 L-15 5 L8 -5 L62 -4 L90 0 L62 5 L8 7 L-15 8 L-37 20 L-49 20 L-41 8 L-64 8 Z" fill="#ffffff" stroke="#06111f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-24 6 L-39 -13 L-27 -13 L-3 6" fill="#fff" stroke="#06111f" stroke-width="3"/>
    <path d="M48 -3 L62 -20 L73 -18 L67 -2" fill="#fff" stroke="#06111f" stroke-width="3"/>
  </g>
  <circle cx="560" cy="350" r="8" fill="#06111f"/>
  <line x1="560" y1="350" x2="875" y2="235" stroke="#f4b400" stroke-width="9" marker-end="url(#arrowGold)"/>
  <text x="892" y="222" font-size="22" font-weight="800" fill="#06111f">THRUST</text>
  <line x1="560" y1="350" x2="330" y2="434" stroke="#1f4e79" stroke-width="9" marker-end="url(#arrowBlue)"/>
  <text x="240" y="463" font-size="22" font-weight="800" fill="#1f4e79">DRAG</text>
  <line x1="560" y1="350" x2="490" y2="158" stroke="#f4b400" stroke-width="9" marker-end="url(#arrowGold)"/>
  <text x="425" y="172" font-size="22" font-weight="800" fill="#06111f">LIFT</text>
  <line x1="560" y1="350" x2="560" y2="530" stroke="#64748b" stroke-width="9" marker-end="url(#arrowSlate)"/>
  <text x="585" y="532" font-size="22" font-weight="800" fill="#64748b">WEIGHT</text>
  <line x1="155" y1="505" x2="300" y2="505" stroke="#94a3b8" stroke-width="2"/>
  <path d="M235 505 A80 80 0 0 0 230 478" fill="none" stroke="#f4b400" stroke-width="5"/>
  <text x="250" y="490" font-size="19" font-weight="800" fill="#06111f">γ</text>
  <text x="975" y="340" text-anchor="middle" font-size="17" font-weight="800" fill="#06111f">WEIGHT COMPONENTS</text>
  <line x1="975" y1="360" x2="975" y2="535" stroke="#64748b" stroke-width="5" marker-end="url(#arrowSlate)"/>
  <line x1="975" y1="360" x2="919" y2="380" stroke="#94a3b8" stroke-width="5"/>
  <line x1="919" y1="380" x2="975" y2="535" stroke="#94a3b8" stroke-width="5"/>
  <text x="900" y="365" text-anchor="end" font-size="16" font-weight="700" fill="#64748b">W sin γ</text>
  <text x="900" y="465" text-anchor="end" font-size="16" font-weight="700" fill="#64748b">W cos γ</text>
  <text x="994" y="505" font-size="16" font-weight="700" fill="#64748b">W</text>
  <text x="320" y="610" text-anchor="middle" font-size="19" font-weight="800" fill="#06111f">THRUST = DRAG + W sin γ</text>
  <text x="810" y="610" text-anchor="middle" font-size="19" font-weight="800" fill="#06111f">LIFT = W cos γ</text>
  <text x="600" y="650" text-anchor="middle" font-size="18" fill="#64748b">Therefore, in a steady climb: thrust is greater than drag and lift is less than weight.</text>
</g>
</svg>