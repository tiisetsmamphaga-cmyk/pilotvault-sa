<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="THRUST–DRAG COUPLE AND PITCH"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker><marker id="s" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b91c1c"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">THRUST–DRAG COUPLE AND PITCH</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><g font-family="Arial"><path d="M200 415 L900 415" stroke="#06111f" stroke-width="8"/><line x1="340" y1="485" x2="850" y2="485" stroke="#f4b400" stroke-width="8" marker-end="url(#g)"/><text x="865" y="492" font-size="20" font-weight="800" fill="#f4b400">THRUST</text><line x1="850" y1="335" x2="340" y2="335" stroke="#64748b" stroke-width="8" marker-end="url(#s)"/><text x="230" y="342" font-size="20" font-weight="800" fill="#64748b">DRAG</text><path d="M710 260 C800 235 880 285 890 365" fill="none" stroke="#1f4e79" stroke-width="8" marker-end="url(#b)"/><text x="760" y="220" text-anchor="middle" font-size="20" font-weight="800" fill="#1f4e79">INCREASED THRUST → NOSE-UP MOMENT</text><text x="600" y="555" text-anchor="middle" font-size="18" fill="#64748b">The vertical separation of thrust and drag lines creates a pitching couple.</text></g><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">In this force arrangement, increasing thrust produces a nose-up pitching tendency.</text></svg>