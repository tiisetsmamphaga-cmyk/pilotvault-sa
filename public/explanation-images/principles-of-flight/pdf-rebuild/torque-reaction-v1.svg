<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Torque Reaction">
<defs><marker id="arrB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker><marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker></defs>
<rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/>
<text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">PROPELLER TORQUE REACTION</text>
<rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>
<text x="600" y="215" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#64748b">VIEWED FROM THE COCKPIT</text>
<circle cx="600" cy="390" r="150" fill="none" stroke="#d7e0ea" stroke-width="4"/><line x1="600" y1="250" x2="600" y2="530" stroke="#06111f" stroke-width="12"/><line x1="470" y1="390" x2="730" y2="390" stroke="#06111f" stroke-width="6"/>
<path d="M720 300 A145 145 0 0 1 740 455" fill="none" stroke="#1f4e79" stroke-width="9" marker-end="url(#arrB)"/><text x="820" y="345" font-family="Arial" font-size="21" font-weight="800" fill="#1f4e79">PROPELLER</text><text x="820" y="375" font-family="Arial" font-size="19" fill="#64748b">clockwise</text>
<path d="M480 480 A155 155 0 0 1 455 315" fill="none" stroke="#f4b400" stroke-width="9" marker-end="url(#arrG)"/><text x="170" y="420" font-family="Arial" font-size="21" font-weight="800" fill="#f4b400">AIRFRAME REACTION</text><text x="170" y="450" font-family="Arial" font-size="19" fill="#64748b">opposite rotation → left roll</text>
<text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Newton's third law: propeller torque produces an equal and opposite rolling reaction on the airframe.</text></svg>