<text x="300" y="225" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#06111f">FLAPS UP</text>
<path d="M100 410 C150 350 300 350 470 400 C500 410 525 420 540 425 C430 435 270 440 160 435 C130 433 110 425 100 410Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/>
<text x="880" y="225" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#06111f">FLAPS DOWN</text>
<path d="M650 410 C700 350 850 350 1000 395 C1025 402 1045 410 1060 415 C970 425 830 430 720 430 C690 428 670 422 650 410Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/>
