<text x="880" y="545" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#f4b400">↑ CAMBER → ↑ LIFT + ↑ DRAG</text>

<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">Lowering trailing-edge flaps increases camber, increases lift, and increases drag.</text>
