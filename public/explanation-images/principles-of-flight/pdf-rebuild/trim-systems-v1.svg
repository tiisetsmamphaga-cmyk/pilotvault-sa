<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Trim Systems">
<defs>
 <marker id="arrB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker>
 <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker>
 <marker id="arrS" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker>
 <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b91c1c"/></marker>
</defs>
<rect width="1200" height="720" fill="#fff"/>
<rect width="1200" height="120" fill="#06111f"/>
<text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text>
<text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">TRIM SYSTEMS</text>
<rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>

<g font-family="Arial">
<rect x="110" y="270" width="300" height="260" rx="14" fill="#f8fafc" stroke="#d7e0ea"/><text x="260" y="320" text-anchor="middle" font-size="23" font-weight="800" fill="#06111f">FIXED TAB</text><text x="260" y="370" text-anchor="middle" font-size="18" fill="#64748b">adjusted on ground</text><text x="260" y="405" text-anchor="middle" font-size="18" fill="#64748b">for hands-off bias</text>
<rect x="450" y="270" width="300" height="260" rx="14" fill="#f8fafc" stroke="#d7e0ea"/><text x="600" y="320" text-anchor="middle" font-size="23" font-weight="800" fill="#06111f">TRIM TAB</text><text x="600" y="370" text-anchor="middle" font-size="18" fill="#64748b">pilot-selectable tab</text><text x="600" y="405" text-anchor="middle" font-size="18" fill="#64748b">reduces sustained force</text>
<rect x="790" y="270" width="300" height="260" rx="14" fill="#f8fafc" stroke="#d7e0ea"/><text x="940" y="320" text-anchor="middle" font-size="23" font-weight="800" fill="#06111f">SPRING-BIAS</text><text x="940" y="370" text-anchor="middle" font-size="18" fill="#64748b">changes spring force</text><text x="940" y="405" text-anchor="middle" font-size="18" fill="#64748b">to remove stick effort</text>
</g>

<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">Trim systems reduce the sustained control effort required after the desired flight condition is established.</text>
</svg>