<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Forces in a Level Turn">
<defs>
 <marker id="arrB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker>
 <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker>
 <marker id="arrS" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker>
 <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b91c1c"/></marker>
</defs>
<rect width="1200" height="720" fill="#fff"/>
<rect width="1200" height="120" fill="#06111f"/>
<text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text>
<text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">FORCES IN A LEVEL TURN</text>
<rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>

<g transform="rotate(-35 600 420)" stroke="#06111f" fill="none"><line x1="420" y1="420" x2="780" y2="420" stroke-width="16"/></g>
<circle cx="600" cy="420" r="10" fill="#06111f"/>
<line x1="600" y1="420" x2="430" y2="220" stroke="#f4b400" stroke-width="10" marker-end="url(#arrG)"/><text x="350" y="195" font-family="Arial" font-size="21" font-weight="800" fill="#06111f">TOTAL LIFT</text>
<line x1="600" y1="420" x2="600" y2="220" stroke="#1f4e79" stroke-width="7" marker-end="url(#arrB)"/><text x="705" y="275" font-family="Arial" font-size="19" font-weight="700" fill="#1f4e79">VERTICAL COMPONENT</text>
<line x1="600" y1="420" x2="430" y2="420" stroke="#1f4e79" stroke-width="7" marker-end="url(#arrB)"/><text x="215" y="385" font-family="Arial" font-size="19" font-weight="700" fill="#1f4e79">HORIZONTAL / CENTRIPETAL</text>
<line x1="600" y1="420" x2="600" y2="605" stroke="#64748b" stroke-width="10" marker-end="url(#arrS)"/><text x="600" y="635" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#64748b">WEIGHT</text>

<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">Banking tilts lift: its vertical component supports weight and its horizontal component provides centripetal force.</text>
</svg>