<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Common Airspeed Limitations">
<defs>
 <marker id="arrB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker>
 <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker>
 <marker id="arrS" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker>
 <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b91c1c"/></marker>
</defs>
<rect width="1200" height="720" fill="#fff"/>
<rect width="1200" height="120" fill="#06111f"/>
<text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text>
<text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">COMMON AIRSPEED LIMITATIONS</text>
<rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>

<g font-family="Arial">
<line x1="170" y1="500" x2="1030" y2="500" stroke="#06111f" stroke-width="5"/>
<rect x="200" y="300" width="150" height="90" rx="12" fill="#f8fafc" stroke="#d7e0ea"/><text x="275" y="340" text-anchor="middle" font-size="28" font-weight="800" fill="#06111f">VFE</text><text x="275" y="370" text-anchor="middle" font-size="16" fill="#64748b">max flap extended</text>
<rect x="390" y="300" width="150" height="90" rx="12" fill="#f8fafc" stroke="#d7e0ea"/><text x="465" y="340" text-anchor="middle" font-size="28" font-weight="800" fill="#06111f">VLO</text><text x="465" y="370" text-anchor="middle" font-size="16" fill="#64748b">gear operating</text>
<rect x="580" y="300" width="150" height="90" rx="12" fill="#f8fafc" stroke="#d7e0ea"/><text x="655" y="340" text-anchor="middle" font-size="28" font-weight="800" fill="#06111f">VNO</text><text x="655" y="370" text-anchor="middle" font-size="16" fill="#64748b">max structural cruise</text>
<rect x="770" y="300" width="150" height="90" rx="12" fill="#f8fafc" stroke="#d7e0ea"/><text x="845" y="340" text-anchor="middle" font-size="28" font-weight="800" fill="#06111f">VNE</text><text x="845" y="370" text-anchor="middle" font-size="16" fill="#64748b">never exceed</text>
<line x1="275" y1="390" x2="275" y2="500" stroke="#f4b400" stroke-width="5"/>
<line x1="465" y1="390" x2="465" y2="500" stroke="#f4b400" stroke-width="5"/>
<line x1="655" y1="390" x2="655" y2="500" stroke="#1f4e79" stroke-width="5"/>
<line x1="845" y1="390" x2="845" y2="500" stroke="#b91c1c" stroke-width="5"/>
<text x="600" y="575" text-anchor="middle" font-size="20" font-weight="700" fill="#64748b">Always use the aircraft POH/AFM for the actual values.</text>
</g>

<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">V-speeds define important operating and structural limits.</text>
</svg>