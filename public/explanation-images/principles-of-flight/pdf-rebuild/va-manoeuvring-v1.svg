<rect width="1200" height="720" fill="#fff"/>
<rect width="1200" height="120" fill="#06111f"/>
<text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text>
<text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">DESIGN MANOEUVRING SPEED — VA</text>
<rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>

<line x1="180" y1="570" x2="1020" y2="570" stroke="#06111f" stroke-width="4"/><line x1="180" y1="570" x2="180" y2="220" stroke="#06111f" stroke-width="4"/>
<path d="M230 530 C380 470 520 360 650 250" fill="none" stroke="#1f4e79" stroke-width="8"/>
<path d="M650 250 L900 250" stroke="#b91c1c" stroke-width="8"/>
<line x1="650" y1="570" x2="650" y2="220" stroke="#f4b400" stroke-width="4" stroke-dasharray="8 6"/>
<text x="650" y="610" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#f4b400">VA</text>
<text x="750" y="225" font-family="Arial" font-size="19" font-weight="700" fill="#b91c1c">LIMIT LOAD</text>
<text x="370" y="400" font-family="Arial" font-size="18" font-weight="700" fill="#1f4e79">STALL BOUNDARY</text>
<text x="600" y="650" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">At VA, a full abrupt control input in one axis is intended to stall the wing before exceeding the positive limit load.</text>

<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">VA is the design manoeuvring speed; actual value depends on aircraft and weight.</text>
</svg>