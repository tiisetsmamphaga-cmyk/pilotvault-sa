<rect width="1200" height="720" fill="#fff"/>
<rect width="1200" height="120" fill="#06111f"/>
<text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text>
<text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">VX &amp; VY</text>
<rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>

<line x1="190" y1="575" x2="1010" y2="575" stroke="#06111f" stroke-width="4"/><line x1="190" y1="575" x2="190" y2="220" stroke="#06111f" stroke-width="4"/>
<path d="M230 540 C390 410 570 330 760 310 C860 300 925 320 970 350" fill="none" stroke="#1f4e79" stroke-width="8"/>
<line x1="410" y1="575" x2="410" y2="405" stroke="#f4b400" stroke-width="4" stroke-dasharray="8 6"/><text x="410" y="610" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#f4b400">VX</text>
<line x1="610" y1="575" x2="610" y2="340" stroke="#b91c1c" stroke-width="4" stroke-dasharray="8 6"/><text x="610" y="610" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#b91c1c">VY</text>
<text x="370" y="300" font-family="Arial" font-size="19" font-weight="700" fill="#f4b400">BEST ANGLE — height / distance</text>
<text x="650" y="250" font-family="Arial" font-size="19" font-weight="700" fill="#b91c1c">BEST RATE — height / time</text>
<text x="600" y="645" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">VX is used for obstacle clearance; VY gives the greatest altitude gain per unit time.</text>

<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">VX = best angle of climb; VY = best rate of climb.</text>
