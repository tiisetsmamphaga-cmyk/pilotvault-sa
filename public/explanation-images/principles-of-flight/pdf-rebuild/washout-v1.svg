<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Wing Washout">
<defs>
 <marker id="arrB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker>
 <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker>
 <marker id="arrS" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker>
 <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b91c1c"/></marker>
</defs>
<rect width="1200" height="720" fill="#fff"/>
<rect width="1200" height="120" fill="#06111f"/>
<text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text>
<text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">WING WASHOUT</text>
<rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>

<path d="M200 390 L1000 390 L940 440 L260 440Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/>
<line x1="240" y1="365" x2="430" y2="365" stroke="#f4b400" stroke-width="6"/><line x1="780" y1="365" x2="960" y2="385" stroke="#1f4e79" stroke-width="6"/>
<text x="330" y="325" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#f4b400">ROOT: HIGHER INCIDENCE</text>
<text x="870" y="325" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#1f4e79">TIP: LOWER INCIDENCE</text>
<text x="600" y="520" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#06111f">WASHOUT</text>
<text x="600" y="565" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">The wing is twisted so angle of incidence decreases toward the tip.</text>

<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">Washout reduces the tip angle of incidence and helps the wing root stall before the tip.</text>
</svg>