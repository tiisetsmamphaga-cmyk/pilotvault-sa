<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Wing polar">
<rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/>
<text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">WING POLAR — LIFT VERSUS DRAG</text>
<rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>
<line x1="220" y1="570" x2="1000" y2="570" stroke="#06111f" stroke-width="4"/><line x1="220" y1="570" x2="220" y2="225" stroke="#06111f" stroke-width="4"/>
<text x="620" y="620" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#64748b">DRAG COEFFICIENT, Cᴅ →</text><text x="125" y="405" text-anchor="middle" transform="rotate(-90 125 405)" font-family="Arial" font-size="20" font-weight="700" fill="#64748b">LIFT COEFFICIENT, Cʟ</text>
<path d="M300 545 C360 485 445 410 555 335 C665 260 790 235 930 285" fill="none" stroke="#1f4e79" stroke-width="8"/>
<line x1="220" y1="570" x2="610" y2="315" stroke="#f4b400" stroke-width="5"/><circle cx="610" cy="315" r="9" fill="#f4b400"/><text x="625" y="300" font-family="Arial" font-size="19" font-weight="800" fill="#06111f">MAX L/D — TANGENT FROM ORIGIN</text>
<circle cx="900" cy="270" r="9" fill="#b91c1c"/><text x="815" y="235" font-family="Arial" font-size="19" font-weight="800" fill="#b91c1c">NEAR CʟMAX / CRITICAL AoA</text>
<text x="330" y="520" font-family="Arial" font-size="18" fill="#64748b">lower AoA</text><text x="850" y="335" font-family="Arial" font-size="18" fill="#64748b">higher AoA</text>
<text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">A wing polar plots lift coefficient against drag coefficient; points along the curve correspond to different angles of attack.</text></svg>