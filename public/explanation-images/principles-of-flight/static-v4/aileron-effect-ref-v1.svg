<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">AILERONS AND ROLL CONTROL</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><path d="M210 405 L520 355 L680 355 L990 405 L680 430 L520 430Z" fill="#f8fafc" stroke="#06111f" stroke-width="6"/><path d="M210 405 L355 380 L365 430 L210 455Z" fill="#f4b400" stroke="#06111f" stroke-width="4"/><path d="M845 380 L990 405 L990 365 L835 350Z" fill="#f4b400" stroke="#06111f" stroke-width="4"/><rect x="555" y="320" width="90" height="140" rx="35" fill="#fff" stroke="#06111f" stroke-width="5"/><text x="290" y="490" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">LEFT AILERON DOWN</text><text x="910" y="325" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">RIGHT AILERON UP</text><line x1="310" y1="390" x2="310" y2="245" stroke="#f4b400" stroke-width="9" marker-end="url(#y)"/><text x="310" y="220" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#06111f">MORE LIFT</text><line x1="895" y1="390" x2="895" y2="300" stroke="#1f4e79" stroke-width="7" marker-end="url(#b)"/><text x="895" y="275" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#1f4e79">LESS LIFT</text><path d="M470 560 A180 95 0 0 0 730 560" fill="none" stroke="#06111f" stroke-width="5"/><text x="600" y="610" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#06111f">ROLL TO THE RIGHT</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">Moving the control to the right raises the right aileron and lowers the left, creating a rolling moment about the longitudinal axis.</text></svg>