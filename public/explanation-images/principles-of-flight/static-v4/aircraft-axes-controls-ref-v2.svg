<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker><marker id="y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">AIRCRAFT AXES AND PRIMARY CONTROLS</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><g transform="translate(600 405)" stroke="#06111f" fill="none"><path d="M-270 0 L-70 -35 L120 -25 L275 0 L120 25 L-70 35 Z" stroke-width="7"/><line x1="0" y1="-170" x2="0" y2="170" stroke="#64748b" stroke-width="5"/><line x1="-320" y1="0" x2="320" y2="0" stroke="#1f4e79" stroke-width="5"/><line x1="-150" y1="120" x2="170" y2="-120" stroke="#f4b400" stroke-width="5"/></g><circle cx="600" cy="405" r="11" fill="#06111f"/><text x="600" y="215" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#64748b">VERTICAL AXIS — YAW — RUDDER</text><text x="810" y="365" font-family="Arial" font-size="20" font-weight="700" fill="#1f4e79">LATERAL AXIS — PITCH — ELEVATOR</text><text x="170" y="555" font-family="Arial" font-size="20" font-weight="700" fill="#f4b400">LONGITUDINAL AXIS — ROLL — AILERONS</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">The three axes intersect at the centre of gravity and are mutually perpendicular.</text></svg>