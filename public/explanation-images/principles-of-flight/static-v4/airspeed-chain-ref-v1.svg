<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
<defs><marker id="gold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker></defs>
<rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/>
<text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text>
<text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">IAS, CAS / RAS AND TAS</text>
<rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>
<g font-family="Arial,sans-serif">
<rect x="105" y="285" width="245" height="155" rx="14" fill="#f8fafc" stroke="#d7e0ea"/><text x="228" y="335" text-anchor="middle" font-size="31" font-weight="800" fill="#06111f">IAS</text><text x="228" y="375" text-anchor="middle" font-size="18" fill="#64748b">indicated airspeed</text><text x="228" y="405" text-anchor="middle" font-size="18" fill="#64748b">direct instrument reading</text>
<line x1="350" y1="360" x2="455" y2="360" stroke="#f4b400" stroke-width="7" marker-end="url(#gold)"/><text x="402" y="322" text-anchor="middle" font-size="16" font-weight="700" fill="#64748b">CORRECT</text><text x="402" y="344" text-anchor="middle" font-size="15" fill="#64748b">instrument + position</text>
<rect x="455" y="285" width="290" height="155" rx="14" fill="#f8fafc" stroke="#d7e0ea"/><text x="600" y="335" text-anchor="middle" font-size="31" font-weight="800" fill="#06111f">CAS / RAS</text><text x="600" y="375" text-anchor="middle" font-size="18" fill="#64748b">IAS corrected for instrument</text><text x="600" y="405" text-anchor="middle" font-size="18" fill="#64748b">and position error</text>
<line x1="745" y1="360" x2="850" y2="360" stroke="#f4b400" stroke-width="7" marker-end="url(#gold)"/><text x="798" y="322" text-anchor="middle" font-size="16" font-weight="700" fill="#64748b">CORRECT</text><text x="798" y="344" text-anchor="middle" font-size="15" fill="#64748b">temperature + altitude</text>
<rect x="850" y="285" width="245" height="155" rx="14" fill="#f8fafc" stroke="#d7e0ea"/><text x="973" y="335" text-anchor="middle" font-size="31" font-weight="800" fill="#06111f">TAS</text><text x="973" y="375" text-anchor="middle" font-size="18" fill="#64748b">true airspeed</text><text x="973" y="405" text-anchor="middle" font-size="18" fill="#64748b">speed through the air mass</text>
<text x="600" y="535" text-anchor="middle" font-size="22" font-weight="800" fill="#06111f">IAS  →  CAS / RAS  →  TAS</text>
<text x="600" y="575" text-anchor="middle" font-size="19" fill="#64748b">PilotVault uses CAS / RAS terminology to match the question bank.</text>
</g>
<text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">TAS is CAS / RAS corrected for temperature and altitude.</text>
</svg>