<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">AIRSPEED LIMITATIONS</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><text x="600" y="205" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">STANDARD LIGHT-AEROPLANE AIRSPEED INDICATOR MARKINGS</text><path d="M325 500 A275 275 0 0 1 875 500" fill="none" stroke="#d7e0ea" stroke-width="32"/><path d="M360 450 A235 235 0 0 1 535 290" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/><path d="M430 360 A205 205 0 0 1 725 285" fill="none" stroke="#22c55e" stroke-width="22" stroke-linecap="round"/><path d="M725 285 A205 205 0 0 1 855 390" fill="none" stroke="#eab308" stroke-width="22" stroke-linecap="round"/><line x1="865" y1="380" x2="885" y2="355" stroke="#dc2626" stroke-width="10"/><text x="360" y="535" font-family="Arial" font-size="18" font-weight="700" fill="#64748b">WHITE ARC</text><text x="360" y="562" font-family="Arial" font-size="18" fill="#64748b">Flap operating range</text><text x="545" y="250" font-family="Arial" font-size="18" font-weight="700" fill="#16a34a">GREEN ARC</text><text x="545" y="277" font-family="Arial" font-size="18" fill="#64748b">Normal operating range</text><text x="790" y="250" font-family="Arial" font-size="18" font-weight="700" fill="#a16207">YELLOW ARC</text><text x="790" y="277" font-family="Arial" font-size="18" fill="#64748b">Caution range — smooth air</text><text x="905" y="345" font-family="Arial" font-size="18" font-weight="700" fill="#dc2626">RED LINE = VNE</text><text x="600" y="610" text-anchor="middle" font-family="Arial" font-size="19" fill="#06111f">VNO: upper limit of the green arc • VFE: upper limit of the white arc • VNE: never-exceed speed</text><text x="600" y="642" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">VA (design manoeuvring speed) is an important limitation normally published in the AFM/POH rather than on the indicator face.</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Markings and terminology follow the handbook's light-aeroplane airspeed limitation description.</text></svg>