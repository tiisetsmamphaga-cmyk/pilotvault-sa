<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Angle of Attack</title><desc id="d">PilotVault technical diagram showing a correctly oriented aerofoil, chord line, flight path and relative airflow.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#1f4e79"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#64748b"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">ANGLE OF ATTACK</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><path d="M330 430 C390 340 630 330 920 390 C980 402 1035 420 1070 438 C995 445 820 458 610 468 C470 475 375 466 330 430Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><line x1="330" y1="430" x2="1070" y2="438" stroke="#f4b400" stroke-width="6"/><line x1="1080" y1="525" x2="245" y2="525" stroke="#1f4e79" stroke-width="6" marker-end="url(#a)"/><line x1="245" y1="585" x2="1080" y2="585" stroke="#64748b" stroke-width="6" marker-end="url(#g)"/><path d="M405 520 A150 150 0 0 1 410 432" fill="none" stroke="#f4b400" stroke-width="8"/><text x="425" y="493" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#06111f">α</text><text x="650" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1f4e79">RELATIVE AIRFLOW</text><text x="650" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#64748b">AIRCRAFT FLIGHT PATH</text><text x="770" y="365" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#f4b400">CHORD LINE</text><line x1="790" y1="372" x2="820" y2="433" stroke="#64748b" stroke-width="2"/><text x="190" y="365" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#06111f">LEADING EDGE</text><line x1="295" y1="372" x2="336" y2="423" stroke="#64748b" stroke-width="2"/><text x="930" y="330" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#06111f">TRAILING EDGE</text><line x1="1015" y1="337" x2="1060" y2="430" stroke="#64748b" stroke-width="2"/><text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#64748b">Angle of attack is the angle between the chord line and the relative airflow.</text></svg>