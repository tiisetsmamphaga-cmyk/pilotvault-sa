<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">ANHEDRAL</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker><marker id="y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b91c1c"/></marker></defs><line x1="600" y1="255" x2="600" y2="535" stroke="#64748b" stroke-width="4"/><path d="M600 395 L300 485" stroke="#06111f" stroke-width="18"/><path d="M600 395 L900 485" stroke="#06111f" stroke-width="18"/><path d="M475 395 A125 125 0 0 0 505 455" fill="none" stroke="#f4b400" stroke-width="6"/><path d="M725 395 A125 125 0 0 1 695 455" fill="none" stroke="#f4b400" stroke-width="6"/><text x="600" y="210" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#06111f">FRONT VIEW</text><text x="600" y="565" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#f4b400">WINGTIPS LOWER THAN THE ROOT</text><text x="600" y="615" text-anchor="middle" font-family="Arial" font-size="20" fill="#64748b">Anhedral reduces the wing’s dihedral effect and therefore reduces lateral stability.</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Anhedral is the downward inclination of the wings from root to tip when viewed from the front.</text></svg>