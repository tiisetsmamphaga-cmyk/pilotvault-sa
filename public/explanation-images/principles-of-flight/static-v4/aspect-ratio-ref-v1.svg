<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">WING ASPECT RATIO</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker><marker id="y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b91c1c"/></marker></defs><text x="320" y="215" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#06111f">HIGH ASPECT RATIO</text><rect x="110" y="310" width="420" height="90" rx="40" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><line x1="110" y1="445" x2="530" y2="445" stroke="#f4b400" stroke-width="5"/><text x="320" y="475" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">long span / narrow chord</text><text x="320" y="520" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#1f4e79">LESS INDUCED DRAG</text><text x="880" y="215" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#06111f">LOW ASPECT RATIO</text><rect x="690" y="285" width="380" height="140" rx="55" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><line x1="690" y1="470" x2="1070" y2="470" stroke="#f4b400" stroke-width="5"/><text x="880" y="500" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">shorter span / wider chord</text><text x="880" y="545" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#b91c1c">MORE INDUCED DRAG</text><text x="600" y="615" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#06111f">ASPECT RATIO = SPAN² ÷ WING AREA</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">For the same wing area, a higher aspect ratio generally reduces induced drag.</text></svg>