<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">BANK ANGLE, LOAD FACTOR AND STALL SPEED</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><line x1="180" y1="585" x2="1020" y2="585" stroke="#06111f" stroke-width="4"/><line x1="180" y1="585" x2="180" y2="220" stroke="#06111f" stroke-width="4"/><line x1="1020" y1="585" x2="1020" y2="220" stroke="#06111f" stroke-width="4"/><path d="M180 570 C360 565 520 548 650 510 C780 470 880 390 955 245" fill="none" stroke="#f4b400" stroke-width="8"/><path d="M180 570 C380 568 550 555 690 525 C820 495 910 425 965 330" fill="none" stroke="#1f4e79" stroke-width="8"/><text x="600" y="628" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#64748b">BANK ANGLE →</text><text x="100" y="405" text-anchor="middle" transform="rotate(-90 100 405)" font-family="Arial" font-size="20" font-weight="700" fill="#f4b400">LOAD FACTOR</text><text x="1100" y="405" text-anchor="middle" transform="rotate(90 1100 405)" font-family="Arial" font-size="20" font-weight="700" fill="#1f4e79">STALL SPEED INCREASE</text><g font-family="Arial" font-size="18" fill="#64748b"><text x="175" y="610">0°</text><text x="430" y="610">30°</text><text x="690" y="610">60°</text><text x="910" y="610">75°</text></g><circle cx="690" cy="500" r="9" fill="#f4b400"/><line x1="690" y1="500" x2="820" y2="455" stroke="#f4b400" stroke-width="3"/><text x="835" y="455" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">60° BANK ≈ 2 G</text><circle cx="690" cy="525" r="8" fill="#1f4e79"/><line x1="690" y1="525" x2="815" y2="555" s