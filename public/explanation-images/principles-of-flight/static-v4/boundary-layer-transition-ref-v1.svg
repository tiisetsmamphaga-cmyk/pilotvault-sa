<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">BOUNDARY LAYER AND TRANSITION</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><path d="M170 465 C240 340 560 325 1000 430 C1040 440 1070 450 1090 458 C930 470 700 480 465 480 C300 480 205 472 170 465Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><g stroke="#1f4e79" fill="none" marker-end="url(#b)"><path d="M120 285 C330 275 520 285 710 325 C875 360 1000 392 1100 410" stroke-width="4"/><path d="M120 315 C330 305 525 315 700 345 C870 375 995 405 1100 425" stroke-width="4"/><path d="M120 345 C330 335 515 345 690 365 C860 390 995 420 1100 440" stroke-width="4"/></g><path d="M190 450 C340 425 500 410 650 405" fill="none" stroke="#f4b400" stroke-width="7"/><path d="M650 405 C790 395 900 395 1025 420" fill="none" stroke="#f4b400" stroke-width="7" stroke-dasharray="12 8"/><line x1="650" y1="285" x2="650" y2="430" stroke="#b91c1c" stroke-width="4" stroke-dasharray="8 7"/><text x="650" y="260" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#b91c1c">TRANSITION POINT</text><text x="355" y="545" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#06111f">LAMINAR BOUNDARY LAYER</text><text x="855" y="545" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#06111f">TURBULENT BOUNDARY LAYER</text><text x="600" y="600" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">The boundary layer is the thin region of airflow slowed by skin friction next to the aerofoil surface.</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">The transition point separates predominantly laminar flow from turbulent flow within the boundary layer.</text></svg>