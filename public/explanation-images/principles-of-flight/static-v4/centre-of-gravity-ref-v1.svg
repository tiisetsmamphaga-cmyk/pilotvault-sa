<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">CENTRE OF GRAVITY</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><path d="M185 420 C250 365 420 350 650 370 L880 395 L1020 350 L1080 365 L995 425 L865 435 L640 455 C410 470 250 465 185 420Z" fill="#f8fafc" stroke="#06111f" stroke-width="6"/><circle cx="575" cy="420" r="18" fill="#f4b400" stroke="#06111f" stroke-width="4"/><line x1="575" y1="205" x2="575" y2="400" stroke="#06111f" stroke-width="5"/><path d="M535 205 L615 205 L575 165Z" fill="#06111f"/><text x="650" y="205" font-family="Arial" font-size="22" font-weight="800" fill="#06111f">SUSPENSION / BALANCE POINT</text><text x="610" y="390" font-family="Arial" font-size="22" font-weight="800" fill="#f4b400">CG</text><text x="600" y="555" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#64748b">If an aircraft could be suspended exactly at its CG, it would balance about that point.</text><text x="600" y="600" text-anchor="middle" font-family="Arial" font-size="20" fill="#64748b">Its position depends on the weight and location of the aircraft's load.</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">The CG lies on the aircraft's longitudinal centreline and strongly affects stability and control.</text></svg>