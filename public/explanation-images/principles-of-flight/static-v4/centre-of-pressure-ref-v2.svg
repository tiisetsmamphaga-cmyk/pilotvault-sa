<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">CENTRE OF PRESSURE</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><path d="M175 430 C245 320 555 315 975 420 C1020 431 1050 440 1070 448 C890 460 640 470 420 468 C300 466 205 452 175 430Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><line x1="175" y1="430" x2="1070" y2="448" stroke="#64748b" stroke-width="3"/><circle cx="560" cy="438" r="12" fill="#06111f"/><line x1="560" y1="438" x2="560" y2="240" stroke="#f4b400" stroke-width="10" marker-end="url(#y)"/><text x="560" y="215" text-anchor="middle" font-family="Arial" font-size="24" font-weight="800" fill="#06111f">TOTAL LIFT</text><text x="605" y="425" font-family="Arial" font-size="21" font-weight="700" fill="#06111f">CENTRE OF PRESSURE</text><line x1="650" y1="435" x2="578" y2="438" stroke="#64748b" stroke-width="2"/><text x="600" y="545" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#64748b">The distributed aerodynamic lift is represented by a single resultant force acting through the centre of pressure.</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">PilotVault uses “centre of pressure” to match the SACAA POF question wording.</text></svg>