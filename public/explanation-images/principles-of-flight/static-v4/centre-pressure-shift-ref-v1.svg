<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">ANGLE OF ATTACK AND CENTRE OF PRESSURE</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><g transform="translate(75 0)"><text x="180" y="215" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#06111f">LOW AoA</text><path d="M50 390 C95 330 225 330 330 375 C350 383 365 390 380 398 C295 408 185 415 105 413 C75 412 58 405 50 390Z" fill="#f8fafc" stroke="#06111f" stroke-width="4"/><circle cx="285" cy="390" r="11" fill="#f4b400"/><text x="285" y="450" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#f4b400">CP</text></g><g transform="translate(410 -20) rotate(6 180 390)"><text x="180" y="235" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#06111f" transform="rotate(-6 180 235)">MEDIUM AoA</text><path d="M50 390 C95 330 225 330 330 375 C350 383 365 390 380 398 C295 408 185 415 105 413 C75 412 58 405 50 390Z" fill="#f8fafc" stroke="#06111f" stroke-width="4"/><circle cx="235" cy="384" r="11" fill="#f4b400"/></g><g transform="translate(765 -45) rotate(12 180 390)"><text x="180" y="260" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#06111f" transform="rotate(-12 180 260)">HIGHER AoA</text><path d="M50 390 C95 330 225 330 330 375 C350 383 365 390 380 398 C295 408 185 415 105 413 C75 412 58 405 50 390Z" fill="#f8fafc" stroke="#06111f" stroke-width="4"/><circle cx="185" cy="376" r="11" fill="#f4b400"/></g><line x1="970" y1="535" x2="420" y2="535" stroke="#1f4e79" stroke-width="7" marker-end="url(#b)"/><text x="695" y="575" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#1f4e79">CENTRE OF PRESSURE MOVES FORWARD</text><text x="600" y="620" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">For the normal pre-stall range represented in the PilotVault question set, increasing AoA moves the resultant lift point forward.</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">The centre of pressure is the point through which the wing's resultant aerodynamic lift is considered to act.</text></svg>