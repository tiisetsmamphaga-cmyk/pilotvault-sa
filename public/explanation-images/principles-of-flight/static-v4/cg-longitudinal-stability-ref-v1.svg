<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">CG, CENTRE OF PRESSURE AND PITCH STABILITY</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><path d="M170 430 C230 375 390 360 610 375 L865 400 L1025 350 L1080 365 L1000 425 L860 435 L620 455 C400 470 235 465 170 430Z" fill="#f8fafc" stroke="#06111f" stroke-width="6"/><circle cx="540" cy="420" r="10" fill="#06111f"/><circle cx="650" cy="420" r="10" fill="#f4b400"/><line x1="540" y1="420" x2="540" y2="610" stroke="#64748b" stroke-width="9" marker-end="url(#g)"/><text x="505" y="640" font-family="Arial" font-size="21" font-weight="800" fill="#64748b">WEIGHT AT CG</text><line x1="650" y1="420" x2="650" y2="225" stroke="#f4b400" stroke-width="9" marker-end="url(#y)"/><text x="680" y="215" font-family="Arial" font-size="21" font-weight="800" fill="#06111f">LIFT AT CP</text><line x1="970" y1="390" x2="970" y2="545" stroke="#1f4e79" stroke-width="8"/><text x="805" y="575" font-family="Arial" font-size="20" font-weight="800" fill="#1f4e79">TAIL DOWNFORCE</text><line x1="540" y1="360" x2="650" y2="360" stroke="#06111f" stroke-width="3"/><text x="595" y="345" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#06111f">CG AHEAD OF CP</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">A conventional stable arrangement places the CG ahead of the wing's centre of pressure and uses tail downforce to balance pitching moments.</text></svg>