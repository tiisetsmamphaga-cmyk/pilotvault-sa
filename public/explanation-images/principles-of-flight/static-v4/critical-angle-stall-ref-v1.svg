<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img"><defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#1f4e79"/></marker></defs><rect width="1200" height="760" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">ANGLE OF ATTACK AND STALL</text><rect x="40" y="150" width="1120" height="545" rx="14" fill="#fff" stroke="#d7e0ea"/><text x="210" y="205" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">LOW AoA</text><text x="600" y="205" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">HIGH AoA</text><text x="990" y="205" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#b91c1c">BEYOND CRITICAL AoA</text><g transform="translate(75 0)"><path d="M50 400 C90 345 210 345 320 392 C270 408 150 420 50 400Z" fill="#f8fafc" stroke="#06111f" stroke-width="4"/><line x1="30" y1="470" x2="330" y2="470" stroke="#1f4e79" stroke-width="5" marker-end="url(#b)"/><path d="M25 355 C120 315 240 320 345 365" fill="none" stroke="#1f4e79" stroke-width="3"/><path d="M25 330 C120 290 245 295 350 340" fill="none" stroke="#1f4e79" stroke-width="3"/><text x="190" y="535" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Attached airflow</text></g><g transform="translate(455 -35) rotate(-10 170 410)"><path d="M50 400 C90 345 210 345 320 392 C270 408 150 420 50 400Z" fill="#f8fafc" stroke="#06111f" stroke-width="4"/><line x1="30" y1="500" x2="330" y2="500" stroke="#1f4e79" stroke-width="5" marker-end="url(#b)"/><path d="M25 350 C115 300 235 300 345 355" fill="none" stroke="#1f4e79" stroke-width="3"/><path d="M25 325 C120 270 245 275 350 330" fill="none" stroke="#1f4e79" stroke-width="3"/></g><text x="625" y="535" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Separation begins near trailing edge</text><g transform="translate(845 -65) rotate(-18 170 410)"><path d="M50 400 C90 345 210 345 320 392 C270 408 150 420 50 400Z" fill="#f8fafc" stroke="#06111f" stroke-width="4"/><line x1="30" y1="540" x2="330" y2="540" stroke="#1f4e79" stroke-width="5" marker-end="url(#b)"/><path d="M20 345 C85 295 140 300 175 325" fill="none" stroke="#1f4e79" stroke-width="3"/><path d="M180 325 C215 285 245 370 285 325 C320 285 345 365 365 330" fill="none" stroke="#b91c1c" stroke-width="4"/><path d="M200 360 C230 325 260 400 300 355 C330 325 355 395 375 365" fill="none" stroke="#b91c1c" stroke-width="4"/></g><text x="1000" y="535" text-anchor="middle" font-family="Arial" font-size="18" fill="#b91c1c">Large separated turbulent region</text><text x="600" y="645" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#06111f">A stall occurs when the critical angle of attack is exceeded — not at one particular airspeed.</text><text x="600" y="725" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">As AoA increases, separation progresses forward over the upper surface and lift falls sharply.</text></svg>