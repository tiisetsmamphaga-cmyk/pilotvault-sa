<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">ANGLE OF ATTACK AND STALL</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><text x="230" y="205" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">LOW AoA</text><text x="600" y="205" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">HIGH AoA</text><text x="970" y="205" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#b91c1c">BEYOND CRITICAL AoA</text><g transform="translate(70 -5)"><path d="M50 400 C90 345 210 345 320 392 C270 408 150 420 50 400Z" fill="#f8fafc" stroke="#06111f" stroke-width="4"/><line x1="40" y1="475" x2="340" y2="475" stroke="#1f4e79" stroke-width="5" marker-end="url(#b)"/><path d="M25 355 C120 315 240 320 345 365" fill="none" stroke="#1f4e79" stroke-width="3"/><path d="M25 330 C120 290 245 295 350 340" fill="none" stroke="#1f4e79" stroke-width="3"/></g><g transform="translate(440 -30) rotate(10 170 410)"><path d="M50 400 C90 345 210 345 320 392 C270 408 150 420 50 400Z" fill="#f8fafc" stroke="#06111f" stroke-width="4"/><line x1="40" y1="500" x2="340" y2="500" stroke="#1f4e79" stroke-width="5" marker-end="url(#b)"/><path d="M25 350 C115 300 235 300 345 355" fill="none" stroke="#1f4e79" stroke-width="3"/><path d="M25 325 C120 270 245 275 350 330" fill="none" stroke="#1f4e79" stroke-width="3"/></g><g transform="translate(810 -55) rotate(18 170 410)"><path d="M50 400 C90 345 210 345 320 392 C270 408 150 420 50 400Z" fill="#f8fafc" stroke="#06111f" stroke-width="4"/><line x1="40" y1="535" x2="340" y2="535" stroke="#1f4e79" stroke-width="5" marker-end="url(#b)"/><path d="M20 345 C85 295 140 300 175 325" fill="none" stroke="#1f4e79" stroke-width="3"/><path d="M180 325 C215 285 245 370 285 325 C320 285 345 365 365 330" fill="none" stroke="#b91c1c" stroke-width="4"/><path d="M200 360 C230 325 260 400 300 355 C330 325 355 395 375 365" fill="none" stroke="#b91c1c" stroke-width="4"/></g><text x="230" y="570" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Attached airflow</text><text x="600" y="570" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Separation starts near trailing edge</text><text x="970" y="570" text-anchor="middle" font-family="Arial" font-size="18" fill="#b91c1c">Large separated region</text><text x="600" y="625" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#06111f">Stall occurs when the critical angle of attack is exceeded.</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">As AoA increases, upper-surface separation moves forward and lift falls sharply.</text></svg>