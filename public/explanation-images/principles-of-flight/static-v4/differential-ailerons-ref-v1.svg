<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">DIFFERENTIAL AILERONS</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><text x="320" y="215" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#06111f">UP-GOING AILERON</text><path d="M110 410 C180 360 360 355 520 395 L570 408 L520 430 C355 450 180 448 110 410Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><path d="M470 395 L575 330 L590 365 L520 430Z" fill="#f4b400" stroke="#06111f" stroke-width="4"/><path d="M510 355 A90 90 0 0 1 570 400" fill="none" stroke="#f4b400" stroke-width="6" marker-end="url(#y)"/><text x="340" y="520" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#f4b400">LARGER UP DEFLECTION</text><text x="885" y="215" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#06111f">DOWN-GOING AILERON</text><path d="M630 410 C700 360 880 355 1040 395 L1090 408 L1040 430 C875 450 700 448 630 410Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><path d="M990 395 L1080 450 L1065 480 L1040 430Z" fill="#f4b400" stroke="#06111f" stroke-width="4"/><path d="M1020 420 A80 80 0 0 0 1070 455" fill="none" stroke="#f4b400" stroke-width="6" marker-end="url(#y)"/><text x="885" y="520" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#f4b400">SMALLER DOWN DEFLECTION</text><text x="600" y="590" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">The upward-moving aileron travels farther than the downward-moving aileron.</text><text x="600" y="625" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">This reduces the drag increase on the wing with the down-going aileron.</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">Differential movement is a common design method used to reduce adverse aileron yaw.</text></svg>