<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker><marker id="y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">DIRECTIONAL STABILITY</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><g transform="translate(620 405) rotate(-16)"><path d="M-300 0 L-70 -55 L150 -40 L300 0 L150 40 L-70 55Z" fill="#f8fafc" stroke="#06111f" stroke-width="6"/><path d="M-75 -55 L-145 -165 L-95 -35" fill="#f4b400" stroke="#06111f" stroke-width="5"/></g><line x1="1050" y1="475" x2="250" y2="475" stroke="#1f4e79" stroke-width="8" marker-end="url(#b)"/><text x="660" y="515" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#1f4e79">RELATIVE WIND / SIDESLIP</text><line x1="460" y1="330" x2="430" y2="260" stroke="#f4b400" stroke-width="8" marker-end="url(#y)"/><text x="320" y="235" font-family="Arial" font-size="20" font-weight="800" fill="#06111f">SIDE FORCE ON FIN</text><path d="M620 585 A210 130 0 0 1 830 425" fill="none" stroke="#f4b400" stroke-width="7" marker-end="url(#y)"/><text x="835" y="400" font-family="Arial" font-size="20" font-weight="800" fill="#06111f">RESTORING YAW</text><text x="600" y="610" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#64748b">The vertical fin is behind the CG, so a sideslip produces a restoring yawing moment.</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">Like a weather vane, the aircraft tends to align its longitudinal axis with the relative wind.</text></svg>