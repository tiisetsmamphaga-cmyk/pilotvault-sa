<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">INDUCED, PARASITE AND TOTAL DRAG</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><line x1="210" y1="590" x2="1030" y2="590" stroke="#06111f" stroke-width="5"/><line x1="210" y1="590" x2="210" y2="220" stroke="#06111f" stroke-width="5"/><text x="620" y="635" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#64748b">AIRSPEED →</text><text x="120" y="410" text-anchor="middle" transform="rotate(-90 120 410)" font-family="Arial" font-size="22" font-weight="700" fill="#64748b">DRAG</text><path d="M260 255 C350 340 450 430 590 530 C710 575 840 580 980 580" fill="none" stroke="#1f4e79" stroke-width="8"/><path d="M260 575 C430 560 600 515 760 430 C875 370 950 300 990 240" fill="none" stroke="#f4b400" stroke-width="8"/><path d="M260 300 C360 410 450 475 560 500 C690 530 810 490 990 320" fill="none" stroke="#06111f" stroke-width="9"/><circle cx="620" cy="505" r="10" fill="#b91c1c"/><line x1="620" y1="505" x2="620" y2="590" stroke="#b91c1c" stroke-width="3"/><text x="360" y="285" font-family="Arial" font-size="20" font-weight="700" fill="#1f4e79">INDUCED DRAG</text><text x="820" y="290" font-family="Arial" font-size="20" font-weight="700" fill="#f4b400">PARASITE DRAG</text><text x="745" y="470" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">TOTAL DRAG</text><text x="620" y="615" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#b91c1c">MINIMUM DRAG / BEST L/D</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">Induced drag falls with speed; parasite drag rises. Their sum produces the total-drag curve.</text></svg>