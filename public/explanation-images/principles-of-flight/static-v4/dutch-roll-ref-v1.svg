<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">DUTCH ROLL</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><line x1="130" y1="500" x2="1070" y2="500" stroke="#d7e0ea" stroke-width="3"/><path d="M170 410 C270 325 360 500 455 420 C550 345 650 495 745 420 C840 350 920 470 1030 410" fill="none" stroke="#1f4e79" stroke-width="7"/><path d="M180 300 C275 360 365 250 455 315 C550 375 650 255 745 315 C835 375 920 275 1030 330" fill="none" stroke="#f4b400" stroke-width="7"/><text x="260" y="255" font-family="Arial" font-size="21" font-weight="800" fill="#f4b400">YAW OSCILLATION</text><text x="260" y="545" font-family="Arial" font-size="21" font-weight="800" fill="#1f4e79">ROLL OSCILLATION</text><g transform="translate(600 405)"><path d="M-150 0 L-50 -24 L75 -20 L150 0 L75 20 L-50 24Z" fill="#f8fafc" stroke="#06111f" stroke-width="6"/><line x1="0" y1="-75" x2="0" y2="75" stroke="#06111f" stroke-width="5"/></g><text x="600" y="615" text-anchor="middle" font-family="Arial" font-size="20" fill="#64748b">Dutch roll is a coupled yaw-and-roll oscillation associated with directional and lateral stability.</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">The diagram shows coupled yaw and roll rather than treating Dutch roll as a pure motion about one axis.</text></svg>