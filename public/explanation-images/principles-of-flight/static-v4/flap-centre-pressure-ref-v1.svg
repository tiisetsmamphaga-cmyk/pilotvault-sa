<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="gold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">FLAPS AND CENTRE OF PRESSURE</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><line x1="600" y1="195" x2="600" y2="545" stroke="#d7e0ea" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="310" y="220" text-anchor="middle" font-size="22" font-weight="800" fill="#06111f">FLAPS RETRACTED</text><path d="M115 390 C180 330 360 330 510 382 C545 394 575 405 590 415 C490 430 330 440 210 438 C160 437 128 420 115 390Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><circle cx="335" cy="415" r="12" fill="#1f4e79"/><line x1="335" y1="415" x2="335" y2="290" stroke="#1f4e79" stroke-width="7"/><text x="335" y="270" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e79">CENTRE OF PRESSURE</text><text x="890" y="220" text-anchor="middle" font-size="22" font-weight="800" fill="#06111f">TRAILING-EDGE FLAPS LOWERED</text><path d="M645 390 C710 330 890 330 1010 380 C1035 390 1050 398 1060 405 C975 420 850 430 745 430 C695 428 660 415 645 390Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><path d="M995 405 L1110 465 L1090 500 L970 432Z" fill="#f4b400" stroke="#06111f" stroke-width="4"/><circle cx="935" cy="420" r="12" fill="#1f4e79"/><line x1="935" y1="420" x2="935" y2="290" stroke="#1f4e79" stroke-width="7"/><text x="935" y="270" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e79">CENTRE OF PRESSURE</text><line x1="365" y1="520" x2="900" y2="520" stroke="#f4b400" stroke-width="8" marker-end="url(#gold)"/><text x="635" y="500" text-anchor="middle" font-size="20" font-weight="800" fill="#06111f">INITIAL CP SHIFT — GENERALLY AFT</text><text x="600" y="585" text-anchor="middle" font-size="20" fill="#64748b">The diagram shows the question-bank relationship only; it does not assume one universal aircraft pitching response.</text></g><text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">PilotVault POF: when lowering trailing-edge flaps, the initial centre-of-pressure movement is generally aft.</text></svg>