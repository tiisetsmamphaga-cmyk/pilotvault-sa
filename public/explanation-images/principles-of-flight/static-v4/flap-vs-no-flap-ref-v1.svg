<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">FLAPLESS VS FULL-FLAP APPROACH</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><line x1="100" y1="560" x2="1100" y2="560" stroke="#64748b" stroke-width="4"/><text x="315" y="215" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#06111f">FLAPLESS APPROACH</text><line x1="140" y1="355" x2="490" y2="560" stroke="#1f4e79" stroke-width="7"/><g transform="translate(290 420) rotate(8)"><path d="M-115 0 L-45 -20 L70 -18 L115 0 L70 18 L-45 20Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/></g><text x="315" y="615" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#b91c1c">HIGHER NOSE ATTITUDE</text><text x="885" y="215" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#06111f">FULL-FLAP APPROACH</text><line x1="710" y1="300" x2="1050" y2="560" stroke="#f4b400" stroke-width="7"/><g transform="translate(845 405) rotate(-2)"><path d="M-115 0 L-45 -20 L70 -18 L115 0 L70 18 L-45 20Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><path d="M55 12 L115 38" stroke="#f4b400" stroke-width="10"/></g><text x="885" y="615" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#1f4e79">LOWER NOSE ATTITUDE / STEEPER PATH</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">The POF question bank states that a flapless approach requires a higher nose position than the normal full-flap approach.</text></svg>