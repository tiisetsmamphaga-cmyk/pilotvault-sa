<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">FOWLER FLAP</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><text x="320" y="215" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#06111f">RETRACTED</text><path d="M120 400 C180 320 390 315 565 385 C595 397 620 408 640 418 C510 432 330 442 210 438 C160 436 130 425 120 400Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><line x1="520" y1="420" x2="640" y2="418" stroke="#06111f" stroke-width="4"/><text x="860" y="215" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#06111f">EXTENDED</text><path d="M625 390 C680 320 850 315 980 365 C1005 375 1025 385 1045 397 C930 410 790 420 695 418 C660 416 635 407 625 390Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><path d="M960 392 L1085 450 L1060 485 L930 420Z" fill="#f4b400" stroke="#06111f" stroke-width="4"/><line x1="970" y1="455" x2="1090" y2="520" stroke="#f4b400" stroke-width="7" marker-end="url(#y)"/><text x="940" y="555" text-anchor="middle" font-family="Arial" font-size="19" font-weight="800" fill="#f4b400">MOVES REARWARD AND DOWN</text><line x1="635" y1="575" x2="1090" y2="575" stroke="#06111f" stroke-width="3"/><text x="860" y="610" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#06111f">EFFECTIVE WING AREA AND CAMBER INCREASE</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">A Fowler flap slides rearward as it deflects, increasing wing area and camber to produce more low-speed lift.</text></svg>