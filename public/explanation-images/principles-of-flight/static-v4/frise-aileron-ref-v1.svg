<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">FRISE AILERON</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><text x="330" y="210" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">NEUTRAL</text><path d="M120 390 C190 335 390 335 525 380 L610 390 L525 410 C390 430 190 430 120 390Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><line x1="500" y1="375" x2="500" y2="415" stroke="#64748b" stroke-width="4"/><circle cx="525" cy="395" r="9" fill="#f4b400"/><text x="525" y="455" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">HINGE AXIS SLIGHTLY AFT OF AILERON LEADING EDGE</text><text x="880" y="210" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">AILERON RAISED</text><path d="M670 390 C735 335 900 335 1010 375 L1080 330 L1095 360 L1015 410 C900 430 735 430 670 390Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><circle cx="1015" cy="388" r="9" fill="#f4b400"/><path d="M1005 390 L965 430 L1000 438" fill="#f4b400" stroke="#06111f" stroke-width="4"/><text x="855" y="495" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">THE AILERON NOSE PROJECTS BELOW THE WING</text><text x="855" y="530" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">This adds drag on the down-going wing side and helps reduce adverse aileron yaw.</text><text x="600" y="610" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#64748b">Frise geometry uses a hinge line slightly aft of the aileron's leading edge.</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">Diagram is an original PilotVault teaching redraw based on the POF question-bank description.</text></svg>