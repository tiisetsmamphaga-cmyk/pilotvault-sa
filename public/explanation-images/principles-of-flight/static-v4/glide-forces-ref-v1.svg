<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker><marker id="y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">FORCES IN A POWER-OFF GLIDE</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><line x1="180" y1="330" x2="1020" y2="585" stroke="#d7e0ea" stroke-width="5"/><g transform="rotate(17 610 455)" stroke="#06111f" fill="none"><path d="M430 455 L520 425 L710 425 L820 455 L710 480 L510 480 Z" stroke-width="6"/><path d="M590 425 L635 375 L670 425" stroke-width="5"/></g><circle cx="610" cy="455" r="9" fill="#06111f"/><line x1="610" y1="455" x2="525" y2="190" stroke="#f4b400" stroke-width="9" marker-end="url(#y)"/><text x="445" y="190" font-family="Arial" font-size="22" font-weight="800" fill="#06111f">LIFT</text><line x1="610" y1="455" x2="330" y2="370" stroke="#1f4e79" stroke-width="9" marker-end="url(#b)"/><text x="205" y="350" font-family="Arial" font-size="22" font-weight="800" fill="#1f4e79">DRAG</text><line x1="610" y1="455" x2="610" y2="625" stroke="#64748b" stroke-width="9" marker-end="url(#g)"/><text x="650" y="630" font-family="Arial" font-size="22" font-weight="800" fill="#64748b">WEIGHT</text><line x1="610" y1="455" x2="860" y2="530" stroke="#06111f" stroke-width="4" stroke-dasharray="10 8"/><text x="865" y="565" font-family="Arial" font-size="18" font-weight="700" fill="#64748b">GLIDE PATH</text><path d="M785 510 A165 165 0 0 0 815 455" fill="none" stroke="#f4b400" stroke-width="5"/><text x="825" y="480" font-family="Arial" font-size="20" font-weight="700" fill="#f4b400">GLIDE ANGLE</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">With no thrust, weight is balanced by the resultant of lift and drag; best L/D gives the shallowest glide angle through the air mass.</text></svg>