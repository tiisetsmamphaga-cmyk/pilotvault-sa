<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">INTERNATIONAL STANDARD ATMOSPHERE</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><g font-family="Arial"><line x1="260" y1="565" x2="260" y2="225" stroke="#06111f" stroke-width="5"/><line x1="235" y1="565" x2="285" y2="565" stroke="#06111f" stroke-width="5"/><line x1="235" y1="395" x2="285" y2="395" stroke="#06111f" stroke-width="4"/><line x1="235" y1="225" x2="285" y2="225" stroke="#06111f" stroke-width="4"/><text x="220" y="570" text-anchor="end" font-size="19" font-weight="700" fill="#64748b">SEA LEVEL</text><text x="220" y="400" text-anchor="end" font-size="18" fill="#64748b">≈18 000 ft</text><text x="220" y="230" text-anchor="end" font-size="18" fill="#64748b">36 090 ft</text><path d="M330 555 L560 240" stroke="#1f4e79" stroke-width="8" fill="none"/><text x="470" y="330" font-size="20" font-weight="800" fill="#1f4e79">TEMPERATURE DECREASES</text><text x="470" y="360" font-size="18" fill="#64748b">≈ 1.98°C per 1 000 ft</text><rect x="650" y="230" width="410" height="285" rx="14" fill="#f8fafc" stroke="#d7e0ea"/><text x="855" y="270" text-anchor="middle" font-size="23" font-weight="800" fill="#06111f">STANDARD SEA-LEVEL VALUES</text><text x="700" y="325" font-size="21" font-weight="700" fill="#64748b">Temperature</text><text x="1015" y="325" text-anchor="end" font-size="24" font-weight="800" fill="#06111f">+15°C</text><text x="700" y="375" font-size="21" font-weight="700" fill="#64748b">Pressure</text><text x="1015" y="375" text-anchor="end" font-size="24" font-weight="800" fill="#06111f">≈1013 hPa</text><text x="700" y="425" font-size="21" font-weight="700" fill="#64748b">Density</text><text x="1015" y="425" text-anchor="end" font-size="24" font-weight="800" fill="#06111f">1.225 kg/m³</text><text x="855" y="475" text-anchor="middle" font-size="19" fill="#64748b">Density decreases with increasing altitude.</text><text x="600" y="600" text-anchor="middle" font-size="21" font-weight="800" fill="#06111f">ISA PROVIDES A STANDARD REFERENCE FOR AIRCRAFT PERFORMANCE</text></g><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">PilotVault values: MSL +15°C, lapse rate 1.98°C/1 000 ft, sea-level density 1.225 kg/m³.</text></svg>