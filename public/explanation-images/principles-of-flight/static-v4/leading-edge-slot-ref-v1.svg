<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker><marker id="y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">LEADING-EDGE SLOT</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><path d="M360 440 C430 330 700 325 1015 410 C1050 420 1075 430 1095 440 C955 452 760 462 575 462 C455 460 390 452 360 440Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><path d="M210 405 C250 350 325 345 385 375 C405 385 415 395 420 408 C355 410 292 420 235 435 C220 428 212 418 210 405Z" fill="#f4b400" stroke="#06111f" stroke-width="5"/><path d="M285 455 C330 430 370 410 420 398 C480 382 540 365 625 355" fill="none" stroke="#1f4e79" stroke-width="9" marker-end="url(#b)"/><path d="M145 500 C205 495 245 482 285 455" fill="none" stroke="#1f4e79" stroke-width="7" marker-end="url(#b)"/><text x="255" y="320" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#06111f">SLAT</text><line x1="275" y1="330" x2="300" y2="365" stroke="#64748b" stroke-width="2"/><text x="440" y="520" font-family="Arial" font-size="21" font-weight="800" fill="#1f4e79">ENERGISED AIRFLOW THROUGH SLOT</text><line x1="780" y1="330" x2="1000" y2="330" stroke="#f4b400" stroke-width="7" marker-end="url(#y)"/><text x="890" y="300" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#f4b400">ATTACHED FLOW MAINTAINED LONGER</text><text x="600" y="590" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">A slot directs higher-energy air over the upper surface and delays flow separation.</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">This allows the wing to operate at a higher angle of attack before reaching the stall.</text></svg>