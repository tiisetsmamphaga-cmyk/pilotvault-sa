<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker><marker id="y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">PRESSURE DISTRIBUTION AND LIFT</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><path d="M220 430 C300 310 610 305 965 405 C1020 420 1065 435 1090 448 C920 460 675 472 445 470 C325 468 245 452 220 430Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><g stroke="#1f4e79" stroke-width="5" marker-end="url(#b)"><line x1="300" y1="295" x2="320" y2="355"/><line x1="420" y1="255" x2="440" y2="330"/><line x1="550" y1="235" x2="560" y2="320"/><line x1="690" y1="245" x2="690" y2="330"/><line x1="830" y1="280" x2="820" y2="355"/></g><g stroke="#f4b400" stroke-width="5" marker-end="url(#y)"><line x1="330" y1="585" x2="340" y2="470"/><line x1="500" y1="600" x2="505" y2="475"/><line x1="675" y1="600" x2="675" y2="475"/><line x1="850" y1="585" x2="845" y2="468"/></g><text x="600" y="205" text-anchor="middle" font-family="Arial" font-size="23" font-weight="800" fill="#1f4e79">LOWER STATIC PRESSURE ABOVE</text><text x="600" y="635" text-anchor="middle" font-family="Arial" font-size="23" font-weight="800" fill="#f4b400">HIGHER STATIC PRESSURE BELOW</text><line x1="1040" y1="520" x2="1040" y2="285" stroke="#06111f" stroke-width="10" marker-end="url(#y)"/><text x="1065" y="275" font-family="Arial" font-size="22" font-weight="800" fill="#06111f">LIFT</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">The pressure difference across the wing contributes to the net aerodynamic force that produces lift.</text></svg>