<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">AIRSPEED EFFECT ON LIFT AND DRAG</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><line x1="170" y1="570" x2="1030" y2="570" stroke="#06111f" stroke-width="4"/><line x1="170" y1="570" x2="170" y2="220" stroke="#06111f" stroke-width="4"/><path d="M220 540 C390 500 560 430 720 335 C820 275 900 235 990 205" fill="none" stroke="#1f4e79" stroke-width="8"/><circle cx="420" cy="490" r="9" fill="#f4b400"/><circle cx="780" cy="300" r="9" fill="#f4b400"/><line x1="420" y1="490" x2="420" y2="570" stroke="#64748b" stroke-width="3" stroke-dasharray="8 8"/><line x1="780" y1="300" x2="780" y2="570" stroke="#64748b" stroke-width="3" stroke-dasharray="8 8"/><text x="420" y="610" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#06111f">V</text><text x="780" y="610" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#06111f">2V</text><text x="390" y="455" font-family="Arial" font-size="21" font-weight="700" fill="#1f4e79">1 × LIFT / DRAG</text><text x="800" y="285" font-family="Arial" font-size="21" font-weight="700" fill="#1f4e79">4 × LIFT / DRAG</text><text x="600" y="645" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#64748b">AT CONSTANT AoA: AERODYNAMIC FORCE ∝ V²</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">If airspeed doubles, lift and drag become four times as large when angle of attack and other factors are unchanged.</text></svg>