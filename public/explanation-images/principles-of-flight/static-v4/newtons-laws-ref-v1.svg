<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker><marker id="y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">NEWTON'S LAWS IN FLIGHT</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><line x1="415" y1="190" x2="415" y2="585" stroke="#d7e0ea" stroke-width="2"/><line x1="785" y1="190" x2="785" y2="585" stroke="#d7e0ea" stroke-width="2"/><g font-family="Arial"><text x="230" y="215" text-anchor="middle" font-size="24" font-weight="800" fill="#06111f">1ST LAW</text><text x="230" y="250" text-anchor="middle" font-size="19" font-weight="700" fill="#64748b">EQUILIBRIUM / INERTIA</text><line x1="125" y1="385" x2="335" y2="385" stroke="#1f4e79" stroke-width="8" marker-end="url(#b)"/><line x1="335" y1="435" x2="125" y2="435" stroke="#1f4e79" stroke-width="8" marker-end="url(#b)"/><text x="230" y="330" text-anchor="middle" font-size="18" fill="#06111f">Balanced opposing forces</text><text x="230" y="500" text-anchor="middle" font-size="18" fill="#64748b">No net force → no acceleration</text><text x="600" y="215" text-anchor="middle" font-size="24" font-weight="800" fill="#06111f">2ND LAW</text><text x="600" y="250" text-anchor="middle" font-size="19" font-weight="700" fill="#64748b">ACCELERATION</text><rect x="510" y="370" width="110" height="70" rx="8" fill="#f8fafc" stroke="#06111f" stroke-width="4"/><line x1="620" y1="405" x2="735" y2="405" stroke="#f4b400" stroke-width="9" marker-end="url(#y)"/><text x="600" y="330" text-anchor="middle" font-size="18" fill="#06111f">Unbalanced force changes velocity</text><text x="600" y="500" text-anchor="middle" font-size="18" fill="#64748b">Net force → acceleration</text><text x="970" y="215" text-anchor="middle" font-size="24" font-weight="800" fill="#06111f">3RD LAW</text><text x="970" y="250" text-anchor="middle" font-size="19" font-weight="700" fill="#64748b">ACTION AND REACTION</text><path d="M845 395 C895 350 1015 350 1090 390 C1030 405 920 415 845 395Z" fill="#f8fafc" stroke="#06111f" stroke-width="4"/><line x1="950" y1="410" x2="950" y2="515" stroke="#1f4e79" stroke-width="8" marker-end="url(#b)"/><line x1="990" y1="385" x2="990" y2="280" stroke="#f4b400" stroke-width="8" marker-end="url(#y)"/><text x="885" y="545" font-size="17" fill="#1f4e79">AIR DEFLECTED DOWN</text><text x="1010" y="300" font-size="17" fill="#f4b400">REACTION UP</text><text x="970" y="585" text-anchor="middle" font-size="18" fill="#64748b">Equal and opposite reaction</text></g><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">PilotVault question-bank terms: First Law — equilibrium; Second Law — acceleration; Third Law — action and reaction.</text></svg>