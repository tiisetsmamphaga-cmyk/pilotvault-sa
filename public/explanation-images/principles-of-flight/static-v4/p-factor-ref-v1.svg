<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">ASYMMETRIC PROPELLER LOADING — P-FACTOR</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker><marker id="y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b91c1c"/></marker></defs><g transform="translate(370 405)"><circle r="135" fill="#f8fafc" stroke="#d7e0ea" stroke-width="4"/><line x1="0" y1="-115" x2="0" y2="115" stroke="#06111f" stroke-width="18"/><line x1="-115" y1="0" x2="115" y2="0" stroke="#06111f" stroke-width="18"/><circle r="20" fill="#f4b400"/></g><path d="M220 235 L285 300" stroke="#1f4e79" stroke-width="10" marker-end="url(#b)"/><text x="160" y="215" font-family="Arial" font-size="20" font-weight="800" fill="#1f4e79">UP-GOING BLADE</text><text x="160" y="245" font-family="Arial" font-size="18" fill="#64748b">lower effective AoA</text><path d="M520 235 L455 300" stroke="#f4b400" stroke-width="12" marker-end="url(#y)"/><text x="520" y="205" font-family="Arial" font-size="20" font-weight="800" fill="#f4b400">DOWN-GOING BLADE</text><text x="520" y="235" font-family="Arial" font-size="18" fill="#64748b">higher effective AoA → more thrust</text><g transform="translate(835 410)"><path d="M-150 0 L-60 -25 L85 -20 L150 0 L85 20 L-60 25Z" fill="#f8fafc" stroke="#06111f" stroke-width="6"/><path d="M40 -80 A125 125 0 0 1 40 80" fill="none" stroke="#b91c1c" stroke-width="8" marker-end="url(#r)"/></g><text x="835" y="565" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#b91c1c">YAWING MOMENT</text><text x="600" y="625" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">At high power and high AoA, the descending blade produces more thrust than the ascending blade.</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">P-factor is asymmetric propeller loading; on a typical clockwise-turning propeller it contributes to a left yawing tendency.</text></svg>