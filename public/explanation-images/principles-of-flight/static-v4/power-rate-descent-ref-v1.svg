<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker><marker id="gold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">POWER AND RATE OF DESCENT</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><line x1="600" y1="190" x2="600" y2="590" stroke="#d7e0ea" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="315" y="215" text-anchor="middle" font-size="22" font-weight="800" fill="#06111f">LOWER POWER — SAME AIRSPEED</text><line x1="125" y1="300" x2="515" y2="525" stroke="#1f4e79" stroke-width="8" marker-end="url(#blue)"/><text x="315" y="405" text-anchor="middle" font-size="19" font-weight="700" fill="#1f4e79">STEEPER DESCENT PATH</text><line x1="505" y1="300" x2="505" y2="510" stroke="#f4b400" stroke-width="8" marker-end="url(#gold)"/><text x="475" y="365" text-anchor="end" font-size="18" font-weight="700" fill="#f4b400">GREATER</text><text x="475" y="390" text-anchor="end" font-size="18" font-weight="700" fill="#f4b400">RATE OF DESCENT</text><text x="885" y="215" text-anchor="middle" font-size="22" font-weight="800" fill="#06111f">MORE POWER — SAME AIRSPEED</text><line x1="685" y1="350" x2="1070" y2="500" stroke="#1f4e79" stroke-width="8" marker-end="url(#blue)"/><text x="880" y="415" text-anchor="middle" font-size="19" font-weight="700" fill="#1f4e79">SHALLOWER DESCENT PATH</text><line x1="1060" y1="350" x2="1060" y2="485" stroke="#f4b400" stroke-width="8" marker-end="url(#gold)"/><text x="1030" y="390" text-anchor="end" font-size="18" font-weight="700" fill="#f4b400">LOWER RATE</text><text x="1030" y="415" text-anchor="end" font-size="18" font-weight="700" fill="#f4b400">OF DESCENT</text><text x="600" y="610" text-anchor="middle" font-size="21" font-weight="800" fill="#06111f">AT CONSTANT AIRSPEED: REDUCE POWER → RATE OF DESCENT INCREASES</text></g><text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">The PilotVault POF question bank states that reducing power during a descent while keeping speed constant increases rate of descent.</text></svg>