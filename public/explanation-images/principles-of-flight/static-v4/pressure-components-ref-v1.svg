<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">STATIC, DYNAMIC AND TOTAL PRESSURE</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><g font-family="Arial"><text x="285" y="220" text-anchor="middle" font-size="22" font-weight="800" fill="#06111f">AIRFLOW</text><g stroke="#1f4e79" stroke-width="6" marker-end="url(#b)"><line x1="120" y1="300" x2="475" y2="300"/><line x1="120" y1="350" x2="475" y2="350"/><line x1="120" y1="400" x2="475" y2="400"/><line x1="120" y1="450" x2="475" y2="450"/></g><path d="M515 300 L760 300 L760 350 L620 350 L620 510 L570 510 L570 350 L515 350Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><circle cx="515" cy="325" r="9" fill="#f4b400"/><text x="500" y="275" text-anchor="end" font-size="18" font-weight="700" fill="#06111f">PITOT OPENING</text><text x="695" y="330" text-anchor="middle" font-size="18" font-weight="700" fill="#06111f">TOTAL / PITOT PRESSURE</text><circle cx="665" cy="350" r="7" fill="#64748b"/><text x="785" y="380" font-size="18" font-weight="700" fill="#64748b">STATIC PORT</text><line x1="775" y1="373" x2="675" y2="353" stroke="#64748b" stroke-width="2"/><rect x="825" y="265" width="285" height="90" rx="12" fill="#f8fafc" stroke="#d7e0ea"/><text x="968" y="300" text-anchor="middle" font-size="20" font-weight="800" fill="#06111f">STATIC PRESSURE (S)</text><text x="968" y="330" text-anchor="middle" font-size="17" fill="#64748b">ambient pressure</text><rect x="825" y="385" width="285" height="90" rx="12" fill="#f8fafc" stroke="#d7e0ea"/><text x="968" y="420" text-anchor="middle" font-size="20" font-weight="800" fill="#06111f">DYNAMIC PRESSURE (q)</text><text x="968" y="450" text-anchor="middle" font-size="17" fill="#64748b">pressure due to motion</text><text x="600" y="550" text-anchor="middle" font-size="23" font-weight="800" fill="#06111f">Pₜ = Pₛ + q  •  q = Pₜ − Pₛ  •  q = ½ρV²</text><text x="600" y="590" text-anchor="middle" font-size="19" fill="#64748b">The airspeed indicator senses the difference between total/pitot pressure and static pressure.</text></g><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Dynamic pressure is the pressure component associated with the aircraft's motion through the air.</text></svg>