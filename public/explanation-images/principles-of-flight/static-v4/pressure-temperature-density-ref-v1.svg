<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">PRESSURE, TEMPERATURE AND DENSITY</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><line x1="600" y1="195" x2="600" y2="570" stroke="#d7e0ea" stroke-width="2"/><g font-family="Arial"><text x="315" y="220" text-anchor="middle" font-size="21" font-weight="800" fill="#06111f">PRESSURE HELD CONSTANT</text><rect x="140" y="290" width="160" height="110" rx="12" fill="#f8fafc" stroke="#d7e0ea"/><text x="220" y="335" text-anchor="middle" font-size="20" font-weight="700" fill="#06111f">TEMPERATURE</text><text x="220" y="375" text-anchor="middle" font-size="30" font-weight="800" fill="#b91c1c">↑</text><line x1="315" y1="345" x2="420" y2="345" stroke="#f4b400" stroke-width="7" marker-end="url(#g)"/><rect x="430" y="290" width="160" height="110" rx="12" fill="#f8fafc" stroke="#d7e0ea"/><text x="510" y="335" text-anchor="middle" font-size="20" font-weight="700" fill="#06111f">DENSITY</text><text x="510" y="375" text-anchor="middle" font-size="30" font-weight="800" fill="#1f4e79">↓</text><text x="315" y="465" text-anchor="middle" font-size="20" fill="#64748b">Warmer air expands and becomes less dense.</text><text x="885" y="220" text-anchor="middle" font-size="21" font-weight="800" fill="#06111f">TEMPERATURE HELD CONSTANT</text><rect x="710" y="290" width="160" height="110" rx="12" fill="#f8fafc" stroke="#d7e0ea"/><text x="790" y="335" text-anchor="middle" font-size="20" font-weight="700" fill="#06111f">PRESSURE</text><text x="790" y="375" text-anchor="middle" font-size="30" font-weight="800" fill="#b91c1c">↑</text><line x1="885" y1="345" x2="990" y2="345" stroke="#f4b400" stroke-width="7" marker-end="url(#g)"/><rect x="1000" y="290" width="160" height="110" rx="12" fill="#f8fafc" stroke="#d7e0ea"/><text x="1080" y="335" text-anchor="middle" font-size="20" font-weight="700" fill="#06111f">DENSITY</text><text x="1080" y="375" text-anchor="middle" font-size="30" font-weight="800" fill="#1f4e79">↑</text><text x="885" y="465" text-anchor="middle" font-size="20" fill="#64748b">Greater pressure means more air mass in a given volume.</text><text x="600" y="590" text-anchor="middle" font-size="21" font-weight="800" fill="#06111f">HIGHER TEMPERATURE → LOWER DENSITY  •  HIGHER PRESSURE → HIGHER DENSITY</text></g><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Relationships shown match the PilotVault POF question bank.</text></svg>