<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">FLIGHT PATH AND RELATIVE AIRFLOW</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><g transform="translate(80 0)"><text x="140" y="225" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">CLIMB</text><line x1="235" y1="315" x2="45" y2="420" stroke="#64748b" stroke-width="6" marker-end="url(#g)"/><line x1="45" y1="570" x2="235" y2="465" stroke="#1f4e79" stroke-width="6" marker-end="url(#b)"/></g><g transform="translate(450 0)"><text x="150" y="225" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">LEVEL FLIGHT</text><line x1="250" y1="380" x2="50" y2="380" stroke="#64748b" stroke-width="6" marker-end="url(#g)"/><line x1="50" y1="480" x2="250" y2="480" stroke="#1f4e79" stroke-width="6" marker-end="url(#b)"/></g><g transform="translate(825 0)"><text x="140" y="225" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">DESCENT</text><line x1="235" y1="420" x2="45" y2="315" stroke="#64748b" stroke-width="6" marker-end="url(#g)"/><line x1="45" y1="465" x2="235" y2="570" stroke="#1f4e79" stroke-width="6" marker-end="url(#b)"/></g><text x="600" y="600" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#64748b">GREY = FLIGHT PATH</text><text x="600" y="635" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#1f4e79">BLUE = RELATIVE AIRFLOW</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="20" fill="#64748b">Relative airflow is parallel and opposite to the flight path through the air mass.</text></svg>