<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker><marker id="y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">RUDDER AND YAW CONTROL</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><g transform="translate(600 405)"><path d="M-290 0 L-80 -55 L145 -40 L300 0 L145 40 L-80 55Z" fill="#f8fafc" stroke="#06111f" stroke-width="6"/><path d="M-80 -55 L-150 -140 L-100 -35" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><path d="M-150 -140 L-185 -100 L-100 -35Z" fill="#f4b400" stroke="#06111f" stroke-width="4"/></g><text x="360" y="235" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">RUDDER DEFLECTED RIGHT</text><line x1="445" y1="250" x2="420" y2="295" stroke="#64748b" stroke-width="2"/><line x1="410" y1="300" x2="300" y2="300" stroke="#1f4e79" stroke-width="8" marker-end="url(#b)"/><text x="235" y="275" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#1f4e79">TAIL MOVES LEFT</text><path d="M655 520 A200 160 0 0 0 875 365" fill="none" stroke="#f4b400" stroke-width="8" marker-end="url(#y)"/><text x="915" y="350" font-family="Arial" font-size="22" font-weight="800" fill="#06111f">NOSE YAWS RIGHT</text><text x="600" y="610" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#64748b">Right rudder creates a side force at the tail, moving the tail left and the nose right.</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">The rudder controls yaw about the vertical axis; by itself it is not the primary turning control.</text></svg>