<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">FORM DRAG AND SKIN FRICTION</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><text x="300" y="220" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#06111f">FORM DRAG</text><g stroke="#1f4e79" stroke-width="5" marker-end="url(#b)"><line x1="110" y1="350" x2="235" y2="350"/><line x1="110" y1="410" x2="235" y2="410"/><line x1="110" y1="470" x2="235" y2="470"/></g><rect x="260" y="290" width="85" height="240" fill="#f8fafc" stroke="#06111f" stroke-width="6"/><path d="M345 310 C440 325 470 365 470 410 C470 455 440 495 345 510" fill="none" stroke="#64748b" stroke-width="4" stroke-dasharray="10 8"/><text x="350" y="575" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Large frontal area → greater pressure/form drag</text><text x="855" y="220" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#06111f">SKIN FRICTION</text><rect x="650" y="405" width="420" height="35" fill="#f8fafc" stroke="#06111f" stroke-width="4"/><g stroke="#1f4e79" stroke-width="5" marker-end="url(#b)"><line x1="630" y1="300" x2="1025" y2="300"/><line x1="630" y1="350" x2="1025" y2="350"/></g><path d="M650 405 l20 -10 l20 10 l20 -8 l20 8 l20 -9 l20 9 l20 -7 l20 7 l20 -9 l20 9 l20 -7 l20 7 l20 -8 l20 8 l20 -9 l20 9 l20 -7 l20 7 l20 -9 l20 9" fill="none" stroke="#f4b400" stroke-width="4"/><text x="860" y="500" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Air rubbing over the surface creates skin-friction drag</text><text x="860" y="535" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Rough or dirty surfaces increase it</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">Parasite drag includes form drag, skin friction and interference drag.</text></svg>