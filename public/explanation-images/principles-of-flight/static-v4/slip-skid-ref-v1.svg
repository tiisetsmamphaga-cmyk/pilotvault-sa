<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">SLIP / SKID INDICATOR</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><g transform="translate(180 250)"><rect width="840" height="230" rx="24" fill="#f8fafc" stroke="#d7e0ea"/><path d="M80 135 Q210 40 340 135" fill="none" stroke="#06111f" stroke-width="8"/><path d="M365 135 Q495 40 625 135" fill="none" stroke="#06111f" stroke-width="8"/><path d="M650 135 Q780 40 910 135" fill="none" stroke="#06111f" stroke-width="8"/><circle cx="160" cy="115" r="25" fill="#f4b400"/><circle cx="495" cy="115" r="25" fill="#1f4e79"/><circle cx="830" cy="115" r="25" fill="#b91c1c"/><line x1="455" y1="85" x2="455" y2="145" stroke="#06111f" stroke-width="5"/><line x1="535" y1="85" x2="535" y2="145" stroke="#06111f" stroke-width="5"/></g><text x="340" y="530" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#f4b400">BALL LEFT = SLIP IN A LEFT TURN</text><text x="600" y="570" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#1f4e79">BALL CENTRED = COORDINATED</text><text x="860" y="610" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#b91c1c">BALL OUTSIDE = SKID</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">The PilotVault question bank specifically identifies a ball left of centre in a left turn as a slipping turn.</text></svg>