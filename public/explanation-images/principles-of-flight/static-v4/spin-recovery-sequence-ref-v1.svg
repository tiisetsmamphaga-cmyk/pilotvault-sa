<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">SPIN RECOVERY — CONTROL SEQUENCE</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><circle cx="340" cy="370" r="105" fill="#f8fafc" stroke="#d7e0ea" stroke-width="4"/><circle cx="860" cy="370" r="105" fill="#f8fafc" stroke="#d7e0ea" stroke-width="4"/><circle cx="340" cy="370" r="55" fill="#06111f"/><circle cx="860" cy="370" r="55" fill="#06111f"/><text x="340" y="382" text-anchor="middle" font-family="Arial" font-size="36" font-weight="800" fill="#f4b400">1</text><text x="860" y="382" text-anchor="middle" font-family="Arial" font-size="36" font-weight="800" fill="#f4b400">2</text><text x="340" y="525" text-anchor="middle" font-family="Arial" font-size="28" font-weight="800" fill="#06111f">RUDDER FIRST</text><text x="860" y="525" text-anchor="middle" font-family="Arial" font-size="28" font-weight="800" fill="#06111f">ELEVATOR SECOND</text><path d="M500 370 H700" stroke="#f4b400" stroke-width="8"/><path d="M700 370 l-25 -15 v30 z" fill="#f4b400"/><text x="600" y="585" text-anchor="middle" font-family="Arial" font-size="21" fill="#64748b">For the PilotVault POF question, the tested point is the order: rudder is applied before elevator.</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">This graphic intentionally shows only the source-supported sequence and does not add aircraft-specific recovery technique.</text></svg>