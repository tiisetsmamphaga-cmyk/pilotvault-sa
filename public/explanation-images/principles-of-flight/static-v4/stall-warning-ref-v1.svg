<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">APPROACHING THE STALL</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><path d="M170 390 C235 325 455 325 640 375 C680 386 720 400 755 418 C630 430 470 438 330 436 C245 434 195 420 170 390Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><path d="M140 320 C320 270 520 280 700 330" fill="none" stroke="#1f4e79" stroke-width="4"/><path d="M140 295 C330 240 540 250 710 305" fill="none" stroke="#1f4e79" stroke-width="4"/><path d="M640 320 C690 300 720 345 755 320 C790 295 820 350 860 320" fill="none" stroke="#b91c1c" stroke-width="5"/><text x="850" y="275" font-family="Arial" font-size="20" font-weight="800" fill="#b91c1c">BUFFET / FLOW SEPARATION</text><text x="835" y="420" font-family="Arial" font-size="20" font-weight="800" fill="#06111f">CONTROL EFFECTIVENESS ↓</text><path d="M910 455 L1000 455" stroke="#f4b400" stroke-width="8"/><path d="M955 410 L955 500" stroke="#f4b400" stroke-width="8"/><text x="955" y="555" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">stall warning / buffet cues</text><text x="600" y="620" text-anchor="middle" font-family="Arial" font-size="20" fill="#64748b">As the critical AoA is approached, separation increases and control effectiveness deteriorates.</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">A stall is caused by exceeding the critical angle of attack; warning cues may include buffet and reduced control effectiveness.</text></svg>