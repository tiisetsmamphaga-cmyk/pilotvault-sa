<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">STATIC AND DYNAMIC STABILITY</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><line x1="150" y1="510" x2="1050" y2="510" stroke="#06111f" stroke-width="4"/><line x1="150" y1="510" x2="150" y2="220" stroke="#06111f" stroke-width="4"/><path d="M170 300 C250 420 330 230 410 350 C490 440 560 300 630 360 C700 415 770 330 835 365 C900 395 965 350 1030 370" fill="none" stroke="#1f4e79" stroke-width="7"/><line x1="150" y1="370" x2="1050" y2="370" stroke="#d7e0ea" stroke-width="2"/><text x="840" y="275" font-family="Arial" font-size="20" font-weight="700" fill="#1f4e79">DAMPED OSCILLATION</text><text x="840" y="305" font-family="Arial" font-size="18" fill="#64748b">Positive static + positive dynamic stability</text><text x="600" y="555" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#64748b">TIME →</text><text x="90" y="365" text-anchor="middle" transform="rotate(-90 90 365)" font-family="Arial" font-size="20" font-weight="700" fill="#64748b">DISPLACEMENT</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">Static stability starts the return; dynamic stability determines whether the oscillations diminish.</text></svg>