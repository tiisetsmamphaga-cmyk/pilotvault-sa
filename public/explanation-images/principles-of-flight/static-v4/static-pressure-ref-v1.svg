<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">STATIC AIR PRESSURE</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><circle cx="600" cy="390" r="110" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><text x="600" y="382" text-anchor="middle" font-family="Arial" font-size="26" font-weight="800" fill="#06111f">OBJECT IN</text><text x="600" y="418" text-anchor="middle" font-family="Arial" font-size="26" font-weight="800" fill="#06111f">STILL AIR</text><g stroke="#1f4e79" stroke-width="8" marker-end="url(#b)"><line x1="600" y1="205" x2="600" y2="275"/><line x1="600" y1="575" x2="600" y2="505"/><line x1="415" y1="390" x2="485" y2="390"/><line x1="785" y1="390" x2="715" y2="390"/><line x1="470" y1="260" x2="520" y2="310"/><line x1="730" y1="260" x2="680" y2="310"/><line x1="470" y1="520" x2="520" y2="470"/><line x1="730" y1="520" x2="680" y2="470"/></g><text x="600" y="625" text-anchor="middle" font-family="Arial" font-size="23" font-weight="800" fill="#06111f">STATIC PRESSURE ACTS IN ALL DIRECTIONS</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Static pressure is the ambient atmospheric pressure acting on a body immersed in the air.</text></svg>