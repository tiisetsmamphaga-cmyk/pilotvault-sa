<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">POSITIVE, NEUTRAL AND NEGATIVE STABILITY</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><g font-family="Arial" text-anchor="middle"><text x="235" y="215" font-size="22" font-weight="800" fill="#06111f">POSITIVE</text><text x="600" y="215" font-size="22" font-weight="800" fill="#06111f">NEUTRAL</text><text x="965" y="215" font-size="22" font-weight="800" fill="#06111f">NEGATIVE</text></g><path d="M90 330 Q235 570 380 330" fill="none" stroke="#06111f" stroke-width="8"/><circle cx="300" cy="405" r="22" fill="#f4b400" stroke="#06111f" stroke-width="4"/><path d="M455 460 L745 460" stroke="#06111f" stroke-width="8"/><circle cx="670" cy="438" r="22" fill="#f4b400" stroke="#06111f" stroke-width="4"/><path d="M820 520 Q965 280 1110 520" fill="none" stroke="#06111f" stroke-width="8"/><circle cx="900" cy="385" r="22" fill="#f4b400" stroke="#06111f" stroke-width="4"/><text x="235" y="590" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Tends to return to original equilibrium</text><text x="600" y="590" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Remains at the new position</text><text x="965" y="590" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Moves farther from original equilibrium</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">Static stability describes the aircraft's initial tendency immediately after a disturbance.</text></svg>