<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="n" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#06111f"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker><marker id="y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">FORCES IN A STEADY CLIMB</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><line x1="210" y1="590" x2="1015" y2="355" stroke="#d7e0ea" stroke-width="5"/><g transform="rotate(-16 600 455)" stroke="#06111f" fill="none"><path d="M430 455 L520 425 L710 425 L820 455 L710 480 L510 480 Z" stroke-width="6"/><path d="M590 425 L635 375 L670 425" stroke-width="5"/></g><circle cx="610" cy="455" r="9" fill="#06111f"/><line x1="610" y1="455" x2="895" y2="372" stroke="#f4b400" stroke-width="9" marker-end="url(#y)"/><text x="930" y="350" font-family="Arial" font-size="22" font-weight="800" fill="#06111f">THRUST</text><line x1="610" y1="455" x2="340" y2="534" stroke="#1f4e79" stroke-width="9" marker-end="url(#b)"/><text x="220" y="565" font-family="Arial" font-size="22" font-weight="800" fill="#1f4e79">DRAG</text><line x1="610" y1="455" x2="530" y2="185" stroke="#f4b400" stroke-width="9" marker-end="url(#y)"/><text x="455" y="185" font-family="Arial" font-size="22" font-weight="800" fill="#06111f">LIFT</text><line x1="610" y1="455" x2="610" y2="625" stroke="#64748b" stroke-width="9" marker-end="url(#g)"/><text x="645" y="630" font-family="Arial" font-size="22" font-weight="800" fill="#64748b">WEIGHT</text><text x="825" y="540" font-family="Arial" font-size="18" font-weight="700" fill="#64748b">FLIGHT PATH</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">In a steady climb, thrust and drag act along the flight path; lift is perpendicular to it and weight remains vertical.</text></svg>