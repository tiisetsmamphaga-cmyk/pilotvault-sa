<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">PROPELLER TORQUE REACTION</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker><marker id="y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker></defs><circle cx="420" cy="410" r="125" fill="#f8fafc" stroke="#06111f" stroke-width="6"/><line x1="420" y1="300" x2="420" y2="520" stroke="#06111f" stroke-width="12"/><line x1="310" y1="410" x2="530" y2="410" stroke="#06111f" stroke-width="12"/><path d="M315 315 A150 150 0 0 1 525 315" fill="none" stroke="#1f4e79" stroke-width="9" marker-end="url(#b)"/><text x="420" y="255" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#1f4e79">PROPELLER ROTATION</text><g transform="translate(760 410)"><path d="M-175 0 L-70 -30 L90 -24 L185 0 L90 24 L-70 30Z" fill="#f8fafc" stroke="#06111f" stroke-width="6"/><line x1="0" y1="-135" x2="0" y2="135" stroke="#64748b" stroke-width="3"/><path d="M-105 100 A150 150 0 0 0 110 100" fill="none" stroke="#f4b400" stroke-width="9" marker-end="url(#y)"/></g><text x="760" y="575" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#06111f">AIRFRAME REACTS IN THE OPPOSITE ROLL DIRECTION</text><text x="600" y="625" text-anchor="middle" font-family="Arial" font-size="20" fill="#64748b">Power-induced left-turning tendency includes torque reaction; the pilot counters the tendency with appropriate control input.</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Torque reaction is an equal-and-opposite reaction to propeller rotation and contributes to the aircraft’s left-turning tendency.</text></svg>