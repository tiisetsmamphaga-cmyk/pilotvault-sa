<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">TRAILING-EDGE FLAPS</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><text x="315" y="215" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">FLAPS RETRACTED</text><path d="M130 420 C185 335 370 335 525 398 C555 410 580 420 595 428 C495 440 330 449 210 445 C165 443 140 435 130 420Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><line x1="480" y1="430" x2="595" y2="428" stroke="#64748b" stroke-width="5"/><text x="870" y="215" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">FLAPS EXTENDED</text><path d="M685 420 C740 335 925 335 1060 395 C1080 405 1095 412 1100 417 C1010 430 865 438 755 438 C715 437 693 430 685 420Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><path d="M1000 422 L1105 468 L1085 495 L975 438Z" fill="#f4b400" stroke="#06111f" stroke-width="4"/><path d="M760 330 C850 280 965 295 1085 360" fill="none" stroke="#1f4e79" stroke-width="4"/><path d="M755 310 C850 255 975 270 1100 340" fill="none" stroke="#1f4e79" stroke-width="3"/><text x="850" y="530" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">INCREASED CAMBER</text><text x="850" y="565" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">↑ LIFT AND ↑ DRAG</text><text x="600" y="620" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#64748b">Flaps change the wing's effective camber and chord; some designs also increase wing area.</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">The practical result is more lift at low speed and more drag, allowing slower and steeper approaches.</text></svg>