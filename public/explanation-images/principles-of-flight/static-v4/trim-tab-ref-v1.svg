<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">ELEVATOR TRIM TAB</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><text x="260" y="220" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">NEUTRAL</text><path d="M120 380 C180 335 310 335 395 375 L505 375 L505 410 L395 410 C305 430 180 420 120 380Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><line x1="395" y1="375" x2="395" y2="410" stroke="#06111f" stroke-width="4"/><line x1="465" y1="375" x2="465" y2="410" stroke="#f4b400" stroke-width="5"/><text x="850" y="220" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">TRIM TAB DOWN → ELEVATOR UP</text><path d="M665 380 C725 335 855 335 940 375 L1050 350 L1058 385 L950 412 C860 432 730 420 665 380Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><line x1="940" y1="375" x2="950" y2="412" stroke="#06111f" stroke-width="4"/><path d="M1020 358 L1090 405" stroke="#f4b400" stroke-width="8"/><text x="1015" y="470" font-family="Arial" font-size="19" font-weight="700" fill="#f4b400">TRIM TAB DOWN</text><text x="805" y="500" font-family="Arial" font-size="19" font-weight="700" fill="#06111f">ELEVATOR MOVES OPPOSITE THE TAB</text><text x="600" y="585" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#64748b">The trim tab creates an aerodynamic force that holds the elevator at the selected position.</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">This relieves continuous control pressure without changing the pilot-selected trimmed condition.</text></svg>