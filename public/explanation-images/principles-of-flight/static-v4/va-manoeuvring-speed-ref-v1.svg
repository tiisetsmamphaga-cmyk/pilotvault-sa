<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#fff"/>
  <rect width="1200" height="120" fill="#06111f"/>
  <text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">VA — DESIGN MANOEUVRING SPEED</text>
  <rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/>
  <circle cx="320" cy="365" r="125" fill="#f8fafc" stroke="#d7e0ea" stroke-width="4"/>
  <text x="320" y="345" text-anchor="middle" font-family="Arial" font-size="72" font-weight="800" fill="#f4b400">VA</text>
  <text x="320" y="395" text-anchor="middle" font-family="Arial" font-size="19" font-weight="800" fill="#06111f">MANOEUVRING SPEED</text>
  <text x="320" y="430" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">published in AFM / POH</text>
  <rect x="535" y="245" width="520" height="105" rx="12" fill="#f8fafc" stroke="#d7e0ea"/>
  <text x="570" y="285" font-family="Arial" font-size="21" font-weight="800" fill="#06111f">ROUGH AIR / SEVERE TURBULENCE</text>
  <text x="570" y="320" font-family="Arial" font-size="19" fill="#64748b">Reduce airspeed to manoeuvring speed or less.</text>
  <rect x="535" y="385" width="520" height="105" rx="12" fill="#f8fafc" stroke="#d7e0ea"/>
  <text x="570" y="425" font-family="Arial" font-size="21" font-weight="800" fill="#06111f">ABRUPT MANOEUVRES</text>
  <text x="570" y="460" font-family="Arial" font-size="19" fill="#64748b">VA is the maximum speed identified for abrupt manoeuvring.</text>
  <text x="600" y="565" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#06111f">VA IS AN AIRCRAFT LIMITATION — USE THE PUBLISHED VALUE FOR THE AIRCRAFT</text>
  <text x="600" y="615" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">The handbook describes manoeuvring speed as the rough-air speed and the maximum speed for abrupt manoeuvres.</text>
  <text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Original PilotVault source-grounded teaching graphic.</text>
</svg>