<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">VX AND VY CLIMB SPEEDS</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><line x1="600" y1="190" x2="600" y2="575" stroke="#d7e0ea" stroke-width="2"/><text x="315" y="220" text-anchor="middle" font-family="Arial" font-size="30" font-weight="800" fill="#f4b400">VX</text><text x="315" y="255" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#06111f">BEST ANGLE OF CLIMB</text><line x1="145" y1="525" x2="505" y2="525" stroke="#64748b" stroke-width="4"/><line x1="165" y1="525" x2="455" y2="315" stroke="#f4b400" stroke-width="8"/><rect x="435" y="255" width="36" height="270" fill="#06111f"/><text x="453" y="240" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#06111f">OBSTACLE</text><text x="315" y="565" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Used when gaining the most altitude over horizontal distance is the priority.</text><text x="885" y="220" text-anchor="middle" font-family="Arial" font-size="30" font-weight="800" fill="#06111f">VY</text><text x="885" y="255" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#06111f">BEST RATE OF CLIMB</text><line x1="715" y1="525" x2="1060" y2="525" stroke="#64748b" stroke-width="4"/><line x1="760" y1="525" x2="890" y2="300" stroke="#1f4e79" stroke-width="8"/><line x1="890" y1="300" x2="1015" y2="300" stroke="#1f4e79" stroke-width="8"/><text x="950" y="285" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1f4e79">MAXIMUM ALTITUDE GAIN</text><text x="950" y="320" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">for a given period of time</text><text x="885" y="565" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">VY gives the most altitude in a given period of time.</text><text x="600" y="620" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#06111f">VX = DISTANCE PRIORITY  •  VY = TIME PRIORITY</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Definitions follow the handbook terminology for best angle- and best rate-of-climb speeds.</text></svg>