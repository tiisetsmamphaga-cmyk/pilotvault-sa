<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">VX AND VY CLIMB SPEEDS</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><line x1="140" y1="590" x2="1060" y2="590" stroke="#06111f" stroke-width="5"/><line x1="140" y1="590" x2="140" y2="220" stroke="#06111f" stroke-width="5"/><text x="600" y="635" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#64748b">AIRSPEED →</text><text x="85" y="405" transform="rotate(-90 85 405)" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#64748b">CLIMB PERFORMANCE</text><path d="M220 545 C315 385 435 300 575 345 C685 380 785 475 930 560" fill="none" stroke="#1f4e79" stroke-width="8"/><line x1="390" y1="590" x2="390" y2="330" stroke="#f4b400" stroke-width="5" stroke-dasharray="10 8"/><line x1="575" y1="590" x2="575" y2="345" stroke="#06111f" stroke-width="5" stroke-dasharray="10 8"/><circle cx="390" cy="350" r="10" fill="#f4b400"/><circle cx="575" cy="345" r="10" fill="#06111f"/><text x="390" y="300" text-anchor="middle" font-family="Arial" font-size="30" font-weight="800" fill="#f4b400">VX</text><text x="390" y="270" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#06111f">BEST ANGLE OF CLIMB</text><text x="390" y="660" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">most altitude per horizontal distance</text><text x="575" y="300" text-anchor="middle" font-family="Arial" font-size="30" font-weight="800" fill="#06111f">VY</text><text x="575" y="270" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#06111f">BEST RATE OF CLIMB</text><text x="760" y="420" font-family="Arial" font-size="20" fill="#64748b">VY gives the most altitude in a given period of time.</text><text x="760" y="460" font-family="Arial" font-size="20" fill="#64748b">VX is used when obstacle clearance over distance is the priority.</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Definitions follow the handbook terminology for best angle- and best rate-of-climb speeds.</text></svg>