<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#f4b400"/></marker><marker id="n" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#06111f"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">VX AND VY CLIMB SPEEDS</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><line x1="600" y1="190" x2="600" y2="555" stroke="#d7e0ea" stroke-width="2"/><text x="315" y="220" text-anchor="middle" font-family="Arial" font-size="30" font-weight="800" fill="#f4b400">VX</text><text x="315" y="252" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#06111f">BEST ANGLE OF CLIMB</text><line x1="135" y1="500" x2="510" y2="500" stroke="#94a3b8" stroke-width="4"/><line x1="160" y1="500" x2="425" y2="320" stroke="#f4b400" stroke-width="8" marker-end="url(#g)"/><rect x="440" y="305" width="34" height="195" fill="#06111f"/><text x="490" y="410" transform="rotate(-90 490 410)" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#64748b">OBSTACLE</text><text x="315" y="540" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#06111f">MAXIMUM ALTITUDE PER HORIZONTAL DISTANCE</text><text x="315" y="570" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">Useful when obstacle clearance over distance is the priority.</text><text x="885" y="220" text-anchor="middle" font-family="Arial" font-size="30" font-weight="800" fill="#06111f">VY</text><text x="885" y="252" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#06111f">BEST RATE OF CLIMB</text><line x1="735" y1="500" x2="1040" y2="500" stroke="#94a3b8" stroke-width="4"/><line x1="760" y1="500" x2="900" y2="300" stroke="#06111f" stroke-width="8" marker-end="url(#n)"/><line x1="900" y1="300" x2="1015" y2="300" stroke="#06111f" stroke-width="5"/><circle cx="990" cy="405" r="52" fill="#fff" stroke="#f4b400" stroke-width="7"/><line x1="990" y1="405" x2="990" y2="370" stroke="#06111f" stroke-width="5"/><line x1="990" y1="405" x2="1018" y2="420" stroke="#06111f" stroke-width="5"/><text x="885" y="540" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#06111f">MAXIMUM ALTITUDE PER UNIT OF TIME</text><text x="885" y="570" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">VY gives the most altitude in a given period of time.</text><text x="600" y="620" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#06111f">VX = DISTANCE PRIORITY  •  VY = TIME PRIORITY</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Definitions follow the handbook terminology for best angle- and best rate-of-climb speeds.</text></svg>