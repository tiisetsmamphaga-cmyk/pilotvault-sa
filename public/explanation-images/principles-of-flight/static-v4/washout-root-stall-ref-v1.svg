<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">WASHOUT AND ROOT-FIRST STALL</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><text x="310" y="215" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#06111f">WING ROOT — HIGHER INCIDENCE</text><path d="M100 390 C165 325 330 325 500 380 C530 390 555 400 575 410 C450 423 300 432 195 430 C145 428 115 415 100 390Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><line x1="80" y1="500" x2="565" y2="500" stroke="#1f4e79" stroke-width="6" marker-end="url(#b)"/><line x1="125" y1="390" x2="555" y2="410" stroke="#f4b400" stroke-width="5"/><text x="850" y="215" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#06111f">WING TIP — LOWER INCIDENCE</text><path d="M650 410 C715 350 865 350 1035 395 C1065 402 1090 410 1105 418 C985 430 835 438 735 436 C690 435 662 424 650 410Z" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><line x1="630" y1="500" x2="1100" y2="500" stroke="#1f4e79" stroke-width="6" marker-end="url(#b)"/><line x1="675" y1="410" x2="1085" y2="418" stroke="#f4b400" stroke-width="5"/><text x="310" y="550" text-anchor="middle" font-family="Arial" font-size="19" font-weight="800" fill="#b91c1c">ROOT REACHES CRITICAL AoA FIRST</text><text x="850" y="550" text-anchor="middle" font-family="Arial" font-size="19" font-weight="800" fill="#1f4e79">TIP REMAINS FLYING LONGER</text><text x="600" y="605" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">Washout twists the wing so the angle of incidence decreases toward the tip.</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">This encourages the root to stall first, helping preserve aileron effectiveness near the stall.</text></svg>