<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">WIND EFFECT ON GLIDE OVER THE GROUND</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#b91c1c"/></marker></defs><line x1="100" y1="560" x2="1100" y2="560" stroke="#64748b" stroke-width="4"/><text x="250" y="210" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#1f4e79">HEADWIND</text><line x1="375" y1="245" x2="155" y2="245" stroke="#1f4e79" stroke-width="8" marker-end="url(#b)"/><line x1="185" y1="305" x2="420" y2="560" stroke="#f4b400" stroke-width="8"/><text x="300" y="450" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">STEEPER GROUND PATH</text><text x="600" y="210" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#06111f">STILL AIR</text><line x1="535" y1="305" x2="700" y2="560" stroke="#06111f" stroke-width="8"/><text x="950" y="210" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#b91c1c">TAILWIND</text><line x1="820" y1="245" x2="1040" y2="245" stroke="#b91c1c" stroke-width="8" marker-end="url(#r)"/><line x1="855" y1="305" x2="1060" y2="560" stroke="#1f4e79" stroke-width="8"/><text x="950" y="450" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">FLATTER GROUND PATH</text><text x="600" y="615" text-anchor="middle" font-family="Arial" font-size="20" fill="#64748b">Wind changes glide distance over the ground, not the aircraft’s aerodynamic glide ratio through the air mass.</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">A headwind shortens ground distance and steepens the apparent glide path; a tailwind increases ground distance.</text></svg>