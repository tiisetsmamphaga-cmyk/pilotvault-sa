<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">WING POLAR — LIFT AND DRAG</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><line x1="180" y1="570" x2="1020" y2="570" stroke="#06111f" stroke-width="4"/><line x1="180" y1="570" x2="180" y2="220" stroke="#06111f" stroke-width="4"/><path d="M240 540 C330 470 420 390 520 325 C625 255 730 240 845 285 C915 315 955 365 990 430" fill="none" stroke="#1f4e79" stroke-width="8"/><line x1="180" y1="570" x2="760" y2="260" stroke="#f4b400" stroke-width="5"/><circle cx="650" cy="302" r="10" fill="#f4b400"/><text x="685" y="285" font-family="Arial" font-size="20" font-weight="800" fill="#f4b400">TANGENCY = MAX L/D</text><text x="600" y="615" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#64748b">DRAG COEFFICIENT →</text><text x="100" y="405" text-anchor="middle" transform="rotate(-90 100 405)" font-family="Arial" font-size="20" font-weight="700" fill="#64748b">LIFT COEFFICIENT</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">A wing polar plots lift coefficient against drag coefficient; a line tangent from the origin identifies maximum lift-to-drag ratio.</text></svg>