<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">WINGTIP VORTICES AND INDUCED DRAG</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><text x="600" y="215" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#06111f">FRONT VIEW</text><path d="M205 385 L525 350 L675 350 L995 385 L675 420 L525 420Z" fill="#f8fafc" stroke="#06111f" stroke-width="6"/><rect x="565" y="320" width="70" height="110" rx="18" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><text x="600" y="290" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#64748b">LOWER PRESSURE ABOVE</text><text x="600" y="465" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#64748b">HIGHER PRESSURE BELOW</text><path d="M215 420 C150 465 145 555 210 600 C270 640 335 600 320 540 C305 485 245 480 220 520" fill="none" stroke="#1f4e79" stroke-width="8"/><path d="M985 420 C1050 465 1055 555 990 600 C930 640 865 600 880 540 C895 485 955 480 980 520" fill="none" stroke="#1f4e79" stroke-width="8"/><path d="M195 430 C165 410 150 390 150 360" fill="none" stroke="#1f4e79" stroke-width="5" marker-end="url(#b)"/><path d="M1005 430 C1035 410 1050 390 1050 360" fill="none" stroke="#1f4e79" stroke-width="5" marker-end="url(#b)"/><text x="210" y="625" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1f4e79">VORTEX</text><text x="990" y="625" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1f4e79">VORTEX</text><text x="600" y="535" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">Air curls around each wingtip from the higher-pressure lower surface toward the lower-pressure upper surface.</text><text x="600" y="570" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#06111f">THE TWO TRAILING VORTICES ROTATE IN OPPOSITE DIRECTIONS</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Wingtip vortices are a by-product of lift and are associated with induced drag.</text></svg>