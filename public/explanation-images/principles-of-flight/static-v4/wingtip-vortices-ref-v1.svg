<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">WINGTIP VORTICES AND INDUCED DRAG</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><path d="M250 360 L530 330 L950 330 L1080 360 L950 390 L530 390Z" fill="#f8fafc" stroke="#06111f" stroke-width="6"/><path d="M250 360 L120 320 L250 340" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><path d="M1080 360 L1140 320 L1080 340" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><text x="600" y="250" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#06111f">LOWER PRESSURE ABOVE</text><text x="600" y="485" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#06111f">HIGHER PRESSURE BELOW</text><path d="M190 400 C120 455 115 540 180 585 C240 625 315 585 305 520 C295 455 220 440 190 490 C165 530 210 555 235 530" fill="none" stroke="#1f4e79" stroke-width="8"/><path d="M1010 400 C1080 455 1085 540 1020 585 C960 625 885 585 895 520 C905 455 980 440 1010 490 C1035 530 990 555 965 530" fill="none" stroke="#1f4e79" stroke-width="8"/><text x="220" y="625" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#1f4e79">COUNTER-ROTATING VORTEX</text><text x="980" y="625" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#1f4e79">COUNTER-ROTATING VORTEX</text><text x="600" y="545" text-anchor="middle" font-family="Arial" font-size="20" fill="#64748b">Pressure flows around each wingtip from the high-pressure lower surface toward the low-pressure upper surface.</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">The resulting trailing vortices are a by-product of lift and are associated with induced drag.</text></svg>