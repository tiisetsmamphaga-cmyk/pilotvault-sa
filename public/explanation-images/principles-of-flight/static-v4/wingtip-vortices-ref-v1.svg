<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1f4e79"/></marker></defs><rect width="1200" height="720" fill="#fff"/><rect width="1200" height="120" fill="#06111f"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#f4b400">PILOTVAULT PRINCIPLES OF FLIGHT</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#fff">WINGTIP VORTICES AND INDUCED DRAG</text><rect x="45" y="150" width="1110" height="510" rx="14" fill="#fff" stroke="#d7e0ea"/><text x="600" y="205" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="#06111f">FRONT VIEW</text><text x="600" y="245" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#64748b">LOWER PRESSURE ABOVE THE WING</text><path d="M205 370 L520 335 L680 335 L995 370 L680 405 L520 405Z" fill="#f8fafc" stroke="#06111f" stroke-width="6"/><rect x="565" y="310" width="70" height="110" rx="18" fill="#f8fafc" stroke="#06111f" stroke-width="5"/><text x="600" y="450" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#64748b">HIGHER PRESSURE BELOW THE WING</text><path d="M205 405 C150 435 125 490 145 535 C165 580 225 595 265 565 C305 535 305 480 270 455 C238 432 195 445 185 480 C178 507 200 527 225 522" fill="none" stroke="#1f4e79" stroke-width="8"/><path d="M995 405 C1050 435 1075 490 1055 535 C1035 580 975 595 935 565 C895 535 895 480 930 455 C962 432 1005 445 1015 480 C1022 507 1000 527 975 522" fill="none" stroke="#1f4e79" stroke-width="8"/><path d="M195 420 C165 400 150 380 150 350" fill="none" stroke="#1f4e79" stroke-width="5" marker-end="url(#a)"/><path d="M1005 420 C1035 400 1050 380 1050 350" fill="none" stroke="#1f4e79" stroke-width="5" marker-end="url(#a)"/><text x="205" y="620" text-anchor="middle" font-family="Arial" font-size="18" font-weight="800" fill="#1f4e79">TRAILING VORTEX</text><text x="995" y="620" text-anchor="middle" font-family="Arial" font-size="18" font-weight="800" fill="#1f4e79">TRAILING VORTEX</text><text x="600" y="570" text-anchor="middle" font-family="Arial" font-size="19" font-weight="800" fill="#06111f">THE TWO WINGTIP VORTICES ROTATE IN OPPOSITE DIRECTIONS</text><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">The pressure differential that produces lift also drives the wingtip flow that forms trailing vortices and induced drag.</text></svg>